
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>플래피 버드: 클래식 큐트 에디션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
            overflow: hidden;
            font-family: 'Fredoka One', 'Jua', 'Comic Sans MS', cursive, sans-serif;
        }
        #game-container {
            position: relative;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #fff;
        }
        canvas {
            display: block;
            background-color: #70c5ce;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 폰트 설정 (웹 폰트 로딩 대기를 피하기 위해 안전한 폴백 사용)
    const gameFont = '"Jua", "Comic Sans MS", sans-serif';

    // 게임 상태 관리
    const STATE = { START: 0, PLAYING: 1, GAMEOVER: 2 };
    let gameState = STATE.START;
    let frames = 0;
    let score = 0;
    let bestScore = localStorage.getItem('flappy_cute_best') || 0;
    
    // 이펙트 및 환경 변수
    let flashAlpha = 0;
    let shake = 0;
    let timeCycle = 0; // 0~1 (낮~밤)

    // 물리 상수
    const GRAVITY = 0.45;
    const JUMP_STRENGTH = -7.2;
    const BASE_SPEED = 3.0;
    const GROUND_HEIGHT = 100;
    const PIPE_GAP = 160;
    
    let currentSpeed = BASE_SPEED;

    // ==========================================
    // 사운드 시스템 (레트로 8비트 스타일)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        
        if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'coin') { // 사과 먹을 때
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.setValueAtTime(1200, now + 0.05);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'shield') { // 쉴드 획득
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'break') { // 파이프 부술 때 (쉴드)
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'hit') { // 게임 오버
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    // ==========================================
    // 파티클 시스템 (효과)
    // ==========================================
    const particles = [];
    function spawnParticles(x, y, color, count, type = 'normal') {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * (type === 'break' ? 10 : 5),
                vy: (Math.random() - 0.5) * (type === 'break' ? 10 : 5) - 2,
                size: Math.random() * 6 + 3,
                color: color,
                life: 1.0,
                decay: Math.random() * 0.03 + 0.02
            });
        }
    }

    function drawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // 파티클에도 중력 적용
            p.life -= p.decay;

            if (p.life <= 0) {
                particles.splice(i, 1);
            } else {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }
    }

    // ==========================================
    // 플레이어: 귀여운 새
    // ==========================================
    const bird = {
        x: 100,
        y: canvas.height / 2,
        radius: 18,
        velocity: 0,
        rotation: 0,
        hasShield: false,
        blinkTimer: 0,
        
        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // 물리 회전
            if (gameState !== STATE.START) {
                this.rotation = Math.min(Math.PI / 3, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
            }
            ctx.rotate(this.rotation);

            // 쉴드 (비눗방울) 효과
            if (this.hasShield) {
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 10, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(135, 206, 250, ${0.4 + Math.sin(frames * 0.1) * 0.2})`; // 하늘색 반투명 반짝임
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.stroke();
                
                // 방울 하이라이트
                ctx.beginPath();
                ctx.arc(-8, -8, 6, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();
            }

            // --- 새 그리기 시작 ---
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#333';

            // 몸통 (통통한 노란색 원)
            ctx.fillStyle = '#ffde00';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 배 하이라이트 (약간 밝은 색)
            ctx.fillStyle = '#fff48c';
            ctx.beginPath();
            ctx.arc(-4, 6, this.radius * 0.6, 0, Math.PI);
            ctx.fill();

            // 눈동자 상태 관리 (깜빡임 또는 기절)
            this.blinkTimer++;
            const isBlinking = (this.blinkTimer % 150 > 140) && gameState !== STATE.GAMEOVER;
            const isDead = gameState === STATE.GAMEOVER;

            // 흰자
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(this.radius * 0.35, -this.radius * 0.2, 8, 0, Math.PI * 2); // 큰 눈
            ctx.fill();
            ctx.stroke();

            if (isDead) {
                // 게임 오버 시 'X' 눈
                ctx.beginPath();
                ctx.moveTo(this.radius * 0.35 - 4, -this.radius * 0.2 - 4);
                ctx.lineTo(this.radius * 0.35 + 4, -this.radius * 0.2 + 4);
                ctx.moveTo(this.radius * 0.35 + 4, -this.radius * 0.2 - 4);
                ctx.lineTo(this.radius * 0.35 - 4, -this.radius * 0.2 + 4);
                ctx.stroke();
            } else if (isBlinking) {
                // 깜빡일 때 '-' 눈
                ctx.beginPath();
                ctx.moveTo(this.radius * 0.35 - 5, -this.radius * 0.2);
                ctx.lineTo(this.radius * 0.35 + 5, -this.radius * 0.2);
                ctx.stroke();
            } else {
                // 평소 검은 눈동자 & 초롱초롱 빛
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.radius * 0.45, -this.radius * 0.2, 4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#fff'; // 눈망울 반짝
                ctx.beginPath();
                ctx.arc(this.radius * 0.45 + 1.5, -this.radius * 0.2 - 1.5, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // 볼터치 (핑크색)
            ctx.fillStyle = '#ff8a80';
            ctx.beginPath();
            ctx.arc(this.radius * 0.1, this.radius * 0.25, 4, 0, Math.PI * 2);
            ctx.fill();

            // 부리 (주황색 입체적)
            ctx.fillStyle = '#ff9800';
            ctx.beginPath();
            ctx.moveTo(this.radius * 0.6, 2);
            ctx.quadraticCurveTo(this.radius + 8, -4, this.radius + 12, 4);
            ctx.quadraticCurveTo(this.radius + 6, 10, this.radius * 0.5, 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 날개 (펄럭임 애니메이션)
            let wingY = 0;
            if (gameState === STATE.PLAYING) {
                wingY = Math.sin(frames * 0.6) * 6; // 빠르게 펄럭임
            } else if (gameState === STATE.START) {
                wingY = Math.sin(frames * 0.2) * 4; // 느리게 펄럭임
            }

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(-8, 2 + wingY, 10, 6, -Math.PI / 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        },
        update: function() {
            if (gameState === STATE.PLAYING) {
                this.velocity += GRAVITY;
                this.y += this.velocity;

                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }

                // 바닥 충돌
                if (this.y + this.radius >= canvas.height - GROUND_HEIGHT) {
                    if (this.hasShield) {
                        // 쉴드가 있으면 바닥에 튕김
                        this.y = canvas.height - GROUND_HEIGHT - this.radius;
                        this.jump();
                        this.breakShield();
                    } else {
                        this.y = canvas.height - GROUND_HEIGHT - this.radius;
                        gameOver();
                    }
                }
            } else if (gameState === STATE.GAMEOVER) {
                if (this.y + this.radius < canvas.height - GROUND_HEIGHT) {
                    this.velocity += GRAVITY;
                    this.y += this.velocity;
                }
            } else if (gameState === STATE.START) {
                this.y = (canvas.height / 2) + Math.cos(frames * 0.1) * 8;
            }
        },
        jump: function() {
            this.velocity = JUMP_STRENGTH;
            playSound('jump');
            spawnParticles(this.x - 10, this.y + 10, '#fff', 3); // 작은 점프 먼지
        },
        breakShield: function() {
            this.hasShield = false;
            playSound('break');
            spawnParticles(this.x, this.y, '#87CEFA', 20, 'break'); // 쉴드 깨지는 이펙트
            shake = 10;
        }
    };

    // ==========================================
    // 장애물 & 아이템 (파이프 + 움직이는 기믹)
    // ==========================================
    const pipes = {
        items: [],
        width: 66,
        
        draw: function() {
            for (let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                if (p.broken) continue; // 부서진 파이프는 안 그림

                const currentY = p.top + p.offsetY; // 동적 Y축 적용

                ctx.save();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#2e4a13';
                
                // 파이프 기둥 색상
                ctx.fillStyle = '#7cb342';
                // 파이프 하이라이트 (입체감)
                ctx.fillRect(p.x, 0, this.width, currentY);
                ctx.strokeRect(p.x, 0, this.width, currentY);
                
                ctx.fillStyle = '#aed581'; // 밝은 연두색 (좌측 하이라이트)
                ctx.fillRect(p.x + 4, 0, 8, currentY);

                // 윗 파이프 캡 (입술)
                ctx.fillStyle = '#7cb342';
                ctx.fillRect(p.x - 4, currentY - 24, this.width + 8, 24);
                ctx.strokeRect(p.x - 4, currentY - 24, this.width + 8, 24);
                ctx.fillStyle = '#aed581';
                ctx.fillRect(p.x, currentY - 20, 8, 16);

                // 아래 파이프
                const bottomY = currentY + PIPE_GAP;
                const bottomH = canvas.height - bottomY - GROUND_HEIGHT;
                
                ctx.fillStyle = '#7cb342';
                ctx.fillRect(p.x, bottomY, this.width, bottomH);
                ctx.strokeRect(p.x, bottomY, this.width, bottomH);
                
                ctx.fillStyle = '#aed581';
                ctx.fillRect(p.x + 4, bottomY, 8, bottomH);

                // 아래 파이프 캡
                ctx.fillStyle = '#7cb342';
                ctx.fillRect(p.x - 4, bottomY, this.width + 8, 24);
                ctx.strokeRect(p.x - 4, bottomY, this.width + 8, 24);
                ctx.fillStyle = '#aed581';
                ctx.fillRect(p.x, bottomY + 4, 8, 16);

                ctx.restore();

                // === 아이템 그리기 ===
                if (p.item && !p.itemCollected) {
                    const cx = p.x + this.width / 2;
                    const cy = currentY + PIPE_GAP / 2 + Math.sin(frames * 0.1) * 5; // 둥둥 떠다님
                    
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#000';

                    if (p.item === 'apple') {
                        // 사과 그리기
                        ctx.fillStyle = '#e74c3c';
                        ctx.beginPath();
                        ctx.arc(-4, 0, 10, 0, Math.PI*2);
                        ctx.arc(4, 0, 10, 0, Math.PI*2);
                        ctx.fill();
                        ctx.stroke();
                        // 잎사귀
                        ctx.fillStyle = '#2ecc71';
                        ctx.beginPath();
                        ctx.ellipse(2, -10, 6, 3, -Math.PI/4, 0, Math.PI*2);
                        ctx.fill();
                        ctx.stroke();
                    } else if (p.item === 'shield') {
                        // 쉴드 아이템 그리기 (비눗방울 속 방패모양)
                        ctx.fillStyle = 'rgba(135, 206, 250, 0.6)';
                        ctx.beginPath();
                        ctx.arc(0, 0, 14, 0, Math.PI*2);
                        ctx.fill();
                        ctx.stroke();
                        
                        ctx.fillStyle = '#f1c40f'; // 방패 별모양
                        ctx.font = 'bold 16px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('S', 0, 1);
                    }
                    ctx.restore();
                }
            }
        },
        update: function() {
            if (gameState !== STATE.PLAYING) return;

            // 난이도 상승 곡선
            currentSpeed = BASE_SPEED + Math.min(2.0, score * 0.05);
            const spawnRate = Math.max(80, 110 - Math.floor(score));

            if (frames % spawnRate === 0) {
                const minH = 60;
                const maxH = canvas.height - GROUND_HEIGHT - PIPE_GAP - minH;
                const topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;

                // 10점 이후부터 가끔 움직이는 파이프 등장
                const isMoving = score > 10 && Math.random() > 0.6;
                
                // 아이템 스폰 확률 (사과 20%, 쉴드 10%)
                let spawnItem = null;
                const r = Math.random();
                if (r < 0.1) spawnItem = 'shield';
                else if (r < 0.3) spawnItem = 'apple';

                this.items.push({
                    x: canvas.width,
                    top: topH,
                    offsetY: 0,
                    moving: isMoving,
                    moveRange: Math.random() * 40 + 20, // 움직이는 폭
                    moveSpeed: Math.random() * 0.03 + 0.02,
                    passed: false,
                    broken: false,
                    item: spawnItem,
                    itemCollected: false
                });
            }

            for (let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                p.x -= currentSpeed;

                if (p.moving) {
                    p.offsetY = Math.sin(frames * p.moveSpeed) * p.moveRange;
                }

                if (!p.broken) {
                    const currentY = p.top + p.offsetY;
                    const bx = bird.x, by = bird.y, br = bird.radius - 4;

                    // 파이프 충돌 감지
                    if (bx + br > p.x && bx - br < p.x + this.width) {
                        if (by - br < currentY || by + br > currentY + PIPE_GAP) {
                            if (bird.hasShield) {
                                // 쉴드로 파이프 파괴!
                                bird.breakShield();
                                p.broken = true;
                                spawnParticles(p.x + this.width/2, by, '#7cb342', 30, 'break');
                                score += 1; // 부숴도 점수 인정
                                p.passed = true;
                            } else {
                                gameOver();
                            }
                        }
                    }
                }

                // 아이템 획득 로직
                if (p.item && !p.itemCollected && !p.broken) {
                    const currentY = p.top + p.offsetY;
                    const cx = p.x + this.width / 2;
                    const cy = currentY + PIPE_GAP / 2;
                    
                    const dist = Math.hypot(bird.x - cx, bird.y - cy);
                    if (dist < bird.radius + 15) {
                        p.itemCollected = true;
                        if (p.item === 'apple') {
                            score += 3;
                            playSound('coin');
                            spawnParticles(cx, cy, '#e74c3c', 10);
                        } else if (p.item === 'shield') {
                            bird.hasShield = true;
                            playSound('shield');
                            spawnParticles(cx, cy, '#87CEFA', 15);
                        }
                    }
                }

                // 점수 통과
                if (p.x + this.width < bird.x && !p.passed && !p.broken) {
                    score += 1;
                    p.passed = true;
                }

                // 배열에서 제거
                if (p.x + this.width < 0) {
                    this.items.shift();
                    i--; 
                }
            }
        },
        reset: function() {
            this.items = [];
            currentSpeed = BASE_SPEED;
        }
    };

    // ==========================================
    // 배경 (낮/밤 변화 & 패럴랙스 & 큐트 요소)
    // ==========================================
    const bg = {
        cloudX: 0,
        treeX: 0,
        
        draw: function() {
            // 시간 경과에 따른 하늘색 변화
            if (gameState === STATE.PLAYING) {
                timeCycle += 0.0005; 
            }
            const cycle = (Math.sin(timeCycle) + 1) / 2; // 0:낮 ~ 1:밤

            // 낮 색상 -> 노을 -> 밤
            const r = Math.floor(112 * (1 - cycle) + 25 * cycle);
            const g = Math.floor(197 * (1 - cycle) + 25 * cycle);
            const b = Math.floor(206 * (1 - cycle) + 60 * cycle);
            
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 해와 달
            ctx.save();
            if (cycle < 0.6) {
                // 해 (노란색)
                ctx.fillStyle = `rgba(255, 235, 59, ${1 - cycle*1.5})`;
                ctx.beginPath();
                ctx.arc(320, 150, 40, 0, Math.PI*2);
                ctx.fill();
            } else {
                // 초승달 (흰색)
                ctx.fillStyle = `rgba(255, 255, 255, ${(cycle - 0.5)*2})`;
                ctx.beginPath();
                ctx.arc(320, 150, 30, 0, Math.PI*2);
                ctx.fill();
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(310, 145, 30, 0, Math.PI*2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
            }
            ctx.restore();

            // 구름 (느리게 이동)
            ctx.fillStyle = `rgba(255, 255, 255, ${0.8 - cycle*0.5})`; // 밤에는 구름이 어두워짐
            for(let i=0; i<3; i++) {
                let cx = ((this.cloudX + i*200) % (canvas.width + 200)) - 100;
                let cy = 100 + (i%2)*80;
                
                ctx.beginPath();
                ctx.arc(cx, cy, 30, 0, Math.PI*2);
                ctx.arc(cx + 30, cy - 15, 40, 0, Math.PI*2);
                ctx.arc(cx + 60, cy, 30, 0, Math.PI*2);
                ctx.fill();
            }

            // 원경 나무/산 숲 실루엣
            ctx.fillStyle = `rgb(${84 - cycle*40}, ${170 - cycle*100}, ${80 - cycle*40})`;
            ctx.beginPath();
            for(let i=0; i<canvas.width + 100; i+=60) {
                let tx = ((this.treeX + i) % (canvas.width + 100)) - 50;
                ctx.moveTo(tx, canvas.height - GROUND_HEIGHT);
                ctx.quadraticCurveTo(tx + 30, canvas.height - GROUND_HEIGHT - 80, tx + 60, canvas.height - GROUND_HEIGHT);
            }
            ctx.fill();
        },
        drawGround: function() {
            const h = canvas.height - GROUND_HEIGHT;
            
            // 땅 (흙)
            ctx.fillStyle = '#d7ccc8';
            ctx.fillRect(0, h, canvas.width, GROUND_HEIGHT);
            
            // 잔디 상단
            ctx.fillStyle = '#8bc34a';
            ctx.fillRect(0, h, canvas.width, 24);
            
            // 두꺼운 외곽선 스타일
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.lineTo(canvas.width, h);
            ctx.stroke();

            // 땅 패턴 무늬 (각진 지층 무늬)
            ctx.strokeStyle = '#bcaaa4';
            ctx.lineWidth = 4;
            ctx.beginPath();
            const patternX = (frames * currentSpeed) % 40;
            for(let i=0; i<canvas.width+60; i+=40) {
                ctx.moveTo(i - patternX, h + 30);
                ctx.lineTo(i - patternX + 20, h + 30);
                ctx.lineTo(i - patternX + 10, h + 60);
                ctx.lineTo(i - patternX + 30, h + 60);
            }
            ctx.stroke();
        },
        update: function() {
            if (gameState === STATE.PLAYING) {
                this.cloudX -= 0.5;
                this.treeX -= currentSpeed * 0.3;
            }
        }
    };

    // ==========================================
    // UI 렌더링
    // ==========================================
    function drawUI() {
        ctx.textAlign = 'center';
        
        if (gameState === STATE.START) {
            // 반투명 배경
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 귀여운 로고
            ctx.font = `bold 46px ${gameFont}`;
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#333';
            ctx.fillStyle = '#fff';
            
            ctx.strokeText('플래피 버드', canvas.width / 2, 160);
            ctx.fillText('플래피 버드', canvas.width / 2, 160);
            
            ctx.fillStyle = '#ff4081'; // 핑크 큐트
            ctx.font = `bold 32px ${gameFont}`;
            ctx.strokeText('♡ 큐트 에디션 ♡', canvas.width / 2, 210);
            ctx.fillText('♡ 큐트 에디션 ♡', canvas.width / 2, 210);

            // 아이템 설명
            const tY = 350;
            ctx.fillStyle = '#fff';
            ctx.font = `20px ${gameFont}`;
            ctx.strokeText('🍎 사과: +3점  |  🛡️ 비눗방울: 1회 방어', canvas.width/2, tY);
            ctx.fillText('🍎 사과: +3점  |  🛡️ 비눗방울: 1회 방어', canvas.width/2, tY);

            if (Math.floor(frames / 30) % 2 === 0) {
                ctx.fillStyle = '#ffde00';
                ctx.font = `24px ${gameFont}`;
                ctx.strokeText('화면을 터치하여 시작하세요!', canvas.width / 2, 450);
                ctx.fillText('화면을 터치하여 시작하세요!', canvas.width / 2, 450);
            }
        }

        if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
            // 점수 표시 (가운데 상단, 굵직하게)
            ctx.font = `bold 64px ${gameFont}`;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 8;
            ctx.fillStyle = '#fff';
            
            ctx.strokeText(score, canvas.width / 2, 100);
            ctx.fillText(score, canvas.width / 2, 100);
        }

        if (gameState === STATE.GAMEOVER) {
            const pW = 280;
            const pH = 220;
            const pX = (canvas.width - pW) / 2;
            const pY = 180;

            // 결과 창 배경 (둥근 사각형)
            ctx.fillStyle = '#fff9c4';
            ctx.beginPath();
            ctx.roundRect(pX, pY, pW, pH, 16);
            ctx.fill();
            
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#333';
            ctx.stroke();

            // 타이틀
            ctx.fillStyle = '#ff5252';
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            ctx.font = `bold 36px ${gameFont}`;
            ctx.strokeText('게임 오버 ㅠㅠ', canvas.width / 2, pY + 50);
            ctx.fillText('게임 오버 ㅠㅠ', canvas.width / 2, pY + 50);

            // 점수 박스
            ctx.fillStyle = '#ffd54f';
            ctx.fillRect(pX + 30, pY + 70, 100, 70);
            ctx.strokeRect(pX + 30, pY + 70, 100, 70);
            
            ctx.fillRect(pX + 150, pY + 70, 100, 70);
            ctx.strokeRect(pX + 150, pY + 70, 100, 70);

            ctx.fillStyle = '#333';
            ctx.font = `bold 20px ${gameFont}`;
            ctx.fillText('점수', pX + 80, pY + 95);
            ctx.fillText('최고 기록', pX + 200, pY + 95);

            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.font = `bold 28px ${gameFont}`;
            ctx.strokeText(score, pX + 80, pY + 130);
            ctx.fillText(score, pX + 80, pY + 130);
            
            ctx.strokeText(bestScore, pX + 200, pY + 130);
            ctx.fillText(bestScore, pX + 200, pY + 130);

            // 신기록 뱃지
            if (score > 0 && score >= bestScore) {
                ctx.fillStyle = '#ff4081';
                ctx.font = `bold 16px ${gameFont}`;
                ctx.fillText('★ NEW ★', pX + 200, pY + 60);
            }

            // 재시작 텍스트
            if (Math.floor(frames / 30) % 2 === 0) {
                ctx.fillStyle = '#333';
                ctx.font = `bold 20px ${gameFont}`;
                ctx.fillText('화면을 눌러 다시하기', canvas.width / 2, pY + 185);
            }
        }
    }

    function gameOver() {
        if (gameState === STATE.GAMEOVER) return;
        gameState = STATE.GAMEOVER;
        playSound('hit');
        
        flashAlpha = 1.0; 
        shake = 15;
        
        spawnParticles(bird.x, bird.y, '#ffde00', 20); // 깃털(노란색) 날림
        
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('flappy_cute_best', bestScore);
        }
    }

    function handleInput() {
        initAudio(); // 터치 시 오디오 컨텍스트 활성화

        if (gameState === STATE.START) {
            gameState = STATE.PLAYING;
            bird.jump();
        } else if (gameState === STATE.PLAYING) {
            bird.jump();
        } else if (gameState === STATE.GAMEOVER) {
            // 바닥에 완전히 떨어져야 재시작 가능
            if (bird.y + bird.radius >= canvas.height - GROUND_HEIGHT) {
                resetGame();
            }
        }
    }

    function resetGame() {
        gameState = STATE.START;
        frames = 0;
        score = 0;
        timeCycle = 0;
        pipes.reset();
        particles.length = 0;
        
        bird.y = canvas.height / 2;
        bird.velocity = 0;
        bird.rotation = 0;
        bird.hasShield = false;
        
        shake = 0;
    }

    // 입력 이벤트 바인딩
    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault(); 
        handleInput();
    }, {passive: false});

    let isKeyPressed = false;
    window.addEventListener('keydown', (e) => {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && !isKeyPressed) {
            isKeyPressed = true;
            handleInput();
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            isKeyPressed = false;
        }
    });

    // 라운드 렉트(둥근 사각형) 폴리필
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            return this;
        };
    }

    // 메인 렌더링 루프
    function gameLoop() {
        // 화면 흔들림(Screen Shake) 효과
        let shakeX = 0, shakeY = 0;
        if (shake > 0) {
            shakeX = (Math.random() - 0.5) * shake;
            shakeY = (Math.random() - 0.5) * shake;
            shake *= 0.8; 
            if(shake < 0.5) shake = 0;
        }

        ctx.save();
        ctx.translate(shakeX, shakeY); 

        // 드로잉 파이프라인
        bg.update();
        bg.draw();

        pipes.update();
        pipes.draw();

        bg.drawGround();

        drawParticles();

        bird.update();
        bird.draw();

        drawUI();

        // 번쩍임 (피격 시 흰색/빨간색 점멸)
        if (flashAlpha > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            flashAlpha -= 0.08; 
        }

        ctx.restore(); 

        frames++;
        requestAnimationFrame(gameLoop);
    }

    window.onload = () => {
        resetGame();
        gameLoop();
    };
</script>

</body>
</html>
