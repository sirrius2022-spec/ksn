<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GRAND ROULETTE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f5c842;--gold2:#e8a800;--gold3:#fff0a0;
  --bg:#06040e;--border:rgba(245,200,66,.28);--text:#f1e9d2;--dim:#7a6a4a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0);}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--text);}

/* 배경 */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;}
#sbg{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 120% 80% at 50% 0%,rgba(192,18,44,.2) 0%,transparent 55%),
    radial-gradient(ellipse 100% 60% at 80% 100%,rgba(26,111,255,.13) 0%,transparent 55%),
    radial-gradient(ellipse 200% 200% at 50% 50%,#0e0820 0%,#06040e 60%);
}
#sgrid{
  position:absolute;inset:0;opacity:.07;
  background-image:linear-gradient(rgba(245,200,66,.8) 1px,transparent 1px),linear-gradient(90deg,rgba(245,200,66,.8) 1px,transparent 1px);
  background-size:60px 60px;
  transform:perspective(400px) rotateX(55deg) translateY(20%);transform-origin:bottom center;
}
.al{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;}

/* 앱 */
#app{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding:8px 8px 4px;}

/* 헤더 */
#hdr{width:100%;max-width:520px;text-align:center;flex-shrink:0;margin-bottom:4px;}
#ttl{
  font-family:'Cinzel Decorative',serif;font-size:clamp(18px,5vw,30px);font-weight:900;letter-spacing:4px;
  background:linear-gradient(135deg,#fff0a0 0%,var(--gold) 35%,#fff8d0 55%,var(--gold2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 12px rgba(245,200,66,.5));
}
#sub{font-family:'Cinzel',serif;font-size:9px;letter-spacing:8px;color:var(--dim);margin-top:1px;}

/* 컨트롤 */
#ctrl{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  background:rgba(245,200,66,.05);border:1px solid var(--border);border-radius:12px;
  padding:6px 14px;flex-shrink:0;margin-bottom:4px;
}
#ctrl label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;color:var(--dim);}
#ctrl input{
  width:58px;padding:4px 6px;background:rgba(0,0,0,.4);border:1px solid var(--border);
  border-radius:6px;color:var(--gold);font-family:'Cinzel',serif;font-size:14px;font-weight:700;text-align:center;touch-action:auto;
}
#ctrl input:focus{outline:none;border-color:var(--gold);}
.cbtn{
  font-family:'Cinzel',serif;font-size:10px;font-weight:700;letter-spacing:1px;
  padding:6px 14px;background:rgba(245,200,66,.1);border:1px solid var(--border);
  border-radius:6px;color:var(--gold);cursor:pointer;touch-action:auto;
  -webkit-user-select:none;user-select:none;
}
.cbtn:active{background:rgba(245,200,66,.3);}

/* 룰렛 영역 */
#rarea{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;}

/* 캔버스: 원판+바늘+허브 모두 포함, overflow visible */
#wc{display:block;touch-action:none;}

/* 스핀 버튼 */
#spbtn{
  flex-shrink:0;font-family:'Cinzel Decorative',serif;font-size:clamp(13px,3.5vw,18px);font-weight:900;
  letter-spacing:3px;padding:12px 36px;border:none;border-radius:50px;cursor:pointer;
  background:linear-gradient(135deg,#b8860b 0%,var(--gold) 40%,var(--gold3) 60%,var(--gold2) 100%);
  color:#1a0a00;margin-bottom:4px;touch-action:auto;-webkit-user-select:none;user-select:none;
  box-shadow:0 6px 30px rgba(245,200,66,.5);position:relative;z-index:10;
}
#spbtn:active{transform:translateY(2px);box-shadow:0 2px 10px rgba(245,200,66,.3);}
#spbtn:disabled{opacity:.45;pointer-events:none;}

/* 당첨 레이어 */
#wlayer{
  position:fixed;inset:0;z-index:9999;display:none;
  align-items:center;justify-content:center;
  background:rgba(6,4,14,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#wlayer.show{display:flex;}
#wcard{
  background:linear-gradient(145deg,#120820 0%,#1e0e10 50%,#0a1020 100%);
  border:2px solid var(--gold);border-radius:24px;padding:28px 36px 24px;text-align:center;
  width:min(340px,88vw);box-shadow:0 0 60px rgba(245,200,66,.4),0 40px 80px rgba(0,0,0,.8);
  pointer-events:auto;position:relative;z-index:10000;
}
.wd{font-size:34px;display:block;margin-bottom:6px;animation:wfl 2s ease-in-out infinite;}
#wlbl{font-family:'Cinzel',serif;font-size:10px;letter-spacing:6px;color:var(--dim);margin-bottom:4px;}
#wnum{
  font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(60px,17vw,92px);line-height:1;
  background:linear-gradient(180deg,#fff8e0 0%,var(--gold) 40%,var(--gold2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:wpop .6s cubic-bezier(.22,1.4,.36,1) both;
}
#wtxt{font-family:'Cinzel',serif;font-size:clamp(13px,4vw,17px);letter-spacing:3px;color:var(--gold3);margin:6px 0 18px;}
#wcls{
  display:block;width:100%;font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:3px;
  padding:14px 28px;background:linear-gradient(135deg,var(--gold2) 0%,var(--gold) 100%);
  border:none;border-radius:50px;color:#1a0a00;cursor:pointer;
  box-shadow:0 4px 20px rgba(245,200,66,.45);touch-action:auto;pointer-events:auto;
  position:relative;z-index:10001;-webkit-user-select:none;user-select:none;
  -webkit-appearance:none;appearance:none;min-height:52px;
}
#wcls:active{transform:scale(.97);}

/* FX */
#fx{position:fixed;inset:0;z-index:1000;pointer-events:none;}

@keyframes wfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes wpop{from{transform:scale(0) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
</style>
</head>
<body>
<div id="scene">
  <div id="sbg"></div>
  <canvas id="stc" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
  <div id="sgrid"></div>
  <div class="al" style="width:280px;height:280px;top:-60px;left:-60px;background:rgba(192,18,44,.13);"></div>
  <div class="al" style="width:220px;height:220px;bottom:-50px;right:-50px;background:rgba(26,111,255,.1);"></div>
</div>

<canvas id="fx"></canvas>

<div id="app">
  <div id="hdr">
    <div id="ttl">GRAND ROULETTE</div>
    <div id="sub">Fortune Wheel · Lucky Draw</div>
  </div>
  <div id="ctrl">
    <label>PLAYERS</label>
    <input type="number" id="pin" value="10" min="2" max="100">
    <button class="cbtn" id="abtn">APPLY</button>
    <button class="cbtn" id="fbtn">⛶ FULL</button>
  </div>
  <div id="rarea">
    <!-- 단 하나의 캔버스: 원판+바늘+허브 모두 여기에 그림 -->
    <canvas id="wc"></canvas>
  </div>
  <button id="spbtn">✦ SPIN ✦</button>
</div>

<div id="wlayer">
  <div id="wcard">
    <span class="wd">🏆</span>
    <div id="wlbl">GRAND PRIZE WINNER</div>
    <div id="wnum">1</div>
    <div id="wtxt">CONGRATULATIONS!</div>
    <button id="wcls" type="button">✦ CONTINUE ✦</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  GRAND ROULETTE — Clean Rebuild
//  바늘: 12시 방향, 캔버스 상단 여백 안에 배치
// ══════════════════════════════════════════

// ── 별 배경 ──
(function(){
  var c=document.getElementById('stc'),x=c.getContext('2d');
  function d(){
    c.width=window.innerWidth;c.height=window.innerHeight;
    for(var i=0;i<180;i++){
      var sx=Math.random()*c.width,sy=Math.random()*c.height,r=Math.random()*1.3+.2,a=Math.random()*.9+.1;
      x.beginPath();x.arc(sx,sy,r,0,6.28);x.fillStyle='rgba(255,248,220,'+a+')';x.fill();
    }
  }
  d();window.addEventListener('resize',d);
})();

// ── Audio ──
var AC=null;
function initAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}
function tone(f,d,tp,v,t0){
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain(),t=t0||AC.currentTime;
  o.type=tp||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.01);
}
var lt=0;
function sfxTick(f){if(!AC)return;var n=Date.now();if(n-lt<25)return;lt=n;tone(f,.08,'triangle',.1);}
function sfxSpin(){
  if(!AC)return;
  var b=AC.createBuffer(1,AC.sampleRate*.06,AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2)*.5;
  var s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=.5;
  s.connect(g);g.connect(AC.destination);s.start();
}
function sfxWobble(){if(!AC)return;var o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=120;g.gain.setValueAtTime(.18,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+2.5);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+2.6);}
function sfxHeart(){if(!AC)return;[0,.28,.56,.9,1.22,1.6,2.0,2.45].forEach(function(d,i){var t=AC.currentTime+d;tone(i%2===0?90:65,.16,'sine',.3,t);});}
function sfxWin(){
  if(!AC)return;
  var m=[[523,.13],[523,.13],[523,.13],[659,.3],[587,.13],[659,.3],[784,.7]],t=AC.currentTime+.05;
  m.forEach(function(n){tone(n[0],n[1],'triangle',.28,t);t+=n[1]+.04;});
  [1046,1318].forEach(function(f){tone(f,1.2,'sine',.07,AC.currentTime+.05);});
}
function sfxDrum(){if(!AC)return;for(var i=0;i<24;i++){var t=AC.currentTime+i*.06;tone(80+i*4,.05,'square',.12,t);}}

// ── 파티클 ──
var fxC=document.getElementById('fx'),fxX=fxC.getContext('2d'),PX=[];
function rzFX(){fxC.width=window.innerWidth;fxC.height=window.innerHeight;}
rzFX();window.addEventListener('resize',rzFX);
function confetti(x,y,n){
  var cols=['#f5c842','#e8183a','#00b86b','#1a6fff','#ff3cac','#ffffff','#ff8c00','#c084fc'];
  for(var i=0;i<(n||220);i++){var a=Math.random()*6.28,sp=Math.random()*20+5;
    PX.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-8,rot:Math.random()*360,vr:(Math.random()-.5)*18,w:Math.random()*9+3,h:Math.random()*5+2,col:cols[Math.floor(Math.random()*cols.length)],s:Math.random()<.25?'c':'r',life:1,dec:Math.random()*.006+.003});}
}
function sparkRing(x,y){for(var i=0;i<50;i++){var a=(i/50)*6.28;PX.push({x:x,y:y,vx:Math.cos(a)*28,vy:Math.sin(a)*28,rot:0,vr:0,w:4,h:4,col:'#f5c842',s:'c',life:1,dec:.04});}}
function drawFX(){
  fxX.clearRect(0,0,fxC.width,fxC.height);
  PX=PX.filter(function(p){return p.life>0;});
  PX.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.32;p.vx*=.98;p.rot+=p.vr;p.life-=p.dec;
    fxX.save();fxX.globalAlpha=Math.max(0,p.life);fxX.translate(p.x,p.y);fxX.rotate(p.rot*Math.PI/180);fxX.fillStyle=p.col;
    if(p.s==='c'){fxX.beginPath();fxX.arc(0,0,p.w/2,0,6.28);fxX.fill();}else{fxX.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
    fxX.restore();});
  requestAnimationFrame(drawFX);
}
drawFX();

// ── 룰렛 ──
var N=10,ANG=0,spinning=false;
var COLS=[
  ['#c0122c','#e8183a'],['#0d5fd4','#1a6fff'],['#007a47','#00b86b'],
  ['#8b0a9e','#b833d4'],['#c45200','#ff6b00'],['#005a8a','#007dc4'],
  ['#8a0038','#cc0055'],['#1a5c00','#2a8c00']
];
var WC=document.getElementById('wc'),WX=WC.getContext('2d');
var R=100,CX=0,CY=0;   // 원판 중심 좌표 (캔버스 기준)
var PTR_H=0;            // 바늘 높이 (캔버스 상단 여백)

function lc(h,f){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return 'rgb('+Math.min(255,r+80*f)+','+Math.min(255,g+80*f)+','+Math.min(255,b+80*f)+')';}
function dc(h,f){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return 'rgb('+Math.max(0,r-60*f)+','+Math.max(0,g-60*f)+','+Math.max(0,b-60*f)+')';}

function resize(){
  var area=document.getElementById('rarea');
  var W=area.clientWidth, H=area.clientHeight;
  // 바늘 높이 확보: 캔버스 총 높이 = 바늘높이 + 원판지름
  var maxR=Math.min(W/2, H*0.44, 200);
  R = Math.floor(maxR);
  PTR_H = Math.round(R * 0.22);  // 바늘이 차지하는 상단 여백
  // 캔버스 크기: 가로=원판지름, 세로=바늘+원판
  WC.width  = R*2 + 4;
  WC.height = R*2 + 4 + PTR_H;
  CX = WC.width / 2;
  CY = PTR_H + R + 2;  // 원판 중심 = 바늘 여백 아래
}

function drawWheel(){
  var c=WX, n=N, arc=Math.PI*2/n;
  c.clearRect(0,0,WC.width,WC.height);

  // ── 1. 바늘 (12시 방향, 캔버스 상단) ──
  var pw = R * 0.12;   // 바늘 너비 절반
  var ptip = CY - R - 4;          // 뾰족한 끝 (원판 표면 바로 위)
  var pbase = PTR_H * 0.08;        // 바늘 꼭대기 y
  c.save();
  // 바늘 삼각형
  c.beginPath();
  c.moveTo(CX, ptip);              // 아래 끝 (원판 접촉점)
  c.lineTo(CX - pw, pbase);
  c.lineTo(CX + pw, pbase);
  c.closePath();
  var pg = c.createLinearGradient(CX, pbase, CX, ptip);
  pg.addColorStop(0, '#8a6200');
  pg.addColorStop(0.35, '#f5c842');
  pg.addColorStop(0.7,  '#fff0a0');
  pg.addColorStop(1,    '#f5c842');
  c.fillStyle = pg;
  c.shadowColor = 'rgba(245,200,66,1)';
  c.shadowBlur  = 20;
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.5)';
  c.lineWidth   = 1.5;
  c.stroke();
  // 바늘 꼭대기 장식 원
  var br = pw * 0.85;
  c.beginPath(); c.arc(CX, pbase, br, 0, 6.28);
  var bg = c.createRadialGradient(CX-br*.3, pbase-br*.3, 1, CX, pbase, br);
  bg.addColorStop(0,'#fff8d0'); bg.addColorStop(1,'#b8860b');
  c.fillStyle = bg; c.shadowBlur = 10; c.fill();
  c.strokeStyle='rgba(255,255,255,.4)'; c.lineWidth=1; c.stroke();
  c.restore();

  // ── 2. 원판 외부 글로우 ──
  c.save();
  c.shadowColor='rgba(245,200,66,.45)'; c.shadowBlur=30;
  c.beginPath(); c.arc(CX,CY,R+2,0,6.28);
  c.strokeStyle='rgba(245,200,66,.2)'; c.lineWidth=2; c.stroke();
  c.restore();

  // ── 3. 섹터 ──
  for(var i=0;i<n;i++){
    var sa=ANG+i*arc-Math.PI/2, ea=sa+arc, ma=(sa+ea)/2;
    var ci=i%COLS.length, col=COLS[ci];
    c.save();
    var gr=c.createRadialGradient(CX,CY,R*.1,CX,CY,R*.97);
    gr.addColorStop(0,lc(col[0],.4)); gr.addColorStop(.5,col[1]); gr.addColorStop(1,dc(col[0],.3));
    c.beginPath(); c.moveTo(CX,CY); c.arc(CX,CY,R,sa,ea); c.closePath();
    c.fillStyle=gr; c.fill();
    c.strokeStyle='rgba(0,0,0,.4)'; c.lineWidth=1.5; c.stroke();
    c.restore();

    // 번호
    var tr=n<=20?R*.72:n<=50?R*.76:R*.8;
    var fs=n<=10?17:n<=20?13:n<=40?10:n<=70?8.5:7;
    var tx=CX+Math.cos(ma)*tr, ty=CY+Math.sin(ma)*tr;
    c.save();
    c.translate(tx,ty); c.rotate(ma+Math.PI/2);
    c.textAlign='center'; c.textBaseline='middle';
    c.font='900 '+fs+'px "Cinzel Decorative",serif';
    c.shadowColor='rgba(0,0,0,.9)'; c.shadowBlur=5;
    c.fillStyle='rgba(0,0,0,.5)'; c.fillText(String(i+1),1.2,1.2);
    c.shadowBlur=0; c.fillStyle='#fff'; c.fillText(String(i+1),0,0);
    c.restore();
  }

  // ── 4. 골드 외곽 링 ──
  c.save();
  c.beginPath(); c.arc(CX,CY,R-.5,0,6.28);
  var gl=c.createLinearGradient(CX-R,CY,CX+R,CY);
  gl.addColorStop(0,'#8a6200'); gl.addColorStop(.25,'#f5c842');
  gl.addColorStop(.5,'#fff0a0'); gl.addColorStop(.75,'#f5c842'); gl.addColorStop(1,'#8a6200');
  c.strokeStyle=gl; c.lineWidth=8;
  c.shadowColor='rgba(245,200,66,.6)'; c.shadowBlur=10; c.stroke(); c.restore();

  // ── 5. 섹터 경계 보석 ──
  for(var j=0;j<n;j++){
    var ba=ANG+j*arc-Math.PI/2;
    c.save();
    c.beginPath(); c.arc(CX+Math.cos(ba)*(R-5),CY+Math.sin(ba)*(R-5),n<=30?3.5:n<=60?2.5:2,0,6.28);
    c.fillStyle='#f5c842'; c.shadowColor='rgba(245,200,66,.9)'; c.shadowBlur=5; c.fill(); c.restore();
  }

  // ── 6. 중앙 허브 ──
  var hs=R*.22;
  c.save();
  c.beginPath(); c.arc(CX,CY,hs,0,6.28);
  var hg1=c.createLinearGradient(CX-hs,CY,CX+hs,CY);
  hg1.addColorStop(0,'#3a2800'); hg1.addColorStop(.5,'#f5c842'); hg1.addColorStop(1,'#8a5e00');
  c.strokeStyle=hg1; c.lineWidth=4; c.shadowColor='rgba(245,200,66,.7)'; c.shadowBlur=8; c.stroke();
  c.beginPath(); c.arc(CX,CY,hs-3,0,6.28);
  var hg2=c.createRadialGradient(CX-hs*.3,CY-hs*.3,1,CX,CY,hs);
  hg2.addColorStop(0,'#3a2000'); hg2.addColorStop(1,'#0a0600');
  c.fillStyle=hg2; c.shadowBlur=0; c.fill();
  c.fillStyle='#f5c842'; c.shadowColor='rgba(245,200,66,.8)'; c.shadowBlur=6;
  c.save(); c.translate(CX,CY); c.rotate(Math.PI/4);
  var ds=hs*.28; c.fillRect(-ds/2,-ds/2,ds,ds); c.restore();
  for(var vi=0;vi<6;vi++){
    var va=(vi/6)*6.28;
    c.beginPath(); c.arc(CX+Math.cos(va)*(hs-5),CY+Math.sin(va)*(hs-5),2.2,0,6.28); c.fill();
  }
  c.restore();
}

// ── SVG 데코 링 (원판 중심 기준으로 배치) ──
function buildSVG(){
  var area=document.getElementById('rarea');
  var old=area.querySelector('svg.dsvg'); if(old) old.remove();
  var NS='http://www.w3.org/2000/svg';
  // 캔버스의 화면상 위치 기준으로 SVG 배치
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('class','dsvg');
  svg.setAttribute('width', WC.width);
  svg.setAttribute('height', WC.height);
  svg.style.cssText='position:absolute;pointer-events:none;z-index:5;';
  var cx=CX, cy=CY;

  function mkC(r,stroke,sw,da,dur,dir){
    var c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r);
    c.setAttribute('fill','none'); c.setAttribute('stroke',stroke); c.setAttribute('stroke-width',sw);
    if(da) c.setAttribute('stroke-dasharray',da);
    var at=document.createElementNS(NS,'animateTransform');
    at.setAttribute('attributeName','transform'); at.setAttribute('type','rotate');
    at.setAttribute('from','0 '+cx+' '+cy); at.setAttribute('to',(dir||360)+' '+cx+' '+cy);
    at.setAttribute('dur',dur); at.setAttribute('repeatCount','indefinite');
    c.appendChild(at); return c;
  }
  svg.appendChild(mkC(R+14,'rgba(245,200,66,.12)',5,'','3s'));
  svg.appendChild(mkC(R+20,'rgba(245,200,66,.5)',1.5,'4 8','18s'));
  svg.appendChild(mkC(R+26,'rgba(245,200,66,.18)',1,'2 12','28s','-360'));

  // LED 불빛
  for(var i=0;i<24;i++){
    var a=(i/24)*6.28, lx=cx+Math.cos(a)*(R+8), ly=cy+Math.sin(a)*(R+8);
    var dot=document.createElementNS(NS,'circle');
    dot.setAttribute('cx',lx); dot.setAttribute('cy',ly); dot.setAttribute('r','3');
    dot.setAttribute('fill',['#f5c842','#ff3cac','#00b86b','#1a6fff','#ff6b00'][i%5]);
    var bk=document.createElementNS(NS,'animate');
    bk.setAttribute('attributeName','opacity'); bk.setAttribute('values','0.2;1;0.2');
    bk.setAttribute('dur',(1+Math.random()*1.5)+'s'); bk.setAttribute('repeatCount','indefinite');
    bk.setAttribute('begin',Math.random()*.8+'s');
    dot.appendChild(bk); svg.appendChild(dot);
  }
  area.appendChild(svg);
}

function build(){
  resize(); drawWheel(); buildSVG();
}

// ── 스핀: 3페이즈 + 워블(앞뒤 진동) ──
function getSector(a){
  var arc=Math.PI*2/N;
  // 포인터는 12시(−π/2 방향)를 가리킴
  // 원판은 ANG 기준으로 -π/2에서 섹터0 시작
  // 포인터가 가리키는 섹터: 12시 방향 = -π/2 절대각
  var norm=((-(a)+Math.PI*2*1000)%(Math.PI*2));
  return Math.floor(norm/arc)%N;
}

function spin(){
  if(spinning) return;
  initAC(); spinning=true;
  document.getElementById('spbtn').disabled=true;

  var winner=Math.floor(Math.random()*N)+1;
  var arc=Math.PI*2/N;
  // winner 섹터 중심을 12시(−π/2)에 맞추기 위한 각도
  // 섹터 i의 중심 = ANG + i*arc + arc/2 - π/2 (절대각)
  // 포인터 = 각도 0(12시) → ANG에서 winner가 맨 위로
  var targetSectorMid = ((winner-1)*arc) + arc/2;
  var currentNorm = ((ANG % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  var diff = (targetSectorMid - currentNorm + Math.PI*2) % (Math.PI*2);
  var extraSpins = (7 + Math.floor(Math.random()*4)) * Math.PI*2;
  var totalRot = extraSpins + diff;

  var startAng=ANG, mainEnd=startAng+totalRot;
  var totalDur=9000+Math.random()*3000;
  var wobbleDur=2000, wobbleAmp=arc*(0.7+Math.random()*1.0), wobbleCount=3+Math.floor(Math.random()*3);

  var startT=null, lastSec=-1, phase='main';
  var wobbleT=0, drumDone=false, heartDone=false, wobbleDone=false;

  sfxSpin();

  function easeMain(t){
    if(t<.1) return (t/.1)*(t/.1)*.15;
    if(t<.62){ var s=.15,r=s/.1; return s+r*(t-.1); }
    var s2=.15+(.15/.1)*(.62-.1), u=(t-.62)/.38;
    return s2+(1-s2)*(1-Math.pow(1-u,6));
  }
  function easeWobble(t){
    return wobbleAmp*Math.exp(-3.8*t)*Math.sin(wobbleCount*Math.PI*t);
  }

  function frame(ts){
    if(!startT) startT=ts;
    var el=ts-startT;

    if(phase==='main'){
      var t=Math.min(el/totalDur,1);
      ANG=startAng+totalRot*easeMain(t);

      var sec=getSector(ANG);
      if(sec!==lastSec){ lastSec=sec; sfxTick(200+Math.min(Math.abs(totalRot*easeMain(Math.max(0,t-.01)))*40,1400)); }
      if(t>.59&&!drumDone){ drumDone=true; sfxDrum(); }
      if(t>.79&&!heartDone){ heartDone=true; sfxHeart(); }

      drawWheel();
      if(t>=1){
        ANG=mainEnd; phase='wobble'; wobbleT=ts; sfxWobble();
      }
      requestAnimationFrame(frame);

    } else if(phase==='wobble'){
      var wt=(ts-wobbleT)/wobbleDur; if(wt>=1){ wt=1; phase='done'; }
      ANG=mainEnd+easeWobble(wt);

      var ws=getSector(ANG);
      if(ws!==lastSec){ lastSec=ws; sfxTick(240+Math.floor(Math.random()*180)); }

      drawWheel();
      if(phase==='done'){
        ANG=mainEnd; drawWheel(); spinning=false;
        setTimeout(function(){
          sfxWin();
          var cx2=window.innerWidth/2, cy2=window.innerHeight*.45;
          sparkRing(cx2,cy2); confetti(cx2,cy2,250);
          setTimeout(function(){confetti(cx2,cy2,180);},350);
          setTimeout(function(){confetti(cx2,cy2,150);},700);
          showWinner(winner);
          document.getElementById('spbtn').disabled=false;
        },300);
        return;
      }
      requestAnimationFrame(frame);
    }
  }
  requestAnimationFrame(frame);
}

function showWinner(n){
  var wn=document.getElementById('wnum');
  wn.style.animation='none'; wn.offsetWidth; wn.style.animation='wpop .6s cubic-bezier(.22,1.4,.36,1) both';
  wn.textContent=n;
  var col=COLS[(n-1)%COLS.length][1];
  wn.style.background='linear-gradient(180deg,#fff8e0 0%,'+col+' 40%,'+dc(col,.2)+' 100%)';
  wn.style.webkitBackgroundClip='text'; wn.style.webkitTextFillColor='transparent'; wn.style.backgroundClip='text';
  document.getElementById('wlayer').classList.add('show');
}
function closeWin(){ document.getElementById('wlayer').classList.remove('show'); }

// ── 이벤트 연결 ──
document.getElementById('spbtn').addEventListener('click', spin);
document.getElementById('spbtn').addEventListener('touchstart', function(e){ e.preventDefault(); spin(); }, {passive:false});

document.getElementById('abtn').addEventListener('click', function(){
  var v=parseInt(document.getElementById('pin').value,10);
  if(isNaN(v)||v<2)v=2; if(v>100)v=100;
  document.getElementById('pin').value=v;
  N=v; ANG=0; build();
});
document.getElementById('fbtn').addEventListener('click', function(){
  var d=document.documentElement;
  if(!document.fullscreenElement)(d.requestFullscreen||d.webkitRequestFullScreen||d.mozRequestFullScreen).call(d).catch(function(){});
  else(document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen).call(document);
});

// CONTINUE 버튼 — 모든 방식 연결
(function(){
  var btn=document.getElementById('wcls');
  var lay=document.getElementById('wlayer');
  btn.addEventListener('click', closeWin);
  btn.addEventListener('touchstart', function(e){ e.stopPropagation(); }, {passive:true});
  btn.addEventListener('touchend', function(e){ e.preventDefault(); e.stopPropagation(); closeWin(); }, {passive:false});
  lay.addEventListener('click', function(e){ if(e.target===lay) closeWin(); });
  lay.addEventListener('touchend', function(e){ if(e.target===lay){ e.preventDefault(); closeWin(); } }, {passive:false});
})();

window.addEventListener('resize', function(){ build(); });

// 초기화
build();
</script>
