<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyber Breakout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            /* 사이버틱한 그리드 배경 */
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none; /* 모바일 새로고침 방지 */
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            background: linear-gradient(180deg, #100020 0%, #050510 100%);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(255, 0, 255, 0.2);
            border: 2px solid #0ff;
            border-radius: 5px;
            display: block;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            text-shadow: 0 0 10px #0ff;
            pointer-events: none;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: transparent;
            color: #0ff;
            border: 1px solid #0ff;
            font-family: inherit;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 10px #0ff;
            pointer-events: auto;
        }
        button:hover { background: #0ff; color: #000; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="ui">
        <h1 id="title">NEON BREAKOUT</h1>
        <button id="startBtn">GAME START</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const ui = document.getElementById('ui');
    const title = document.getElementById('title');

    // 화면 크기에 맞게 캔버스 조정 (모바일 대응)
    function resizeCanvas() {
        const scale = Math.min(window.innerWidth / 420, window.innerHeight / 620);
        if (scale < 1) {
            canvas.style.width = `${400 * scale}px`;
            canvas.style.height = `${600 * scale}px`;
        }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Web Audio API (고전 오락실 사운드) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.1);
            gainNode.gain.setValueAtTime(0.05, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(440, now + 0.05);
            gainNode.gain.setValueAtTime(0.05, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'brick') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        }
    }

    // --- 게임 변수 ---
    let animationId;
    let isPlaying = false;
    let score = 0;

    const paddle = { x: 160, y: 550, w: 80, h: 10, speed: 6, color: '#0ff' };
    const ball = { x: 200, y: 530, radius: 6, dx: 4, dy: -4, color: '#f0f' };
    let bullets = [];
    let bricks = [];

    const brickConfig = { row: 6, col: 7, w: 45, h: 20, padding: 8, offsetTop: 50, offsetLeft: 18 };
    const colors = ['#ff0055', '#ff00ff', '#00ffff', '#00ff00', '#ffff00', '#ffaa00'];

    function initBricks() {
        bricks = [];
        for (let c = 0; c < brickConfig.col; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickConfig.row; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r] };
            }
        }
    }

    // --- 입력 처리 (모바일 터치 & PC 마우스) ---
    let isLeftPressed = false;
    let isRightPressed = false;

    // 터치 및 마우스 드래그로 패들 이동
    function handleMove(e) {
        if (!isPlaying) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const scaleX = canvas.width / rect.width;
        let relativeX = (clientX - rect.left) * scaleX;
        if (relativeX > 0 && relativeX < canvas.width) {
            paddle.x = relativeX - paddle.w / 2;
        }
    }

    // 터치 및 클릭으로 총 쏘기
    function handleShoot(e) {
        if (!isPlaying) return;
        e.preventDefault();
        bullets.push({ x: paddle.x + paddle.w / 2, y: paddle.y, radius: 3, speed: 7 });
        playSound('shoot');
    }

    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    canvas.addEventListener('mousedown', handleShoot);
    canvas.addEventListener('touchstart', handleShoot, { passive: false });

    // PC 키보드
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') isRightPressed = true;
        if (e.key === 'ArrowLeft') isLeftPressed = true;
        if (e.key === ' ' && isPlaying) handleShoot(e);
    });
    document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowRight') isRightPressed = false;
        if (e.key === 'ArrowLeft') isLeftPressed = false;
    });

    // --- 그리기 함수 ---
    function drawNeonRect(x, y, w, h, color) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
        ctx.shadowBlur = 0;
    }

    function drawNeonCircle(x, y, radius, color) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.shadowBlur = 15;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 패들 그리기
        drawNeonRect(paddle.x, paddle.y, paddle.w, paddle.h, paddle.color);

        // 공 그리기
        drawNeonCircle(ball.x, ball.y, ball.radius, ball.color);

        // 총알 그리기 및 업데이트
        for (let i = 0; i < bullets.length; i++) {
            let b = bullets[i];
            drawNeonCircle(b.x, b.y, b.radius, '#fff');
            b.y -= b.speed;
            if (b.y < 0) bullets.splice(i, 1);
        }

        // 블록 그리기 및 충돌 처리
        let allBroken = true;
        for (let c = 0; c < brickConfig.col; c++) {
            for (let r = 0; r < brickConfig.row; r++) {
                let b = bricks[c][r];
                if (b.status === 1) {
                    allBroken = false;
                    let brickX = (c * (brickConfig.w + brickConfig.padding)) + brickConfig.offsetLeft;
                    let brickY = (r * (brickConfig.h + brickConfig.padding)) + brickConfig.offsetTop;
                    b.x = brickX;
                    b.y = brickY;
                    drawNeonRect(brickX, brickY, brickConfig.w, brickConfig.h, b.color);

                    // 공 충돌
                    if (ball.x > b.x && ball.x < b.x + brickConfig.w && ball.y > b.y && ball.y < b.y + brickConfig.h) {
                        ball.dy = -ball.dy;
                        b.status = 0;
                        score += 10;
                        playSound('brick');
                    }

                    // 총알 충돌
                    for (let j = 0; j < bullets.length; j++) {
                        let bullet = bullets[j];
                        if (bullet.x > b.x && bullet.x < b.x + brickConfig.w && bullet.y > b.y && bullet.y < b.y + brickConfig.h) {
                            b.status = 0;
                            score += 5;
                            bullets.splice(j, 1);
                            playSound('brick');
                            break;
                        }
                    }
                }
            }
        }

        if (allBroken) gameOver("STAGE CLEAR!");

        // 점수
        ctx.font = "16px Courier New";
        ctx.fillStyle = "#0ff";
        ctx.fillText("SCORE: " + score, 8, 20);

        // 공 이동 및 벽 충돌
        ball.x += ball.dx;
        ball.y += ball.dy;

        if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
            ball.dx = -ball.dx;
            playSound('hit');
        }
        if (ball.y + ball.dy < ball.radius) {
            ball.dy = -ball.dy;
            playSound('hit');
        } else if (ball.y + ball.dy > canvas.height - ball.radius) {
            gameOver("GAME OVER");
            return;
        }

        // 공과 패들 충돌
        if (ball.y + ball.dy > paddle.y - ball.radius && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
            ball.dy = -ball.dy;
            // 타격 위치에 따른 각도 변화
            let hitPoint = ball.x - (paddle.x + paddle.w / 2);
            ball.dx = hitPoint * 0.15;
            playSound('hit');
        }

        // 패들 이동 (키보드)
        if (isRightPressed && paddle.x < canvas.width - paddle.w) paddle.x += paddle.speed;
        else if (isLeftPressed && paddle.x > 0) paddle.x -= paddle.speed;

        if (isPlaying) animationId = requestAnimationFrame(draw);
    }

    function gameOver(msg) {
        isPlaying = false;
        cancelAnimationFrame(animationId);
        ui.style.pointerEvents = 'auto';
        title.innerText = msg;
        title.style.display = 'block';
        startBtn.style.display = 'inline-block';
        startBtn.innerText = 'RESTART';
    }

    startBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new AudioContext(); // 사용자 인터랙션 후 오디오 활성화
        audioCtx.resume();
        
        ui.style.pointerEvents = 'none';
        title.style.display = 'none';
        startBtn.style.display = 'none';
        
        initBricks();
        score = 0;
        ball.x = 200; ball.y = 530;
        ball.dx = 4; ball.dy = -4;
        paddle.x = 160;
        bullets = [];
        isPlaying = true;
        draw();
    });

</script>
</body>
</html>
