  <script>
    /* 
      Web Audio 기반 추억의 아케이드 Ponpoko 사운드 시스템:
      - 오리지널 경쾌한 너구리 배경음악(BGM) 루프 멜로디
      - 점프, 아이템 수집, 사다리, 피격, 라운드 클리어 효과음
    */
    class PonpokoAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.bgmTimer = null;
        this.isBgmPlaying = false;
        this.bgmStep = 0;

        // 원작 오락실 너구리 메인 테마 멜로디 (주파수 & 길이)
        // 경쾌한 포크 댄스풍의 멜로디 시퀀스
        this.melody = [
          { f: 523.25, d: 0.15 }, { f: 659.25, d: 0.15 }, { f: 783.99, d: 0.15 }, { f: 1046.5, d: 0.2 },
          { f: 880.00, d: 0.15 }, { f: 783.99, d: 0.15 }, { f: 659.25, d: 0.25 }, { f: 0, d: 0.05 },
          { f: 587.33, d: 0.15 }, { f: 659.25, d: 0.15 }, { f: 698.46, d: 0.15 }, { f: 880.00, d: 0.2 },
          { f: 783.99, d: 0.15 }, { f: 659.25, d: 0.15 }, { f: 523.25, d: 0.25 }, { f: 0, d: 0.05 },

          { f: 523.25, d: 0.15 }, { f: 659.25, d: 0.15 }, { f: 783.99, d: 0.15 }, { f: 1046.5, d: 0.2 },
          { f: 1174.6, d: 0.15 }, { f: 1046.5, d: 0.15 }, { f: 880.00, d: 0.25 }, { f: 0, d: 0.05 },
          { f: 783.99, d: 0.15 }, { f: 880.00, d: 0.15 }, { f: 987.77, d: 0.15 }, { f: 1046.5, d: 0.25 },
          { f: 783.99, d: 0.15 }, { f: 659.25, d: 0.15 }, { f: 523.25, d: 0.3 },  { f: 0, d: 0.1 }
        ];

        // 베이스 라인 (뚱땅거리는 8비트 아르페지오 베이스)
        this.bass = [
          261.6, 392.0, 261.6, 392.0, 220.0, 329.6, 261.6, 392.0,
          293.6, 440.0, 293.6, 440.0, 261.6, 392.0, 261.6, 392.0,
          261.6, 392.0, 261.6, 392.0, 220.0, 440.0, 220.0, 440.0,
          392.0, 493.8, 523.2, 392.0, 261.6, 329.6, 261.6, 0
        ];
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startBGM() {
        if (!this.enabled || this.isBgmPlaying) return;
        this.init();
        this.isBgmPlaying = true;
        this.bgmStep = 0;
        this.scheduleBGMNote();
      }

      stopBGM() {
        this.isBgmPlaying = false;
        if (this.bgmTimer) {
          clearTimeout(this.bgmTimer);
          this.bgmTimer = null;
        }
      }

      scheduleBGMNote() {
        if (!this.isBgmPlaying || !this.enabled) return;

        const note = this.melody[this.bgmStep % this.melody.length];
        const bassFreq = this.bass[this.bgmStep % this.bass.length];
        const now = this.ctx.currentTime;

        // 1. 리드 멜로디 (펄스 사각파)
        if (note.f > 0) {
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(note.f, now);
            gain.gain.setValueAtTime(0.045, now);
            gain.gain.exponentialRampToValueAtTime(0.005, now + note.d * 0.85);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + note.d);
          } catch(e) {}
        }

        // 2. 통통 튀는 베이스 (삼각파)
        if (bassFreq > 0) {
          try {
            const bOsc = this.ctx.createOscillator();
            const bGain = this.ctx.createGain();
            bOsc.type = 'triangle';
            bOsc.frequency.setValueAtTime(bassFreq * 0.5, now);
            bGain.gain.setValueAtTime(0.06, now);
            bGain.gain.linearRampToValueAtTime(0.01, now + note.d * 0.7);
            bOsc.connect(bGain);
            bGain.connect(this.ctx.destination);
            bOsc.start(now);
            bOsc.stop(now + note.d);
          } catch(e) {}
        }

        this.bgmStep++;
        const nextTime = Math.max(100, note.d * 1000);
        this.bgmTimer = setTimeout(() => {
          this.scheduleBGMNote();
        }, nextTime);
      }

      playJump() {
        if (!this.enabled) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.14);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.14);
        } catch(e) {}
      }

      playCollect() {
        if (!this.enabled) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          [659.25, 880.00, 1318.5].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.04);
            gain.gain.setValueAtTime(0.12, now + i * 0.04);
            gain.gain.linearRampToValueAtTime(0.001, now + i * 0.04 + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.04);
            osc.stop(now + i * 0.04 + 0.08);
          });
        } catch(e) {}
      }

      playLadder() {
        if (!this.enabled) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240 + (Math.random() * 30), now);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.035);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.035);
        } catch(e) {}
      }

      playDie() {
        if (!this.enabled) return;
        this.stopBGM();
        this.init();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.linearRampToValueAtTime(70, now + 0.45);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        } catch(e) {}
      }

      playStageClear() {
        if (!this.enabled) return;
        this.stopBGM();
        this.init();
        try {
          const notes = [392.0, 523.2, 659.2, 783.9, 1046.5, 1318.5];
          const now = this.ctx.currentTime;
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            const t = now + idx * 0.08;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.linearRampToValueAtTime(0.005, t + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.14);
          });
        } catch(e) {}
      }
    }

    const sound = new PonpokoAudioEngine();
  </script>

          { x: 430, floorY: 420, type: 'grape', points: 250 },
          { x: 250, floorY: 320, type: 'watermelon', points: 300 },
          { x: 570, floorY: 320, type: 'apple', points: 150 },
          { x: 250, floorY: 220, type: 'strawberry', points: 200 },
          { x: 610, floorY: 220, type: 'grape', points: 250 },
          { x: 130, floorY: 120, type: 'watermelon', points: 300 },
          { x: 670, floorY: 120, type: 'watermelon', points: 300 }
        ],
        startPos: { x: 75, y: 520 }
      }
    ];
  </script>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const stageDisplay = document.getElementById('stageDisplay');
    const livesContainer = document.getElementById('livesContainer');
    const overlayScreen = document.getElementById('overlayScreen');
    const startMenu = document.getElementById('startMenu');
    const stageClearMenu = document.getElementById('stageClearMenu');
    const gameOverMenu = document.getElementById('gameOverMenu');
    const stageClearBonusText = document.getElementById('stageClearBonusText');
    const finalScoreText = document.getElementById('finalScoreText');

    let gameState = 'START'; // START, PLAYING, DYING, STAGECLEAR, GAMEOVER
    let currentStageIndex = 0;
    let score = 0;
    let highScore = 5000;
    let lives = 3;

    // 조작 키 입력 상태
    const keys = {
      left: false,
      right: false,
      up: false,
      down: false,
      jump: false
    };

    // 너구리 플레이어 객체
    const raccoon = {
      x: 75,
      y: 520,
      width: 32,
      height: 36,
      vx: 0,
      vy: 0,
      speed: 3.3,
      climbSpeed: 2.5,
      jumpForce: -6.3,       // 원작 맞춤 점프력 (장애물만 적절히 뛰어넘는 쾌적한 궤적)
      gravity: 0.44,         // 중력
      jumpOriginFloorY: 520, // 점프 시 윗층 뚫고 올라가는 것 방지용 기준 층
      facing: 1,             // 1: 우측, -1: 좌측
      isGrounded: true,
      isClimbing: false,
      isJumping: false,
      jumpVx: 0,             // 점프 중 관성 속도 고정 (원작 방식)
      walkFrame: 0,
      walkTimer: 0,

      reset(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.facing = 1;
        this.isGrounded = true;
        this.isClimbing = false;
        this.isJumping = false;
        this.jumpVx = 0;
        this.jumpOriginFloorY = y;
        this.walkFrame = 0;
        this.walkTimer = 0;
      }
    };

    let currentFloors = [];
    let currentLadders = [];
    let currentTraps = [];
    let currentSnakes = [];
    let currentItems = [];

    function loadStage(index) {
      const template = STAGES[index % STAGES.length];
      currentFloors = JSON.parse(JSON.stringify(template.floors));
      currentLadders = JSON.parse(JSON.stringify(template.ladders));
      currentTraps = JSON.parse(JSON.stringify(template.traps));
      currentSnakes = JSON.parse(JSON.stringify(template.snakes));
      currentItems = JSON.parse(JSON.stringify(template.items));

      raccoon.reset(template.startPos.x, template.startPos.y);
      stageDisplay.textContent = String(index + 1).padStart(2, '0');
      updateLivesUI();
    }

    function updateScore(pts) {
      score += pts;
      scoreDisplay.textContent = String(score).padStart(5, '0');
      if (score > highScore) {
        highScore = score;
        highScoreDisplay.textContent = String(highScore).padStart(5, '0');
      }
    }

    function updateLivesUI() {
      let str = '';
      for (let i = 0; i < lives; i++) str += '🦝';
      livesContainer.innerHTML = str || '💀';
    }

    // 키보드 이벤트
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
      if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
        keys.jump = true;
        if (gameState === 'START') startGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
      if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.jump = false;
    });

    // 모바일 터치 및 마우스 바인딩 (동시 멀티터치 완벽 지원)
    function bindTouchControl(id, keyName) {
      const btn = document.getElementById(id);
      if (!btn) return;
      const onStart = (e) => {
        e.preventDefault();
        keys[keyName] = true;
        if (gameState === 'START') startGame();
      };
      const onEnd = (e) => {
        e.preventDefault();
        keys[keyName] = false;
      };
      btn.addEventListener('touchstart', onStart, { passive: false });
      btn.addEventListener('touchend', onEnd, { passive: false });
      btn.addEventListener('touchcancel', onEnd, { passive: false });
      btn.addEventListener('mousedown', onStart);
      btn.addEventListener('mouseup', onEnd);
      btn.addEventListener('mouseleave', onEnd);
    }

    bindTouchControl('btnUp', 'up');
    bindTouchControl('btnDown', 'down');
    bindTouchControl('btnLeft', 'left');
    bindTouchControl('btnRight', 'right');
    bindTouchControl('btnJump', 'jump');

    function checkLadder(px, py) {
      for (const ladder of currentLadders) {
        if (Math.abs(px - ladder.x) < 20) {
          if (py >= ladder.y1 - 4 && py <= ladder.y2 + 4) {
            return ladder;
          }
        }
      }
      return null;
    }

    function updatePlayerPhysics() {
      const ladder = checkLadder(raccoon.x, raccoon.y);

      // 1. 사다리 오르내리기
      if (ladder && !raccoon.isJumping) {
        if (keys.up) {
          raccoon.isClimbing = true;
          raccoon.x = ladder.x;
          raccoon.y -= raccoon.climbSpeed;
          sound.playLadder();
          if (raccoon.y <= ladder.y1) {
            raccoon.y = ladder.y1;
            raccoon.isClimbing = false;
            raccoon.isGrounded = true;
          }
        } else if (keys.down) {
          raccoon.isClimbing = true;
          raccoon.x = ladder.x;
          raccoon.y += raccoon.climbSpeed;
          sound.playLadder();
          if (raccoon.y >= ladder.y2) {
            raccoon.y = ladder.y2;
            raccoon.isClimbing = false;
            raccoon.isGrounded = true;
          }
        }
      } else {
        raccoon.isClimbing = false;
      }

      if (raccoon.isClimbing) return;

      // 2. 아케이드 점프 트리거
      if (raccoon.isGrounded && keys.jump && !raccoon.isJumping) {
        raccoon.isJumping = true;
        raccoon.isGrounded = false;
        raccoon.vy = raccoon.jumpForce;
        raccoon.jumpOriginFloorY = raccoon.y;

        if (keys.left) {
          raccoon.jumpVx = -raccoon.speed;
          raccoon.facing = -1;
        } else if (keys.right) {
          raccoon.jumpVx = raccoon.speed;
          raccoon.facing = 1;
        } else {
          raccoon.jumpVx = 0;
        }
        sound.playJump();
      }

      // 3. 점프 이동 & 중력 & 윗층 천장 충돌 가드
      if (raccoon.isJumping) {
        raccoon.x += raccoon.jumpVx;
        raccoon.y += raccoon.vy;
        raccoon.vy += raccoon.gravity;

        // 윗층 바닥 아래 천장 부딪힘 방지
        for (const floor of currentFloors) {
          if (floor.y < raccoon.jumpOriginFloorY && raccoon.x >= floor.x1 - 10 && raccoon.x <= floor.x2 + 10) {
            if (raccoon.y - raccoon.height <= floor.y + 12 && raccoon.vy < 0) {
              raccoon.vy = 0.5;
            }
          }
        }
      } else {
        // 평지 보행
        if (keys.left) {
          raccoon.x -= raccoon.speed;
          raccoon.facing = -1;
          raccoon.walkTimer++;
          if (raccoon.walkTimer % 7 === 0) raccoon.walkFrame = (raccoon.walkFrame + 1) % 4;
        } else if (keys.right) {
          raccoon.x += raccoon.speed;
          raccoon.facing = 1;
          raccoon.walkTimer++;
          if (raccoon.walkTimer % 7 === 0) raccoon.walkFrame = (raccoon.walkFrame + 1) % 4;
        } else {
          raccoon.walkFrame = 0;
        }

        if (!raccoon.isGrounded) {
          raccoon.y += raccoon.vy;
          raccoon.vy += raccoon.gravity;
        }
      }

      // 화면 경계 제한
      if (raccoon.x < 55) raccoon.x = 55;
      if (raccoon.x > 745) raccoon.x = 745;

      // 4. 바닥 착지 감지 (점프로 윗층 뚫고 올라가는 버그 완벽 차단)
      raccoon.isGrounded = false;
      for (const floor of currentFloors) {
        if (raccoon.isJumping && floor.y < raccoon.jumpOriginFloorY - 10) {
          continue; // 점프로는 절대 윗 층 바닥에 착지할 수 없음
        }
        if (raccoon.x >= floor.x1 - 15 && raccoon.x <= floor.x2 + 15) {
          const feetPrev = raccoon.y - raccoon.vy;
          if (raccoon.vy >= 0 && feetPrev <= floor.y + 4 && raccoon.y >= floor.y - 6) {
            raccoon.y = floor.y;
            raccoon.vy = 0;
            raccoon.isGrounded = true;
            raccoon.isJumping = false;
            raccoon.jumpVx = 0;
            break;
          }
        }
      }

      if (raccoon.y > 580) {
        handlePlayerDeath();
      }
    }

    function updateSnakes() {
      for (const snake of currentSnakes) {
        snake.x += snake.speed * snake.dir;
        if (snake.x >= snake.maxX) {
          snake.x = snake.maxX;
          snake.dir = -1;
        } else if (snake.x <= snake.minX) {
          snake.x = snake.minX;
          snake.dir = 1;
        }
      }
    }

    function checkHazardAndItemCollisions() {
      if (gameState !== 'PLAYING') return;

      const pBox = {
        left: raccoon.x - 12,
        right: raccoon.x + 12,
        top: raccoon.y - raccoon.height + 4,
        bottom: raccoon.y
      };

      // 1. 압정/가시 충돌
      for (const trap of currentTraps) {
        const tBox = {
          left: trap.x - 11,
          right: trap.x + 11,
          top: trap.floorY - 15,
          bottom: trap.floorY
        };
        if (intersect(pBox, tBox)) {
          handlePlayerDeath();
          return;
        }
      }

      // 2. 뱀 충돌
      for (const snake of currentSnakes) {
        const sBox = {
          left: snake.x - 15,
          right: snake.x + 15,
          top: snake.floorY - 18,
          bottom: snake.floorY
        };
        if (intersect(pBox, sBox)) {
          handlePlayerDeath();
          return;
        }
      }

      // 3. 먹이 획득
      for (let i = currentItems.length - 1; i >= 0; i--) {
        const item = currentItems[i];
        const iBox = {
          left: item.x - 14,
          right: item.x + 14,
          top: item.floorY - 28,
          bottom: item.floorY
        };
        if (intersect(pBox, iBox)) {
          updateScore(item.points);
          sound.playCollect();
          currentItems.splice(i, 1);

          if (currentItems.length === 0) {
            triggerStageClear();
            return;
          }
        }
      }
    }

    function intersect(a, b) {
      return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
    }

    function handlePlayerDeath() {
      if (gameState !== 'PLAYING') return;
      gameState = 'DYING';
      sound.playDie();
      lives--;
      updateLivesUI();

      setTimeout(() => {
        if (lives > 0) {
          const template = STAGES[currentStageIndex % STAGES.length];
          raccoon.reset(template.startPos.x, template.startPos.y);
          gameState = 'PLAYING';
          sound.startBGM();
        } else {
          gameState = 'GAMEOVER';
          finalScoreText.textContent = `FINAL SCORE: ${score}`;
          overlayScreen.classList.remove('hidden');
          startMenu.classList.add('hidden');
          stageClearMenu.classList.add('hidden');
          gameOverMenu.classList.remove('hidden');
        }
      }, 950);
    }

    function triggerStageClear() {
      gameState = 'STAGECLEAR';
      sound.playStageClear();
      updateScore(1000);
      stageClearBonusText.textContent = `STAGE BONUS +1000`;

      setTimeout(() => {
        overlayScreen.classList.remove('hidden');
        startMenu.classList.add('hidden');
        gameOverMenu.classList.add('hidden');
        stageClearMenu.classList.remove('hidden');
      }, 750);
    }
  </script>

  <script>
    // 1. 고퀄리티 너구리 캐릭터 렌더링
    function drawRaccoon() {
      ctx.save();
      ctx.translate(raccoon.x, raccoon.y);

      if (raccoon.facing === -1) {
        ctx.scale(-1, 1);
      }

      if (gameState === 'DYING') {
        ctx.rotate((Date.now() % 600) / 50);
      }

      // 그림자
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath();
      ctx.ellipse(0, -1, 14, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // 너구리 줄무늬 꼬리 (살랑거림 애니메이션)
      ctx.save();
      const tailWiggle = Math.sin(Date.now() * 0.018) * 3;
      ctx.translate(-13, -15);
      ctx.rotate(0.25 + tailWiggle * 0.04);
      // 베이스 꼬리
      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.ellipse(0, 0, 9, 6, -0.3, 0, Math.PI * 2);
      ctx.fill();
      // 꼬리 검은 줄무늬
      ctx.fillStyle = '#3e1d08';
      ctx.fillRect(-4, -5, 3, 10);
      ctx.fillRect(1, -5, 3, 9);
      ctx.restore();

      // 너구리 몸통
      ctx.fillStyle = '#9a3412';
      ctx.beginPath();
      ctx.ellipse(0, -19, 14, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      // 배 (밝은 살구색 복부)
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.ellipse(3, -17, 8, 12, 0.1, 0, Math.PI * 2);
      ctx.fill();

      // 머리 / 볼
      ctx.fillStyle = '#9a3412';
      ctx.beginPath();
      ctx.arc(5, -28, 11, 0, Math.PI * 2);
      ctx.fill();

      // 귀 (바깥 & 분홍색 안쪽)
      ctx.fillStyle = '#7c2d12';
      ctx.beginPath();
      ctx.moveTo(-3, -36);
      ctx.lineTo(1, -43);
      ctx.lineTo(6, -37);
      ctx.fill();
      ctx.fillStyle = '#fda4af';
      ctx.beginPath();
      ctx.moveTo(-1, -37);
      ctx.lineTo(1, -41);
      ctx.lineTo(4, -38);
      ctx.fill();

      // 도둑 마스크 (너구리 특유의 검은 눈가 안경무늬)
      ctx.fillStyle = '#261005';
      ctx.beginPath();
      ctx.ellipse(7, -29, 7, 5, 0.1, 0, Math.PI * 2);
      ctx.fill();

      // 똘망똘망한 눈동자
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(8, -30, 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(9.2, -30, 1.5, 0, Math.PI * 2);
      ctx.fill();
      // 하이라이트 반사광
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(9, -31.5, 1, 1);

      // 주둥이 & 코
      ctx.fillStyle = '#ffedd5';
      ctx.beginPath();
      ctx.arc(14, -26, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(16, -27, 1.8, 0, Math.PI * 2);
      ctx.fill();

      // 손과 발 (사다리 타기 / 뜀박질 애니메이션)
      ctx.fillStyle = '#431407';
      if (raccoon.isClimbing) {
        const climbAlt = (Date.now() / 110) % 2 > 1;
        ctx.fillRect(-7, climbAlt ? -33 : -21, 6, 6);
        ctx.fillRect(5, climbAlt ? -21 : -33, 6, 6);
        ctx.fillRect(-8, -6, 6, 6);
        ctx.fillRect(4, -6, 6, 6);
      } else if (!raccoon.isGrounded) {
        // 점프 포즈
        ctx.fillRect(-7, -9, 7, 7);
        ctx.fillRect(3, -9, 7, 7);
        ctx.fillRect(8, -22, 5, 5); // 앞발 들기
      } else {
        // 걷기 포즈
        const step = raccoon.walkFrame % 2 === 0 ? 3 : -3;
        ctx.fillRect(-8 + step, -6, 6, 6);
        ctx.fillRect(3 - step, -6, 6, 6);
        ctx.fillRect(8, -19, 5, 5);
      }

      ctx.restore();
    }

    // 2. 바닥 플랫폼 (원작 브라운관 벽돌 질감 & 하이라이트)
    function drawPlatforms() {
      for (const floor of currentFloors) {
        const h = 15;
        // 하단 그림자
        ctx.fillStyle = '#451a03';
        ctx.fillRect(floor.x1, floor.y, floor.x2 - floor.x1, h);

        // 상단 잔디/벽돌면
        const grad = ctx.createLinearGradient(0, floor.y, 0, floor.y + 6);
        grad.addColorStop(0, '#f59e0b');
        grad.addColorStop(1, '#b45309');
        ctx.fillStyle = grad;
        ctx.fillRect(floor.x1, floor.y, floor.x2 - floor.x1, 6);

        // 오락실 도트 벽돌 눈금
        ctx.fillStyle = '#78350f';
        for (let x = floor.x1; x < floor.x2; x += 24) {
          ctx.fillRect(x, floor.y + 6, 2, h - 6);
        }
      }
    }

    // 3. 사다리 렌더링 (입체적인 금속/목재 레일)
    function drawLadders() {
      for (const ladder of currentLadders) {
        const w = 26;
        const left = ladder.x - w / 2;
        const right = ladder.x + w / 2;

        // 기둥 외곽선
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(left, ladder.y1, 4, ladder.y2 - ladder.y1 + 4);
        ctx.fillRect(right - 4, ladder.y1, 4, ladder.y2 - ladder.y1 + 4);

        // 기둥 하이라이트
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(left + 1, ladder.y1, 2, ladder.y2 - ladder.y1 + 4);
        ctx.fillRect(right - 3, ladder.y1, 2, ladder.y2 - ladder.y1 + 4);

        // 발판 가로대
        for (let y = ladder.y1 + 8; y <= ladder.y2; y += 14) {
          ctx.fillStyle = '#075985';
          ctx.fillRect(left + 2, y + 1, w - 4, 4);
          ctx.fillStyle = '#bae6fd';
          ctx.fillRect(left + 2, y, w - 4, 2);
        }
      }
    }

    // 4. 압정 / 가시 함정 (날카로운 광택 철제 스파이크)
    function drawTraps() {
      for (const trap of currentTraps) {
        ctx.save();
        ctx.translate(trap.x, trap.floorY);

        // 그림자
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 12, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // 뾰족한 철제 압정 2개 나란히
        [-6, 6].forEach((ox) => {
          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.moveTo(ox - 5, 0);
          ctx.lineTo(ox, -16);
          ctx.lineTo(ox + 5, 0);
          ctx.fill();

          // 금속 반사 하이라이트
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.moveTo(ox, -16);
          ctx.lineTo(ox + 2, 0);
          ctx.lineTo(ox, 0);
          ctx.fill();
        });

        // 빨간 경고 베이스
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-10, -3, 20, 3);

        ctx.restore();
      }
    }

    // 5. 뱀 몬스터 (원작 구렁이 모션: 꿈틀대는 몸체 & 혓바닥 애니메이션)
    function drawSnakes() {
      const t = Date.now() * 0.012;
      for (const snake of currentSnakes) {
        ctx.save();
        ctx.translate(snake.x, snake.floorY);
        if (snake.dir === -1) {
          ctx.scale(-1, 1);
        }

        // 그림자
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // 꿈틀거리는 몸통 세그먼트 (그라데이션 및 비늘 무늬)
        for (let i = 0; i < 5; i++) {
          const segX = -14 + i * 6.5;
          const segY = -7 + Math.sin(t + i * 1.3) * 3.5;

          ctx.fillStyle = '#15803d';
          ctx.beginPath();
          ctx.arc(segX, segY, 6, 0, Math.PI * 2);
          ctx.fill();

          // 노란색 알록달록 비늘 반점
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(segX, segY - 1.5, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // 뱀 머리
        ctx.fillStyle = '#166534';
        ctx.beginPath();
        ctx.ellipse(14, -8, 8, 6.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 번뜩이는 눈
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(15, -10, 2.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.arc(16.5, -10, 1.4, 0, Math.PI * 2);
        ctx.fill();

        // 날름거리는 붉은 혓바닥
        if (Math.sin(t * 1.8) > 0.2) {
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(21, -8);
          ctx.lineTo(28, -8);
          ctx.lineTo(31, -11);
          ctx.moveTo(28, -8);
          ctx.lineTo(31, -5);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // 6. 먹이 아이템 (당근, 사과, 딸기, 포도, 수박의 통통 튀는 애니메이션)
    function drawItems() {
      const bob = Math.sin(Date.now() * 0.007) * 3.5;
      for (const item of currentItems) {
        ctx.save();
        ctx.translate(item.x, item.floorY - 14 + bob);

        // 아이템 발광 후광 효과
        ctx.shadowColor = 'rgba(251, 191, 36, 0.4)';
        ctx.shadowBlur = 8;

        if (item.type === 'carrot') {
          // 당근
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.moveTo(-6, -11);
          ctx.lineTo(6, -11);
          ctx.lineTo(0, 6);
          ctx.closePath();
          ctx.fill();
          // 당근 주름선
          ctx.strokeStyle = '#c2410c';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-3, -7); ctx.lineTo(1, -7);
          ctx.moveTo(-1, -2); ctx.lineTo(3, -2);
          ctx.stroke();
          // 싱싱한 당근 잎
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(-2, -18, 4, 7);
          ctx.fillRect(-6, -16, 3, 5);
          ctx.fillRect(3, -16, 3, 5);
        } else if (item.type === 'apple') {
          // 탐스러운 빨간 사과
          ctx.fillStyle = '#dc2626';
          ctx.beginPath();
          ctx.arc(-3, -4, 7, 0, Math.PI * 2);
          ctx.arc(3, -4, 7, 0, Math.PI * 2);
          ctx.fill();
          // 하이라이트 광택
          ctx.fillStyle = '#fca5a5';
          ctx.beginPath();
          ctx.arc(-3, -7, 2, 0, Math.PI * 2);
          ctx.fill();
          // 꼭지 & 잎
          ctx.fillStyle = '#78350f';
          ctx.fillRect(-1, -15, 2, 5);
          ctx.fillStyle = '#4ade80';
          ctx.beginPath();
          ctx.ellipse(4, -13, 4, 2.5, 0.4, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.type === 'strawberry') {
          // 달콤한 딸기
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.moveTo(-7, -9);
          ctx.quadraticCurveTo(8, -9, 0, 7);
          ctx.quadraticCurveTo(-8, -9, -7, -9);
          ctx.fill();
          // 딸기 씨앗
          ctx.fillStyle = '#fef08a';
          [[-3, -5], [2, -6], [-1, -1], [3, 0]].forEach(([px, py]) => {
            ctx.fillRect(px, py, 1.5, 1.5);
          });
          // 꼭지
          ctx.fillStyle = '#10b981';
          ctx.fillRect(-5, -12, 10, 3);
        } else if (item.type === 'grape') {
          // 알알이 맺힌 포도송이
          ctx.fillStyle = '#9333ea';
          [-4, 4].forEach(x => { ctx.beginPath(); ctx.arc(x, -9, 4.5, 0, Math.PI * 2); ctx.fill(); });
          [-5, 0, 5].forEach(x => { ctx.beginPath(); ctx.arc(x, -3, 4, 0, Math.PI * 2); ctx.fill(); });
          ctx.beginPath(); ctx.arc(0, 3, 3.5, 0, Math.PI * 2); ctx.fill();
          // 줄기
          ctx.fillStyle = '#65a30d';
          ctx.fillRect(-1, -15, 2, 5);
        } else {
          // 수박 조각
          ctx.fillStyle = '#15803d'; // 수박 껍질
          ctx.beginPath();
          ctx.arc(0, -3, 11, 0, Math.PI);
          ctx.fill();
          ctx.fillStyle = '#ef4444'; // 빨간 과육
          ctx.beginPath();
          ctx.arc(0, -3, 8.5, 0, Math.PI);
          ctx.fill();
          // 수박씨
          ctx.fillStyle = '#000000';
          ctx.fillRect(-4, 0, 1.8, 1.8);
          ctx.fillRect(3, 0, 1.8, 1.8);
          ctx.fillRect(0, 3, 1.8, 1.8);
        }

        ctx.restore();
      }
    }
  </script>

  <script>
    function renderLoop() {
      // 캔버스 배경 (고전 아케이드 심야 네이비)
      ctx.fillStyle = '#050714';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 은은한 그리드 라인 배경
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.35)';
      ctx.lineWidth = 1;
      for (let x = 40; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 40; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // 게임 플레이 업데이트
      if (gameState === 'PLAYING') {
        updatePlayerPhysics();
        updateSnakes();
        checkHazardAndItemCollisions();
      }

      // 화면 요소 렌더링
      drawLadders();
      drawPlatforms();
      drawTraps();
      drawSnakes();
      drawItems();
      drawRaccoon();

      requestAnimationFrame(renderLoop);
    }

    function startGame() {
      sound.init();
      overlayScreen.classList.add('hidden');
      score = 0;
      lives = 3;
      currentStageIndex = 0;
      updateScore(0);
      loadStage(currentStageIndex);
      gameState = 'PLAYING';
      sound.startBGM();
    }

    // 터치 및 버튼 바인딩
    document.getElementById('startMenu').addEventListener('click', startGame);
    document.getElementById('startMenu').addEventListener('touchstart', (e) => {
      e.preventDefault();
      startGame();
    });

    document.getElementById('nextStageBtn').addEventListener('click', () => {
      overlayScreen.classList.add('hidden');
      currentStageIndex++;
      loadStage(currentStageIndex);
      gameState = 'PLAYING';
      sound.startBGM();
    });

    document.getElementById('restartGameBtn').addEventListener('click', () => {
      overlayScreen.classList.add('hidden');
      score = 0;
      lives = 3;
      currentStageIndex = 0;
      updateScore(0);
      loadStage(currentStageIndex);
      gameState = 'PLAYING';
      sound.startBGM();
    });

    // BGM 및 사운드 온/오프 토글
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    soundToggleBtn.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      if (sound.enabled) {
        sound.init();
        if (gameState === 'PLAYING') sound.startBGM();
        soundIcon.textContent = '🔊';
        soundToggleBtn.innerHTML = '<span id="soundIcon">🔊</span> BGM: ON';
        soundToggleBtn.classList.add('text-amber-300');
      } else {
        sound.stopBGM();
        soundIcon.textContent = '🔇';
        soundToggleBtn.innerHTML = '<span id="soundIcon">🔇</span> BGM: OFF';
        soundToggleBtn.classList.remove('text-amber-300');
      }
    });

    // 페이지 로드 시 초기화 및 애니메이션 루프 시작
    window.onload = function () {
      loadStage(0);
      requestAnimationFrame(renderLoop);
    };
  </script>
</body>
</html>
