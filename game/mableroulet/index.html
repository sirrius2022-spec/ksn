<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Rian Education - Ultimate Marble Racing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
    body {
        margin: 0;
        background: #000;
        color: #ffd600;
        font-family: 'Arial', sans-serif;
        text-align: center;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    #game-wrapper {
        position: relative;
        width: 1024px;
        height: 768px;
        box-shadow: 0 0 50px rgba(255, 214, 0, 0.5);
        background: #0a0a0a;
        transform-origin: center center;
    }

    #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
        pointer-events: none;
        padding-top: 15px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
    }

    h1 {
        font-size: 26px; 
        margin: 0 0 15px 0;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.5; /* 글씨 투명도 50% */
    }

    .control-group {
        margin-bottom: 15px;
        pointer-events: auto; 
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    .control-group label {
        opacity: 0.5;
    }

    input[type="number"] {
        padding: 8px;
        font-size: 18px;
        font-weight: bold;
        border: 2px solid #ffd600;
        border-radius: 8px;
        background: #222;
        color: #ffd600;
        text-align: center;
        width: 80px;
    }
    input[type="number"]:focus { outline: none; background: #333; }

    button {
        padding: 8px 15px;
        font-size: 16px;
        background: #333;
        color: #ffd600;
        border: 2px solid #ffd600;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }
    button:hover { background: #ffd600; color: #000; }

    .main-btn {
        background: #ffd600;
        color: #000;
        padding: 10px 30px;
        font-size: 18px;
        border: none;
        box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    }
    .main-btn:hover { background: #ffea00; transform: scale(1.05); }

    .fs-btn {
        background: #00e676; 
        border-color: #00e676;
        color: #000;
    }
    .fs-btn:hover { background: #00c853; }

    #winner {
        font-size: 32px;
        margin-top: 5px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        transition: 0.3s;
        height: 40px;
        opacity: 0.5;
    }

    @keyframes pop {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); text-shadow: 0 0 20px #ffd600, 0 0 40px #ff9800; opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
    }
    .celebrate { animation: pop 0.6s ease-in-out infinite; color: #fff !important; }

    #canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 1024px;
        height: 768px;
        z-index: 1;
        overflow: hidden;
    }
</style>
</head>
<body>

<div id="game-wrapper">
    <div id="ui-layer">
        <h1>제작자 : Rian Education Ryu Su Min</h1>
        
        <div class="control-group">
            <label style="font-size: 18px; font-weight: bold;">참가 인원 (1~100) : </label>
            <input type="number" id="ballCountInput" value="50" min="1" max="100">
            <button onclick="applyBallCount()">적용</button>
            <button onclick="startGame()" class="main-btn" style="margin-left: 20px;">▶ START</button>
            <button onclick="resetGame()" class="main-btn">RESET</button>
            <button onclick="toggleFullScreen()" class="main-btn fs-btn">🖥️ 화면크게</button>
        </div>
        
        <div id="winner">🏁 대기 중... (사운드 ON!)</div>
    </div>

    <div id="canvas-container"></div>
</div>

<script>
// ==========================================
// 💡 화면 자동 스케일링 & 전체화면
// ==========================================
function resizeGame() {
    const wrapper = document.getElementById('game-wrapper');
    const scale = Math.min(window.innerWidth / 1024, window.innerHeight / 768);
    wrapper.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', resizeGame);
resizeGame();

function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}

const { Engine, Render, Runner, World, Bodies, Body, Events } = Matter;

const VIEW_WIDTH = 1024;
const VIEW_HEIGHT = 768;
const WORLD_HEIGHT = VIEW_HEIGHT * 22; 

let engine, world, render, runner;
let balls = [];
let movingObstacles = [];
let winnerDeclared = false;
let totalBalls = 50; 
let currentCameraY = 0; 
let top5BallIds = new Set(); 

let audioCtx = null;
let lastBounceTime = 0;

// 오프라인 사용 시 MP3 파일을 폴더에 넣고 파일명으로 수정하세요 (예: 'bgm.mp3')
const bgmMusic = new Audio('https://assets.mixkit.co/music/preview/mixkit-funny-quirky-comedy-track-43.mp3');
bgmMusic.loop = true;
bgmMusic.volume = 0.3;
const cheerSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-small-crowd-ovation-437.mp3');
cheerSound.volume = 0.8;

function playBounceSound() {
    if (!audioCtx) return;
    let now = Date.now();
    if (now - lastBounceTime < 30) return; 
    lastBounceTime = now;

    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    osc.type = 'sine'; 
    const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    const freq = notes[Math.floor(Math.random() * notes.length)];
    
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

function playVictoryBGM() {
    cheerSound.currentTime = 0;
    cheerSound.play().catch(e => {});

    if (!audioCtx) return;
    const melody = [
        { f: 523.25, d: 0.15 }, { f: 523.25, d: 0.15 }, { f: 523.25, d: 0.15 },
        { f: 659.25, d: 0.35 }, { f: 587.33, d: 0.15 }, { f: 659.25, d: 0.35 },
        { f: 783.99, d: 0.80 } 
    ];
    let startTime = audioCtx.currentTime;
    melody.forEach(note => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle'; 
        osc.frequency.value = note.f;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05); 
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.d); 
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + note.d);
        startTime += note.d + 0.05; 
    });
}

initEngine();
buildLevel();

function initEngine() {
    engine = Engine.create();
    world = engine.world;
    engine.gravity.y = 0.8; // 30초 플레이를 위해 중력 낮춤

    render = Render.create({
        element: document.getElementById('canvas-container'),
        engine: engine,
        options: {
            width: VIEW_WIDTH,
            height: VIEW_HEIGHT,
            wireframes: false,
            background: "#050505",
            hasBounds: true
        }
    });

    Render.run(render);
    runner = Runner.create();
    Runner.run(runner, engine);

    Events.on(engine, 'collisionStart', function(event) {
        if (winnerDeclared) return;
        let shouldPlaySound = false;
        for (let pair of event.pairs) {
            if (top5BallIds.has(pair.bodyA.id) || top5BallIds.has(pair.bodyB.id)) {
                shouldPlaySound = true;
                break;
            }
        }
        if (shouldPlaySound) playBounceSound();
    });

    Events.on(engine, "beforeUpdate", function() {
        if (winnerDeclared) return;
        let activeBalls = balls.filter(b => !b.isStatic);
        if (activeBalls.length > 0) {
            activeBalls.sort((a, b) => b.position.y - a.position.y); 
            top5BallIds.clear();
            let limit = Math.min(5, activeBalls.length); 
            for (let i = 0; i < limit; i++) {
                top5BallIds.add(activeBalls[i].id);
            }
        }
        movingObstacles.forEach(obs => {
            if (obs.type === 'spinner') {
                Body.rotate(obs.body, obs.speed);
            } else if (obs.type === 'slider') {
                if (Math.abs(obs.offset) > obs.range) {
                    obs.speed *= -1; 
                }
                obs.offset += obs.speed;
                Body.translate(obs.body, { x: obs.speed, y: 0 });
            }
        });
    });

    Events.on(engine, "afterUpdate", function() {
        if (!winnerDeclared) {
            updateCamera();
            checkWinner();
        }
    });

    Events.on(render, 'afterRender', function() {
        const ctx = render.context;
        ctx.font = "900 16px Arial"; 
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const offsetX = render.bounds.min.x;
        const offsetY = render.bounds.min.y;
        for (let ball of balls) {
            let x = ball.position.x - offsetX;
            let y = ball.position.y - offsetY;
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#000000"; 
            ctx.strokeText(ball.number, x, y);
            ctx.fillStyle = "#ffffff";
            ctx.fillText(ball.number, x, y);
        }
    });
}

function applyBallCount() {
    let inputEl = document.getElementById("ballCountInput");
    let count = parseInt(inputEl.value, 10);
    if (isNaN(count) || count < 1) count = 1;
    if (count > 100) count = 100;
    inputEl.value = count;
    totalBalls = count;
    resetGame();
}

function updateCamera() {
    if (balls.length === 0) return;
    let activeBalls = balls.filter(b => !b.isStatic);
    if (activeBalls.length === 0) activeBalls = balls;
    activeBalls.sort((a, b) => b.position.y - a.position.y);
    let leaderY = activeBalls[0].position.y; 
    let desiredCameraY = leaderY - VIEW_HEIGHT * 0.65; 
    desiredCameraY = Math.max(0, Math.min(desiredCameraY, WORLD_HEIGHT - VIEW_HEIGHT));
    currentCameraY += (desiredCameraY - currentCameraY) * 0.08; 
    Render.lookAt(render, {
        min: { x: 0, y: currentCameraY },
        max: { x: VIEW_WIDTH, y: currentCameraY + VIEW_HEIGHT }
    });
}

function checkWinner() {
    for (let ball of balls) {
        if (ball.position.y > WORLD_HEIGHT - 50) {
            winnerDeclared = true;
            bgmMusic.pause();
            playVictoryBGM();
            const winnerEl = document.getElementById("winner");
            winnerEl.innerHTML = "🎉 최종 우승 : " + ball.number + "번 🎉";
            winnerEl.classList.add("celebrate");
            engine.timing.timeScale = 0.1; 
            Body.scale(ball, 2, 2);
            ball.render.lineWidth = 5;
            ball.render.strokeStyle = "#ffffff";
            ball.render.fillStyle = "#ffd600";
            spawnConfetti(ball.position.x, WORLD_HEIGHT - 10);
            break;
        }
    }
}

function spawnConfetti(x, y) {
    const confettiColors = ['#ffeb3b', '#ff3d00', '#00e676', '#2979ff', '#e040fb'];
    for (let i = 0; i < 150; i++) {
        let confetti = Bodies.rectangle(
            x + (Math.random() - 0.5) * 100, 
            y + Math.random() * 50, 
            Math.random() * 10 + 5, 
            Math.random() * 10 + 5, 
            {
                frictionAir: 0.02,
                restitution: 0.8,
                render: { fillStyle: confettiColors[Math.floor(Math.random() * confettiColors.length)] },
                isSensor: true 
            }
        );
        Body.setVelocity(confetti, { x: (Math.random() - 0.5) * 40, y: -(Math.random() * 50 + 20) });
        World.add(world, confetti);
    }
}

function buildLevel() {
    createWalls();
    createPinsAndObstacles();
    createBalls();
    currentCameraY = 0;
    Render.lookAt(render, { min: { x: 0, y: 0 }, max: { x: VIEW_WIDTH, y: VIEW_HEIGHT } });
}

function createWalls() {
    let leftWall = Bodies.rectangle(-10, WORLD_HEIGHT / 2, 60, WORLD_HEIGHT, { isStatic: true, friction: 0, render: {fillStyle: '#333'} });
    let rightWall = Bodies.rectangle(VIEW_WIDTH + 10, WORLD_HEIGHT / 2, 60, WORLD_HEIGHT, { isStatic: true, friction: 0, render: {fillStyle: '#333'} });
    const gap = 55; 
    const funnelY = WORLD_HEIGHT - 100;
    const funnelWidth = (VIEW_WIDTH - gap) / 2;
    let leftFunnel = Bodies.rectangle(funnelWidth / 2, funnelY, funnelWidth * 1.1, 40, { isStatic: true, friction: 0, angle: Math.PI / 6, render: {fillStyle: '#ffd600'} });
    let rightFunnel = Bodies.rectangle(VIEW_WIDTH - (funnelWidth / 2), funnelY, funnelWidth * 1.1, 40, { isStatic: true, friction: 0, angle: -Math.PI / 6, render: {fillStyle: '#ffd600'} });
    World.add(world, [leftWall, rightWall, leftFunnel, rightFunnel]);
}

function createPinsAndObstacles() {
    movingObstacles = []; 
    const startY = 350;
    const endY = WORLD_HEIGHT - 3500; 

    for (let y = startY; y < WORLD_HEIGHT - 600; y += 250) { 
        let leftLedge = Bodies.rectangle(40, y, 220, 25, { isStatic: true, friction: 0, angle: Math.PI / 3.5, render: { fillStyle: "#ffaa00" }, restitution: 0.7 });
        let rightLedge = Bodies.rectangle(VIEW_WIDTH - 40, y + 125, 220, 25, { isStatic: true, friction: 0, angle: -Math.PI / 3.5, render: { fillStyle: "#ffaa00" }, restitution: 0.7 });
        World.add(world, [leftLedge, rightLedge]);
    }

    // 병목 게이트 3단계
    let gatePositions = [WORLD_HEIGHT * 0.3, WORLD_HEIGHT * 0.55, WORLD_HEIGHT * 0.8];
    gatePositions.forEach((gy) => {
        let lGate = Bodies.rectangle(VIEW_WIDTH * 0.2, gy, 500, 35, { isStatic: true, render: { fillStyle: "#00e676" } });
        movingObstacles.push({ body: lGate, type: 'slider', offset: 0, speed: 2.0, range: 250 });
        let rGate = Bodies.rectangle(VIEW_WIDTH * 0.8, gy, 500, 35, { isStatic: true, render: { fillStyle: "#00e676" } });
        movingObstacles.push({ body: rGate, type: 'slider', offset: 0, speed: -2.0, range: 250 });
        World.add(world, [lGate, rGate]);
    });

    for (let i = 0; i < 500; i++) { 
        let pin = Bodies.circle(VIEW_WIDTH / 2 + (Math.random() - 0.5) * (VIEW_WIDTH * 0.8), startY + Math.random() * (endY - startY), 12, { isStatic: true, friction: 0, render: { fillStyle: "#777" }, restitution: 0.8 });
        World.add(world, pin);
    }
    for (let i = 0; i < 60; i++) {
        let y = startY + 300 + Math.random() * (endY - startY - 400);
        let x = VIEW_WIDTH / 2 + (Math.random() - 0.5) * (VIEW_WIDTH * 0.85); 
        let spinBody = Bodies.rectangle(x, y, 150, 18, { isStatic: true, render: { fillStyle: "#ff3b30" } });
        movingObstacles.push({ body: spinBody, type: 'spinner', speed: (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 0.05 + 0.05) });
        World.add(world, spinBody);
    }

    const climaxY = endY + 300;
    for(let i = 0; i < 60; i++) {
        let bumper = Bodies.circle(VIEW_WIDTH / 2 + (Math.random() - 0.5) * (VIEW_WIDTH * 0.8), climaxY + Math.random() * 2000, 25, { isStatic: true, restitution: 1.6, render: { fillStyle: "#cc66ff" } });
        World.add(world, bumper);
    }
    for(let i = 0; i < 8; i++) {
        let giantSpin = Bodies.rectangle(VIEW_WIDTH / 2 + (Math.random() - 0.5) * 400, climaxY + 2200 + (i * 200), 320, 25, { isStatic: true, render: { fillStyle: "#ff0000" } });
        movingObstacles.push({ body: giantSpin, type: 'spinner', speed: (Math.random() > 0.5 ? 1 : -1) * 0.15 });
        World.add(world, giantSpin);
    }
}

function createBalls() {
    const colors = ["#ff9500", "#4cd964", "#5ac8fa", "#ff2d55", "#e57373", "#ba68c8", "#4dd0e1", "#81c784", "#fff176"];
    const spreadHeight = Math.max(300, totalBalls * 6);
    for (let i = 1; i <= totalBalls; i++) {
        let ball = Bodies.circle(VIEW_WIDTH / 2 + (Math.random() - 0.5) * (VIEW_WIDTH * 0.6), -150 - Math.random() * spreadHeight, 15, {
            restitution: 0.85, friction: 0, frictionAir: 0.02, density: 0.05, isStatic: true, render: { fillStyle: colors[i % colors.length] }
        });
        ball.number = i;
        balls.push(ball);
        World.add(world, ball);
    }
}

function startGame() {
    if(!winnerDeclared && balls.length > 0 && balls[0].isStatic === false) return;
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    bgmMusic.currentTime = 0;
    bgmMusic.play().catch(e => {});
    winnerDeclared = false;
    document.getElementById("winner").innerHTML = "🔥 레이스 진행중! 🔥";
    document.getElementById("winner").classList.remove("celebrate");
    engine.timing.timeScale = 1.0; 
    balls.forEach(ball => Body.setStatic(ball, false));
}

function resetGame() {
    bgmMusic.pause();
    winnerDeclared = false;
    document.getElementById("winner").innerHTML = "🏁 대기 중... (사운드 ON!)";
    document.getElementById("winner").classList.remove("celebrate");
    engine.timing.timeScale = 1.0;
    World.clear(world);
    Engine.clear(engine);
    balls = [];
    top5BallIds.clear();
    buildLevel();
}
</script>
</body>
</html>
