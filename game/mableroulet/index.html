<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>안전 룰렛 - 모바일 전체화면</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            font-family: Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            /* 💡 [요청 1] 스마트폰 전체화면 설정 */
            height: 100vh;
            width: 100vw;
        }

        #game-wrapper {
            position: relative;
            /* 💡 [요청 1] 세로로 길게 확장 */
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 💡 상단 UI 레이아웃 수정 */
        #game-ui {
            position: absolute;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: yellow;
            padding: 10px 0;
            text-align: center;
            z-index: 10;
        }

        #game-ui > p {
            margin: 5px 0;
            font-size: 14px;
        }

        /* [요청 3] 제작자 텍스트는 HTML에서 제거되었습니다. */

        #winner-text {
            color: yellow;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        .button {
            background-color: yellow;
            color: black;
            border: none;
            padding: 5px 10px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin: 0 2px;
        }

        #input-participants {
            background-color: #222;
            color: yellow;
            border: 1px solid yellow;
            padding: 5px;
            width: 40px;
            text-align: center;
            font-size: 12px;
        }

        #screen-toggle-btn {
            background-color: #00ff7f; /* SpringGreen */
            display: none; /* 모바일에서는 자동 전체화면이므로 숨김 */
        }

        /* Matter.js 렌더링 컨테이너 */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-ui">
            <p>참가 인원 (1~100) : <input type="number" id="input-participants" value="50" min="1" max="100"> <button class="button">적용</button></p>
            <p><button id="start-btn" class="button">START</button> <button id="reset-btn" class="button">RESET</button></p>
            <div id="winner-text"></div>
        </div>
        <div id="canvas-container"></div>
    </div>

    <script>
        // 💡 [요청 2] 게임 시간 1분으로 설정
        const GAME_DURATION_SECONDS = 60; 

        // Matter.js 모듈
        const { Engine, Render, Runner, Bodies, Composite } = Matter;

        // 엔진 및 렌더러 생성
        const engine = Engine.create();
        
        // 💡 [요청 1] 모바일 화면 비율에 맞춰 렌더링 크기 설정
        const render = Render.create({
            element: document.getElementById('canvas-container'),
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'black'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // 💡 [요청 1] 세로로 긴 화면에 맞춰 장애물 재배치
        const width = window.innerWidth;
        const height = window.innerHeight;
        const wallThickness = 20;

        // 벽 생성
        const leftWall = Bodies.rectangle(wallThickness / 2, height / 2, wallThickness, height, { isStatic: true, render: { fillStyle: 'yellow' } });
        const rightWall = Bodies.rectangle(width - wallThickness / 2, height / 2, wallThickness, height, { isStatic: true, render: { fillStyle: 'yellow' } });
        const topWall = Bodies.rectangle(width / 2, height, width, wallThickness, { isStatic: true, render: { fillStyle: 'yellow' } }); // 바닥 벽

        // 💡 [요청 1] 세로 화면에 맞는 장애물 배치 (image_5.png 패턴 참고)
        const obstacles = [
            // 경사진 노란색 바
            Bodies.rectangle(width * 0.2, height * 0.15, width * 0.3, 10, { isStatic: true, angle: Math.PI / 6, render: { fillStyle: 'yellow' } }),
            Bodies.rectangle(width * 0.8, height * 0.15, width * 0.3, 10, { isStatic: true, angle: -Math.PI / 6, render: { fillStyle: 'yellow' } }),
            
            // 더 많은 경사 바
            Bodies.rectangle(width * 0.2, height * 0.35, width * 0.3, 10, { isStatic: true, angle: -Math.PI / 8, render: { fillStyle: 'yellow' } }),
            Bodies.rectangle(width * 0.8, height * 0.35, width * 0.3, 10, { isStatic: true, angle: Math.PI / 8, render: { fillStyle: 'yellow' } }),

            // 긴 가로 노란색 바
            Bodies.rectangle(width / 2, height * 0.55, width * 0.8, 15, { isStatic: true, render: { fillStyle: 'yellow' } }),

            // 경사진 빨간색 바 (지그재그)
            Bodies.rectangle(width * 0.3, height * 0.7, width * 0.2, 8, { isStatic: true, angle: Math.PI / 4, render: { fillStyle: 'red' } }),
            Bodies.rectangle(width * 0.7, height * 0.7, width * 0.2, 8, { isStatic: true, angle: -Math.PI / 4, render: { fillStyle: 'red' } }),
            
            Bodies.rectangle(width * 0.3, height * 0.85, width * 0.2, 8, { isStatic: true, angle: -Math.PI / 5, render: { fillStyle: 'red' } }),
            Bodies.rectangle(width * 0.7, height * 0.85, width * 0.2, 8, { isStatic: true, angle: Math.PI / 5, render: { fillStyle: 'red' } }),
        ];

        Composite.add(engine.world, [leftWall, rightWall, topWall, ...obstacles]);

        // 공 생성 함수
        function createBall(x, y, radius, color, number) {
            const ball = Bodies.circle(x, y, radius, {
                restitution: 0.8,
                friction: 0.005,
                render: { fillStyle: color }
            });
            ball.number = number;
            return ball;
        }

        // 공 색상 배열
        const colors = ['red', 'blue', 'green', 'purple', 'orange', 'cyan', 'magenta', 'lime', 'pink', 'teal'];

        // 공 추가 함수
        function addBalls(count) {
            Composite.clear(engine.world, true); // 장애물은 제외하고 공만 제거
            Composite.add(engine.world, [leftWall, rightWall, topWall, ...obstacles]); // 장애물 다시 추가

            const ballRadius = 10;
            const uiHeight = document.getElementById('game-ui').offsetHeight;
            const startY = uiHeight + ballRadius * 2;

            for (let i = 1; i <= count; i++) {
                const x = Math.random() * (width - ballRadius * 4) + ballRadius * 2;
                const y = startY + Math.random() * (height * 0.5 - startY);
                const color = colors[i % colors.length];
                const ball = createBall(x, y, ballRadius, color, i);
                Composite.add(engine.world, ball);
            }
        }

        // 초기 공 추가
        addBalls(50);

        // UI 이벤트 처리
        document.querySelector('.button').addEventListener('click', function() {
            const count = parseInt(document.getElementById('input-participants').value);
            if (count > 0 && count <= 100) {
                addBalls(count);
                document.getElementById('winner-text').innerText = ''; // 승자 텍스트 초기화
            }
        });

        document.getElementById('start-btn').addEventListener('click', function() {
            startRace();
        });

        document.getElementById('reset-btn').addEventListener('click', function() {
            const count = parseInt(document.getElementById('input-participants').value);
            addBalls(count);
            document.getElementById('winner-text').innerText = ''; // 승자 텍스트 초기화
        });

        // 레이스 시작 함수
        function startRace() {
            Composite.clear(engine.world, true); // 기존 공 제거
            const count = parseInt(document.getElementById('input-participants').value);
            addBalls(count); // 공 다시 추가

            // BGM 재생 로직 (기존 코드 유지)
            // console.log("BGM 재생 시작");

            document.getElementById('winner-text').innerText = "레이스 진행중!";
            
            // 💡 [요청 2] 1분 후 레이스 종료
            setTimeout(endRace, GAME_DURATION_SECONDS * 1000);
        }

        // 레이스 종료 함수
        function endRace() {
            // console.log("BGM 재생 중지");
            // console.log("레이스 완료");

            // 승자 결정 로직 (가장 아래에 도달한 공)
            const bodies = Composite.allBodies(engine.world);
            let winnerBall = null;
            let maxFinalY = -Infinity;

            bodies.forEach(body => {
                if (body.number && body.position.y > maxFinalY) {
                    maxFinalY = body.position.y;
                    winnerBall = body;
                }
            });

            if (winnerBall) {
                const winnerNumber = winnerBall.number;
                // image_4.png의 패턴 참고 (이모지 추가)
                document.getElementById('winner-text').innerHTML = `🎉 최종 우승 : ${winnerNumber}번 🎉`;
                // console.log(`승자: ${winnerNumber}번`);
            } else {
                document.getElementById('winner-text').innerText = "승자를 결정할 수 없습니다.";
            }
        }
    </script>
</body>
</html>
