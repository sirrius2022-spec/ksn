<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rian Education - Ultimate Marble Racing (Mobile)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
    body, html {
        margin: 0;
        padding: 0;
        background: #000;
        color: #ffd600;
        font-family: 'Arial', sans-serif;
        text-align: center;
        /* 모바일에서 스크롤 안 생기게 차단 */
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    #game-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #0a0a0a;
    }

    #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
        pointer-events: none;
        padding-top: 15px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    }

    /* 모바일 화면에 맞춰 UI 버튼들 줄바꿈(Wrap) 및 크기 조정 */
    .control-group {
        margin-bottom: 10px;
        pointer-events: auto; 
        display: flex;
        flex-wrap: wrap; 
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
    }

    .control-group label {
        opacity: 0.7;
        font-size: 15px;
        font-weight: bold;
    }

    input[type="number"] {
        padding: 6px;
        font-size: 16px;
        font-weight: bold;
        border: 2px solid #ffd600;
        border-radius: 8px;
        background: #222;
        color: #ffd600;
        text-align: center;
        width: 60px;
    }

    button {
        padding: 8px 12px;
        font-size: 14px;
        background: #333;
        color: #ffd600;
        border: 2px solid #ffd600;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    .main-btn {
        background: #ffd600;
        color: #000;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
    }

    #winner {
        font-size: 24px;
        margin-top: 5px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        height: 30px;
        opacity: 0.6;
    }

    @keyframes pop {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); text-shadow: 0 0 20px #ffd600, 0 0 40px #ff9800; opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
    }
    .celebrate { animation: pop 0.6s ease-in-out infinite; color: #fff !important; }

    #canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }
</style>
</head>
<body>

<div id="game-wrapper">
    <div id="ui-layer">
        <div class="control-group">
            <label>참가 인원(1~100):</label>
            <input type="number" id="ballCountInput" value="50" min="1" max="100">
            <button onclick="applyBallCount()">적용</button>
            <button onclick="startGame()" class="main-btn">▶ START</button>
            <button onclick="resetGame()" class="main-btn" style="background:#ff3b30; color:#fff;">RESET</button>
        </div>
        
        <div id="winner">🏁 대기 중...</div>
    </div>

    <div id="canvas-container"></div>
</div>

<script>
const { Engine, Render, Runner, World, Bodies, Body, Events } = Matter;

// 💡 모바일 기기의 실제 가로/세로 길이를 인식하여 게임판 크기 결정
const VIEW_WIDTH = window.innerWidth;
const VIEW_HEIGHT = window.innerHeight;

// 💡 게임시간 1분을 맞추기 위해 트랙 길이를 어마어마하게 늘림 (기존 22배 -> 40배)
const WORLD_HEIGHT = VIEW_HEIGHT * 40; 

let engine, world, render, runner;
let balls = [];
let movingObstacles = [];
let winnerDeclared = false;
let totalBalls = 50; 
let currentCameraY = 0; 
let top5BallIds = new Set(); 

// 🎵 오디오 시스템
let audioCtx = null;
let lastBounceTime = 0;

const bgmMusic = new Audio('https://assets.mixkit.co/music/preview/mixkit-funny-quirky-comedy-track-43.mp3');
bgmMusic.loop = true;
bgmMusic.volume = 0.3;
const cheerSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-small-crowd-ovation-437.mp3');
cheerSound.volume = 0.8;

function playBounceSound() {
    if (!audioCtx) return;
    let now = Date.now();
    if (now - lastBounceTime < 30) return; 
    lastBounceTime = now;

    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    osc.type = 'sine'; 
    const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    const freq = notes[Math.floor(Math.random() * notes.length)];
    
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

function playVictoryBGM() {
    cheerSound.currentTime = 0;
    cheerSound.play().catch(e => {});

    if (!audioCtx) return;
    const melody = [
        { f: 523.25, d: 0.15 }, { f: 523.25, d: 0.15 }, { f: 523.25, d: 0.15 },
        { f: 659.25, d: 0.35 }, { f: 587.33, d: 0.15 }, { f: 659.25, d: 0.35 },
        { f: 783.99, d: 0.80 } 
    ];
    let startTime = audioCtx.currentTime;
    melody.forEach(note => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle'; 
        osc.frequency.value = note.f;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05); 
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.d); 
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + note.d);
        startTime += note.d + 0.05; 
    });
}

initEngine();
buildLevel();

function initEngine() {
    engine = Engine.create();
    world = engine.world;
    // 💡 1분 동안 천천히 내려가도록 중력값을 더 낮춤
    engine.gravity.y = 0.6; 

    render = Render.create({
        element: document.getElementById('canvas-container'),
        engine: engine,
        options: {
            width: VIEW_WIDTH,
            height: VIEW_HEIGHT,
            wireframes: false,
            background: "#050505",
            hasBounds: true
        }
    });

    Render.run(render);
    runner = Runner.create();
    Runner.run(runner, engine);

    Events.on(engine, 'collisionStart', function(event) {
        if (winnerDeclared) return;
        let shouldPlaySound = false;
        for (let pair of event.pairs) {
            if (top5BallIds.has(pair.bodyA.id) || top5BallIds.has(pair.bodyB.id)) {
                shouldPlaySound = true;
                break;
            }
        }
        if (shouldPlaySound) playBounceSound();
    });

    Events.on(engine, "beforeUpdate", function() {
        if (winnerDeclared) return;
        let activeBalls = balls.filter(b => !b.isStatic);
        if (activeBalls.length > 0) {
            activeBalls.sort((a, b) => b.position.y - a.position.y); 
            top5BallIds.clear();
            let limit = Math.min(5, activeBalls.length); 
            for (let i = 0; i < limit; i++) {
                top5BallIds.add(activeBalls[i].id);
            }
        }
        movingObstacles.forEach(obs => {
            if (obs.type === 'spinner') {
                Body.rotate(obs.body, obs.speed);
            } else if (obs.type === 'slider') {
                if (Math.abs(obs.offset) > obs.range) {
                    obs.speed *= -1; 
                }
                obs.offset += obs.speed;
                Body.translate(obs.body, { x: obs.speed, y: 0 });
            }
        });
    });

    Events.on(engine, "afterUpdate", function() {
        if (!winnerDeclared) {
            updateCamera();
            checkWinner();
        }
    });

    Events.on(render, 'afterRender', function() {
        const ctx = render.context;
        ctx.font = "bold 13px Arial"; // 모바일에 맞게 글씨 크기 조정
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const offsetX = render.bounds.min.x;
        const offsetY = render.bounds.min.y;
        for (let ball of balls) {
            let x = ball.position.x - offsetX;
            let y = ball.position.y - offsetY;
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#000000"; 
            ctx.strokeText(ball.number, x, y);
            ctx.fillStyle = "#ffffff";
            ctx.fillText(ball.number, x, y);
        }
    });
}

function applyBallCount() {
    let inputEl = document.getElementById("ballCountInput");
    let count = parseInt(inputEl.value, 10);
    if (isNaN(count) || count < 1) count = 1;
    if (count > 100) count = 100;
    inputEl.value = count;
    totalBalls = count;
    resetGame();
}

function updateCamera() {
    if (balls.length === 0) return;
    let activeBalls = balls.filter(b => !b.isStatic);
    if (activeBalls.length === 0) activeBalls = balls;
    activeBalls.sort((a, b) => b.position.y - a.position.y);
    let leaderY = activeBalls[0].position.y; 
    let desiredCameraY = leaderY - VIEW_HEIGHT * 0.65; 
    desiredCameraY = Math.max(0, Math.min(desiredCameraY, WORLD_HEIGHT - VIEW_HEIGHT));
    currentCameraY += (desiredCameraY - currentCameraY) * 0.08; 
    Render.lookAt(render, {
        min: { x: 0, y: currentCameraY },
        max: { x: VIEW_WIDTH, y: currentCameraY + VIEW_HEIGHT }
    });
}

function checkWinner() {
    for (let ball of balls) {
        if (ball.position.y > WORLD_HEIGHT - 50) {
            winnerDeclared = true;
            bgmMusic.pause();
            playVictoryBGM();
            const winnerEl = document.getElementById("winner");
            winnerEl.innerHTML = "🎉 최종 우승 : " + ball.number + "번 🎉";
            winnerEl.classList.add("celebrate");
            engine.timing.timeScale = 0.1; 
            Body.scale(ball, 2, 2);
            ball.render.lineWidth = 4;
            ball.render.strokeStyle = "#ffffff";
            ball.render.fillStyle = "#ffd600";
            spawnConfetti(ball.position.x, WORLD_HEIGHT - 10);
            break;
        }
    }
}

function spawnConfetti(x, y) {
    const confettiColors = ['#ffeb3b', '#ff3d00', '#00e676', '#2979ff', '#e040fb'];
    for (let i = 0; i < 100; i++) {
        let confetti = Bodies.rectangle(
            x + (Math.random() - 0.5) * 80, 
            y + Math.random() * 40, 
            Math.random() * 8 + 4, 
            Math.random() * 8 + 4, 
            {
                frictionAir: 0.02,
                restitution: 0.8,
                render: { fillStyle: confettiColors[Math.floor(Math.random() * confettiColors.length)] },
                isSensor: true 
            }
        );
        Body.setVelocity(confetti, { x: (Math.random() - 0.5) * 30, y: -(Math.random() * 40 + 15) });
        World.add(world, confetti);
    }
}

function buildLevel() {
    createWalls();
    createPinsAndObstacles();
    createBalls();
    currentCameraY = 0;
    Render.lookAt(render, { min: { x: 0, y: 0 }, max: { x: VIEW_WIDTH, y: VIEW_HEIGHT } });
}

function createWalls() {
    let leftWall = Bodies.rectangle(-10, WORLD_HEIGHT / 2, 60, WORLD_HEIGHT, { isStatic: true, friction: 0, render: {fillStyle: '#333'} });
    let rightWall = Bodies.rectangle(VIEW_WIDTH + 10, WORLD_HEIGHT / 2, 60, WORLD_HEIGHT, { isStatic: true, friction: 0, render: {fillStyle: '#333'} });
    const gap = VIEW_WIDTH * 0.15; 
    const funnelY = WORLD_HEIGHT - 80;
    const funnelWidth = (VIEW_WIDTH - gap) / 2;
    let leftFunnel = Bodies.rectangle(funnelWidth / 2, funnelY, funnelWidth * 1.2, 40, { isStatic: true, friction: 0, angle: Math.PI / 6, render: {fillStyle: '#ffd600'} });
    let rightFunnel = Bodies.rectangle(VIEW_WIDTH - (funnelWidth / 2), funnelY, funnelWidth * 1.2, 40, { isStatic: true, friction: 0, angle: -Math.PI / 6, render: {fillStyle: '#ffd600'} });
    World.add(world, [leftWall, rightWall, leftFunnel, rightFunnel]);
}

function createPinsAndObstacles() {
    movingObstacles = []; 
    const startY = VIEW_HEIGHT * 0.4;
    const endY = WORLD_HEIGHT - (VIEW_HEIGHT * 3); 

    // 모바일 너비에 맞춘 고속도로 방지 절벽
    for (let y = startY; y < WORLD_HEIGHT - 600; y += 250) { 
        let ledgeWidth = VIEW_WIDTH * 0.4;
        let leftLedge = Bodies.rectangle(ledgeWidth/2 - 20, y, ledgeWidth, 20, { isStatic: true, friction: 0, angle: Math.PI / 3.5, render: { fillStyle: "#ffaa00" }, restitution: 0.7 });
        let rightLedge = Bodies.rectangle(VIEW_WIDTH - (ledgeWidth/2) + 20, y + 125, ledgeWidth, 20, { isStatic: true, friction: 0, angle: -Math.PI / 3.5, render: { fillStyle: "#ffaa00" }, restitution: 0.7 });
        World.add(world, [leftLedge, rightLedge]);
    }

    // 병목 게이트 5단계 (시간 끌기용)
    let gatePositions = [WORLD_HEIGHT * 0.15, WORLD_HEIGHT * 0.35, WORLD_HEIGHT * 0.55, WORLD_HEIGHT * 0.75, WORLD_HEIGHT * 0.85];
    gatePositions.forEach((gy) => {
        let gateWidth = VIEW_WIDTH * 0.6;
        let lGate = Bodies.rectangle(VIEW_WIDTH * 0.1, gy, gateWidth, 30, { isStatic: true, render: { fillStyle: "#00e676" } });
        movingObstacles.push({ body: lGate, type: 'slider', offset: 0, speed: 1.2, range: VIEW_WIDTH * 0.3 });
        let rGate = Bodies.rectangle(VIEW_WIDTH * 0.9, gy, gateWidth, 30, { isStatic: true, render: { fillStyle: "#00e676" } });
        movingObstacles.push({ body: rGate, type: 'slider', offset: 0, speed: -1.2, range: VIEW_WIDTH * 0.3 });
        World.add(world, [lGate, rGate]);
    });

    // 둥근 핀 (모바일 너비에 맞춰 촘촘하게 700개)
    for (let i = 0; i < 700; i++) { 
        let pin = Bodies.circle(
            Math.random() * VIEW_WIDTH, 
            startY + Math.random() * (endY - startY), 
            VIEW_WIDTH * 0.018, 
            { isStatic: true, friction: 0, render: { fillStyle: "#777" }, restitution: 0.8 }
        );
        World.add(world, pin);
    }
    
    // 회전 풍차
    for (let i = 0; i < 50; i++) {
        let y = startY + 300 + Math.random() * (endY - startY - 400);
        let x = VIEW_WIDTH / 2 + (Math.random() - 0.5) * (VIEW_WIDTH * 0.8); 
        let spinBody = Bodies.rectangle(x, y, VIEW_WIDTH * 0.3, 15, { isStatic: true, render: { fillStyle: "#ff3b30" } });
        movingObstacles.push({ body: spinBody, type: 'spinner', speed: (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 0.05 + 0.05) });
        World.add(world, spinBody);
    }

    // 마의 구간 (Climax Zone)
    const climaxY = endY + 200;
    for(let i = 0; i < 40; i++) {
        let bumper = Bodies.circle(Math.random() * VIEW_WIDTH, climaxY + Math.random() * 1500, VIEW_WIDTH * 0.05, { isStatic: true, restitution: 1.6, render: { fillStyle: "#cc66ff" } });
        World.add(world, bumper);
    }
}

function createBalls() {
    const colors = ["#ff9500", "#4cd964", "#5ac8fa", "#ff2d55", "#e57373", "#ba68c8", "#4dd0e1", "#81c784", "#fff176"];
    const spreadHeight = Math.max(300, totalBalls * 6);
    // 모바일 뷰에 맞춰 공 크기 조절
    const ballRadius = VIEW_WIDTH * 0.025 > 15 ? 15 : Math.max(VIEW_WIDTH * 0.025, 10); 
    
    for (let i = 1; i <= totalBalls; i++) {
        let ball = Bodies.circle(VIEW_WIDTH / 2 + (Math.random() - 0.5) * (VIEW_WIDTH * 0.5), -150 - Math.random() * spreadHeight, ballRadius, {
            restitution: 0.85, friction: 0, frictionAir: 0.025, density: 0.05, isStatic: true, render: { fillStyle: colors[i % colors.length] }
        });
        ball.number = i;
        balls.push(ball);
        World.add(world, ball);
    }
}

function startGame() {
    if(!winnerDeclared && balls.length > 0 && balls[0].isStatic === false) return;
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    bgmMusic.currentTime = 0;
    bgmMusic.play().catch(e => {});
    winnerDeclared = false;
    document.getElementById("winner").innerHTML = "🔥 레이스 진행중! 🔥";
    document.getElementById("winner").classList.remove("celebrate");
    engine.timing.timeScale = 1.0; 
    balls.forEach(ball => Body.setStatic(ball, false));
}

function resetGame() {
    bgmMusic.pause();
    cheerSound.pause();
    winnerDeclared = false;
    document.getElementById("winner").innerHTML = "🏁 대기 중...";
    document.getElementById("winner").classList.remove("celebrate");
    engine.timing.timeScale = 1.0;
    World.clear(world);
    Engine.clear(engine);
    balls = [];
    top5BallIds.clear();
    buildLevel();
}
</script>
</body>
</html>
