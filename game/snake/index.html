<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyber Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            border-radius: 5px;
            display: block;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            text-shadow: 0 0 10px #0f0;
            width: 100%;
            pointer-events: none;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(0, 255, 0, 0.1);
            color: #0f0;
            border: 1px solid #0f0;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px #0f0;
            pointer-events: auto;
            transition: all 0.2s;
        }
        button:hover { background: #0f0; color: #000; }
        #scoreBoard {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 5px #0f0;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="scoreBoard">SCORE: <span id="score">0</span></div>
    <div id="ui">
        <h1 id="title">NEON SNAKE</h1>
        <button id="startBtn">GAME START</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const ui = document.getElementById('ui');
    const title = document.getElementById('title');
    const scoreEl = document.getElementById('score');

    // 모바일 대응 캔버스 크기 조정
    function resizeCanvas() {
        const scale = Math.min(window.innerWidth / 420, window.innerHeight / 420);
        if (scale < 1) {
            canvas.style.transform = `scale(${scale})`;
            canvas.style.transformOrigin = 'center center';
        }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Web Audio API (레트로 사운드) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'eat') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }

    // --- 게임 변수 ---
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    
    let snake = [];
    let dx = 0;
    let dy = 0;
    let food = { x: 15, y: 15 };
    let score = 0;
    let speed = 10; // 초기 속도 (낮을수록 느림, fps 개념)
    
    let gameLoopTimeout;
    let isPlaying = false;
    let changingDirection = false;

    // --- 입력 처리 (PC 키보드 & 모바일 스와이프) ---
    document.addEventListener('keydown', changeDirection);

    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault(); // 스크롤 방지
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        if (!isPlaying) return;
        let touchEndX = e.changedTouches[0].screenX;
        let touchEndY = e.changedTouches[0].screenY;
        handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
    });

    function changeDirection(event) {
        if (changingDirection || !isPlaying) return;
        
        const LEFT_KEY = 37; const RIGHT_KEY = 39;
        const UP_KEY = 38; const DOWN_KEY = 40;

        const keyPressed = event.keyCode;
        const goingUp = dy === -1;
        const goingDown = dy === 1;
        const goingRight = dx === 1;
        const goingLeft = dx === -1;

        if (keyPressed === LEFT_KEY && !goingRight) { dx = -1; dy = 0; changingDirection = true; }
        if (keyPressed === UP_KEY && !goingDown) { dx = 0; dy = -1; changingDirection = true; }
        if (keyPressed === RIGHT_KEY && !goingLeft) { dx = 1; dy = 0; changingDirection = true; }
        if (keyPressed === DOWN_KEY && !goingUp) { dx = 0; dy = 1; changingDirection = true; }
    }

    function handleSwipe(startX, startY, endX, endY) {
        if (changingDirection) return;
        
        let deltaX = endX - startX;
        let deltaY = endY - startY;

        // 스와이프 거리가 짧으면 무시
        if (Math.abs(deltaX) < 30 && Math.abs(deltaY) < 30) return;

        const goingUp = dy === -1;
        const goingDown = dy === 1;
        const goingRight = dx === 1;
        const goingLeft = dx === -1;

        // X축 이동이 Y축 이동보다 크면 좌우 스와이프
        if (Math.abs(deltaX) > Math.abs(deltaY)) {
            if (deltaX > 0 && !goingLeft) { dx = 1; dy = 0; changingDirection = true; } // 우
            else if (deltaX < 0 && !goingRight) { dx = -1; dy = 0; changingDirection = true; } // 좌
        } else {
            // Y축 이동이 더 크면 상하 스와이프
            if (deltaY > 0 && !goingUp) { dx = 0; dy = 1; changingDirection = true; } // 하
            else if (deltaY < 0 && !goingDown) { dx = 0; dy = -1; changingDirection = true; } // 상
        }
    }

    // --- 그리기 및 게임 로직 ---
    function drawGame() {
        if (!isPlaying) return;
        
        if (hasGameEnded()) {
            gameOver();
            return;
        }

        changingDirection = false;
        
        // 속도 제어를 위해 setTimeout 사용
        gameLoopTimeout = setTimeout(function onTick() {
            clearCanvas();
            drawFood();
            advanceSnake();
            drawSnake();
            drawGame();
        }, 1000 / speed);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawFood() {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#f00';
        ctx.fillStyle = '#f00';
        // 음식을 동그랗게 그리기
        ctx.beginPath();
        ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            // 머리는 다른 색상/광원 효과
            if (index === 0) {
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 10;
            } else {
                ctx.fillStyle = '#0f0';
                ctx.shadowColor = '#0f0';
                ctx.shadowBlur = 5;
            }
            // 그리드 크기보다 살짝 작게 그려서 블록 구분을 줌
            ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0;
        });
    }

    function advanceSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
        if (hasEatenFood) {
            score += 10;
            scoreEl.innerText = score;
            playSound('eat');
            
            // 점수가 오를수록 속도 미세하게 증가 (최대치 제한)
            if (score % 50 === 0 && speed < 25) speed += 1.5;
            
            generateFood();
        } else {
            snake.pop(); // 먹이를 먹지 않았다면 꼬리를 자름 (길이 유지)
        }
    }

    function generateFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        
        // 음식이 뱀의 몸통 위에 생성되지 않도록 체크
        snake.forEach(function has_snake_eaten_food(part) {
            const has_eaten = part.x == food.x && part.y == food.y;
            if (has_eaten) generateFood();
        });
    }

    function hasGameEnded() {
        // 벽에 충돌
        const hitLeftWall = snake[0].x < 0;
        const hitRightWall = snake[0].x >= tileCount;
        const hitTopWall = snake[0].y < 0;
        const hitBottomWall = snake[0].y >= tileCount;
        
        if (hitLeftWall || hitRightWall || hitTopWall || hitBottomWall) return true;

        // 자기 몸에 충돌
        for (let i = 4; i < snake.length; i++) {
            if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
        }
        return false;
    }

    function gameOver() {
        isPlaying = false;
        playSound('die');
        ui.style.pointerEvents = 'auto';
        title.innerText = "GAME OVER";
        title.style.display = 'block';
        startBtn.style.display = 'inline-block';
        startBtn.innerText = 'RESTART';
    }

    // --- 게임 시작 ---
    startBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new AudioContext();
        audioCtx.resume();
        
        ui.style.pointerEvents = 'none';
        title.style.display = 'none';
        startBtn.style.display = 'none';
        
        // 초기화
        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        dx = 1;
        dy = 0;
        score = 0;
        speed = 8;
        scoreEl.innerText = score;
        generateFood();
        
        isPlaying = true;
        clearTimeout(gameLoopTimeout);
        drawGame();
    });

</script>
</body>
</html>
