<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyber Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
        }
        #gameArea {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #scoreBoard {
            width: 100%;
            text-align: left;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 5px #0f0;
            margin-bottom: 10px;
        }
        canvas {
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            border-radius: 5px;
            display: block;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            text-shadow: 0 0 10px #0f0;
            width: 100%;
            pointer-events: none;
        }
        button.actionBtn {
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(0, 255, 0, 0.1);
            color: #0f0;
            border: 1px solid #0f0;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px #0f0;
            pointer-events: auto;
        }
        button.actionBtn:active { background: #0f0; color: #000; }
        
        /* 모바일용 가상 방향키 */
        #dpad {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            justify-content: center;
        }
        .dirBtn {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            border-radius: 10px;
            color: #0f0;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: manipulation;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        .dirBtn:active { background: rgba(0, 255, 0, 0.5); }
        #btnUp { grid-column: 2; grid-row: 1; }
        #btnLeft { grid-column: 1; grid-row: 2; }
        #btnDown { grid-column: 2; grid-row: 2; }
        #btnRight { grid-column: 3; grid-row: 2; }

    </style>
</head>
<body>

<div id="gameArea">
    <div id="scoreBoard">SCORE: <span id="score">0</span></div>
    <div style="position: relative;">
        <canvas id="gameCanvas" width="300" height="300"></canvas>
        <div id="ui">
            <h1 id="title">NEON SNAKE</h1>
            <button id="startBtn" class="actionBtn">GAME START</button>
        </div>
    </div>
    
    <!-- 모바일 터치 패드 -->
    <div id="dpad">
        <div class="dirBtn" id="btnUp">▲</div>
        <div class="dirBtn" id="btnLeft">◀</div>
        <div class="dirBtn" id="btnDown">▼</div>
        <div class="dirBtn" id="btnRight">▶</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const ui = document.getElementById('ui');
    const title = document.getElementById('title');
    const scoreEl = document.getElementById('score');

    // 캔버스 크기를 화면에 맞게 유동적으로 조절 (정사각형 유지)
    function resizeCanvas() {
        const size = Math.min(window.innerWidth * 0.9, 400); // 최대 400px
        canvas.width = size;
        canvas.height = size;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 오디오 컨텍스트
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'eat') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }

    // 게임 변수
    let tileCount = 15; // 격자 칸 수 (가로세로 15칸)
    let gridSize = canvas.width / tileCount;
    
    let snake = [];
    let dx = 0;
    let dy = 0;
    let food = { x: 5, y: 5 };
    let score = 0;
    let speed = 7;
    
    let gameLoopTimeout;
    let isPlaying = false;
    let changingDirection = false;

    // --- 방향 제어 로직 ---
    function setDirection(newDx, newDy) {
        if (changingDirection || !isPlaying) return;
        const goingUp = dy === -1;
        const goingDown = dy === 1;
        const goingRight = dx === 1;
        const goingLeft = dx === -1;

        if (newDx === -1 && !goingRight) { dx = -1; dy = 0; changingDirection = true; } // 좌
        if (newDy === -1 && !goingDown) { dx = 0; dy = -1; changingDirection = true; } // 상
        if (newDx === 1 && !goingLeft) { dx = 1; dy = 0; changingDirection = true; } // 우
        if (newDy === 1 && !goingUp) { dx = 0; dy = 1; changingDirection = true; } // 하
    }

    // PC 키보드
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') setDirection(-1, 0);
        if (e.key === 'ArrowUp') setDirection(0, -1);
        if (e.key === 'ArrowRight') setDirection(1, 0);
        if (e.key === 'ArrowDown') setDirection(0, 1);
    });

    // 모바일 터치 패드 이벤트 (마우스 클릭도 지원)
    const addTouch = (id, nx, ny) => {
        const btn = document.getElementById(id);
        const handler = (e) => { e.preventDefault(); setDirection(nx, ny); };
        btn.addEventListener('touchstart', handler, {passive: false});
        btn.addEventListener('mousedown', handler);
    };
    addTouch('btnLeft', -1, 0);
    addTouch('btnUp', 0, -1);
    addTouch('btnRight', 1, 0);
    addTouch('btnDown', 0, 1);

    // --- 게임 루프 ---
    function drawGame() {
        if (!isPlaying) return;
        if (hasGameEnded()) {
            gameOver();
            return;
        }

        changingDirection = false;
        gridSize = canvas.width / tileCount; // 리사이즈 대비
        
        gameLoopTimeout = setTimeout(() => {
            clearCanvas();
            drawFood();
            advanceSnake();
            drawSnake();
            drawGame();
        }, 1000 / speed);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawFood() {
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#f00';
        ctx.fillStyle = '#f00';
        ctx.beginPath();
        ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            if (index === 0) {
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 10;
            } else {
                ctx.fillStyle = '#0f0';
                ctx.shadowColor = '#0f0';
                ctx.shadowBlur = 5;
            }
            ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0;
        });
    }

    function advanceSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.innerText = score;
            playSound('eat');
            if (score % 50 === 0 && speed < 20) speed += 1; // 속도 증가
            generateFood();
        } else {
            snake.pop();
        }
    }

    function generateFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        snake.forEach((part) => {
            if (part.x === food.x && part.y === food.y) generateFood();
        });
    }

    function hasGameEnded() {
        const head = snake[0];
        // 벽 충돌 (0 미만이거나 타일 수 이상일 때)
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return true;
        // 자기 몸 충돌
        for (let i = 4; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) return true;
        }
        return false;
    }

    function gameOver() {
        isPlaying = false;
        playSound('die');
        ui.style.pointerEvents = 'auto';
        title.innerText = "GAME OVER";
        title.style.display = 'block';
        startBtn.style.display = 'inline-block';
        startBtn.innerText = 'RESTART';
    }

    // --- 게임 시작 ---
    startBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new AudioContext();
        audioCtx.resume();
        
        ui.style.pointerEvents = 'none';
        title.style.display = 'none';
        startBtn.style.display = 'none';
        
        // 초기화 (중앙에서 약간 왼쪽에서 시작)
        const startX = Math.floor(tileCount / 2);
        const startY = Math.floor(tileCount / 2);
        snake = [
            { x: startX, y: startY },
            { x: startX - 1, y: startY },
            { x: startX - 2, y: startY }
        ];
        dx = 1; // 오른쪽 방향으로 출발
        dy = 0;
        score = 0;
        speed = 7;
        scoreEl.innerText = score;
        generateFood();
        
        isPlaying = true;
        clearTimeout(gameLoopTimeout);
        drawGame();
    });

</script>
</body>
</html>
