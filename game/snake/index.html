<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyber Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            /* 배경 그리드 조금 더 촘촘하게 */
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 15px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 상하 분배 */
            align-items: center;
            height: 100vh;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
        }
        
        #topArea {
            width: 100%;
            padding: 10px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        #scoreBoard {
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 5px #0f0;
        }

        #gameArea {
            position: relative;
            width: 100%;
            flex-grow: 1; /* 남은 공간을 모두 차지하도록 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        canvas {
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            border-radius: 5px;
            display: block;
            /* 캔버스가 부모 영역을 꽉 채우되 비율 유지 */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
        }

        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            text-shadow: 0 0 10px #0f0;
            width: 100%;
            pointer-events: none;
            z-index: 20;
        }
        
        button.actionBtn {
            margin-top: 20px;
            padding: 15px 30px;
            background: rgba(0, 255, 0, 0.1);
            color: #0f0;
            border: 2px solid #0f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px #0f0;
            pointer-events: auto;
        }
        button.actionBtn:active { background: #0f0; color: #000; }
        
        /* 모바일용 가상 방향키 (하단 고정) */
        #dpadArea {
            width: 100%;
            padding-bottom: 30px;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        #dpad {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 10px;
        }
        
        .dirBtn {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            border-radius: 15px;
            color: #0f0;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: manipulation;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        .dirBtn:active { background: rgba(0, 255, 0, 0.6); box-shadow: 0 0 20px #0f0; }
        #btnUp { grid-column: 2; grid-row: 1; }
        #btnLeft { grid-column: 1; grid-row: 2; }
        #btnDown { grid-column: 2; grid-row: 2; }
        #btnRight { grid-column: 3; grid-row: 2; }

    </style>
</head>
<body>

<div id="topArea">
    <div id="scoreBoard">SCORE: <span id="score">0</span></div>
</div>

<div id="gameArea">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <h1 id="title" style="font-size: 32px; margin-bottom: 10px;">NEON SNAKE</h1>
        <button id="startBtn" class="actionBtn">START</button>
    </div>
</div>
    
<div id="dpadArea">
    <div id="dpad">
        <div class="dirBtn" id="btnUp">▲</div>
        <div class="dirBtn" id="btnLeft">◀</div>
        <div class="dirBtn" id="btnDown">▼</div>
        <div class="dirBtn" id="btnRight">▶</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const ui = document.getElementById('ui');
    const title = document.getElementById('title');
    const scoreEl = document.getElementById('score');

    let tileCount = 20; // 맵을 20x20 칸으로 나누어 조금 더 넓게 설정
    let gridSize;

    // 모바일 화면을 꽉 채우도록 캔버스 크기 계산
    function resizeCanvas() {
        const gameArea = document.getElementById('gameArea');
        // 부모 영역의 너비와 높이 중 작은 값을 기준으로 정사각형 생성
        const size = Math.min(gameArea.clientWidth - 20, gameArea.clientHeight - 20); 
        
        canvas.width = size;
        canvas.height = size;
        gridSize = size / tileCount;
    }
    
    // 리사이즈 이벤트 시 다시 그리기 위함
    window.addEventListener('resize', () => {
        resizeCanvas();
        if(!isPlaying && snake.length > 0) {
            clearCanvas();
            drawFood();
            drawSnake();
        }
    });

    // 오디오 설정
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'eat') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }

    // 게임 상태 변수
    let snake = [];
    let dx = 0;
    let dy = 0;
    let food = { x: 5, y: 5 };
    let score = 0;
    let speed = 8;
    
    let gameLoopTimeout;
    let isPlaying = false;
    let changingDirection = false;

    // --- 방향 제어 로직 ---
    function setDirection(newDx, newDy) {
        if (changingDirection || !isPlaying) return;
        const goingUp = dy === -1;
        const goingDown = dy === 1;
        const goingRight = dx === 1;
        const goingLeft = dx === -1;

        if (newDx === -1 && !goingRight) { dx = -1; dy = 0; changingDirection = true; } 
        if (newDy === -1 && !goingDown) { dx = 0; dy = -1; changingDirection = true; } 
        if (newDx === 1 && !goingLeft) { dx = 1; dy = 0; changingDirection = true; } 
        if (newDy === 1 && !goingUp) { dx = 0; dy = 1; changingDirection = true; } 
    }

    // PC 키보드
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') setDirection(-1, 0);
        if (e.key === 'ArrowUp') setDirection(0, -1);
        if (e.key === 'ArrowRight') setDirection(1, 0);
        if (e.key === 'ArrowDown') setDirection(0, 1);
    });

    // 모바일 터치 패드
    const addTouch = (id, nx, ny) => {
        const btn = document.getElementById(id);
        const handler = (e) => { e.preventDefault(); setDirection(nx, ny); };
        btn.addEventListener('touchstart', handler, {passive: false});
        btn.addEventListener('mousedown', handler);
    };
    addTouch('btnLeft', -1, 0);
    addTouch('btnUp', 0, -1);
    addTouch('btnRight', 1, 0);
    addTouch('btnDown', 0, 1);

    // --- 게임 루프 ---
    function drawGame() {
        if (!isPlaying) return;
        if (hasGameEnded()) {
            gameOver();
            return;
        }

        changingDirection = false;
        
        gameLoopTimeout = setTimeout(() => {
            clearCanvas();
            drawFood();
            advanceSnake();
            drawSnake();
            drawGame();
        }, 1000 / speed);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawFood() {
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#f00';
        ctx.fillStyle = '#f00';
        ctx.beginPath();
        // 먹이 크기도 셀 크기에 맞춰 조정
        ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            if (index === 0) {
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 8;
            } else {
                ctx.fillStyle = '#0f0';
                ctx.shadowColor = '#0f0';
                ctx.shadowBlur = 4;
            }
            
            // 사진의 참고 이미지처럼 셀(마디) 간의 간격을 주어 띄워 그리기
            // 각 칸의 크기(gridSize)에서 여백(margin)을 뺌
            const margin = 2; // 마디 사이의 간격
            const rectSize = gridSize - (margin * 2); 
            
            // 모서리를 살짝 둥글게 처리 (선택사항, 지워도 됨)
            ctx.lineJoin = "round";
            ctx.lineWidth = margin;
            
            ctx.fillRect(
                (part.x * gridSize) + margin, 
                (part.y * gridSize) + margin, 
                rectSize, 
                rectSize
            );
            ctx.shadowBlur = 0;
        });
    }

    function advanceSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.innerText = score;
            playSound('eat');
            if (score % 50 === 0 && speed < 20) speed += 1; 
            generateFood();
        } else {
            snake.pop();
        }
    }

    function generateFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        
        let onSnake = false;
        snake.forEach((part) => {
            if (part.x === food.x && part.y === food.y) onSnake = true;
        });
        
        if(onSnake) generateFood();
    }

    function hasGameEnded() {
        const head = snake[0];
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return true;
        for (let i = 4; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) return true;
        }
        return false;
    }

    function gameOver() {
        isPlaying = false;
        playSound('die');
        ui.style.pointerEvents = 'auto';
        title.innerText = "GAME OVER";
        title.style.display = 'block';
        startBtn.style.display = 'inline-block';
        startBtn.innerText = 'RESTART';
    }

    // --- 초기화 및 시작 ---
    // 첫 로드 시 캔버스 설정
    resizeCanvas();

    startBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new AudioContext();
        audioCtx.resume();
        
        ui.style.pointerEvents = 'none';
        title.style.display = 'none';
        startBtn.style.display = 'none';
        
        // 화면 크기가 변했을 수 있으므로 다시 리사이즈
        resizeCanvas();
        
        const startX = Math.floor(tileCount / 2);
        const startY = Math.floor(tileCount / 2);
        snake = [
            { x: startX, y: startY },
            { x: startX - 1, y: startY },
            { x: startX - 2, y: startY }
        ];
        dx = 1; 
        dy = 0;
        score = 0;
        speed = 8;
        scoreEl.innerText = score;
        generateFood();
        
        isPlaying = true;
        clearTimeout(gameLoopTimeout);
        drawGame();
    });

</script>
</body>
</html>
