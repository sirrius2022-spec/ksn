<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyber Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            /* 배경 그리드 */
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 15px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 모바일 브라우저 주소창을 고려한 100dvh (꽉 찬 화면) */
            height: 100dvh; 
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
        }
        
        #topArea {
            width: 100%;
            height: 60px; /* 고정 높이 */
            padding: 15px 20px 0 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #scoreBoard {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 5px #0f0;
        }

        #gameArea {
            position: relative;
            width: 100%;
            flex: 1; /* 남은 위아래 공간을 모두 차지 (가장 중요) */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
        }

        canvas {
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            border-radius: 5px;
            display: block;
        }

        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            text-shadow: 0 0 10px #0f0;
            width: 100%;
            pointer-events: none;
            z-index: 20;
        }
        
        button.actionBtn {
            margin-top: 20px;
            padding: 15px 30px;
            background: rgba(0, 255, 0, 0.1);
            color: #0f0;
            border: 2px solid #0f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px #0f0;
            pointer-events: auto;
        }
        button.actionBtn:active { background: #0f0; color: #000; }
        
        /* 모바일용 가상 방향키 (잘리지 않도록 높이와 여백 축소) */
        #dpadArea {
            width: 100%;
            height: 150px; /* 고정 높이 할당 */
            padding-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        #dpad {
            display: grid;
            /* 버튼 크기를 70px -> 55px로 축소 */
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(2, 55px);
            gap: 8px;
        }
        
        .dirBtn {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            border-radius: 12px;
            color: #0f0;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: manipulation;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        .dirBtn:active { background: rgba(0, 255, 0, 0.6); box-shadow: 0 0 20px #0f0; }
        #btnUp { grid-column: 2; grid-row: 1; }
        #btnLeft { grid-column: 1; grid-row: 2; }
        #btnDown { grid-column: 2; grid-row: 2; }
        #btnRight { grid-column: 3; grid-row: 2; }

    </style>
</head>
<body>

<div id="topArea">
    <div id="scoreBoard">SCORE: <span id="score">0</span></div>
</div>

<div id="gameArea">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <h1 id="title" style="font-size: 32px; margin-bottom: 10px;">NEON SNAKE</h1>
        <button id="startBtn" class="actionBtn">START</button>
    </div>
</div>
    
<div id="dpadArea">
    <div id="dpad">
        <div class="dirBtn" id="btnUp">▲</div>
        <div class="dirBtn" id="btnLeft">◀</div>
        <div class="dirBtn" id="btnDown">▼</div>
        <div class="dirBtn" id="btnRight">▶</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const ui = document.getElementById('ui');
    const title = document.getElementById('title');
    const scoreEl = document.getElementById('score');

    let cols, rows, gridSize;

    // 화면(gameArea) 공간을 온전히 직사각형으로 채우는 계산
    function resizeCanvas() {
        const gameArea = document.getElementById('gameArea');
        // 여백(padding) 10px씩 제외한 실제 가용 너비/높이
        const w = gameArea.clientWidth - 20; 
        const h = gameArea.clientHeight - 20;
        
        // 뱀 마디 크기 결정: 가로를 25칸으로 설정 (적당히 작고 촘촘하게)
        const targetCols = 25; 
        gridSize = Math.floor(w / targetCols);
        
        // 캔버스의 칸(열/행) 수 계산
        cols = Math.floor(w / gridSize);
        rows = Math.floor(h / gridSize); // 세로 길이(h)에 맞춰 직사각형 생성
        
        // 캔버스 픽셀 크기 적용
        canvas.width = cols * gridSize;
        canvas.height = rows * gridSize;
    }
    
    window.addEventListener('resize', () => {
        resizeCanvas();
        if(!isPlaying && snake.length > 0) {
            clearCanvas();
            drawFood();
            drawSnake();
        }
    });

    // 오디오 설정 (레트로 효과음)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'eat') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }

    // 게임 상태 변수
    let snake = [];
    let dx = 0;
    let dy = 0;
    let food = { x: 5, y: 5 };
    let score = 0;
    let speed = 8;
    
    let gameLoopTimeout;
    let isPlaying = false;
    let changingDirection = false;

    // 방향 제어
    function setDirection(newDx, newDy) {
        if (changingDirection || !isPlaying) return;
        const goingUp = dy === -1;
        const goingDown = dy === 1;
        const goingRight = dx === 1;
        const goingLeft = dx === -1;

        if (newDx === -1 && !goingRight) { dx = -1; dy = 0; changingDirection = true; } 
        if (newDy === -1 && !goingDown) { dx = 0; dy = -1; changingDirection = true; } 
        if (newDx === 1 && !goingLeft) { dx = 1; dy = 0; changingDirection = true; } 
        if (newDy === 1 && !goingUp) { dx = 0; dy = 1; changingDirection = true; } 
    }

    // PC 키보드
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') setDirection(-1, 0);
        if (e.key === 'ArrowUp') setDirection(0, -1);
        if (e.key === 'ArrowRight') setDirection(1, 0);
        if (e.key === 'ArrowDown') setDirection(0, 1);
    });

    // 모바일 터치 패드
    const addTouch = (id, nx, ny) => {
        const btn = document.getElementById(id);
        const handler = (e) => { e.preventDefault(); setDirection(nx, ny); };
        btn.addEventListener('touchstart', handler, {passive: false});
        btn.addEventListener('mousedown', handler);
    };
    addTouch('btnLeft', -1, 0);
    addTouch('btnUp', 0, -1);
    addTouch('btnRight', 1, 0);
    addTouch('btnDown', 0, 1);

    // 게임 루프
    function drawGame() {
        if (!isPlaying) return;
        if (hasGameEnded()) {
            gameOver();
            return;
        }

        changingDirection = false;
        
        gameLoopTimeout = setTimeout(() => {
            clearCanvas();
            drawFood();
            advanceSnake();
            drawSnake();
            drawGame();
        }, 1000 / speed);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawFood() {
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#f00';
        ctx.fillStyle = '#f00';
        ctx.beginPath();
        ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            if (index === 0) {
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 8;
            } else {
                ctx.fillStyle = '#0f0';
                ctx.shadowColor = '#0f0';
                ctx.shadowBlur = 4;
            }
            
            // 마디 사이 1px 여백 띄우기 (세련된 네온 효과)
            const margin = 1; 
            const rectSize = gridSize - (margin * 2); 
            
            ctx.lineJoin = "round";
            ctx.fillRect(
                (part.x * gridSize) + margin, 
                (part.y * gridSize) + margin, 
                rectSize, 
                rectSize
            );
            ctx.shadowBlur = 0;
        });
    }

    function advanceSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.innerText = score;
            playSound('eat');
            if (score % 50 === 0 && speed < 25) speed += 1; 
            generateFood();
        } else {
            snake.pop();
        }
    }

    function generateFood() {
        food.x = Math.floor(Math.random() * cols);
        food.y = Math.floor(Math.random() * rows);
        
        let onSnake = false;
        snake.forEach((part) => {
            if (part.x === food.x && part.y === food.y) onSnake = true;
        });
        
        if(onSnake) generateFood();
    }

    function hasGameEnded() {
        const head = snake[0];
        // 직사각형 벽 충돌 감지
        if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) return true;
        for (let i = 4; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) return true;
        }
        return false;
    }

    function gameOver() {
        isPlaying = false;
        playSound('die');
        ui.style.pointerEvents = 'auto';
        title.innerText = "GAME OVER";
        title.style.display = 'block';
        startBtn.style.display = 'inline-block';
        startBtn.innerText = 'RESTART';
    }

    // 초기화 및 시작
    resizeCanvas();

    startBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new AudioContext();
        audioCtx.resume();
        
        ui.style.pointerEvents = 'none';
        title.style.display = 'none';
        startBtn.style.display = 'none';
        
        resizeCanvas();
        
        const startX = Math.floor(cols / 2);
        const startY = Math.floor(rows / 2);
        snake = [
            { x: startX, y: startY },
            { x: startX - 1, y: startY },
            { x: startX - 2, y: startY }
        ];
        dx = 1; 
        dy = 0;
        score = 0;
        speed = 10; // 칸이 좁아졌으므로 10부터 시작
        scoreEl.innerText = score;
        generateFood();
        
        isPlaying = true;
        clearTimeout(gameLoopTimeout);
        drawGame();
    });

</script>
</body>
</html>
