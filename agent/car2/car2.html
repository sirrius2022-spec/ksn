<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>항타기 지지력 검토</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* 레이아웃: 상단 고정 바(판정·저장) + 좌측 입력 / 우측 결과(도해) 2단, 좁은 화면은 결과 우선 1단 */
:root {
  --font-ui: 'IBM Plex Sans KR', 'IBM Plex Sans JP', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'Malgun Gothic', monospace;
  --bg: #E8ECEE; --panel: #F8FAFB; --panel-2: #EDF1F3; --field: #FFFFFF;
  --ink: #16252E; --mute: #566872; --line: #C6D0D6;
  --accent: #1B5E8A; --accent-ink: #FFFFFF; --accent-soft: #D7E7F1;
  --ok: #1B7447; --ok-bg: #DCEFE4; --warn: #85580A; --warn-bg: #F7EAC8; --bad: #B3261E; --bad-bg: #F7DAD6;
  --crane: #EDB100; --crane-dk: #9A7300; --steel: #8B98A1; --steel-dk: #4E5B64;
  --trk: #33404A; --trk-in: #4B5A66; --glass: #BFD9EA;
  --soil-1: #D8CBB0; --soil-2: #B9C2B0; --soil-3: #C9B79F; --soil-4: #A9AFB4; --water: #2F7FB5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1619; --panel: #182026; --panel-2: #202A31; --field: #0F1619;
    --ink: #E4ECF0; --mute: #9AABB5; --line: #34434D;
    --accent: #6DB5E6; --accent-ink: #0A1821; --accent-soft: #1E3949;
    --ok: #62CF93; --ok-bg: #16372A; --warn: #F0C45E; --warn-bg: #3A3014; --bad: #FF8D84; --bad-bg: #43201E;
    --crane: #F2B90D; --crane-dk: #B58A00; --steel: #6F7D87; --steel-dk: #9AA8B1;
    --trk: #56646F; --trk-in: #6E7E8A; --glass: #3C5D73;
    --soil-1: #4B4537; --soil-2: #3D473A; --soil-3: #4A4137; --soil-4: #3C4349; --water: #5AB0E8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1619; --panel: #182026; --panel-2: #202A31; --field: #0F1619;
  --ink: #E4ECF0; --mute: #9AABB5; --line: #34434D;
  --accent: #6DB5E6; --accent-ink: #0A1821; --accent-soft: #1E3949;
  --ok: #62CF93; --ok-bg: #16372A; --warn: #F0C45E; --warn-bg: #3A3014; --bad: #FF8D84; --bad-bg: #43201E;
  --crane: #F2B90D; --crane-dk: #B58A00; --steel: #6F7D87; --steel-dk: #9AA8B1;
  --trk: #56646F; --trk-in: #6E7E8A; --glass: #3C5D73;
  --soil-1: #4B4537; --soil-2: #3D473A; --soil-3: #4A4137; --soil-4: #3C4349; --water: #5AB0E8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
  padding-inline: 16px; padding-block: 0 48px;
}
button, input { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.st-OK   { --st: var(--ok);   --st-bg: var(--ok-bg); }
.st-WARN { --st: var(--warn); --st-bg: var(--warn-bg); }
.st-NG   { --st: var(--bad);  --st-bg: var(--bad-bg); }
.st-NA   { --st: var(--mute); --st-bg: var(--panel-2); }

/* ---- 상단 바 ---- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: -16px; padding-inline: 16px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1380px; margin-inline: auto; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 260px; }
.brand svg { flex: none; color: var(--accent); }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.brand p { margin: 0; font-size: 12px; color: var(--mute); }
.top-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; font-weight: 700; font-size: 13px; background: var(--st-bg); color: var(--st); border: 1px solid var(--st); white-space: nowrap; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--st); }
.chip small { font: 500 12px var(--font-num); opacity: .9; }
.btn { height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.wrap { max-width: 1380px; margin-inline: auto; padding-block: 16px 0; }
.note { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: var(--mute); }

.grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; }
@media (max-width: 1060px) { .grid { grid-template-columns: minmax(0, 1fr); } .res { order: -1; } }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.res { container-type: inline-size; container-name: res; }

/* ---- 카드 ---- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.ch { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.ch h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ch .hint { margin-left: auto; font-size: 12px; color: var(--mute); }
.stepn { flex: none; width: 22px; height: 22px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 12px var(--font-num); }
.sub { font-size: 12px; color: var(--mute); margin: 8px 0 0; }

.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 10px; }
.fgrid.w2 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f > span { font-size: 12px; color: var(--mute); font-weight: 500; }
.f > span em { font-style: normal; font-family: var(--font-num); }
.f input[type="number"], .f input[type="text"], .f input[type="date"] {
  width: 100%; height: 36px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--field); color: var(--ink); font: 500 14px var(--font-num); font-variant-numeric: tabular-nums;
}
.f input[type="text"], .f input[type="date"] { font-family: var(--font-ui); }
.f input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.f input:disabled { opacity: .45; }

.item { border: 1px solid var(--line); border-radius: 7px; padding: 10px; background: var(--panel-2); display: flex; flex-direction: column; gap: 10px; }
.item-h { display: flex; gap: 8px; align-items: center; }
.no { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 12px var(--font-num); }
.item-h input { flex: 1; min-width: 0; height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: var(--ink); font: 500 14px var(--font-ui); }
.ico { flex: none; width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--mute); cursor: pointer; font-size: 17px; line-height: 1; }
.ico:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }
.ico:disabled { opacity: .35; cursor: not-allowed; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; min-height: 36px; align-self: end; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.add { width: 100%; height: 38px; border: 1px dashed var(--line); border-radius: 6px; background: transparent; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; }
.add:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.add:disabled { opacity: .4; cursor: not-allowed; }
.list { display: flex; flex-direction: column; gap: 10px; }
.sumrow { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font: 500 13px var(--font-num); color: var(--ink); }
.sumrow span { color: var(--mute); font-family: var(--font-ui); }
.reset { background: none; border: 0; color: var(--mute); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 6px 2px; align-self: flex-start; }

/* ---- 결과 ---- */
.issues { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.issues.err { border-color: var(--bad); background: var(--bad-bg); }
.issues ul { margin: 0; padding-left: 18px; }
.checks-w { container-type: inline-size; }
.checks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@container (max-width: 640px) { .checks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (max-width: 380px) { .checks { grid-template-columns: minmax(0, 1fr); } }
.ck { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ck.banner { background: var(--st-bg); border-color: var(--st); justify-content: center; }
.ck-k { font-size: 12px; font-weight: 600; color: var(--st); }
.ck-big { font-size: 30px; font-weight: 700; color: var(--st); line-height: 1.1; }
.ck-s { font-size: 12px; color: var(--ink); }
.ck-top { display: flex; align-items: center; gap: 6px; }
.ck-n { flex: none; width: 18px; height: 18px; border-radius: 4px; background: var(--panel-2); color: var(--mute); display: grid; place-items: center; font: 600 11px var(--font-num); }
.ck-t { font-size: 12.5px; font-weight: 600; flex: 1; min-width: 0; line-height: 1.3; }
.pl { flex: none; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--st-bg); color: var(--st); }
.ck-v { font: 600 24px/1.15 var(--font-num); font-variant-numeric: tabular-nums; }
.ck-v small { font-size: 12px; color: var(--mute); margin-left: 4px; font-weight: 500; }
.ck-l { font: 500 12px var(--font-num); color: var(--mute); }
.gauge { position: relative; height: 6px; border-radius: 3px; background: var(--panel-2); margin-top: 2px; }
.gauge i { display: block; height: 100%; border-radius: 3px; background: var(--st); }
.gauge b { position: absolute; left: 80%; top: -3px; bottom: -3px; width: 2px; background: var(--mute); border-radius: 1px; }
.ck-f { font-size: 11.5px; color: var(--mute); line-height: 1.35; }

.fig { overflow-x: auto; }
.fig svg { display: block; width: 100%; min-width: 640px; height: auto; }
.fig.s svg { min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mute); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; }
.legend b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 600 11px var(--font-num); margin-right: 6px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@container res (max-width: 720px) { .two { grid-template-columns: minmax(0, 1fr); } }

details.card > summary { cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before { content: '▸'; display: inline-block; width: 18px; color: var(--accent); }
details.card[open] > summary::before { content: '▾'; }
details.card[open] > summary { margin-bottom: 12px; }
.dg { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.dg h4 { margin: 0 0 4px; font-size: 12px; color: var(--accent); font-weight: 700; }
.dg table, .tw table { width: 100%; border-collapse: collapse; font-size: 13px; }
.dg td { padding: 4px 0; border-bottom: 1px solid var(--line); }
.dg td:last-child { text-align: right; font: 500 13px var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tw { overflow-x: auto; margin-top: 16px; }
.tw h4 { margin: 0 0 6px; font-size: 12px; color: var(--accent); }
.tw th, .tw td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font: 500 12.5px var(--font-num); }
.tw th { color: var(--mute); font-family: var(--font-ui); font-weight: 600; }
.tw th:first-child, .tw td:first-child { text-align: left; font-family: var(--font-ui); }
.pvnote { font-size: 12px; color: var(--mute); margin: 0 0 10px; }
.rpt-wrap { overflow-x: auto; padding: 12px; background: var(--panel-2); border-radius: 6px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.rpt-wrap .rpt-page { box-shadow: 0 1px 8px rgba(0, 0, 0, .3); }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.on { opacity: 1; }
#offscreen, #pvStage { position: absolute; left: -12000px; top: 0; width: 794px; pointer-events: none; }

/* ---- 검토서 (A4 용지: 테마와 무관하게 흰 종이 · 고정색) ---- */
.rpt-page { width: 794px; height: 1123px; flex: none; position: relative; background: #fff; color: #16252E; color-scheme: light; padding: 32px 44px 26px; display: flex; flex-direction: column; font-family: var(--font-ui); font-size: 11.5px; line-height: 1.55; }
.rpt-h { display: flex; justify-content: space-between; font-size: 10px; color: #5B6C77; border-bottom: 1px solid #B9C4CA; padding-bottom: 6px; margin-bottom: 12px; }
.rpt-b { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
.rpt-f { display: flex; justify-content: space-between; font-size: 10px; color: #5B6C77; border-top: 1px solid #B9C4CA; padding-top: 6px; margin-top: 10px; }
.rpt-page .blk { flex: none; }
.rpt-page h1 { font-size: 22px; margin: 0; font-weight: 700; color: #16252E; line-height: 1.25; }
.rpt-page .ttl p { margin: 2px 0 0; color: #5B6C77; font-size: 11px; }
.rpt-page .ttl { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 2px solid #16252E; padding-bottom: 8px; margin-bottom: 10px; }
.rpt-page .bdg { padding: 5px 14px; border-radius: 4px; font-weight: 700; font-size: 15px; border: 1.5px solid; white-space: nowrap; }
.rpt-page .bdg.sm-b { font-size: 13px; }
.rpt-page .bdg-OK { color: #1B7447; background: #DCEFE4; border-color: #1B7447; }
.rpt-page .bdg-WARN { color: #85580A; background: #F7EAC8; border-color: #85580A; }
.rpt-page .bdg-NG { color: #B3261E; background: #F7DAD6; border-color: #B3261E; }
.rpt-page h2 { font-size: 14px; margin: 0 0 6px; padding-bottom: 3px; border-bottom: 1px solid #16252E; font-weight: 700; color: #16252E; }
.rpt-page h3 { font-size: 12px; margin: 8px 0 5px; font-weight: 700; color: #16252E; }
.rpt-page .blk > h3:first-child { margin-top: 0; }
.rpt-page table.rt { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: auto; }
.rpt-page .rt th, .rpt-page .rt td { border: 1px solid #B9C4CA; padding: 3px 6px; text-align: left; vertical-align: top; color: #16252E; }
.rpt-page .rt th { background: #E9EFF2; font-weight: 600; }
.rpt-page .rt td.n, .rpt-page .rt th.n { text-align: right; font-variant-numeric: tabular-nums; }
.rpt-page .rt.kv td:nth-child(odd), .rpt-page .rt.meta td:nth-child(odd) { background: #F2F5F7; width: 17%; }
.rpt-page .rt.sm-t { font-size: 10px; }
.rpt-page .fm { border-left: 3px solid #1B5E8A; background: #F4F7F9; padding: 5px 9px; margin: 6px 0; font-size: 11px; }
.rpt-page .fm div { margin: 2px 0; }
.rpt-page .pl { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 10px; font-weight: 700; border: 1px solid; background: #fff; }
.rpt-page .pl-OK { color: #1B7447; border-color: #1B7447; background: #DCEFE4; }
.rpt-page .pl-WARN { color: #85580A; border-color: #85580A; background: #F7EAC8; }
.rpt-page .pl-NG { color: #B3261E; border-color: #B3261E; background: #F7DAD6; }
.rpt-page .pl-NA { color: #5B6C77; border-color: #B9C4CA; background: #fff; }
.rpt-page .fig svg { width: 100%; min-width: 0; height: auto; display: block; border: 1px solid #D5DDE1; }
.rpt-page .cap { font-size: 10px; color: #5B6C77; text-align: center; margin-top: 3px; }
.rpt-page .fig2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rpt-page .fig2 svg { width: 100%; height: auto; display: block; border: 1px solid #D5DDE1; }
.rpt-page .bl { margin: 0; padding-left: 16px; }
.rpt-page .bl li { margin: 1px 0; }
.rpt-page .op { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 6px; }
.rpt-page .sm { font-size: 10px; color: #5B6C77; }
.rpt-page .sign { margin-top: 10px; }
.rpt-page .sign td { height: 34px; }
.rpt-page .sign td:nth-child(odd) { width: 9%; text-align: center; background: #F2F5F7; }

@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (max-width: 520px) { .brand h1 { font-size: 16px; } .ck-big { font-size: 26px; } }

/* ---- 언어 전환 ---- */
:root[lang="ja"] { --font-ui: 'IBM Plex Sans JP', 'IBM Plex Sans KR', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif; }
:root[lang="ja"] body { line-break: strict; }
.seg { display: inline-flex; height: 36px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; color: var(--mute); font-weight: 600; font-size: 13px; padding: 0 12px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
        <rect x="3" y="24" width="22" height="7" rx="3.5" stroke="currentColor" stroke-width="2"/>
        <rect x="7" y="16" width="12" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
        <path d="M17 17 L27 3 M27 3 V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="24.5" y="9" width="5" height="5" fill="currentColor"/>
      </svg>
      <div>
        <h1 data-ko="항타기 지지력 검토" data-ja="杭打機 支持力検討">항타기 지지력 검토</h1>
        <p data-ko="크롤러형 항타기 · 접지압 · 지지력 · 전도" data-ja="クローラ式杭打機 ・ 接地圧 ・ 支持力 ・ 転倒">크롤러형 항타기 · 접지압 · 지지력 · 전도</p>
      </div>
    </div>
    <div class="top-r">
      <div class="seg" role="group" aria-label="언어 / 言語">
        <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
        <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
      </div>
      <div id="chip" class="chip st-NA"><span class="dot"></span><span id="chipText">…</span></div>
      <button id="btnPdf" class="btn primary" type="button" data-ko="PDF 저장" data-ja="PDF保存">PDF 저장</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* =====================================================================
   1. 언어 · 계산 모듈 (순수 함수)
   - L(ko, ja) : 현재 언어(LANG)에 맞는 문자열 반환
   - 접지압: 2궤도 직사각형 접지면, 선형분포 (편심 e ≤ L/6) / 삼각분포 (e > L/6)
   - 극한지지력: Meyerhof(1963) 일반 지지력 공식 (형상·근입깊이 계수)
   - 하부층: 2:1 하중분산 가상기초 + 순극한지지력 기준
   - 전도: 궤도 전단(前端) 지점 모멘트 평형 (전방 작업)
   ===================================================================== */
const GW = 9.81;                       // 물의 단위중량 (kN/m³)
const rad = d => d * Math.PI / 180;

let LANG = 'ko';
const L = (ko, ja) => (LANG === 'ja' ? ja : ko);
function setLang(l) { LANG = (l === 'ja') ? 'ja' : 'ko'; }
const shortName = s => String(s).replace(/\s*[(（].*[)）]/, '');
const STLABEL = {
  get OK() { return L('적합', '適合'); },
  get WARN() { return L('주의', '注意'); },
  get NG() { return L('부적합', '不適合'); },
  get NA() { return L('해당 없음', '該当なし'); }
};
const CIRC = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩', '⑪', '⑫'];

const SAMPLE_NAMES = {
  ko: {
    proj: '○○지구 PHC 말뚝 항타 작업 (샘플)',
    layers: ['매립층 (사질토 혼입 점성토)', '퇴적층 (연약 점성토)', '풍화토 (사질토)'],
    crane: '크롤러형 항타기 (100t급 크롤러크레인 + 3점식 리더)',
    loads: ['본체 (상부선회체 + 하부주행체)', '카운터웨이트', '리더 (마스트)', '유압해머', '말뚝 (PHC Ø500, L=15m)', '기타 부속 (와이어·공구 등)'],
    newLayer: '신규 지층', newLoad: '기타 하중'
  },
  ja: {
    proj: '○○地区 PHC杭 打設作業（サンプル）',
    layers: ['盛土層（砂質土混じり粘性土）', '沖積層（軟弱粘性土）', '風化土（砂質土）'],
    crane: 'クローラ式杭打機（100t級クローラクレーン＋3点式リーダー）',
    loads: ['本体（上部旋回体＋下部走行体）', 'カウンターウェイト', 'リーダー（マスト）', '油圧ハンマー', '杭（PHC Ø500、L=15m）', 'その他付属品（ワイヤ・工具等）'],
    newLayer: '新規地層', newLoad: 'その他荷重'
  }
};

function makeSample() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const nm = SAMPLE_NAMES[LANG];
  return {
    proj: {
      name: nm.proj,
      author: '',
      date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
    },
    soil: {
      gwt: 3.0,
      layers: [
        { name: nm.layers[0], H: 2.0, gamma: 18.0, c: 5, phi: 25, N: 6 },
        { name: nm.layers[1], H: 4.0, gamma: 17.0, c: 15, phi: 0, N: 3 },
        { name: nm.layers[2], H: 5.0, gamma: 19.0, c: 0, phi: 32, N: 30 }
      ]
    },
    crane: { model: nm.crane, B: 0.90, L: 5.20, G: 3.40 },
    loads: [
      { name: nm.loads[0], W: 700, y: -0.2, dyn: false },
      { name: nm.loads[1], W: 300, y: -3.0, dyn: false },
      { name: nm.loads[2], W: 200, y: 3.6,  dyn: false },
      { name: nm.loads[3], W: 80,  y: 4.8,  dyn: true  },
      { name: nm.loads[4], W: 45,  y: 5.0,  dyn: true  },
      { name: nm.loads[5], W: 20,  y: 1.0,  dyn: false }
    ],
    plate: { use: true, Bp: 2.20, Lp: 6.00, t: 0.022, gp: 77 },
    cond: { FsB: 3.0, FsT: 1.5, alpha: 1.2, Df: 0 }
  };
}

function bearingFactors(phi) {
  if (phi < 0.01) return { Nc: 5.14, Nq: 1, Ng: 0, Kp: 1 };
  const t = Math.tan(rad(phi));
  const Kp = Math.pow(Math.tan(rad(45 + phi / 2)), 2);
  const Nq = Math.exp(Math.PI * t) * Kp;
  const Nc = (Nq - 1) / t;
  const Ng = (Nq - 1) * Math.tan(rad(1.4 * phi));
  return { Nc, Nq, Ng, Kp };
}

function meyerhof(p) {
  const Bs = Math.min(p.B, p.L), Ls = Math.max(p.B, p.L);
  const f = bearingFactors(p.phi);
  const r = Bs / Ls, sk = Math.sqrt(f.Kp);
  const sc = 1 + 0.2 * f.Kp * r;
  const sq = p.phi > 10 ? 1 + 0.1 * f.Kp * r : 1;
  const dc = 1 + 0.2 * sk * p.Df / Bs;
  const dq = p.phi > 10 ? 1 + 0.1 * sk * p.Df / Bs : 1;
  const t1 = p.c * f.Nc * sc * dc;
  const t2 = p.q * f.Nq * sq * dq;
  const t3 = 0.5 * p.gam * Bs * f.Ng * sq * dq;
  return { qu: t1 + t2 + t3, t1, t2, t3, Nc: f.Nc, Nq: f.Nq, Ng: f.Ng, Kp: f.Kp,
           sc, sq, sg: sq, dc, dq, dg: dq, B: Bs, L: Ls };
}

/* 깊이 z 에서의 유효연직응력 (지하수위 이하 γ' = γ − γw) */
function sigmaV(z, soil) {
  let s = 0, top = 0;
  const seg = (a, b, g) => {
    if (b <= a) return;
    const dry = Math.max(0, Math.min(b, soil.gwt) - a);
    const wet = (b - a) - dry;
    s += dry * g + wet * (g - GW);
  };
  for (const ly of soil.layers) {
    seg(top, Math.min(top + ly.H, z), ly.gamma);
    top += ly.H;
    if (z <= top) return s;
  }
  seg(top, z, soil.layers[soil.layers.length - 1].gamma);
  return s;
}

/* 기초 저면 아래 지하수위 영향을 반영한 γ 항 단위중량 */
function gammaEff(gamma, dw, B) {
  const gp = gamma - GW;
  if (dw <= 0) return gp;
  if (dw >= B) return gamma;
  return gp + (dw / B) * (gamma - gp);
}

function stateOf(u) {
  if (u === null || u === undefined || isNaN(u)) return 'NA';
  if (u > 1 + 1e-9) return 'NG';
  if (u > 0.9) return 'WARN';
  return 'OK';
}

function analyze(S) {
  const issues = [];
  const num = (v, label) => {
    if (typeof v !== 'number' || !isFinite(v)) {
      issues.push({ lv: 'err', msg: L(label + ' 값이 비어 있거나 숫자가 아닙니다.', label + 'が未入力、または数値ではありません。') });
      return 0;
    }
    return v;
  };
  const lyN = i => L((i + 1) + '층', (i + 1) + '層目');
  const ldN = i => L((i + 1) + '번 하중', '荷重' + (i + 1));

  const soil = {
    gwt: num(S.soil.gwt, L('지하수위', '地下水位')),
    layers: S.soil.layers.map((l, i) => ({
      name: l.name || (L('지층 ', '地層 ') + (i + 1)),
      H: num(l.H, lyN(i) + L(' 두께', 'の層厚')),
      gamma: num(l.gamma, lyN(i) + L(' 단위중량', 'の単位体積重量')),
      c: num(l.c, lyN(i) + L(' 점착력', 'の粘着力')),
      phi: num(l.phi, lyN(i) + L(' 내부마찰각', 'の内部摩擦角')),
      N: (typeof l.N === 'number' && isFinite(l.N)) ? l.N : null
    }))
  };
  const crane = {
    model: S.crane.model || '',
    B: num(S.crane.B, L('궤도 폭', '履帯幅')), L: num(S.crane.L, L('궤도 접지길이', '履帯接地長')), G: num(S.crane.G, L('궤도 중심간격', '履帯中心間隔'))
  };
  const loads = S.loads.map((l, i) => ({
    name: l.name || (L('하중 ', '荷重 ') + (i + 1)), W: num(l.W, ldN(i) + L(' 중량', 'の重量')),
    y: num(l.y, ldN(i) + L(' 위치', 'の位置')), dyn: !!l.dyn
  }));
  const plate = {
    use: !!S.plate.use, Bp: num(S.plate.Bp, L('깔판 폭', '敷板幅')), Lp: num(S.plate.Lp, L('깔판 길이', '敷板長さ')),
    t: num(S.plate.t, L('깔판 두께', '敷板厚')), gp: num(S.plate.gp, L('깔판 단위중량', '敷板の単位体積重量'))
  };
  const cond = {
    FsB: num(S.cond.FsB, L('지지력 안전율', '支持力安全率')), FsT: num(S.cond.FsT, L('전도 안전율', '転倒安全率')),
    alpha: num(S.cond.alpha, L('충격계수', '衝撃係数')), Df: num(S.cond.Df, L('근입깊이', '根入れ深さ'))
  };

  /* 입력 검증 */
  const err = m => issues.push({ lv: 'err', msg: m });
  const warn = m => issues.push({ lv: 'warn', msg: m });
  if (soil.layers.length < 1) err(L('지층이 1개 이상 필요합니다.', '地層を1層以上入力してください。'));
  soil.layers.forEach((l, i) => {
    if (l.H <= 0) err(L(lyN(i) + ' 두께는 0보다 커야 합니다.', lyN(i) + 'の層厚は0より大きくしてください。'));
    if (l.gamma <= GW) err(L(lyN(i) + ' 단위중량이 물의 단위중량(9.81 kN/m³) 이하입니다.', lyN(i) + 'の単位体積重量が水の単位体積重量（9.81 kN/m³）以下です。'));
    if (l.c < 0) err(L(lyN(i) + ' 점착력은 0 이상이어야 합니다.', lyN(i) + 'の粘着力は0以上にしてください。'));
    if (l.phi < 0 || l.phi > 45) err(L(lyN(i) + ' 내부마찰각은 0~45° 범위로 입력하세요.', lyN(i) + 'の内部摩擦角は0〜45°の範囲で入力してください。'));
    else if (l.phi > 40) warn(L(lyN(i) + ' 내부마찰각이 40°를 초과합니다. 값을 다시 확인하세요.', lyN(i) + 'の内部摩擦角が40°を超えています。値を再確認してください。'));
  });
  if (soil.gwt < 0) err(L('지하수위는 0 이상(지표면 아래 깊이)으로 입력하세요.', '地下水位は0以上（地表面からの深さ）で入力してください。'));
  if (crane.B <= 0 || crane.L <= 0 || crane.G <= 0) err(L('궤도 폭·접지길이·중심간격은 0보다 커야 합니다.', '履帯幅・接地長・中心間隔は0より大きくしてください。'));
  if (crane.G > 0 && crane.B > 0 && crane.G < crane.B) err(L('궤도 중심간격이 궤도 폭보다 작습니다.', '履帯中心間隔が履帯幅より小さいです。'));
  if (crane.L > 0 && crane.B > 0 && crane.L < crane.B) warn(L('궤도 접지길이가 폭보다 짧습니다. 입력값을 확인하세요.', '履帯接地長が履帯幅より短いです。入力値を確認してください。'));
  loads.forEach((l, i) => { if (l.W < 0) err(L(ldN(i) + ' 중량은 0 이상이어야 합니다.', ldN(i) + 'の重量は0以上にしてください。')); });
  if (!loads.some(l => l.W > 0)) err(L('하중이 입력되지 않았습니다.', '荷重が入力されていません。'));
  if (cond.FsB < 1 || cond.FsT < 1) err(L('허용 안전율은 1.0 이상이어야 합니다.', '許容安全率は1.0以上にしてください。'));
  if (cond.alpha < 1) warn(L('충격계수가 1.0 미만입니다.', '衝撃係数が1.0未満です。'));
  if (cond.Df < 0) err(L('근입깊이는 0 이상이어야 합니다.', '根入れ深さは0以上にしてください。'));
  else if (soil.layers[0] && cond.Df > soil.layers[0].H) warn(L('근입깊이가 1층 두께보다 큽니다.', '根入れ深さが1層目の層厚より大きいです。'));
  if (plate.use) {
    if (plate.Bp <= 0 || plate.Lp <= 0 || plate.t < 0 || plate.gp < 0) err(L('깔판 제원을 확인하세요.', '敷板の諸元を確認してください。'));
    else if (plate.Bp < crane.B || plate.Lp < crane.L)
      warn(L('깔판이 궤도보다 작아 깔판 효과 없이 궤도 접지면(폭·길이 중 큰 값)을 적용했습니다.',
             '敷板が履帯より小さいため、敷板の効果を見込まず履帯接地面（幅・長さの大きい方）を適用しました。'));
  }
  if (issues.some(i => i.lv === 'err')) return { ok: false, issues, soil, crane, loads, plate, cond };

  /* ---- 하중 집계 ---- */
  const rows = loads.map(l => {
    const f = l.dyn ? cond.alpha : 1;
    return { ...l, f, Wd: l.W * f, M: l.W * f * l.y };
  });
  const W0 = rows.reduce((s, r) => s + r.W, 0);
  const Wp = plate.use ? 2 * plate.Bp * plate.Lp * plate.t * plate.gp : 0;
  const Wsum = rows.reduce((s, r) => s + r.Wd, 0) + Wp;
  const Msum = rows.reduce((s, r) => s + r.M, 0);
  const e = Msum / Wsum, ae = Math.abs(e);

  /* ---- 접지면 ---- */
  const Bg = plate.use ? Math.max(plate.Bp, crane.B) : crane.B;
  const Lg = plate.use ? Math.max(plate.Lp, crane.L) : crane.L;
  const A = 2 * Bg * Lg;
  const qavg = Wsum / A;
  const full = ae <= Lg / 6 + 1e-9;
  const qfront = qavg * (1 + 6 * e / Lg);
  const qrear = qavg * (1 - 6 * e / Lg);
  let qmax, qmin, xc = Lg;
  if (full) {
    qmax = Math.max(qfront, qrear); qmin = Math.min(qfront, qrear);
  } else {
    const x = Lg / 2 - ae;
    if (x <= 0) { qmax = Infinity; qmin = 0; xc = 0; }
    else { qmax = Wsum / (3 * Bg * x); qmin = 0; xc = 3 * x; }
  }

  /* ---- 검토 1·2 : 1층 지지력 ---- */
  const L1 = soil.layers[0];
  const Df = cond.Df;
  const q0 = sigmaV(Df, soil);
  const g1 = gammaEff(L1.gamma, soil.gwt - Df, Bg);
  const mu = meyerhof({ c: L1.c, phi: L1.phi, gam: g1, q: q0, Df, B: Bg, L: Lg });
  const qa = mu.qu / cond.FsB;
  const u1 = qmax / qa;

  const Le = Math.max(Lg - 2 * ae, 0.01);
  const mu2 = meyerhof({ c: L1.c, phi: L1.phi, gam: g1, q: q0, Df, B: Bg, L: Le });
  const qeff = (Wsum / 2) / (Bg * Le);
  const FS2 = mu2.qu / qeff;
  const u2 = cond.FsB / FS2;

  /* ---- 검토 3 : 하부 지층 (2:1 분산) ---- */
  const lowers = [];
  let z = 0;
  for (let j = 1; j < soil.layers.length; j++) {
    z += soil.layers[j - 1].H;
    const ly = soil.layers[j];
    const overlap = (Bg + z) >= crane.G;
    const Bv = overlap ? crane.G + Bg + z : Bg + z;
    const Qv = overlap ? Wsum : Wsum / 2;
    const Lv = Le + z;
    const qv = Qv / (Bv * Lv);
    const sv = sigmaV(z, soil);
    const gj = gammaEff(ly.gamma, soil.gwt - z, Math.min(Bv, Lv));
    const m = meyerhof({ c: ly.c, phi: ly.phi, gam: gj, q: sv, Df: z, B: Bv, L: Lv });
    const qnet = m.qu - sv;
    lowers.push({ idx: j, name: ly.name, z, overlap, Bv, Lv, Qv, qv, sv, qu: m.qu, qnet,
                  FS: qnet / qv, Nc: m.Nc, Nq: m.Nq, Ng: m.Ng });
  }
  const FS3 = lowers.length ? Math.min(...lowers.map(x => x.FS)) : null;
  const u3 = lowers.length ? cond.FsB / FS3 : null;

  /* ---- 검토 4 : 전도 (전방, 궤도 전단 지점) ---- */
  const a0 = crane.L / 2;
  let Mr = 0, Mo = 0;
  rows.forEach(r => {
    const arm = a0 - r.y;
    r.arm = arm;
    if (arm >= 0) { r.Mres = r.W * arm; r.Mover = 0; Mr += r.Mres; }
    else { r.Mres = 0; r.Mover = r.Wd * (-arm); Mo += r.Mover; }
  });
  const FSt = Mo > 0 ? Mr / Mo : Infinity;
  const u4 = Mo > 0 ? cond.FsT / FSt : 0;

  /* ---- 검토 5 : 편심 ---- */
  const u5 = ae / (Lg / 6);

  const checks = [
    { id: 1, name: L('최대 접지압', '最大接地圧'), short: 'q_max ≤ q_a', value: qmax, unit: 'kPa', rel: '≤', limit: qa, u: u1,
      note: 'q_a = q_u / Fs = ' + (mu.qu / cond.FsB).toFixed(1) + ' kPa' },
    { id: 2, name: L('지지력 안전율 (유효면적법)', '支持力安全率（有効面積法）'), short: 'FS ≥ Fs', value: FS2, unit: '', rel: '≥', limit: cond.FsB, u: u2,
      note: 'q_u(B×L′) / q_eff, L′ = L − 2e' },
    { id: 3, name: L('하부 지층 안전율', '下部地層の安全率'),
      short: lowers.length ? L('2:1 분산 · 순지지력', '2:1分散・純支持力') : L('하부 지층 없음', '下部地層なし'),
      value: FS3, unit: '', rel: '≥', limit: cond.FsB, u: u3, note: L('2:1 분산 가상기초 · 최소값', '2:1分散仮想基礎・最小値') },
    { id: 4, name: L('전도 안전율', '転倒安全率'), short: 'M_r / M_o ≥ Fs', value: FSt, unit: '', rel: '≥', limit: cond.FsT, u: u4,
      note: L('전방 작업, 궤도 전단 지점', '前方作業、履帯前端を支点') },
    { id: 5, name: L('편심 한계', '偏心限界'), short: 'e ≤ L/6', value: ae, unit: 'm', rel: '≤', limit: Lg / 6, u: u5,
      note: L('접지면 전체 접지 유지', '接地面の全面接地を維持') }
  ];
  checks.forEach(c => { c.st = stateOf(c.u); });
  const valid = checks.filter(c => c.u !== null);
  const umax = Math.max(...valid.map(c => c.u));
  const worst = valid.reduce((a, b) => (b.u > a.u ? b : a));
  const status = stateOf(umax);

  return { ok: true, issues, soil, crane, loads, plate, cond, rows, W0, Wp, Wsum, Msum, e, ae,
           Bg, Lg, A, qavg, qfront, qrear, qmax, qmin, full, xc, L1, Df, q0, g1, mu, qa, u1,
           Le, mu2, qeff, FS2, u2, lowers, FS3, u3, a0, Mr, Mo, FSt, u4, u5, checks, umax, worst, status };
}

/* ---- 표기 도우미 ---- */
function fmt(v, d = 2) {
  if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) return '–';
  if (v === Infinity) return '∞';
  if (v === -Infinity) return '−∞';
  const s = v.toLocaleString(LANG === 'ja' ? 'ja-JP' : 'ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
  return s.replace('-', '−');
}
const sgn = (v, d = 2) => (v > 0 ? '+' : '') + fmt(v, d);


/* =====================================================================
   2. 도해 모듈 (SVG 문자열 생성)
   - 팔레트를 인자로 받아 화면용(CSS 변수)과 출력용(고정색)을 동일 코드로 생성
   ===================================================================== */
const fontStack = () => (LANG === 'ja'
  ? "'IBM Plex Sans JP','IBM Plex Sans KR','Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif"
  : "'IBM Plex Sans KR','IBM Plex Sans JP','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif");
const PAL_SCREEN = {
  ink: 'var(--ink)', mute: 'var(--mute)', line: 'var(--line)', paper: 'var(--panel)', accent: 'var(--accent)',
  ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)', crane: 'var(--crane)', craneDk: 'var(--crane-dk)',
  steel: 'var(--steel)', steelDk: 'var(--steel-dk)', trk: 'var(--trk)', trkIn: 'var(--trk-in)', glass: 'var(--glass)',
  water: 'var(--water)', soil: ['var(--soil-1)', 'var(--soil-2)', 'var(--soil-3)', 'var(--soil-4)']
};
const PAL_PAPER = {
  ink: '#16252E', mute: '#5B6C77', line: '#B9C4CA', paper: '#FFFFFF', accent: '#1B5E8A',
  ok: '#1F7A4D', warn: '#8F5E00', bad: '#B3261E', crane: '#EDB100', craneDk: '#9A7300',
  steel: '#8B98A1', steelDk: '#4E5B64', trk: '#33404A', trkIn: '#4B5A66', glass: '#BFD9EA',
  water: '#2F7FB5', soil: ['#D8CBB0', '#B9C2B0', '#C9B79F', '#A9AFB4']
};

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const sty = (fill, stroke, sw, extra) =>
  'style="fill:' + (fill || 'none') + ';stroke:' + (stroke || 'none') + ';stroke-width:' + (sw || 0) + (extra ? ';' + extra : '') + '"';
const T = (x, y, s, o = {}) =>
  '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="' + (o.a || 'start') +
  '" style="fill:' + o.fill + ';font-size:' + (o.size || 12) + 'px;font-weight:' + (o.w || 400) +
  ';font-family:' + fontStack() + '">' + esc(s) + '</text>';
const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
const f1 = v => v.toFixed(1);
function niceStep(max, n) {
  const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}

/* ---------- 측면도 : 크롤러형 항타기 + 지층 + 하중 작용선 ---------- */
function svgElevation(R, C, o = {}) {
  const W = 760, H = 404, pad = 34;
  const { crane, rows, soil, plate } = R;
  const Lt = crane.L, Lg = R.Lg;
  const act = rows.map((r, i) => ({ ...r, i })).filter(r => r.W > 0);
  const ys = act.map(r => r.y);
  const xmin = Math.min(-Lg / 2, -Lt / 2, ...ys) - 0.9, xmax = Math.max(Lg / 2, Lt / 2, ...ys) + 0.9;
  const sx = Math.min(95, (W - 2 * pad) / (xmax - xmin));
  const offs = pad + ((W - 2 * pad) - (xmax - xmin) * sx) / 2;
  const X = y => offs + (y - xmin) * sx;

  const gY = 284, plT = plate.use ? 8 : 0, tb = gY - plT, tt = tb - 40, ut = tt - 36;
  const front = ys.length ? Math.max(...ys) : Lt / 2 + 1;
  const rear = ys.length ? Math.min(...ys) : -Lt / 2;
  const dynRows = act.filter(r => r.dyn);
  const hy = dynRows.length ? dynRows.reduce((s, r) => s + r.y, 0) / dynRows.length : front;
  const s = [];
  s.push('<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + L('항타기 측면도', '杭打機 側面図') + '">');

  /* 지층 */
  const sumH = soil.layers.reduce((a, l) => a + l.H, 0);
  const ds = Math.min(sx, 96 / sumH);
  let top = gY;
  soil.layers.forEach((ly, i) => {
    const h = ly.H * ds;
    s.push('<rect x="0" y="' + f1(top) + '" width="' + W + '" height="' + f1(h) + '" ' + sty(C.soil[i % 4], C.line, 1) + '/>');
    const lab = CIRC[i] + ' ' + trunc(shortName(ly.name), 9) + ' · ' + ly.H.toFixed(1) + 'm · c' + ly.c + ' φ' + ly.phi + '°';
    s.push(T(10, top + Math.min(h / 2 + 4, 26), lab, { fill: C.ink, size: 12 }));
    top += h;
  });
  const secH = top - gY;
  if (soil.gwt * ds <= secH + 2) {
    const yw = gY + soil.gwt * ds;
    s.push('<line x1="0" y1="' + f1(yw) + '" x2="' + W + '" y2="' + f1(yw) + '" style="stroke:' + C.water + ';stroke-width:1.6;stroke-dasharray:7 4"/>');
    s.push('<polygon points="' + (W / 2 - 100) + ',' + f1(yw - 9) + ' ' + (W / 2 - 108) + ',' + f1(yw - 1) + ' ' + (W / 2 - 92) + ',' + f1(yw - 1) + '" ' + sty(C.water, 'none', 0) + '/>');
    s.push(T(W / 2 - 84, yw - 5, 'GWL GL-' + soil.gwt.toFixed(1) + ' m', { fill: C.water, size: 11, w: 600 }));
  }
  s.push('<line x1="0" y1="' + gY + '" x2="' + W + '" y2="' + gY + '" style="stroke:' + C.ink + ';stroke-width:1.6"/>');

  /* 깔판 */
  if (plate.use) {
    s.push('<rect x="' + f1(X(-Lg / 2)) + '" y="' + (gY - plT) + '" width="' + f1(Lg * sx) + '" height="' + plT + '" ' + sty(C.steel, C.steelDk, 1.2) + '/>');
  }
  /* 카운터웨이트 */
  const cwY = rear < -0.5 ? rear : -Lt / 2 + 0.2;
  const cwW = Math.max(50, 1.3 * sx);
  s.push('<rect x="' + f1(X(cwY) - cwW / 2) + '" y="' + f1(ut - 8) + '" width="' + f1(cwW) + '" height="46" rx="3" ' + sty(C.steelDk, C.ink, 1.2) + '/>');
  s.push('<line x1="' + f1(X(cwY) - cwW / 2 + 8) + '" y1="' + f1(ut + 6) + '" x2="' + f1(X(cwY) + cwW / 2 - 8) + '" y2="' + f1(ut + 6) + '" style="stroke:' + C.steel + ';stroke-width:1.2"/>');
  s.push('<line x1="' + f1(X(cwY) - cwW / 2 + 8) + '" y1="' + f1(ut + 18) + '" x2="' + f1(X(cwY) + cwW / 2 - 8) + '" y2="' + f1(ut + 18) + '" style="stroke:' + C.steel + ';stroke-width:1.2"/>');
  /* 궤도 */
  s.push('<rect x="' + f1(X(-Lt / 2)) + '" y="' + f1(tt) + '" width="' + f1(Lt * sx) + '" height="40" rx="20" ' + sty(C.trk, C.ink, 1.2) + '/>');
  s.push('<rect x="' + f1(X(-Lt / 2) + 5) + '" y="' + f1(tt + 5) + '" width="' + f1(Lt * sx - 10) + '" height="30" rx="15" ' + sty(C.trkIn, 'none', 0) + '/>');
  const nR = Math.max(2, Math.round(Lt * sx / 70));
  for (let k = 0; k <= nR; k++) {
    const cx = X(-Lt / 2) + 20 + k * (Lt * sx - 40) / nR;
    const big = (k === 0 || k === nR);
    s.push('<circle cx="' + f1(cx) + '" cy="' + f1(tt + 20) + '" r="' + (big ? 11 : 5) + '" ' + sty(big ? C.trk : C.steel, C.ink, 1) + '/>');
  }
  /* 상부선회체 */
  const bx1 = X(-Lt / 2 + 0.5), bx2 = X(Lt / 2 - 0.5);
  s.push('<rect x="' + f1(bx1) + '" y="' + f1(ut) + '" width="' + f1(bx2 - bx1) + '" height="36" rx="3" ' + sty(C.crane, C.craneDk, 1.4) + '/>');
  s.push('<rect x="' + f1(X(-Lt / 2 + 0.7)) + '" y="' + f1(ut - 24) + '" width="' + f1(Math.max(40, (Lt - 3) * sx)) + '" height="24" rx="3" ' + sty(C.crane, C.craneDk, 1.4) + '/>');
  s.push('<rect x="' + f1(X(Lt / 2 - 1.9)) + '" y="' + f1(ut - 30) + '" width="' + f1(1.2 * sx) + '" height="30" rx="3" ' + sty(C.crane, C.craneDk, 1.4) + '/>');
  s.push('<rect x="' + f1(X(Lt / 2 - 1.75)) + '" y="' + f1(ut - 25) + '" width="' + f1(0.9 * sx) + '" height="15" rx="2" ' + sty(C.glass, C.craneDk, 1) + '/>');
  /* 붐 · 리더 · 해머 · 말뚝 */
  const lx = X(front) - 9;
  const px = X(Lt / 2 - 1.2), py = ut + 10;
  s.push('<line x1="' + f1(px) + '" y1="' + f1(py) + '" x2="' + f1(lx) + '" y2="62" style="stroke:' + C.craneDk + ';stroke-width:11;stroke-linecap:round"/>');
  s.push('<line x1="' + f1(px) + '" y1="' + f1(py) + '" x2="' + f1(lx) + '" y2="62" style="stroke:' + C.crane + ';stroke-width:6.5;stroke-linecap:round"/>');
  s.push('<line x1="' + f1(X(Lt / 2 - 0.5)) + '" y1="' + f1(tt - 4) + '" x2="' + f1(lx) + '" y2="' + (gY - 26) + '" style="stroke:' + C.steelDk + ';stroke-width:4;stroke-linecap:round"/>');
  s.push('<rect x="' + f1(lx - 6) + '" y="58" width="12" height="' + (gY - 58 - 12) + '" ' + sty(C.steel, C.steelDk, 1.4) + '/>');
  for (let yy = 72; yy < gY - 24; yy += 14) {
    s.push('<line x1="' + f1(lx - 6) + '" y1="' + yy + '" x2="' + f1(lx + 6) + '" y2="' + yy + '" style="stroke:' + C.steelDk + ';stroke-width:1"/>');
  }
  const pxx = X(front) + 8;
  s.push('<rect x="' + f1(pxx - 5) + '" y="108" width="10" height="' + (gY + 46 - 108) + '" ' + sty(C.paper, C.steelDk, 1.4, 'opacity:.92') + '/>');
  s.push('<rect x="' + f1(X(hy) - 15 + 8) + '" y="76" width="30" height="34" rx="3" ' + sty(C.steelDk, C.ink, 1.4) + '/>');
  s.push('<rect x="' + f1(X(hy) - 9 + 8) + '" y="110" width="18" height="6" ' + sty(C.steel, C.ink, 1) + '/>');

  /* 중심선 · 하중 작용선 · 합력 */
  s.push('<line x1="' + f1(X(0)) + '" y1="' + f1(ut - 40) + '" x2="' + f1(X(0)) + '" y2="' + gY + '" style="stroke:' + C.mute + ';stroke-width:1;stroke-dasharray:9 3 2 3"/>');
  s.push(T(X(0) + 4, ut - 42, 'C.L.', { fill: C.mute, size: 11 }));
  const sorted = [...act].sort((a, b) => a.y - b.y);
  sorted.forEach((r, k) => {
    const cx = X(r.y), cy = 16 + (k % 2) * 21;
    s.push('<line x1="' + f1(cx) + '" y1="' + (cy + 9) + '" x2="' + f1(cx) + '" y2="' + gY + '" style="stroke:' + C.accent + ';stroke-width:1.1;stroke-dasharray:3 3;opacity:.7"/>');
    s.push('<polygon points="' + f1(cx) + ',' + (cy + 24) + ' ' + f1(cx - 4) + ',' + (cy + 15) + ' ' + f1(cx + 4) + ',' + (cy + 15) + '" ' + sty(C.accent, 'none', 0) + '/>');
    s.push('<circle cx="' + f1(cx) + '" cy="' + cy + '" r="9" ' + sty(C.accent, 'none', 0) + '/>');
    s.push(T(cx, cy + 4.2, String(r.i + 1), { fill: C.paper, size: 11.5, w: 700, a: 'middle' }));
  });
  const rx = X(R.e);
  s.push('<line x1="' + f1(rx) + '" y1="52" x2="' + f1(rx) + '" y2="' + gY + '" style="stroke:' + C.bad + ';stroke-width:2"/>');
  s.push('<polygon points="' + f1(rx) + ',' + gY + ' ' + f1(rx - 6) + ',' + (gY - 11) + ' ' + f1(rx + 6) + ',' + (gY - 11) + '" ' + sty(C.bad, 'none', 0) + '/>');
  s.push(T(rx + 8, 50, 'R  ΣW=' + fmt(R.Wsum, 0) + ' kN · e=' + sgn(R.e, 2) + ' m', { fill: C.bad, size: 12, w: 700 }));

  /* 축척 */
  s.push('<line x1="' + pad + '" y1="' + (H - 14) + '" x2="' + f1(pad + 2 * sx) + '" y2="' + (H - 14) + '" style="stroke:' + C.ink + ';stroke-width:2"/>');
  s.push('<line x1="' + pad + '" y1="' + (H - 19) + '" x2="' + pad + '" y2="' + (H - 9) + '" style="stroke:' + C.ink + ';stroke-width:1.5"/>');
  s.push('<line x1="' + f1(pad + 2 * sx) + '" y1="' + (H - 19) + '" x2="' + f1(pad + 2 * sx) + '" y2="' + (H - 9) + '" style="stroke:' + C.ink + ';stroke-width:1.5"/>');
  s.push(T(pad + 2 * sx + 8, H - 10, L('2 m (수평 축척)', '2 m（水平縮尺）'), { fill: C.mute, size: 11 }));
  s.push(T(W - 10, H - 10, L('작업 방향 →  ※ 수평 위치는 입력값 축척, 높이·지층 깊이는 개략', '作業方向 →  ※ 水平位置は入力値の縮尺、高さ・地層深さは概略'), { fill: C.mute, size: 11, a: 'end' }));
  s.push('</svg>');
  return s.join('');
}

/* ---------- 접지압 분포 (궤도 길이 방향) ---------- */
function svgPressure(R, C) {
  const W = 420, H = 280, ml = 50, mr = 16, mt = 30, mb = 56;
  const pw = W - ml - mr, ph = H - mt - mb;
  const Lg = R.Lg;
  const xs = y => ml + (y + Lg / 2) / Lg * pw;
  const qmaxShow = isFinite(R.qmax) ? R.qmax : R.qa * 2;
  const pmax = Math.max(qmaxShow, R.qa, R.qavg) * 1.2;
  const ys = p => mt + ph - p / pmax * ph;
  const s = [];
  s.push('<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + L('접지압 분포', '接地圧分布') + '">');
  const st = niceStep(pmax, 4);
  for (let v = 0; v <= pmax; v += st) {
    s.push('<line x1="' + ml + '" y1="' + f1(ys(v)) + '" x2="' + (W - mr) + '" y2="' + f1(ys(v)) + '" style="stroke:' + C.line + ';stroke-width:1"/>');
    s.push(T(ml - 6, ys(v) + 4, String(Math.round(v)), { fill: C.mute, size: 11, a: 'end' }));
  }
  s.push(T(ml - 6, mt - 12, 'kPa', { fill: C.mute, size: 11, a: 'end' }));
  /* 분포 */
  let pts;
  if (R.full) {
    pts = [[xs(-Lg / 2), ys(0)], [xs(-Lg / 2), ys(R.qrear)], [xs(Lg / 2), ys(R.qfront)], [xs(Lg / 2), ys(0)]];
  } else {
    const sign = R.e >= 0 ? 1 : -1;
    const q = isFinite(R.qmax) ? R.qmax : qmaxShow;
    const xend = sign > 0 ? Lg / 2 : -Lg / 2, xstart = xend - sign * Math.min(R.xc, Lg);
    pts = [[xs(xstart), ys(0)], [xs(xend), ys(q)], [xs(xend), ys(0)]];
  }
  s.push('<polygon points="' + pts.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ') + '" style="fill:' + C.accent + ';fill-opacity:.32;stroke:' + C.accent + ';stroke-width:2"/>');
  /* 평균·허용 */
  s.push('<line x1="' + ml + '" y1="' + f1(ys(R.qavg)) + '" x2="' + (W - mr) + '" y2="' + f1(ys(R.qavg)) + '" style="stroke:' + C.mute + ';stroke-width:1.2;stroke-dasharray:2 4"/>');
  s.push(T(W - mr - 2, ys(R.qavg) + 14, L('평균 ', '平均 ') + fmt(R.qavg, 1), { fill: C.mute, size: 11, a: 'end' }));
  s.push('<line x1="' + ml + '" y1="' + f1(ys(R.qa)) + '" x2="' + (W - mr) + '" y2="' + f1(ys(R.qa)) + '" style="stroke:' + C.bad + ';stroke-width:1.8;stroke-dasharray:7 4"/>');
  s.push(T(ml + 4, ys(R.qa) - 5, L('허용지지력 q_a = ', '許容支持力 q_a = ') + fmt(R.qa, 1) + ' kPa', { fill: C.bad, size: 11.5, w: 700 }));
  /* 단부 값 */
  const lab = (x, v, a) => T(x, ys(v) - 6, fmt(v, 1), { fill: C.ink, size: 11.5, w: 700, a });
  if (R.full) { s.push(lab(xs(-Lg / 2) + 3, R.qrear, 'start')); s.push(lab(xs(Lg / 2) - 3, R.qfront, 'end')); }
  else { s.push(lab(xs(R.e >= 0 ? Lg / 2 : -Lg / 2) + (R.e >= 0 ? -3 : 3), isFinite(R.qmax) ? R.qmax : qmaxShow, R.e >= 0 ? 'end' : 'start')); }
  /* 축 */
  s.push('<line x1="' + ml + '" y1="' + f1(ys(0)) + '" x2="' + (W - mr) + '" y2="' + f1(ys(0)) + '" style="stroke:' + C.ink + ';stroke-width:1.6"/>');
  [-Lg / 2, 0, Lg / 2].forEach(v => {
    s.push('<line x1="' + f1(xs(v)) + '" y1="' + f1(ys(0)) + '" x2="' + f1(xs(v)) + '" y2="' + f1(ys(0) + 5) + '" style="stroke:' + C.ink + ';stroke-width:1.2"/>');
    s.push(T(xs(v), ys(0) + 18, v === 0 ? '0' : sgn(v, 2), { fill: C.mute, size: 11, a: 'middle' }));
  });
  s.push('<polygon points="' + f1(xs(R.e)) + ',' + f1(ys(0) + 1) + ' ' + f1(xs(R.e) - 5) + ',' + f1(ys(0) + 11) + ' ' + f1(xs(R.e) + 5) + ',' + f1(ys(0) + 11) + '" ' + sty(C.bad, 'none', 0) + '/>');
  s.push(T(W / 2, H - 8, L('궤도 길이 방향 위치 y (m) · 합력 ▲ e = ', '履帯長手方向の位置 y (m) ・ 合力 ▲ e = ') + sgn(R.e, 2) + L(' m · 접지길이 ', ' m ・ 接地長 ') + fmt(Lg, 2) + ' m', { fill: C.mute, size: 11, a: 'middle' }));
  s.push('</svg>');
  return s.join('');
}

/* ---------- 평면도 : 궤도 · 깔판 · 치수 ---------- */
function svgPlan(R, C) {
  const W = 420, H = 280;
  const { crane, plate } = R;
  const Lg = R.Lg, Bg = R.Bg, Lc = crane.L, B = crane.B, G = crane.G;
  const totW = G + Math.max(Bg, B);
  const sp = Math.min((W - 130) / Math.max(Lg, Lc), (H - 96) / totW);
  const cx = W / 2 + 6, cy = 126;
  const s = [];
  s.push('<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + L('평면도', '平面図') + '">');
  [-1, 1].forEach(k => {
    const yc = cy + k * G / 2 * sp;
    if (plate.use) {
      s.push('<rect x="' + f1(cx - Lg / 2 * sp) + '" y="' + f1(yc - Bg / 2 * sp) + '" width="' + f1(Lg * sp) + '" height="' + f1(Bg * sp) + '" ' + sty(C.steel, C.steelDk, 1.4, 'fill-opacity:.55;stroke-dasharray:6 3') + '/>');
    }
  });
  /* 상부 */
  s.push('<rect x="' + f1(cx - 0.42 * Lc * sp) + '" y="' + f1(cy - (G / 2 - B / 2) * sp) + '" width="' + f1(0.84 * Lc * sp) + '" height="' + f1((G - B) * sp) + '" rx="4" ' + sty(C.crane, C.craneDk, 1.4) + '/>');
  [-1, 1].forEach(k => {
    const yc = cy + k * G / 2 * sp;
    s.push('<rect x="' + f1(cx - Lc / 2 * sp) + '" y="' + f1(yc - B / 2 * sp) + '" width="' + f1(Lc * sp) + '" height="' + f1(B * sp) + '" rx="' + f1(Math.min(B * sp / 2, 12)) + '" ' + sty(C.trk, C.ink, 1.2) + '/>');
    s.push('<rect x="' + f1(cx - Lc / 2 * sp + 6) + '" y="' + f1(yc - B / 2 * sp + 4) + '" width="' + f1(Lc * sp - 12) + '" height="' + f1(Math.max(2, B * sp - 8)) + '" rx="4" ' + sty(C.trkIn, 'none', 0) + '/>');
  });
  s.push('<line x1="' + f1(cx) + '" y1="14" x2="' + f1(cx) + '" y2="' + (H - 40) + '" style="stroke:' + C.mute + ';stroke-width:1;stroke-dasharray:9 3 2 3"/>');
  /* 합력 위치 */
  s.push('<circle cx="' + f1(cx + R.e * sp) + '" cy="' + f1(cy) + '" r="5.5" ' + sty(C.bad, C.paper, 1.5) + '/>');
  s.push(T(cx + R.e * sp + 9, cy - 8, 'R', { fill: C.bad, size: 12, w: 700 }));
  /* 작업 방향 */
  s.push('<line x1="' + (W - 118) + '" y1="22" x2="' + (W - 22) + '" y2="22" style="stroke:' + C.ink + ';stroke-width:1.6"/>');
  s.push('<polygon points="' + (W - 14) + ',22 ' + (W - 25) + ',17 ' + (W - 25) + ',27" ' + sty(C.ink, 'none', 0) + '/>');
  s.push(T(W - 118, 14, L('작업 방향 (전방)', '作業方向（前方）'), { fill: C.ink, size: 11.5, w: 600 }));
  /* 치수 : Lc */
  const yb = cy + G / 2 * sp + Math.max(Bg, B) / 2 * sp + 16;
  const dimH = (x1, x2, y, label) => {
    s.push('<line x1="' + f1(x1) + '" y1="' + f1(y) + '" x2="' + f1(x2) + '" y2="' + f1(y) + '" style="stroke:' + C.ink + ';stroke-width:1.1"/>');
    [x1, x2].forEach(x => s.push('<line x1="' + f1(x) + '" y1="' + f1(y - 5) + '" x2="' + f1(x) + '" y2="' + f1(y + 5) + '" style="stroke:' + C.ink + ';stroke-width:1.1"/>'));
    s.push(T((x1 + x2) / 2, y + 16, label, { fill: C.ink, size: 11.5, a: 'middle', w: 600 }));
  };
  const dimV = (y1, y2, x, label, anchor) => {
    s.push('<line x1="' + f1(x) + '" y1="' + f1(y1) + '" x2="' + f1(x) + '" y2="' + f1(y2) + '" style="stroke:' + C.ink + ';stroke-width:1.1"/>');
    [y1, y2].forEach(y => s.push('<line x1="' + f1(x - 5) + '" y1="' + f1(y) + '" x2="' + f1(x + 5) + '" y2="' + f1(y) + '" style="stroke:' + C.ink + ';stroke-width:1.1"/>'));
    s.push(T(anchor === 'end' ? x - 8 : x + 8, (y1 + y2) / 2 + 4, label, { fill: C.ink, size: 11.5, a: anchor, w: 600 }));
  };
  dimH(cx - Lc / 2 * sp, cx + Lc / 2 * sp, yb, 'L = ' + fmt(Lc, 2) + ' m');
  const xr = cx + Math.max(Lg, Lc) / 2 * sp + 14;
  dimV(cy + G / 2 * sp - B / 2 * sp, cy + G / 2 * sp + B / 2 * sp, xr, 'B = ' + fmt(B, 2), 'start');
  const xl = cx - Math.max(Lg, Lc) / 2 * sp - 14;
  dimV(cy - G / 2 * sp, cy + G / 2 * sp, xl, 'G = ' + fmt(G, 2), 'end');
  if (plate.use) {
    s.push(T(W / 2, H - 8, L('깔판 ', '敷板 ') + fmt(Bg, 2) + ' × ' + fmt(Lg, 2) + L(' m (궤도당 1매) · t = ', ' m（履帯1本につき1枚）・ t = ') + Math.round(plate.t * 1000) + ' mm', { fill: C.mute, size: 11, a: 'middle' }));
  } else {
    s.push(T(W / 2, H - 8, L('깔판 미설치 (궤도 직접 접지)', '敷板なし（履帯が直接接地）'), { fill: C.mute, size: 11, a: 'middle' }));
  }
  s.push('</svg>');
  return s.join('');
}

const PAGE_W = 794, PAGE_H = 1123;

function tbl(head, rows, o = {}) {
  const num = o.num || [];
  const cell = (v, i, tag) => '<' + tag + (num.includes(i) ? ' class="n"' : '') + '>' + v + '</' + tag + '>';
  return '<table class="rt' + (o.cls ? ' ' + o.cls : '') + '">' +
    (head ? '<thead><tr>' + head.map((h, i) => cell(h, i, 'th')).join('') + '</tr></thead>' : '') +
    '<tbody>' + rows.map(r => '<tr>' + r.map((v, i) => cell(v, i, 'td')).join('') + '</tr>').join('') + '</tbody></table>';
}
const pill = st => '<span class="pl pl-' + st + '">' + STLABEL[st] + '</span>';

function checkValueText(c) {
  if (c.u === null) return '–';
  return fmt(c.value, c.id === 1 ? 1 : 2) + (c.unit ? ' ' + c.unit : '');
}
function checkLimitText(c) {
  return c.rel + ' ' + fmt(c.limit, c.id === 1 ? 1 : 2) + (c.unit ? ' ' + c.unit : '');
}

function opinionText(R) {
  const ng = R.checks.filter(c => c.st === 'NG'), wr = R.checks.filter(c => c.st === 'WARN');
  const sep = L(', ', '、');

    return [L('검토 결과 전 항목이 허용 기준을 만족함.', '検討の結果、全項目が許容基準を満足する。'),
            L('지반 상태(함수비·지하수위 등)가 조사 결과와 다를 경우 재검토할 것.', '地盤状態（含水比・地下水位等）が調査結果と異なる場合は再検討すること。')];
  }

    return [L('허용 기준은 만족하나 사용률 90% 초과 항목이 있음: ', '許容基準は満足するが、使用率90%超の項目がある：') + wr.map(c => c.name).join(sep) + L('.', '。'),

async function ensureFonts(sample) {
  if (!document.fonts || !document.fonts.load) return;
  const fam = LANG === 'ja' ? 'IBM Plex Sans JP' : 'IBM Plex Sans KR';
  try {
    await Promise.all([400, 500, 600, 700].map(w => document.fonts.load(w + ' 12px "' + fam + '"', sample)));
    await Promise.all([400, 500].map(w => document.fonts.load(w + ' 12px "IBM Plex Mono"', '0123456789.,+-')));
    await document.fonts.ready;
  } catch (e) { /* 폰트 로드 실패 시 대체 글꼴 사용 */ }
}

/* 블록을 A4 쪽에 순서대로 채우고 넘치면 다음 쪽으로 */
async function buildReportPages(S, R, host) {
  host.innerHTML = '';
  const blocks = reportBlocks(S, R);
  await ensureFonts(blocks.join('').replace(/<[^>]+>/g, ' ') + '0123456789' + L('가나다라마바사아자차카타파하', ''));
  const pages = [];
  const newPage = () => {
    const p = document.createElement('section');
    p.className = 'rpt-page';
    p.innerHTML = '<header class="rpt-h"><span>' + L('항타기 지지력 검토서', '杭打機 支持力検討書') + '</span><span></span></header><div class="rpt-b"></div><footer class="rpt-f"><span></span><span></span></footer>';
    host.appendChild(p);
    pages.push(p);
    return p;
  };
  let cur = newPage();
  for (const html of blocks) {
    const el = document.createElement('div');
    el.innerHTML = html;
    const blk = el.firstElementChild;
    const body = cur.querySelector('.rpt-b');
    body.appendChild(blk);
    if (body.scrollHeight > body.clientHeight + 1 && body.children.length > 1) {
      body.removeChild(blk);
      cur = newPage();
      cur.querySelector('.rpt-b').appendChild(blk);
    }
  }
  pages.forEach((p, i) => {
    p.querySelector('.rpt-h span:last-child').textContent = S.proj.name || '';
    const fs = p.querySelectorAll('.rpt-f span');
    fs[0].textContent = L('검토일 ', '検討日 ') + (S.proj.date || '');
    fs[1].textContent = (i + 1) + ' / ' + pages.length;
  });
  return pages;
}

  });

  add(gT, L('전도 안전율 FS', '転倒安全率 FS'), R.FSt, '', 'Mr / Mo');

function applyStatic() {
  document.documentElement.lang = LANG;

function translateSampleTexts(from, to) {
  const a = SAMPLE_NAMES[from], b = SAMPLE_NAMES[to];
  if (S.proj.name === a.proj) S.proj.name = b.proj;
  if (S.crane.model === a.crane) S.crane.model = b.crane;
  S.soil.layers.forEach((l, i) => {
    if (l.name === a.newLayer) l.name = b.newLayer;
    else if (a.layers[i] !== undefined && l.name === a.layers[i]) l.name = b.layers[i];
  });
  S.loads.forEach((l, i) => {
    if (l.name === a.newLoad) l.name = b.newLoad;
    else if (a.loads[i] !== undefined && l.name === a.loads[i]) l.name = b.loads[i];
  });
}
function switchLang(l) {
  if (l === LANG) return;
  translateSampleTexts(LANG, l);
  setLang(l);
  try { localStorage.setItem(LS_LANG, l); } catch (e) { /* 무시 */ }

  applyStatic();
  renderInputs();
  update();
}

function setPath(path, val) {
  const k = path.split('.');
  let o = S;
  for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
  o[k[k.length - 1]] = val;
}
function onField(e) {
  const t = e.target;
  if (!t.dataset || !t.dataset.k) return;
  let v;
  if (t.type === 'checkbox') v = t.checked;
  else if (t.type === 'number') {
    v = t.value === '' ? NaN : parseFloat(t.value);
    if (t.dataset.sc) v = v / parseFloat(t.dataset.sc);
  } else v = t.value;
  setPath(t.dataset.k, v);
  schedule();
}
let resetArmed = 0;
function onClick(e) {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, i = parseInt(b.dataset.i, 10);
  if (act === 'add-layer' && S.soil.layers.length < 6) {
    S.soil.layers.push({ name: SAMPLE_NAMES[LANG].newLayer, H: 3, gamma: 18, c: 0, phi: 30, N: 10 }); renderInputs(); schedule();
  } else if (act === 'del-layer' && S.soil.layers.length > 1) {
    S.soil.layers.splice(i, 1); renderInputs(); schedule();
  } else if (act === 'add-load' && S.loads.length < 12) {
    S.loads.push({ name: SAMPLE_NAMES[LANG].newLoad, W: 0, y: 0, dyn: false }); renderInputs(); schedule();
  } else if (act === 'del-load' && S.loads.length > 1) {
    S.loads.splice(i, 1); renderInputs(); schedule();
  } else if (act === 'reset') {
    if (!resetArmed) {
      resetArmed = setTimeout(() => { resetArmed = 0; const r = $('btnReset'); if (r) r.textContent = L('샘플값으로 되돌리기', 'サンプル値に戻す'); }, 3500);
      b.textContent = L('입력값이 모두 사라집니다. 한 번 더 누르면 되돌립니다.', '入力値がすべて消えます。もう一度押すと元に戻します。');
    } else {
      clearTimeout(resetArmed); resetArmed = 0; S = makeSample(); renderInputs(); schedule(); toast(L('샘플값으로 되돌렸습니다.', 'サンプル値に戻しました。'));
    }
  }
}

  let low = '';
  if (R.lowers.length) {
    low = '<div class="tw"><h4>' + L('하부 지층 (2:1 분산 · 순지지력 기준)', '下部地層（2:1分散・純支持力基準）') + '</h4><table><thead><tr><th>' + L('지층', '地層') + '</th><th>z (m)</th><th>B<sub>v</sub> × L<sub>v</sub> (m)</th><th>q<sub>v</sub></th><th>σ′<sub>v</sub></th><th>q<sub>u</sub></th><th>q<sub>net</sub></th><th>FS</th></tr></thead><tbody>' +
      R.lowers.map(l => '<tr><td>' + L((l.idx + 1) + '층 ', (l.idx + 1) + '層目 ') + esc(trunc(shortName(l.name), 8)) + '</td><td>' + fmt(l.z, 1) + '</td><td>' + fmt(l.Bv, 2) + ' × ' + fmt(l.Lv, 2) + (l.overlap ? ' *' : '') +
        '</td><td>' + fmt(l.qv, 1) + '</td><td>' + fmt(l.sv, 1) + '</td><td>' + fmt(l.qu, 1) + '</td><td>' + fmt(l.qnet, 1) + '</td><td>' + fmt(l.FS, 2) + '</td></tr>').join('') +
      '</tbody></table><p class="sub">' + L('* 두 궤도의 응력영역이 겹쳐 G + B<sub>g</sub> + z 로 산정. 단위 kPa.', '* 両履帯の応力範囲が重なるため G + B<sub>g</sub> + z で算定。単位 kPa。') + '</p></div>';
  }
  $('detailBody').innerHTML = '<div class="dg">' + parts.join('') + '</div>' + low;
}

function renderLoadSum() {
  const el = $('loadSum');
  if (!el) return;
  if (!R || !R.ok) { el.innerHTML = ''; return; }
  el.innerHTML = '<div><span>' + L('총 하중 ΣW ', '総荷重 ΣW ') + '</span>' + fmt(R.Wsum, 1) + ' kN</div><div><span>' + L('합력 편심 e ', '合力の偏心 e ') + '</span>' + sgn(R.e, 2) +
    ' m</div><div><span>' + L('평균 접지압 ', '平均接地圧 ') + '</span>' + fmt(R.qavg, 1) + ' kPa</div>';
}

function syncPlate() {
  const on = !!S.plate.use;
  document.querySelectorAll('#plateF input').forEach(i => { i.disabled = !on; });
}

let pvTimer = 0, pvToken = 0;
function schedulePreview() {
  if (!$('pv').open) return;
  clearTimeout(pvTimer);
  pvTimer = setTimeout(refreshPreview, 500);
}
async function refreshPreview() {
  if (!R || !R.ok) { $('pvBody').innerHTML = '<p class="sub">' + L('입력값을 확인하면 미리보기가 표시됩니다.', '入力値を確認するとプレビューが表示されます。') + '</p>'; return; }
  const my = ++pvToken;
  const stage = $('pvStage');
  try {
    const pages = await buildReportPages(S, R, stage);
    if (my !== pvToken) return;
    $('pvBody').innerHTML = '';
    pages.forEach(p => $('pvBody').appendChild(p));
    stage.innerHTML = '';
  } catch (e) { $('pvBody').innerHTML = '<p class="sub">' + L('미리보기를 만들지 못했습니다.', 'プレビューを作成できませんでした。') + '</p>'; }
}

function update() {
  R = analyze(S);
  renderTop();
  renderIssues();
  syncPlate();
  if (!R.ok) {
    $('checks').innerHTML = '';
    ['figElev', 'figPress', 'figPlan', 'legend', 'detailBody'].forEach(id => { $(id).innerHTML = ''; });
    renderLoadSum();
    schedulePreview();
    persist();
    return;
  }
  renderChecks(); renderFigs(); renderDetail(); renderLoadSum();
  schedulePreview();
  persist();
}

/* ---- 저장 (PDF · Excel) ---- */
let DL = null, dlReady = false, busy = false;
let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 3600);
}
function updateSaveUI() {
  const note = $('saveNote');
  if (dlReady && !DL) {
    note.hidden = false;
    note.textContent = L('이 보기에서는 파일 저장을 사용할 수 없습니다. claude.ai 에서 이 페이지를 열면 PDF·Excel 저장이 가능합니다.',
      'この表示ではファイル保存を利用できません。claude.ai でこのページを開くと PDF・Excel の保存が可能です。');
    $('btnPdf').disabled = true; $('btnXls').disabled = true;
  } else {
    note.hidden = true;
    $('btnPdf').disabled = busy; $('btnXls').disabled = busy;
  }
}
/* claude.ai 밖(일반 브라우저로 직접 연 HTML)에서는 브라우저 기본 다운로드를 사용 */
function browserSave(req) {
  return new Promise((resolve, reject) => {
    try {
      const blob = req.data instanceof Blob ? req.data : new Blob([req.data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = req.filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      resolve({ status: 'saved' });
    } catch (e) { reject(e); }
  });
}
(async function initDL() {
  const inViewer = !!(window.claude && window.claude.use);
  try { if (inViewer) DL = await window.claude.use('downloads'); } catch (e) { DL = null; }
  if (!DL && !inViewer) DL = { save: browserSave };
  dlReady = true; updateSaveUI();
})();

function fileStem(kind) {
  const d = (S.proj.date || '').replace(/[^0-9]/g, '') || 'report';
  if (kind === 'xls') return L('항타기_지지력_검토_', '杭打機_支持力検討_') + d;
  return L('항타기_지지력_검토서_', '杭打機_支持力検討書_') + d;
}
function saveError(err) {
  const code = err && err.code;
  if (code === 'declined') toast(L('저장이 취소되었습니다.', '保存をキャンセルしました。'));
  else if (code === 'rate_limited') toast(L('저장 확인창이 이미 열려 있습니다. 잠시 후 다시 시도하세요.', '保存の確認ダイアログがすでに開いています。しばらくしてからお試しください。'));
  else if (code === 'too_large') toast(L('파일이 너무 큽니다.', 'ファイルが大きすぎます。'));
  else toast(L('저장하지 못했습니다. ', '保存できませんでした。') + (err && err.message ? err.message : ''));
}
async function guard() {
  if (busy) return false;
  if (!dlReady) { toast(L('저장 기능을 준비하는 중입니다. 잠시 후 다시 시도하세요.', '保存機能を準備中です。しばらくしてからもう一度お試しください。')); return false; }
  if (!DL) { updateSaveUI(); return false; }
  if (!R || !R.ok) { toast(L('입력값 오류를 먼저 수정하세요.', '先に入力値の誤りを修正してください。')); return false; }
  return true;
}

async function savePDF() {
  if (!(await guard())) return;
  if (!window.html2canvas || !window.jspdf) { toast(L('PDF 라이브러리를 불러오지 못했습니다. 네트워크를 확인하세요.', 'PDFライブラリを読み込めませんでした。ネットワークを確認してください。')); return; }
  busy = true; updateSaveUI();
  const btn = $('btnPdf'), label = btn.textContent;
  btn.textContent = L('PDF 생성 중…', 'PDF作成中…');
  const host = $('offscreen');
  try {
    const pages = await buildReportPages(S, R, host);
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compression: true });
    for (let i = 0; i < pages.length; i++) {
      const canvas = await window.html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', logging: false, windowWidth: Math.max(window.innerWidth, 900) });
      if (i > 0) doc.addPage();
      doc.addImage(canvas.toDataURL('image/jpeg', 0.93), 'JPEG', 0, 0, 210, 297);
    }
    const blob = doc.output('blob');
    host.innerHTML = '';
    btn.textContent = label;
    await DL.save({ filename: fileStem('pdf') + '.pdf', data: blob });
    toast(L('PDF 를 저장했습니다.', 'PDFを保存しました。'));
  } catch (err) { saveError(err); }
  finally { host.innerHTML = ''; btn.textContent = label; busy = false; updateSaveUI(); }
}

async function saveXLS() {
  if (!(await guard())) return;
  if (!window.XLSX) { toast(L('Excel 라이브러리를 불러오지 못했습니다. 네트워크를 확인하세요.', 'Excelライブラリを読み込めませんでした。ネットワークを確認してください。')); return; }
  busy = true; updateSaveUI();
  try {
    const wb = buildWorkbook(window.XLSX, S, R);
    const buf = window.XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    await DL.save({ filename: fileStem('xls') + '.xlsx', data: buf });
    toast(L('Excel 파일을 저장했습니다.', 'Excelファイルを保存しました。'));
  } catch (err) { saveError(err); }
  finally { busy = false; updateSaveUI(); }
}

/* ---- 시작 ---- */
function init() {
  applyStatic();
  renderInputs();
  const inp = $('inputs');
  inp.addEventListener('input', onField);
  inp.addEventListener('change', onField);
  inp.addEventListener('click', onClick);
  document.querySelector('.seg').addEventListener('click', e => {
    const b = e.target.closest('button[data-lang]');
    if (b) switchLang(b.dataset.lang);
  });
  $('btnPdf').addEventListener('click', savePDF);
  $('btnXls').addEventListener('click', saveXLS);
  $('pv').addEventListener('toggle', () => { if ($('pv').open) refreshPreview(); });
  update();
}
init();

</script>
