<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ENG CALC</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --panel: #111418;
    --border: #2a3040;
    --border-bright: #3d4f6e;
    --accent: #00d4ff;
    --display-bg: #020e08;
    --display-text: #39ff14;
    --display-dim: #0d3318;
    --btn-base: #1a1f28;
    --btn-active: #0d1520;
    --btn-num: #1e2530;
    --btn-op: #1a2535;
    --btn-fn: #15202e;
    --btn-eq: #0d3a1a;
    --text-main: #c8d8e8;
    --text-dim: #5a6a80;
    --text-fn: #7db8d8;
    --text-op: #ff9955;
    --text-eq: #39ff14;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:var(--bg); overflow:hidden; font-family:'Exo 2',sans-serif; }

  .calc {
    display:flex; flex-direction:column;
    width:100%; height:100dvh;
    background:var(--panel);
  }

  /* HEADER */
  .hdr { display:flex; align-items:center; justify-content:space-between; padding:5px 12px 4px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .brand { font-family:'Orbitron',monospace; font-size:10px; font-weight:700; letter-spacing:3px; color:var(--accent); text-shadow:0 0 8px var(--accent); }
  .model { font-family:'Share Tech Mono',monospace; font-size:6.5px; letter-spacing:1.5px; color:var(--text-dim); margin-top:1px; }
  .dots { display:flex; gap:4px; }
  .dot { width:5px; height:5px; border-radius:50%; }
  .dg { background:#39ff14; box-shadow:0 0 5px #39ff14; animation:blink 3s infinite; }
  .do { background:#ff6b35; opacity:.4; }
  .db { background:var(--accent); opacity:.3; }
  @keyframes blink { 0%,90%,100%{opacity:1} 95%{opacity:.2} }

  /* TABS */
  .tabs { display:flex; padding:4px 10px 0; gap:2px; flex-shrink:0; }
  .tab { font-family:'Share Tech Mono',monospace; font-size:8px; letter-spacing:1.5px; padding:3px 9px; border-radius:4px 4px 0 0; cursor:pointer; color:var(--text-dim); border:1px solid transparent; border-bottom:none; background:transparent; user-select:none; }
  .tab.active { color:var(--accent); background:rgba(0,212,255,.07); border-color:var(--border-bright); text-shadow:0 0 6px var(--accent); }

  /* DISPLAY */
  .disp-wrap { margin:0 10px 5px; background:var(--display-bg); border-radius:0 5px 5px 5px; border:1px solid #0d2010; box-shadow:inset 0 2px 8px rgba(0,0,0,.8); padding:5px 12px; flex-shrink:0; position:relative; overflow:hidden; }
  .disp-wrap::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 4px); pointer-events:none; }
  .dinfo { display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
  .flags { display:flex; gap:6px; }
  .flag { font-family:'Share Tech Mono',monospace; font-size:7px; letter-spacing:1px; color:var(--display-dim); transition:all .2s; }
  .flag.on { color:var(--display-text); text-shadow:0 0 5px var(--display-text); }
  .d-label { font-family:'Share Tech Mono',monospace; font-size:7px; color:var(--text-dim); letter-spacing:1px; }
  .d-expr { font-family:'Share Tech Mono',monospace; font-size:9px; color:rgba(57,255,20,.35); text-align:right; min-height:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .d-main { font-family:'Share Tech Mono',monospace; font-size:clamp(18px,6.5vw,28px); color:var(--display-text); text-align:right; text-shadow:0 0 15px rgba(57,255,20,.5),0 0 30px rgba(57,255,20,.15); letter-spacing:2px; line-height:1.1; word-break:break-all; }
  .d-main.sm { font-size:clamp(13px,4.5vw,20px); }
  .d-main.xs { font-size:clamp(10px,3.5vw,14px); }
  .d-main.err { color:#ff4444; text-shadow:0 0 12px rgba(255,50,50,.5); font-size:clamp(12px,4vw,17px); }

  /* INFO ROW */
  .irow { display:flex; gap:5px; margin:0 10px 4px; flex-shrink:0; }
  .mbar { flex:1; padding:3px 8px; background:rgba(0,0,0,.3); border:1px solid var(--border); border-radius:5px; display:flex; justify-content:space-between; align-items:center; }
  .mlbl { font-family:'Share Tech Mono',monospace; font-size:6.5px; color:var(--text-dim); letter-spacing:1px; }
  .mval { font-family:'Share Tech Mono',monospace; font-size:9px; color:#cc88ff; }
  .hbar { flex:2; padding:2px 8px; background:rgba(0,0,0,.3); border:1px solid var(--border); border-radius:5px; overflow:hidden; min-height:22px; }
  .hi { font-family:'Share Tech Mono',monospace; font-size:7.5px; color:var(--text-dim); display:flex; justify-content:space-between; cursor:pointer; white-space:nowrap; overflow:hidden; }
  .hi:hover { color:var(--text-main); }
  .hr { color:rgba(57,255,20,.5); margin-left:5px; flex-shrink:0; }

  /* SEP */
  .sep { margin:0 10px 3px; height:1px; background:linear-gradient(90deg,transparent,var(--border),transparent); flex-shrink:0; }

  /* BUTTON AREA */
  .barea { flex:1; display:flex; flex-direction:column; padding:0 8px 5px; gap:3px; min-height:0; }
  .g5 { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; flex:1; min-height:0; }

  button { border:none; cursor:pointer; border-radius:6px; position:relative; transition:all .07s; user-select:none; outline:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; width:100%; height:100%; }
  .btn { background:var(--btn-base); border:1px solid var(--border); color:var(--text-main); font-family:'Exo 2',sans-serif; font-size:clamp(8px,2.8vw,13px); font-weight:600; box-shadow:0 2px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05); }
  .btn:active { background:var(--btn-active); transform:translateY(1px); box-shadow:0 1px 2px rgba(0,0,0,.5); }
  .fn  { background:var(--btn-fn); color:var(--text-fn); font-size:clamp(7px,2.5vw,11px); }
  .op  { background:var(--btn-op); color:var(--text-op); font-size:clamp(11px,3.8vw,17px); border-color:rgba(255,100,50,.15); }
  .num { background:var(--btn-num); font-size:clamp(11px,3.8vw,17px); font-weight:600; }
  .eq  { background:var(--btn-eq); color:var(--text-eq); font-size:clamp(13px,4.5vw,20px); font-weight:700; border-color:rgba(57,255,20,.2); text-shadow:0 0 8px var(--text-eq); box-shadow:0 2px 3px rgba(0,0,0,.4),0 0 8px rgba(57,255,20,.08),inset 0 1px 0 rgba(255,255,255,.05); }
  .clr { background:#2a1215; color:#ff4444; border-color:rgba(255,50,50,.2); font-weight:700; }
  .sft { background:#1a1830; color:#9988ff; border-color:rgba(120,100,255,.2); font-size:clamp(6px,2.2vw,9px); letter-spacing:1px; font-family:'Share Tech Mono',monospace; }
  .sft.on { background:#251e50; color:#bbaaff; border-color:rgba(150,130,255,.4); box-shadow:0 0 10px rgba(120,100,255,.2); }
  .mb  { background:#1a1428; color:#cc88ff; border-color:rgba(180,100,255,.15); font-size:clamp(7px,2.5vw,11px); }
  .sub { font-size:clamp(4.5px,1.7vw,7.5px); color:#9988ff; font-family:'Share Tech Mono',monospace; letter-spacing:.3px; opacity:.65; line-height:1; }
  .fn .sub { color:#4a7a9a; }
  .span2 { grid-column:span 2; }

  /* FOOTER */
  .ftr { padding:2px 12px 3px; display:flex; justify-content:space-between; border-top:1px solid var(--border); flex-shrink:0; }
  .ftr span { font-family:'Share Tech Mono',monospace; font-size:6.5px; color:var(--text-dim); letter-spacing:1px; }

  @keyframes flash { 0%,100%{opacity:1} 50%{opacity:.3} }
  .flash { animation:flash .15s 2; }
</style>
</head>
<body>
<div class="calc">

  <div class="hdr">
    <div><div class="brand">ENG CALC</div><div class="model">SC-9800X · SCIENTIFIC</div></div>
    <div class="dots"><div class="dot dg"></div><div class="dot do"></div><div class="dot db"></div></div>
  </div>

  <div class="tabs">
    <div class="tab active" id="t-DEG" onclick="setMode('DEG')">DEG</div>
    <div class="tab" id="t-RAD" onclick="setMode('RAD')">RAD</div>
    <div class="tab" id="t-GRAD" onclick="setMode('GRAD')">GRAD</div>
  </div>

  <div class="disp-wrap">
    <div class="dinfo">
      <div class="flags">
        <span class="flag" id="f-shift">SHIFT</span>
        <span class="flag on" id="f-mode">DEG</span>
        <span class="flag" id="f-mem">M</span>
      </div>
      <span class="d-label">NORMAL</span>
    </div>
    <div class="d-expr" id="d-expr"></div>
    <div class="d-main" id="d-main">0</div>
  </div>

  <div class="irow">
    <div class="mbar"><span class="mlbl">MEM</span><span class="mval" id="mem-v">0</span></div>
    <div class="hbar" id="hbar"><div class="hi" style="justify-content:center;color:var(--text-dim);font-size:7px">— 이력 —</div></div>
  </div>

  <div class="sep"></div>

  <div class="barea">
    <div class="g5">
      <button class="btn sft" id="b-shift" onclick="toggleShift()">SHIFT</button>
      <button class="btn mb" onclick="memClear()"><span>MC</span><span class="sub">CLR</span></button>
      <button class="btn mb" onclick="memRecall()"><span>MR</span><span class="sub">RCL</span></button>
      <button class="btn mb" onclick="memAdd()"><span>M+</span><span class="sub">ADD</span></button>
      <button class="btn clr" onclick="clearAll()">AC</button>
    </div>
    <div class="g5">
      <button class="btn fn" onclick="pressFn('sin')"><span id="l-sin">sin</span><span class="sub">asin</span></button>
      <button class="btn fn" onclick="pressFn('cos')"><span id="l-cos">cos</span><span class="sub">acos</span></button>
      <button class="btn fn" onclick="pressFn('tan')"><span id="l-tan">tan</span><span class="sub">atan</span></button>
      <button class="btn fn" onclick="pressFn('log')"><span id="l-log">log</span><span class="sub">10^x</span></button>
      <button class="btn fn" onclick="pressFn('ln')"><span>ln</span><span class="sub">e^x</span></button>
    </div>
    <div class="g5">
      <button class="btn fn" onclick="pressFn('sqrt')"><span>√x</span><span class="sub">x²</span></button>
      <button class="btn fn" onclick="pressFn('cbrt')"><span>∛x</span><span class="sub">x³</span></button>
      <button class="btn fn" onclick="pressFn('pow')"><span>xʸ</span><span class="sub">ʸ√x</span></button>
      <button class="btn fn" onclick="pressFn('recip')"><span>1/x</span><span class="sub">|x|</span></button>
      <button class="btn fn" onclick="pressFn('percent')"><span>%</span><span class="sub">mod</span></button>
    </div>
    <div class="g5">
      <button class="btn fn" onclick="pressConst('pi')"><span>π</span><span class="sub">2π</span></button>
      <button class="btn fn" onclick="pressConst('e')"><span>e</span><span class="sub">e²</span></button>
      <button class="btn fn" onclick="pressFn('fact')"><span>n!</span><span class="sub">nCr</span></button>
      <button class="btn op" onclick="pressOp('/')">÷</button>
      <button class="btn clr" onclick="backspace()">⌫</button>
    </div>
    <div class="g5">
      <button class="btn num" onclick="pressNum('7')">7</button>
      <button class="btn num" onclick="pressNum('8')">8</button>
      <button class="btn num" onclick="pressNum('9')">9</button>
      <button class="btn op" onclick="pressOp('*')">×</button>
      <button class="btn fn" onclick="pressFn('neg')">±</button>
    </div>
    <div class="g5">
      <button class="btn num" onclick="pressNum('4')">4</button>
      <button class="btn num" onclick="pressNum('5')">5</button>
      <button class="btn num" onclick="pressNum('6')">6</button>
      <button class="btn op" onclick="pressOp('-')">−</button>
      <button class="btn fn" onclick="pressParen('(')">(</button>
    </div>
    <div class="g5">
      <button class="btn num" onclick="pressNum('1')">1</button>
      <button class="btn num" onclick="pressNum('2')">2</button>
      <button class="btn num" onclick="pressNum('3')">3</button>
      <button class="btn op" onclick="pressOp('+')">+</button>
      <button class="btn fn" onclick="pressParen(')')">)</button>
    </div>
    <div class="g5">
      <button class="btn num span2" onclick="pressNum('0')">0</button>
      <button class="btn num" onclick="pressDecimal()">.</button>
      <button class="btn fn" onclick="pressEE()">EE</button>
      <button class="btn eq" onclick="calculate()">=</button>
    </div>
  </div>

  <div class="ftr">
    <span>SCIENTIFIC v9.8</span>
    <span id="f-clock"></span>
  </div>

</div>
<script>
let cur='0',prevVal=null,operator=null,waitOp=false,memory=0,angleMode='DEG',shiftMode=false,hist=[];
const dM=document.getElementById('d-main'),dE=document.getElementById('d-expr'),mV=document.getElementById('mem-v'),hb=document.getElementById('hbar');
function upD(v,err){dM.className='d-main';if(err){dM.className+=' err';dM.textContent=err;return;}let s=String(v);if(s.length>14)s=parseFloat(v).toExponential(5);dM.className='d-main'+(s.length>14?' xs':s.length>10?' sm':'');dM.textContent=s;}
function toR(x){return angleMode==='DEG'?x*Math.PI/180:angleMode==='GRAD'?x*Math.PI/200:x;}
function frR(x){return angleMode==='DEG'?x*180/Math.PI:angleMode==='GRAD'?x*200/Math.PI:x;}
function fact(n){n=Math.round(n);if(n<0||n>170)throw 0;let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function fmt(n){if(typeof n!=='number')n=parseFloat(n);if(!isFinite(n))return String(n);let s=String(n);if(s.length>12)s=n.toPrecision(7);return s;}
function setMode(m){angleMode=m;['DEG','RAD','GRAD'].forEach(x=>{document.getElementById('t-'+x).classList.toggle('active',x===m);});document.getElementById('f-mode').textContent=m;}
function toggleShift(){shiftMode=!shiftMode;document.getElementById('b-shift').classList.toggle('on',shiftMode);document.getElementById('f-shift').classList.toggle('on',shiftMode);document.getElementById('l-sin').textContent=shiftMode?'asin':'sin';document.getElementById('l-cos').textContent=shiftMode?'acos':'cos';document.getElementById('l-tan').textContent=shiftMode?'atan':'tan';document.getElementById('l-log').textContent=shiftMode?'10^x':'log';}
function clrShift(){if(!shiftMode)return;shiftMode=false;document.getElementById('b-shift').classList.remove('on');document.getElementById('f-shift').classList.remove('on');document.getElementById('l-sin').textContent='sin';document.getElementById('l-cos').textContent='cos';document.getElementById('l-tan').textContent='tan';document.getElementById('l-log').textContent='log';}
function pressNum(n){if(waitOp){cur=n;waitOp=false;}else cur=cur==='0'?n:cur+n;upD(cur);}
function pressDecimal(){if(waitOp){cur='0.';waitOp=false;}else if(!cur.includes('.'))cur+='.';upD(cur);}
function pressEE(){if(!cur.includes('e')&&!cur.includes('E'))cur+='e+';upD(cur);}
function pressOp(op){let v=parseFloat(cur);if(prevVal!==null&&!waitOp){v=cmp(prevVal,v,operator);if(v===null)return;cur=fmt(v);upD(cur);}prevVal=parseFloat(cur);operator=op;waitOp=true;dE.textContent=fmt(prevVal)+' '+({'+':'+','-':'−','*':'×','/':'÷'}[op]||op);}
function cmp(a,b,op){try{let r;switch(op){case'+':r=a+b;break;case'-':r=a-b;break;case'*':r=a*b;break;case'/':if(b===0){showErr('DIV/ZERO');return null;}r=a/b;break;default:r=b;}if(!isFinite(r)){showErr('OVERFLOW');return null;}return r;}catch(e){showErr('ERROR');return null;}}
function calculate(){if(operator===null||prevVal===null){addH(cur,cur);return;}let b=parseFloat(cur),sym={'+':'+','-':'−','*':'×','/':'÷'}[operator]||operator,ex=fmt(prevVal)+' '+sym+' '+fmt(b),r=cmp(prevVal,b,operator);if(r===null)return;addH(ex,r);cur=fmt(r);upD(cur);dE.textContent=ex+' =';prevVal=null;operator=null;waitOp=true;}
function pressFn(fn){let v=parseFloat(cur),r,lb;try{if(shiftMode){switch(fn){case'sin':r=frR(Math.asin(v));lb='asin';break;case'cos':r=frR(Math.acos(v));lb='acos';break;case'tan':r=frR(Math.atan(v));lb='atan';break;case'log':r=Math.pow(10,v);lb='10^x';break;case'ln':r=Math.exp(v);lb='e^x';break;case'sqrt':r=v*v;lb='x²';break;case'cbrt':r=v*v*v;lb='x³';break;case'recip':r=Math.abs(v);lb='|x|';break;default:r=v;lb=fn;}clrShift();}else{switch(fn){case'sin':r=Math.sin(toR(v));lb='sin';break;case'cos':r=Math.cos(toR(v));lb='cos';break;case'tan':if(Math.abs(Math.cos(toR(v)))<1e-10){showErr('UNDEF');return;}r=Math.tan(toR(v));lb='tan';break;case'log':if(v<=0){showErr('DOMAIN');return;}r=Math.log10(v);lb='log';break;case'ln':if(v<=0){showErr('DOMAIN');return;}r=Math.log(v);lb='ln';break;case'sqrt':if(v<0){showErr('DOMAIN');return;}r=Math.sqrt(v);lb='√';break;case'cbrt':r=Math.cbrt(v);lb='∛';break;case'pow':prevVal=v;operator='pow';waitOp=true;dE.textContent=fmt(v)+'^';return;case'recip':if(v===0){showErr('DIV/ZERO');return;}r=1/v;lb='1/x';break;case'percent':r=v/100;lb='%';break;case'neg':r=-v;lb='±';break;case'fact':r=fact(v);lb='n!';break;}}if(r===undefined||r===null)return;if(!isFinite(r)){showErr('OVERFLOW');return;}dE.textContent=lb+'('+fmt(v)+')';cur=fmt(r);upD(cur);addH(lb+'('+fmt(v)+')',r);waitOp=true;}catch(e){showErr('ERROR');}}
function pressConst(c){let v=c==='pi'?(shiftMode?2*Math.PI:Math.PI):(shiftMode?Math.E*Math.E:Math.E);cur=String(v);upD(cur);waitOp=false;clrShift();}
function pressParen(p){dE.textContent=(dE.textContent||'')+p;}
function memClear(){memory=0;mV.textContent='0';document.getElementById('f-mem').classList.remove('on');}
function memRecall(){cur=String(memory);upD(cur);waitOp=false;}
function memAdd(){memory+=parseFloat(cur);mV.textContent=fmt(memory);document.getElementById('f-mem').classList.add('on');fl();}
function clearAll(){cur='0';prevVal=null;operator=null;waitOp=false;dE.textContent='';upD('0');fl();}
function backspace(){if(waitOp)return;cur=cur.length<=1?'0':cur.slice(0,-1);upD(cur);}
function showErr(m){dM.className='d-main err';dM.textContent=m;dE.textContent='';setTimeout(()=>{cur='0';upD('0');},2000);}
function fl(){dM.classList.add('flash');setTimeout(()=>dM.classList.remove('flash'),300);}
function addH(ex,r){hist.unshift({ex,r:fmt(r)});if(hist.length>4)hist.pop();renderH();}
function renderH(){hb.innerHTML='';if(!hist.length){hb.innerHTML='<div class="hi" style="justify-content:center;color:var(--text-dim);font-size:7px">— 이력 —</div>';return;}hist.slice(0,3).forEach(h=>{let d=document.createElement('div');d.className='hi';d.innerHTML=`<span style="overflow:hidden;text-overflow:ellipsis">${h.ex}</span><span class="hr">=${h.r}</span>`;d.onclick=()=>{cur=h.r;upD(h.r);waitOp=false;};hb.appendChild(d);});}
document.addEventListener('keydown',e=>{if(e.key>='0'&&e.key<='9')pressNum(e.key);else if(e.key==='.')pressDecimal();else if(e.key==='+')pressOp('+');else if(e.key==='-')pressOp('-');else if(e.key==='*')pressOp('*');else if(e.key==='/'){e.preventDefault();pressOp('/');}else if(e.key==='Enter'||e.key==='=')calculate();else if(e.key==='Backspace')backspace();else if(e.key==='Escape')clearAll();});
setInterval(()=>{let n=new Date();document.getElementById('f-clock').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');},1000);
</script>
</body>
</html>
