<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 전체화면 및 핀치줌 방지, 주소창 영역 대응(viewport-fit=cover) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 홈 화면 추가 시 앱처럼 보이게 하는 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#252525">

    <title>Sharp EL-5500X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap');

        /* 기본 바디 설정 - 모바일에서 스크롤 및 바운스 현상 완벽 방지 */
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            user-select: none;
            overflow: hidden;
            touch-action: none; /* 화면 당기기 새로고침 방지 */
        }

        /* 계산기 본체: 모바일은 100% 꽉 채우고, PC에서는 폰 모양 유지 */
        .calc-body {
            background: linear-gradient(180deg, #333333 0%, #1a1a1a 100%);
            width: 100vw;
            height: 100dvh; /* 브라우저 주소창 제외한 실제 화면 높이 */
            max-width: 100%;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom) 10px;
        }

        /* 데스크탑(PC) 환경일 경우 기존처럼 둥근 폰 모양으로 표시 */
        @media (min-width: 640px) {
            .calc-body {
                width: 100%;
                max-width: 420px;
                height: 90vh;
                max-height: 850px;
                margin: 5vh auto;
                border-radius: 2rem;
                padding: 20px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 0 4px #444, 0 0 0 8px #111;
            }
            body { background-color: #202124; touch-action: auto; overflow: auto; }
        }

        /* LCD 화면 디자인 */
        .lcd-screen {
            background-color: #c0ccb5;
            box-shadow: inset 3px 3px 10px rgba(0,0,0,0.3), inset -2px -2px 5px rgba(255,255,255,0.4), 0 2px 0 rgba(255,255,255,0.05);
            font-family: 'JetBrains Mono', monospace;
            position: relative;
        }
        .lcd-screen::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 3px 3px; pointer-events: none;
        }

        /* 상단 태양광 패널 */
        .solar-panel {
            background: linear-gradient(to right, #3d2424 0%, #1c0f0f 20%, #3d2424 40%, #1c0f0f 60%, #3d2424 80%, #1c0f0f 100%);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.9);
            border: 1px solid #000;
        }

        /* 공통 버튼 스타일 (높이를 부모 flex 영역에 맞게 꽉 채움) */
        .btn {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 6px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 5px 5px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.1);
            cursor: pointer;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.1);
        }

        .btn-func { background: linear-gradient(180deg, #4a4a4a, #333333); color: #f0f0f0; }
        .btn-num { background: linear-gradient(180deg, #2a2a2a, #111111); color: #ffffff; }
        .btn-action { background: linear-gradient(180deg, #2a2a2a, #111111); color: #4ade80; }
        
        .lbl-orange { color: #f59e0b; }
        .lbl-green { color: #10b981; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="calc-body">
        
        <!-- 상단 헤더 (로고 누르면 전체화면) -->
        <div class="flex-none flex justify-between items-start px-2 pt-2 pb-1">
            <div onclick="toggleFullScreen()" class="text-[#e0e0e0] font-bold text-xl md:text-2xl tracking-wider cursor-pointer active:text-white">SHARP</div>
            <div class="solar-panel w-32 md:w-40 h-8 md:h-10 rounded-sm"></div>
        </div>

        <!-- 디스플레이 영역 -->
        <div class="flex-none relative mt-1">
            <div class="lcd-screen w-full h-24 md:h-28 rounded-lg p-2 flex flex-col justify-between overflow-hidden">
                <div class="flex justify-between text-[10px] md:text-xs font-bold text-black/70 z-10">
                    <div class="flex gap-3">
                        <span id="ind-shift" class="opacity-0 transition-opacity">2ndF</span>
                        <span id="ind-alpha" class="opacity-0">ALPHA</span>
                        <span class="opacity-100">DEG</span>
                    </div>
                    <span class="opacity-100">W-VIEW</span>
                </div>
                <div id="display-expr" class="w-full text-right text-base md:text-lg text-black/90 whitespace-nowrap overflow-x-auto scrollbar-hide z-10 font-mono mt-1 min-h-[1.5rem]"></div>
                <div id="display-result" class="w-full text-right text-3xl md:text-4xl font-bold text-black z-10 truncate font-mono pb-1">0</div>
            </div>
            <div class="flex justify-between text-[#888] text-[11px] md:text-[13px] mt-1 px-2 font-bold tracking-wide">
                <span class="italic">WriteView</span>
                <span>EL-5500X</span>
            </div>
        </div>

        <!-- 네비게이션 및 기본 조작부 -->
        <div class="flex-none flex justify-between items-center px-2 mt-2 md:mt-4">
            <button class="btn bg-[#333] text-white text-[10px] md:text-xs w-14 h-7 md:w-16 md:h-8 rounded-full border border-[#555]">HOME</button>
            
            <div class="relative w-28 h-14 md:w-32 md:h-16 flex justify-center items-center">
                <div class="absolute w-full h-6 md:h-7 bg-gradient-to-b from-[#777] to-[#555] rounded-full shadow-lg flex justify-between px-2 items-center cursor-pointer active:scale-95 transition-transform">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="white"><path d="M15 19l-7-7 7-7v14z"/></svg>
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="white"><path d="M9 5l7 7-7 7V5z"/></svg>
                </div>
                <div class="absolute w-7 md:w-8 h-full bg-gradient-to-r from-[#666] via-[#777] to-[#666] rounded-full shadow-lg flex flex-col justify-between py-1 items-center cursor-pointer active:scale-95 transition-transform">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="white"><path d="M5 15l7-7 7 7H5z"/></svg>
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="white"><path d="M19 9l-7 7-7-7h14z"/></svg>
                </div>
                <div class="absolute w-5 h-5 bg-[#666] rounded-full shadow-inner"></div>
            </div>

            <button onclick="clearAll()" class="btn bg-[#222] text-[#ff6b6b] text-[10px] md:text-xs w-14 h-7 md:w-16 md:h-8 rounded-full font-black border border-[#4a1c1c]">ON/C</button>
        </div>

        <div class="flex-none h-px w-full bg-[#555] opacity-50 my-2 md:my-4"></div>

        <!-- 공학용 기능 버튼부 (화면 비율에 따라 높이 유연하게 조절됨) -->
        <div class="flex-[3] grid grid-cols-6 grid-rows-3 gap-x-1.5 gap-y-1 px-1 mb-2">
            <!-- 1행 -->
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[9px] text-transparent h-3 md:h-4 mb-0.5">.</span><button onclick="toggleShift()" id="btn-shift" class="btn flex-1 bg-gradient-to-b from-[#fbbf24] to-[#d97706] text-black text-[10px] md:text-xs">2ndF</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[9px] lbl-orange h-3 md:h-4 mb-0.5 font-bold">SET UP</span><button class="btn flex-1 btn-func text-[10px] md:text-xs">MATH</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[9px] lbl-orange h-3 md:h-4 mb-0.5 font-bold">ALGB</span><button class="btn flex-1 btn-func text-[10px] md:text-xs">D1</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[9px] lbl-orange h-3 md:h-4 mb-0.5 font-bold">SOLVER</span><button class="btn flex-1 btn-func text-[10px] md:text-xs">D2</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[9px] lbl-orange h-3 md:h-4 mb-0.5 font-bold"></span><button class="btn flex-1 btn-func text-[10px] md:text-xs">D3</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[9px] lbl-orange h-3 md:h-4 mb-0.5 font-bold">DEL</span><button onclick="deleteLast()" class="btn flex-1 btn-func text-[10px] md:text-xs">BS</button></div>

            <!-- 2행 -->
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange">arc hyp</span><span class="lbl-green">NOT</span></div><button class="btn flex-1 btn-func text-[10px] md:text-xs">hyp</button></div>
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange">sin⁻¹</span><span class="lbl-green">AND</span></div><button onclick="addFunc('sin(')" class="btn flex-1 btn-func text-[10px] md:text-xs">sin</button></div>
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange">cos⁻¹</span><span class="lbl-green">OR</span></div><button onclick="addFunc('cos(')" class="btn flex-1 btn-func text-[10px] md:text-xs">cos</button></div>
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange">tan⁻¹</span><span class="lbl-green">XOR</span></div><button onclick="addFunc('tan(')" class="btn flex-1 btn-func text-[10px] md:text-xs">tan</button></div>
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange"></span><span class="lbl-green">XNOR</span></div><button onclick="addChar('π')" class="btn flex-1 btn-func text-[10px] md:text-xs">π</button></div>
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange">↔DEG</span></div><button class="btn flex-1 btn-func text-[10px] md:text-xs">D°M'S</button></div>

            <!-- 3행 -->
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange">ˣ√</span><span class="lbl-green">A</span></div><button onclick="addChar('^')" class="btn flex-1 btn-func text-[10px] md:text-xs">yˣ</button></div>
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange">³√</span><span class="lbl-green">B</span></div><button onclick="addFunc('sqrt(')" class="btn flex-1 btn-func text-[10px] md:text-xs">√</button></div>
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange">x³</span><span class="lbl-green">C</span></div><button onclick="addChar('²')" class="btn flex-1 btn-func text-[10px] md:text-xs">x²</button></div>
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange">10ˣ</span><span class="lbl-green">D</span></div><button onclick="addFunc('log(')" class="btn flex-1 btn-func text-[10px] md:text-xs">log</button></div>
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange">eˣ</span><span class="lbl-green">E</span></div><button onclick="addFunc('ln(')" class="btn flex-1 btn-func text-[10px] md:text-xs">ln</button></div>
            <div class="flex flex-col items-center"><div class="flex justify-between w-full px-0.5 text-[7px] md:text-[8px] h-3 md:h-4 mb-0.5"><span class="lbl-orange"></span><span class="lbl-green">F</span></div><button class="btn flex-1 btn-func text-[10px] md:text-xs">(x,y)</button></div>
        </div>

        <!-- 숫자 및 연산자 패드 (가장 넓은 공간 차지) -->
        <div class="flex-[5] grid grid-cols-5 grid-rows-4 gap-x-2 gap-y-2 px-1 pb-2 md:pb-4">
            <!-- 1행 -->
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">RANDOM</span><button onclick="addChar('7')" class="btn flex-1 btn-num text-xl md:text-2xl">7</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">→rθ</span><button onclick="addChar('8')" class="btn flex-1 btn-num text-xl md:text-2xl">8</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">→xy</span><button onclick="addChar('9')" class="btn flex-1 btn-num text-xl md:text-2xl">9</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5"></span><button onclick="addChar('(')" class="btn flex-1 btn-num text-base md:text-xl">(</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5"></span><button onclick="addChar(')')" class="btn flex-1 btn-num text-base md:text-xl">)</button></div>

            <!-- 2행 -->
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">n!</span><button onclick="addChar('4')" class="btn flex-1 btn-num text-xl md:text-2xl">4</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">nCr</span><button onclick="addChar('5')" class="btn flex-1 btn-num text-xl md:text-2xl">5</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">nPr</span><button onclick="addChar('6')" class="btn flex-1 btn-num text-xl md:text-2xl">6</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5"></span><button onclick="addChar('×')" class="btn flex-1 btn-num text-2xl md:text-3xl">×</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5"></span><button onclick="addChar('÷')" class="btn flex-1 btn-num text-2xl md:text-3xl">÷</button></div>

            <!-- 3행 -->
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">%</span><button onclick="addChar('1')" class="btn flex-1 btn-num text-xl md:text-2xl">1</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5"></span><button onclick="addChar('2')" class="btn flex-1 btn-num text-xl md:text-2xl">2</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5"></span><button onclick="addChar('3')" class="btn flex-1 btn-num text-xl md:text-2xl">3</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5"></span><button onclick="addChar('+')" class="btn flex-1 btn-num text-2xl md:text-3xl">+</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5"></span><button onclick="addChar('-')" class="btn flex-1 btn-num text-3xl md:text-4xl">-</button></div>

            <!-- 4행 -->
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">MDF</span><button onclick="addChar('0')" class="btn flex-1 btn-num text-xl md:text-2xl">0</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">DRG►</span><button onclick="addChar('.')" class="btn flex-1 btn-num text-2xl md:text-3xl flex items-start justify-center pt-1 md:pt-2">.</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">abs</span><button onclick="addChar('-')" class="btn flex-1 btn-num text-base md:text-xl">(-)</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">ANS</span><button onclick="calculate()" class="btn flex-1 btn-num text-2xl md:text-3xl bg-gradient-to-b from-[#333] to-[#111]">=</button></div>
            <div class="flex flex-col items-center"><span class="text-[8px] md:text-[10px] lbl-orange h-3 md:h-4 mb-0.5">LENTERJ</span><button onclick="calculate()" class="btn flex-1 btn-action text-[11px] md:text-sm font-bold">ENTER</button></div>
        </div>
    </div>

    <script>
        // 전체화면 토글 기능 (상단 로고 터치 시 작동)
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) { /* IE11 */
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        let expression = "";
        let isShift = false;

        const exprDisplay = document.getElementById('display-expr');
        const resDisplay = document.getElementById('display-result');
        const indShift = document.getElementById('ind-shift');

        function toggleShift() {
            isShift = !isShift;
            indShift.style.opacity = isShift ? "1" : "0";
        }

        function addChar(char) {
            if(char === '²') expression += '^2';
            else expression += char;
            updateDisplay();
        }

        function addFunc(func) {
            if (isShift) {
                const shiftMap = {
                    'sin(': 'asin(', 'cos(': 'acos(', 'tan(': 'atan(',
                    'sqrt(': 'cbrt(', 'log(': '10^(', 'ln(': 'e^('
                };
                expression += shiftMap[func] || func;
                toggleShift(); 
            } else {
                expression += func;
            }
            updateDisplay();
        }

        function updateDisplay() {
            let visualExpr = expression
                .replace(/\^2/g, '²').replace(/asin\(/g, 'sin⁻¹(')
                .replace(/acos\(/g, 'cos⁻¹(').replace(/atan\(/g, 'tan⁻¹(')
                .replace(/sqrt\(/g, '√(');
                
            exprDisplay.innerText = visualExpr || "";
            exprDisplay.scrollLeft = exprDisplay.scrollWidth;
        }

        function clearAll() {
            expression = ""; resDisplay.innerText = "0";
            isShift = false; indShift.style.opacity = "0";
            updateDisplay();
        }

        function deleteLast() {
            expression = expression.slice(0, -1);
            updateDisplay();
        }

        function calculate() {
            if (!expression) return;
            try {
                let jsExpr = expression
                    .replace(/×/g, '*').replace(/÷/g, '/').replace(/π/g, 'Math.PI')
                    .replace(/e\^\(/g, 'Math.exp(').replace(/sin\(/g, 'Math.sin(')
                    .replace(/cos\(/g, 'Math.cos(').replace(/tan\(/g, 'Math.tan(')
                    .replace(/asin\(/g, 'Math.asin(').replace(/acos\(/g, 'Math.acos(')
                    .replace(/atan\(/g, 'Math.atan(').replace(/log\(/g, 'Math.log10(')
                    .replace(/ln\(/g, 'Math.log(').replace(/sqrt\(/g, 'Math.sqrt(')
                    .replace(/cbrt\(/g, 'Math.cbrt(').replace(/\^/g, '**');

                const openCount = (jsExpr.match(/\(/g) || []).length;
                const closeCount = (jsExpr.match(/\)/g) || []).length;
                for (let i = 0; i < openCount - closeCount; i++) jsExpr += ')';

                const result = eval(jsExpr);
                
                if (isNaN(result) || !isFinite(result)) resDisplay.innerText = "Error";
                else resDisplay.innerText = Number.isInteger(result) ? result : parseFloat(result.toFixed(9)).toString();
            } catch (e) {
                resDisplay.innerText = "Syntax Error";
            }
        }
        
        document.addEventListener('keydown', (event) => {
            const key = event.key;
            if (/[0-9]/.test(key)) addChar(key);
            if (key === '+' || key === '-' || key === '(' || key === ')' || key === '.') addChar(key);
            if (key === '*') addChar('×');
            if (key === '/') addChar('÷');
            if (key === 'Enter' || key === '=') { event.preventDefault(); calculate(); }
            if (key === 'Backspace') deleteLast();
            if (key === 'Escape') clearAll();
        });
    </script>
</body>
</html>
