<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 기기에서 올바른 비율로 보이게 하는 필수 태그 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>웹 메모장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 커스텀 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        textarea {
            resize: none;
            outline: none;
        }
        
        /* 모달 애니메이션 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px) translateX(-50%); } to { opacity: 1; transform: translateY(0) translateX(-50%); } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0) translateX(-50%); } to { opacity: 0; transform: translateY(-10px) translateX(-50%); } }
        .toast-enter { animation: fadeIn 0.3s ease forwards; }
        .toast-exit { animation: fadeOut 0.3s ease forwards; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col items-center p-2 sm:p-4 md:p-8">

    <div class="w-full max-w-4xl bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden flex flex-col h-[90vh] sm:h-[85vh]">
        
        <!-- 상단 헤더 영역 -->
        <header class="bg-gray-50 border-b border-gray-200 p-3 sm:p-4 flex flex-col gap-3">
            
            <!-- 1열: 파일 이름 & 확장자 -->
            <div class="flex w-full gap-2">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    </div>
                    <input type="text" id="fileName" value="제목 없는 메모" 
                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-shadow"
                        placeholder="파일 이름을 입력하세요">
                </div>
                <select id="fileExt" class="block w-28 sm:w-36 py-2 px-3 border border-gray-300 bg-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-gray-700 transition-shadow outline-none cursor-pointer">
                    <option value=".txt">.txt (일반)</option>
                    <option value=".md">.md (마크다운)</option>
                    <option value=".html">.html (웹 문서)</option>
                    <option value=".json">.json (데이터)</option>
                    <option value=".csv">.csv (표)</option>
                </select>
            </div>

            <!-- 2열: 버튼들 -->
            <div class="flex w-full gap-2">
                <button id="btnSave" class="flex-1 flex justify-center items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white py-2 px-3 rounded-lg text-sm font-medium transition-colors shadow-sm active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    저장
                </button>
                <button id="btnSaveAs" class="flex-1 flex justify-center items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-3 rounded-lg text-sm font-medium transition-colors shadow-sm active:scale-95 whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    다른 이름으로 저장
                </button>
                <button id="btnClear" class="flex-none flex justify-center items-center gap-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 py-2 px-3 sm:px-4 rounded-lg text-sm font-medium transition-colors shadow-sm active:scale-95" title="내용 비우기">
                    <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    <span class="hidden sm:inline">지우기</span>
                </button>
            </div>
        </header>

        <!-- 텍스트 에디터 영역 -->
        <main class="flex-grow p-0 relative">
            <textarea id="editor" class="w-full h-full p-4 sm:p-6 text-gray-800 text-base sm:text-lg leading-relaxed bg-white" placeholder="이곳에 메모를 작성하세요..."></textarea>
        </main>

        <!-- 하단 상태 표시줄 -->
        <footer class="bg-gray-50 border-t border-gray-200 p-2 sm:p-3 px-4 flex justify-between items-center text-xs sm:text-sm text-gray-500">
            <div id="charCount">글자 수: 0</div>
            <div class="flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="hidden sm:inline">PC: 자동 덮어쓰기 지원 / 모바일: 다운로드 방식</span>
                <span class="inline sm:hidden">다운로드 폴더에 저장됩니다.</span>
            </div>
        </footer>
    </div>

    <!-- 커스텀 토스트 알림창 -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm z-50 hidden text-center">
        <!-- 메시지 내용이 여기에 들어갑니다 -->
    </div>

    <script>
        // 요소 참조
        const editor = document.getElementById('editor');
        const fileNameInput = document.getElementById('fileName');
        const fileExtSelect = document.getElementById('fileExt');
        const charCount = document.getElementById('charCount');
        const btnSave = document.getElementById('btnSave');
        const btnSaveAs = document.getElementById('btnSaveAs');
        const btnClear = document.getElementById('btnClear');
        const toast = document.getElementById('toast');

        // File System Access API용 핸들 (PC용)
        let currentFileHandle = null;

        // 글자 수 세기 기능
        editor.addEventListener('input', () => {
            const length = editor.value.length;
            charCount.textContent = `글자 수: ${length.toLocaleString()}`;
        });

        // MIME 타입 반환 함수
        function getMimeType(ext) {
            switch(ext) {
                case '.txt': case '.md': return 'text/plain';
                case '.html': return 'text/html';
                case '.json': return 'application/json';
                case '.csv': return 'text/csv';
                default: return 'text/plain';
            }
        }

        // 전체 파일 이름 생성 로직 (확장자 중복 방지)
        function getFullFileName() {
            let name = fileNameInput.value.trim();
            if (!name) name = "제목 없는 메모";
            const ext = fileExtSelect.value;
            
            // 사용자가 입력칸에 이미 확장자를 적었을 경우 제거
            if (name.endsWith(ext)) {
                name = name.slice(0, -ext.length);
            } else if (name.includes('.') && name.split('.').pop().length <= 4) {
                // 임의의 다른 확장자를 적었을 경우 (예: test.png) 그냥 뒤에 붙임
                // 사용자가 의도한 것일 수도 있으므로 보존
            }
            
            return name + ext;
        }

        // 토스트 알림 표시 함수
        let toastTimeout;
        function showToast(message, duration = 3000) {
            toast.innerHTML = message;
            toast.classList.remove('hidden', 'toast-exit');
            toast.classList.add('toast-enter');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, duration);
        }

        // 구형 다운로드 방식 (모바일 및 호환성 폴백)
        function fallbackDownload(content, filename, mimeType) {
            try {
                const blob = new Blob([content], { type: mimeType });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                
                // 모바일 환경을 위한 DOM 추가
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 200);

                showToast("다운로드가 시작되었습니다.<br><small style='color:#ccc; font-weight:normal;'>※ 무반응 시, 우측 상단 메뉴 ➔ '기본 브라우저로 열기'를 눌러주세요.</small>", 4000);
            } catch (error) {
                console.error("다운로드 실패:", error);
                showToast("다운로드에 실패했습니다.");
            }
        }

        // 저장 기능 (Save)
        async function handleSave() {
            const content = editor.value;
            const filename = getFullFileName();
            
            // PC 환경: 이전에 [다른 이름으로 저장]으로 파일 핸들을 얻은 경우 덮어쓰기
            if (window.showSaveFilePicker && currentFileHandle) {
                try {
                    const writable = await currentFileHandle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    showToast("파일이 저장(덮어쓰기) 되었습니다.");
                    return;
                } catch (err) {
                    console.error("덮어쓰기 실패:", err);
                    // 권한 만료 등의 이유로 실패 시 일반 저장 로직으로 넘어감
                }
            }
            
            // 핸들이 없거나 모바일 환경인 경우 [다른 이름으로 저장] 로직 실행
            handleSaveAs();
        }

        // 다른 이름으로 저장 기능 (Save As)
        async function handleSaveAs() {
            const content = editor.value;
            const filename = getFullFileName();
            const ext = fileExtSelect.value;
            const mimeType = getMimeType(ext);

            // 1. 최신 File System Access API 지원 환경 (주로 PC 크롬/엣지)
            if (window.showSaveFilePicker) {
                try {
                    const opts = {
                        suggestedName: filename,
                        types: [{
                            description: 'Text/Data file',
                            accept: { [mimeType]: [ext] },
                        }],
                    };
                    // 파일 저장 위치 선택 창 띄우기
                    currentFileHandle = await window.showSaveFilePicker(opts);
                    
                    const writable = await currentFileHandle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    
                    // 파일 이름을 사용자가 지정한 이름으로 갱신
                    fileNameInput.value = currentFileHandle.name.replace(ext, '');
                    showToast("선택하신 경로에 저장되었습니다.");
                    return;
                } catch (err) {
                    // 사용자가 취소(AbortError)한 경우 아무 동작 안 함
                    if (err.name === 'AbortError') return;
                    console.error("File System API Error:", err);
                    // 실패 시 구형 방식으로 fallback
                }
            }

            // 2. 미지원 환경 (모바일, Safari, 인앱 브라우저 등)
            fallbackDownload(content, filename, mimeType);
        }

        // 버튼 이벤트 연결
        btnSave.addEventListener('click', handleSave);
        btnSaveAs.addEventListener('click', handleSaveAs);
        
        btnClear.addEventListener('click', () => {
            if(confirm("작성된 내용을 모두 지우시겠습니까?")) {
                editor.value = "";
                editor.focus();
                charCount.textContent = "글자 수: 0";
                currentFileHandle = null; // 초기화
            }
        });

        // 단축키 지원 (Ctrl+S / Cmd+S)
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                // Shift를 같이 누르면 무조건 '다른 이름으로 저장'
                if (e.shiftKey) {
                    handleSaveAs();
                } else {
                    handleSave();
                }
            }
        });
    </script>
</body>
</html>
