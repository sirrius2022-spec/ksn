<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>웹 메모장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        textarea { resize: none; outline: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px) translateX(-50%); } to { opacity: 1; transform: translateY(0) translateX(-50%); } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0) translateX(-50%); } to { opacity: 0; transform: translateY(-10px) translateX(-50%); } }
        .toast-enter { animation: fadeIn 0.3s ease forwards; }
        .toast-exit { animation: fadeOut 0.3s ease forwards; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col items-center p-0 sm:p-4 md:p-8">

    <div class="w-full max-w-4xl bg-white sm:rounded-xl sm:shadow-lg border-x-0 sm:border border-gray-200 overflow-hidden flex flex-col h-[100vh] sm:h-[85vh]">
        
        <div class="bg-gray-800 text-white px-4 py-2 flex justify-between items-center">
            <div class="flex items-center gap-2 font-medium">
                <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                <span>웹 메모장</span>
            </div>
            <button id="btnClose" class="text-gray-300 hover:text-white transition-colors p-1" title="창 닫기">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <header class="bg-gray-50 border-b border-gray-200 p-3 flex flex-col gap-3">
            
            <div class="flex w-full gap-2">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    </div>
                    <input type="text" id="fileName" value="제목 없는 메모" 
                        class="block w-full pl-9 pr-2 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm transition-shadow"
                        placeholder="파일 이름">
                </div>
                <select id="fileExt" class="block w-24 sm:w-32 py-2 px-2 border border-gray-300 bg-white rounded-lg focus:ring-2 focus:ring-blue-500 text-sm text-gray-700 outline-none cursor-pointer">
                    <option value=".txt">.txt</option>
                    <option value=".md">.md</option>
                    <option value=".html">.html</option>
                    <option value=".json">.json</option>
                    <option value=".csv">.csv</option>
                </select>
            </div>

            <div class="flex w-full gap-2">
                <button id="btnSave" class="flex-1 flex justify-center items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white py-2 px-2 rounded-lg text-sm font-medium transition-colors shadow-sm active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    <span>저장</span>
                </button>
                <button id="btnSaveAs" class="flex-[1.5] flex justify-center items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-2 rounded-lg text-sm font-medium transition-colors shadow-sm active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span class="truncate">다른 이름 저장</span>
                </button>
                <button id="btnClear" class="flex-none flex justify-center items-center gap-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 py-2 px-3 rounded-lg text-sm font-medium transition-colors shadow-sm active:scale-95" title="내용 비우기">
                    <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    <span class="hidden sm:inline">지우기</span>
                </button>
            </div>
        </header>

        <main class="flex-grow p-0 relative">
            <textarea id="editor" class="w-full h-full p-4 sm:p-6 text-gray-800 text-base leading-relaxed bg-white" placeholder="이곳에 메모를 작성하세요..."></textarea>
        </main>

        <footer class="bg-gray-50 border-t border-gray-200 p-2 sm:p-3 px-4 flex justify-between items-center text-xs sm:text-sm text-gray-500">
            <div id="charCount">글자 수: 0</div>
            <div class="flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="hidden sm:inline">PC: 자동 덮어쓰기 지원 / 모바일: 다운로드 방식</span>
                <span class="inline sm:hidden">모바일 다운로드 모드</span>
            </div>
        </footer>
    </div>

    <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm z-50 hidden text-center w-max max-w-[90vw]">
    </div>

    <script>
        const editor = document.getElementById('editor');
        const fileNameInput = document.getElementById('fileName');
        const fileExtSelect = document.getElementById('fileExt');
        const charCount = document.getElementById('charCount');
        const btnSave = document.getElementById('btnSave');
        const btnSaveAs = document.getElementById('btnSaveAs');
        const btnClear = document.getElementById('btnClear');
        const btnClose = document.getElementById('btnClose');
        const toast = document.getElementById('toast');

        let currentFileHandle = null;

        editor.addEventListener('input', () => {
            charCount.textContent = `글자 수: ${editor.value.length.toLocaleString()}`;
        });

        function getMimeType(ext) {
            switch(ext) {
                case '.html': return 'text/html';
                case '.json': return 'application/json';
                case '.csv': return 'text/csv';
                default: return 'text/plain';
            }
        }

        function getFullFileName() {
            let name = fileNameInput.value.trim() || "제목 없는 메모";
            const ext = fileExtSelect.value;
            if (name.endsWith(ext)) name = name.slice(0, -ext.length);
            return name + ext;
        }

        let toastTimeout;
        function showToast(message, duration = 3000) {
            toast.innerHTML = message;
            toast.classList.remove('hidden', 'toast-exit');
            toast.classList.add('toast-enter');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, duration);
        }

        function fallbackDownload(content, filename, mimeType) {
            try {
                const blob = new Blob([content], { type: mimeType });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 200);

                showToast("다운로드가 시작되었습니다.");
            } catch (error) {
                showToast("다운로드에 실패했습니다.");
            }
        }

        async function handleSave() {
            const content = editor.value;
            if (window.showSaveFilePicker && currentFileHandle) {
                try {
                    const writable = await currentFileHandle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    showToast("파일이 덮어쓰기 되었습니다.");
                    return;
                } catch (err) { }
            }
            handleSaveAs();
        }

        async function handleSaveAs() {
            const content = editor.value;
            const filename = getFullFileName();
            const ext = fileExtSelect.value;
            const mimeType = getMimeType(ext);

            if (window.showSaveFilePicker) {
                try {
                    currentFileHandle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{ description: 'Text/Data file', accept: { [mimeType]: [ext] } }],
                    });
                    
                    const writable = await currentFileHandle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    
                    fileNameInput.value = currentFileHandle.name.replace(ext, '');
                    showToast("선택하신 경로에 저장되었습니다.");
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }
            fallbackDownload(content, filename, mimeType);
        }

        btnSave.addEventListener('click', handleSave);
        btnSaveAs.addEventListener('click', handleSaveAs);
        
        btnClear.addEventListener('click', () => {
            if(confirm("작성된 내용을 모두 지우시겠습니까?")) {
                editor.value = "";
                editor.focus();
                charCount.textContent = "글자 수: 0";
                currentFileHandle = null;
            }
        });

                // 창 닫기 로직 (수정됨)
        btnClose.addEventListener('click', () => {
            if (editor.value.length > 0) {
                if (!confirm("작성 중인 내용이 있습니다. 정말 메모장을 닫으시겠습니까?")) {
                    return;
                }
            }
            
            // 1. 브라우저 탭 닫기 강제 시도 (우회 기법)
            window.opener = null;
            window.open('', '_self');
            window.close();
            
            // 2. 모바일 브라우저 보안 정책상 창 닫기가 안 먹힐 경우를 대비한 안전장치
            // 방명록 등 이전 기록으로 가지 않고 메인 홈페이지로 확실하게 이동합니다.
            setTimeout(() => {
                location.href = 'https://sirrius2022-spec.github.io/ksn/';
            }, 300);
        });


        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                e.shiftKey ? handleSaveAs() : handleSave();
            }
        });
    </script>
</body>
</html>
