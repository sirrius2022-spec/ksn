<script>
/* ===== 엔진: 탄소성 보-스프링 단계별 굴착 해석 (Rankine 토압) ===== */
/* i18n */
let LANG = 'ko';
const T = (ko, ja) => LANG === 'ja' ? ja : ko;
const GJ = {'벽체':'壁体','변위':'変位','근입':'根入れ','히빙':'ヒービング','토류판':'土留め板','띠장':'腹起し','버팀보':'切梁','앵커':'アンカー'};
const gname = k => LANG === 'ja' ? GJ[k] : k;
const GW = 9.81;
const rad = d => d * Math.PI / 180;
const HSEC = {
  'H-200x200x8x12':  {d:200,bf:200,tw:8, tf:12,A:63.53,I:4720, Z:472, ry:5.02},
  'H-250x250x9x14':  {d:250,bf:250,tw:9, tf:14,A:92.18,I:10800,Z:867, ry:6.29},
  'H-300x300x10x15': {d:300,bf:300,tw:10,tf:15,A:119.8,I:20400,Z:1360,ry:7.51},
  'H-350x350x12x19': {d:350,bf:350,tw:12,tf:19,A:173.9,I:40300,Z:2300,ry:8.84},
  'H-400x400x13x21': {d:400,bf:400,tw:13,tf:21,A:218.7,I:66600,Z:3330,ry:10.1}
};
const SSEC = {
  'SP-III': {I:16800,Z:1340,A:191,  Aw:40.6},
  'SP-IV':  {I:38600,Z:2270,A:242.5,Aw:65.9}
};
function layerAt(layers, z){
  let acc = 0;
  for (let i = 0; i < layers.length; i++){
    acc += layers[i].t;
    if (z < acc - 1e-9 || i === layers.length - 1) return layers[i];
  }
}
function memberProps(inp){
  const E = inp.mat.Es; // MPa
  const wt = inp.wallType;
  if (wt === 'hpile' || wt === 'scw'){
    const p = inp.pile;
    const sec = p.sec === 'custom' ? p.custom : HSEC[p.sec];
    const Aw = sec.Aw != null ? sec.Aw : sec.d * sec.tw / 100;
    const bf = sec.bf || 300;
    const Wa = p.s;
    const Wp = wt === 'hpile' ? Math.min(p.s, p.kpass * bf / 1000) : p.s;
    return {kind:'steel', label: (wt==='hpile'?T('H-Pile+토류판 ','H形鋼杭+土留め板 '):T('SCW(H-Pile 삽입) ','SCW(H形鋼挿入) ')) + (p.sec==='custom'?T('사용자단면','ユーザー断面'):p.sec) + ' @' + p.s.toFixed(2) + 'm',
      EI: E * 1000 * sec.I * 1e-8, Z: sec.Z, A: sec.A, Aw, bf, Wa, Wp, s: p.s, sec, lagging: wt === 'hpile'};
  }
  if (wt === 'sheet'){
    const sp = inp.sheet;
    const sec = sp.sec === 'custom' ? sp.custom : SSEC[sp.sec];
    return {kind:'steel', label:T('강널말뚝 ','鋼矢板 ') + (sp.sec==='custom'?T('사용자단면','ユーザー断面'):sp.sec) + T(' (1m당)',' (1mあたり)'),
      EI: E * 1000 * sec.I * 1e-8, Z: sec.Z, A: sec.A, Aw: sec.Aw, bf: 0, Wa: 1, Wp: 1, s: 1, sec, lagging: false};
  }
  const c = inp.cip;
  const Ig = Math.PI * Math.pow(c.D, 4) / 64;
  return {kind:'rc', label:'CIP Ø' + (c.D*1000).toFixed(0) + ' @' + c.s.toFixed(2) + 'm',
    EI: c.Ec * 1000 * Ig * c.red, Z: 0, A: 0, Aw: 0, bf: 0, Wa: c.s, Wp: c.s, s: c.s, Mcap: c.Ma, lagging: false};
}
function solveLinear(A, b, N){
  for (let c = 0; c < N; c++){
    let p = c, mx = Math.abs(A[c][c]);
    for (let r = c + 1; r < N; r++){ const v = Math.abs(A[r][c]); if (v > mx){ mx = v; p = r; } }
    if (p !== c){ const t = A[c]; A[c] = A[p]; A[p] = t; const tb = b[c]; b[c] = b[p]; b[p] = tb; }
    const d = A[c][c];
    for (let r = c + 1; r < N; r++){
      const f = A[r][c] / d;
      if (f === 0) continue;
      const Ar = A[r], Ac = A[c];
      for (let k = c; k < N; k++) Ar[k] -= f * Ac[k];
      b[r] -= f * b[c];
    }
  }
  const x = new Array(N).fill(0);
  for (let r = N - 1; r >= 0; r--){
    let s = b[r];
    for (let k = r + 1; k < N; k++) s -= A[r][k] * x[k];
    x[r] = s / A[r][r];
  }
  return x;
}
function analyze(inp){
  const m = memberProps(inp);
  const dz = inp.dz || 0.25;
  const H = inp.H;
  const L = Math.ceil((H + inp.D) / dz - 1e-9) * dz;
  const n = Math.round(L / dz) + 1;
  const z = Array.from({length: n}, (_, i) => i * dz);
  const tr = z.map((_, i) => (i === 0 || i === n - 1) ? dz / 2 : dz);
  const Wa = m.Wa, Wp = m.Wp, EI = m.EI;
  const lay = z.map(zi => layerAt(inp.layers, Math.min(zi + 1e-6, L)));
  const Ka = lay.map(l => Math.pow(Math.tan(rad(45 - l.phi / 2)), 2));
  const Kp = lay.map(l => Math.pow(Math.tan(rad(45 + l.phi / 2)), 2));
  const K0 = lay.map(l => 1 - Math.sin(rad(l.phi)));
  const gam = s => { const l = layerAt(inp.layers, s); return (inp.useWater && s > inp.hw) ? Math.max(l.gs - GW, 1) : l.gt; };
  const integ = (z0, z1) => {
    if (z1 <= z0) return 0;
    const N = Math.max(1, Math.ceil((z1 - z0) / 0.05)), h = (z1 - z0) / N;
    let s = 0; for (let i = 0; i < N; i++) s += gam(z0 + (i + .5) * h);
    return s * h;
  };
  const sv0 = z.map(zi => integ(0, zi));
  const svb = sv0.map(v => v + inp.q);
  const paB = z.map((_, i) => Math.max(0, Ka[i] * svb[i] - 2 * lay[i].c * Math.sqrt(Ka[i])));
  const ppB = z.map((_, i) => Kp[i] * svb[i] + 2 * lay[i].c * Math.sqrt(Kp[i]));
  const khN = lay.map(l => l.kh);
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  // 지보 목록
  const sup = inp.supports.filter(s => s.z < H - 1e-6).slice().sort((a, b) => a.z - b.z).map(s => {
    const idx = Math.round(s.z / dz);
    let ku, cosA = 1, Pax = s.P;
    if (inp.supportType === 'strut'){
      const sec = HSEC[inp.strut.sec];
      ku = 2 * inp.mat.Es * 1000 * sec.A * 1e-4 / inp.strut.B;
    } else {
      const a = inp.anchor; cosA = Math.cos(rad(a.ang));
      ku = a.E * 1000 * a.A * 1e-6 / a.Lf * cosA * cosA;
    }
    return {z: z[idx], idx, sh: s.sh, P: s.P, cosA, kM: ku * m.s / s.sh, Ph: (inp.supportType === 'strut' ? s.P : s.P * cosA) * m.s / s.sh, xi: 0};
  });
  // 굴착 단계
  const dList = [];
  sup.forEach(s => dList.push(Math.min(H, s.z + inp.clr)));
  if (!dList.length || dList[dList.length - 1] < H - 1e-6) dList.push(H);
  const stages = [];
  let x = new Array(n).fill(0), x0 = new Array(n).fill(0);
  let Fb0 = z.map((_, i) => clamp(K0[i] * svb[i], paB[i], ppB[i]) * Wa * tr[i]);
  let Ff0 = z.map((_, i) => K0[i] * sv0[i] * Wa * tr[i]);
  const h = dz;
  for (let k = 0; k < dList.length; k++){
    const d = dList[k];
    const act = sup.filter((s, j) => j < k);

function runChecks(inp, res){
  const m = res.m, H = inp.H, mat = inp.mat, out = [];
  const fb = mat.fb0 * mat.alpha, fv = mat.fv0 * mat.alpha;
  const add = (g, name, val, lim, unit, mode, note) => {
    const ratio = mode === 'min' ? (val > 0 ? lim / val : 0) : val / lim;
    out.push({gk: g, g: gname(g), name, val, lim, unit, mode: mode || 'max', ratio, ok: mode === 'min' ? val >= lim : val <= lim, note: note || ''});
  };
  // 1) 벽체 휨/전단
  if (m.kind === 'steel'){
    const sb = res.Mx.v * 1000 / m.Z, tv = res.Vx.v * 1000 / (m.Aw * 100);
    add('벽체', T('휨응력 σb','曲げ応力 σb'), sb, fb, 'MPa', 'max', 'Mmax=' + res.Mx.v.toFixed(1) + ' kN·m @GL-' + res.Mx.z.toFixed(2));
    add('벽체', T('전단응력 τ','せん断応力 τ'), tv, fv, 'MPa', 'max', 'Vmax=' + res.Vx.v.toFixed(1) + ' kN @GL-' + res.Vx.z.toFixed(2));
  } else {
    add('벽체', T('휨모멘트 M (본당)','曲げモーメント M (1本あたり)'), res.Mx.v, m.Mcap, 'kN·m', 'max', T('허용휨모멘트는 배근에 따라 사용자 입력','許容曲げモーメントは配筋に応じてユーザー入力'));
  }
  // 2) 변위
  const dl = H * inp.limits.dispPct / 100 * 1000;
  add('변위', T('최대 수평변위 δmax','最大水平変位 δmax'), Math.abs(res.Wx.v) * 1000, dl, 'mm', 'max', 'δmax @GL-' + res.Wx.z.toFixed(2) + T(', 허용=H×',', 許容=H×') + inp.limits.dispPct + '%');
  // 3) 근입 안정 (모멘트 평형)
  {
    const d = H, L = res.L, zs = res.sup.length ? res.sup[res.sup.length - 1].z : L;
    const f = res.lastF; let Ma = 0, Mp = 0;
    const dz = res.dz;
    for (let i = 0; i < res.n; i++){
      const zi = res.z[i], t = (i === 0 || i === res.n - 1) ? dz / 2 : dz;
      const arm = res.sup.length ? zi - zs : L - zi;
      Ma += res.paB[i] * m.Wa * t * arm;
      if (inp.useWater){
        const pw = GW * Math.max(0, zi - inp.hw) - (zi > d ? GW * Math.max(0, zi - Math.max(inp.hw, d)) : 0);
        Ma += pw * m.Wa * t * arm;
      }
      if (f.hasF[i]) Mp += f.ppF[i] * m.Wp * t * arm;
    }
    const piv = res.sup.length ? T('최하단 지보(GL-','最下段支保工(GL-') + zs.toFixed(1) + 'm)' : T('선단(자립식)','先端(自立式)');
    out.push({gk:'근입', g:gname('근입'), name:T('근입 안정 Fs=Mp/Ma','根入れ安定 Fs=Mp/Ma'), val: Ma > 0 ? Mp / Ma : 99, lim: inp.limits.FsEmb, unit:'-', mode:'min',
      ratio: Ma > 0 ? inp.limits.FsEmb / (Mp / Ma) : 0, ok: Ma <= 0 || Mp / Ma >= inp.limits.FsEmb,
      note: piv + T(' 중심, Ma=',' 中心, Ma=') + Ma.toFixed(0) + ', Mp=' + Mp.toFixed(0) + ' kN·m'});

  }
  // 4) 히빙

    const l = layerAt(inp.layers, H + 1e-6);

      const Bw = inp.strut.B, B1 = 0.7 * Bw;
      let gH = 0; { const N = Math.ceil(H / 0.05); for (let i = 0; i < N; i++){ const zz = (i + .5) * H / N; gH += layerAt(inp.layers, zz).gt * H / N; } }

      out.push({gk:'히빙', g:gname('히빙'), name:T('히빙 Fs (Terzaghi)','ヒービング Fs (Terzaghi)'), val: FsC, lim: inp.limits.FsHeave, unit:'-', mode:'min', ratio: inp.limits.FsHeave / FsC, ok: FsC >= inp.limits.FsHeave, note:T('굴착저면 점성토 c=','掘削底面 粘性土 c=') + l.c + ' kN/m²'});
    } else out.push({gk:'히빙', g:gname('히빙'), name:T('히빙 검토','ヒービング検討'), na:true, note:T('굴착저면 지반이 사질토/φ>5° → 해당없음','掘削底面が砂質土/φ>5° → 該当なし'), ok:true});

    const Lc = Math.max(0.05, m.s - m.bf / 1000);
    const Mw = pmax * Lc * Lc / 8;
    const sw = Mw * 1e6 / (1000 * lg.t * lg.t / 6);
    add('토류판', T('토류판 휨응력','土留め板 曲げ応力'), sw, lg.fb * mat.alpha, 'MPa', 'max', 't=' + lg.t + 'mm' + T(', 순경간 ',', 純スパン ') + Lc.toFixed(2) + 'm, pmax=' + pmax.toFixed(1) + ' kN/m²');
  }
  // 6) 지보재
  if (res.sup.length){
    const maxN = Math.max.apply(null, res.sup.map(s => s.N));
    const maxRh = Math.max.apply(null, res.sup.map(s => s.Rh));
    const maxSh = Math.max.apply(null, res.sup.map(s => s.sh));

    add('띠장', T('띠장 휨응력','腹起し 曲げ応力'), Mw * 1000 / Zw, fb, 'MPa', 'max', inp.wale.sec + ' ×' + inp.wale.n + ', M=' + Mw.toFixed(1) + ' kN·m (wL²/10)');
    add('띠장', T('띠장 전단응력','腹起し せん断応力'), Vw * 1000 / (ws.d * ws.tw / 100 * inp.wale.n * 100), fv, 'MPa', 'max', 'V=' + Vw.toFixed(1) + ' kN (0.6wL)');
    if (inp.supportType === 'strut'){
      const ss = HSEC[inp.strut.sec];
      const lam = inp.strut.Lk * 100 / ss.ry;

    } else {
      const a = inp.anchor;
      const Ta = a.ratio * a.fpu * a.A / 1000;
      add('앵커', T('앵커 인장력 T','アンカー 引張力 T'), maxN, Ta, 'kN', 'max', T('Tmax(설계)=','Tmax(設計)=') + maxN.toFixed(0) + ' kN, Ta=' + a.ratio + '·fpu·A');
      const La = maxN / (Math.PI * a.dia / 1000 * a.tau);
      add('앵커', T('필요 정착장','必要定着長'), La, a.Lb, 'm', 'max', 'La=T/(π·d·τba), τba=' + a.tau + ' kN/m²');
    }
  }
  return out;
}

    h += `<div class="grp"><h3>${T('검토 기준','照査基準')}</h3><div class="grid2">${F('limits.dispPct', T('허용 수평변위 (H 대비)','許容水平変位 (H比)'), '%', {step:0.05})}${F('limits.FsEmb', T('근입 안정 Fs','根入れ安定 Fs'), T('이상','以上'), {step:0.05})}${F('limits.FsHeave', T('히빙 Fs','ヒービング Fs'), T('이상','以上'), {step:0.05})}${SEL('dz', T('해석 절점간격','解析節点間隔'), [[0.25, T('0.25 m (정밀)','0.25 m (精密)')], [0.5, T('0.5 m (빠름)','0.5 m (高速)')]])}</div></div>`;
    h += `<div class="grp"><h3>${T('해석 가정','解析の仮定')}</h3><p class="note">${T('Rankine 주동·수동토압을 한계값으로 하는 탄소성 지반스프링(kh)과 Euler 보 요소로 굴착 단계별 누적 해석합니다. 초기토압은 정지토압(K₀=1−sinφ)이며, 굴착면 측 토압은 굴착 시 제거됩니다. 지보재는 설치 단계 이후 선형 스프링으로 모델링하고 해체 단계는 고려하지 않습니다.','Rankine主働・受働土圧を限界値とする弾塑性地盤ばね(kh)とEulerはり要素で、掘削ステップごとに累積解析します。初期土圧は静止土圧(K₀=1−sinφ)とし、掘削側の土圧は掘削時に除去されます。支保工は設置ステップ以降に線形ばねとしてモデル化し、撤去ステップは考慮しません。')}</p></div>`;

/* ---------- 입력 이벤트 ---------- */
let tmr = null;
function schedule(){ clearTimeout(tmr); tmr = setTimeout(run, 120); }
$('#inBody').addEventListener('input', e => {
  const t = e.target; const k = t.dataset.k; if (!k) return;
  let v;
  if (t.type === 'number') v = t.value === '' ? NaN : parseFloat(t.value);
  else if (t.type === 'checkbox') v = t.checked;
  else v = t.value;
  setp(S, k, v); if (t.tagName !== 'SELECT') schedule();
});
$('#inBody').addEventListener('change', e => {
  const t = e.target; const k = t.dataset.k; if (!k) return;
  if (t.tagName === 'SELECT'){
    let v = t.value; if (k === 'dz' || k === 'wale.n') v = parseFloat(v);
    setp(S, k, v); if (t.dataset.s) renderInputs(); schedule();
  } else if (t.type === 'checkbox') { setp(S, k, t.checked); schedule(); }
});
$('#inBody').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]'), ad = e.target.closest('[data-add]');
  if (rm){ const [arr, i] = rm.dataset.rm.split('.'); S[arr].splice(+i, 1); renderInputs(); schedule(); }
  if (ad){
    if (ad.dataset.add === 'layer'){ const l = S.layers[S.layers.length - 1]; S.layers.push({name:NEWL[LANG], t:5, gt:l.gt, gs:l.gs, c:l.c, phi:l.phi, kh:l.kh}); }
    else { const l = S.supports[S.supports.length - 1]; S.supports.push({z: l ? Math.min(+(l.z + 3).toFixed(1), Math.max(S.H - 1, 1)) : 1.5, sh: l ? l.sh : 3, P: 0}); }
    renderInputs(); schedule();
  }
});
function tabs(id, cb){
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button[data-t]'); if (!b) return;
    $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
    cb(b.dataset.t);
  });
}
tabs('#inTabs', t => { inTab = t; renderInputs(); });
tabs('#outTabs', t => { document.querySelectorAll('#oBody>[data-p]').forEach(p => p.hidden = p.dataset.p !== t); });
function setView(v){ document.body.dataset.view = v; $('#vIn').setAttribute('aria-pressed', v === 'in'); $('#vOut').setAttribute('aria-pressed', v === 'out'); }
$('#vIn').onclick = () => setView('in'); $('#vOut').onclick = () => setView('out'); setView('in');

/* ---------- 검증 ---------- */
function validate(s){
  const e = [], nf = (v, name, min = 0, strict = true) => { if (!isFinite(v) || (strict ? v <= min : v < min)) e.push(name + T(' 값을 확인하십시오.',' の値を確認してください。')); };
  const LY = i => T((i + 1) + '번 지층', '地層' + (i + 1)), LS = i => T((i + 1) + '단', '第' + (i + 1) + '段');
  nf(s.H, T('굴착깊이','掘削深さ')); nf(s.D, T('근입깊이','根入れ深さ')); nf(s.q, T('상재하중','上載荷重'), 0, false); nf(s.hw, T('지하수위','地下水位'), 0, false); nf(s.clr, T('굴착 여유','掘削余裕'), 0, false);
  if (s.layers.length < 1) e.push(T('지층이 없습니다.','地層がありません。'));
  s.layers.forEach((l, i) => {
    nf(l.t, LY(i) + T(' 두께',' 厚さ')); nf(l.gt, LY(i) + ' γt'); nf(l.gs, LY(i) + ' γsat'); nf(l.c, LY(i) + ' c', 0, false);
    nf(l.kh, LY(i) + ' kh');
    if (!isFinite(l.phi) || l.phi < 0 || l.phi > 50) e.push(LY(i) + T(' φ는 0~50° 범위로 입력하십시오.',' のφは0~50°の範囲で入力してください。'));
  });
  nf(s.mat.Es, 'Es'); nf(s.mat.fb0, T('허용휨','許容曲げ')); nf(s.mat.fv0, T('허용전단','許容せん断')); nf(s.mat.alpha, T('할증계수','割増係数'));
  nf(s.limits.dispPct, T('허용변위','許容変位')); nf(s.limits.FsEmb, T('근입 Fs','根入れ Fs')); nf(s.limits.FsHeave, T('히빙 Fs','ヒービング Fs'));
  if (s.wallType === 'hpile' || s.wallType === 'scw'){
    nf(s.pile.s, T('말뚝 간격','杭間隔')); if (s.wallType === 'hpile'){ nf(s.pile.kpass, T('수동폭 계수','受働幅係数')); nf(s.lag.t, T('토류판 두께','土留め板厚')); nf(s.lag.fb, T('목재 허용휨','木材許容曲げ')); }
    if (s.pile.sec === 'custom') ['d', 'bf', 'tw', 'A', 'I', 'Z'].forEach(k => nf(s.pile.custom[k], T('사용자 H형강 ','ユーザーH形鋼 ') + k));
  } else if (s.wallType === 'sheet'){
    if (s.sheet.sec === 'custom') ['I', 'Z', 'A', 'Aw'].forEach(k => nf(s.sheet.custom[k], T('사용자 강널말뚝 ','ユーザー鋼矢板 ') + k));
  } else { nf(s.cip.D, T('CIP 직경','CIP杭径')); nf(s.cip.s, T('CIP 간격','CIP杭間隔')); nf(s.cip.Ec, 'Ec'); nf(s.cip.red, T('유효강성비','有効剛性比')); nf(s.cip.Ma, T('허용휨모멘트','許容曲げモーメント')); }
  s.supports.forEach((p, i) => {
    nf(p.z, LS(i) + T(' 설치깊이',' 設置深さ')); nf(p.sh, LS(i) + T(' 수평간격',' 水平間隔')); nf(p.P, LS(i) + T(' 선행하중',' プレロード'), 0, false);
    if (isFinite(p.z) && isFinite(s.H) && p.z > s.H - s.clr + 1e-6) e.push(LS(i) + T(' 설치깊이는 굴착깊이−굴착여유(',' 設置深さは掘削深さ−掘削余裕(') + (s.H - s.clr).toFixed(2) + T('m) 이하여야 합니다.','m)以下としてください。'));
  });
  if (s.supportType === 'strut'){ nf(s.strut.B, T('굴착폭','掘削幅')); nf(s.strut.Lk, T('좌굴길이','座屈長')); }
  else ['A', 'E', 'Lf', 'Lb', 'dia', 'tau', 'fpu', 'ratio'].forEach(k => nf(s.anchor[k], T('앵커 ','アンカー ') + k));
  if (s.supportType === 'anchor' && (!isFinite(s.anchor.ang) || s.anchor.ang < 0 || s.anchor.ang > 60)) e.push(T('앵커 설치각은 0~60° 범위로 입력하십시오.','アンカー設置角は0~60°の範囲で入力してください。'));
  if (isFinite(s.H) && isFinite(s.D) && (s.H + s.D) / s.dz > 220) e.push(T('벽체 길이가 과대합니다. 절점간격을 0.5m로 선택하십시오.','壁体が長すぎます。節点間隔を0.5mにしてください。'));
  return e;
}

/* ---------- 도해 공통 ---------- */
const FONT = () => LANG === 'ja' ? "'Yu Gothic','Meiryo','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif" : "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";
function pal(lit){
  return lit ? {fg:'#14202B', mu:'#566676', line:'#C9D1D9', acc:'#1B5CA6', wall:'#4D5C6B', sup:'#C25E1E', bg:'#FFFFFF', ok:'#1C7C4D', ng:'#B83227', wat:'#2B7BB9'}
             : {fg:'var(--fg)', mu:'var(--mu)', line:'var(--line)', acc:'var(--acc)', wall:'var(--wall)', sup:'var(--sup)', bg:'var(--surf)', ok:'var(--ok)', ng:'var(--ng)', wat:'#3C8FD0'};
}
function kit(P){
  return {
    tx:(x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || 'start'}" style="fill:${o.c || P.fg};font-size:${o.s || 11}px;font-weight:${o.w || 400}"${o.rot ? ` transform="rotate(${o.rot} ${x} ${y})"` : ''}>${esc(t)}</text>`,
    ln:(x1, y1, x2, y2, o = {}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${o.c || P.line};stroke-width:${o.w || 1};${o.d ? 'stroke-dasharray:' + o.d + ';' : ''}"${o.cap ? ' stroke-linecap="round"' : ''}/>`,
    rc:(x, y, w, h, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" style="fill:${o.f || 'none'};stroke:${o.s || 'none'};stroke-width:${o.w || 1};opacity:${o.o == null ? 1 : o.o}"/>`,
    pl:(pts, o = {}) => `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" style="fill:${o.f || 'none'};stroke:${o.c || P.fg};stroke-width:${o.w || 1.5};${o.d ? 'stroke-dasharray:' + o.d + ';' : ''}opacity:${o.o == null ? 1 : o.o};stroke-linejoin:round"/>`
  };
}
function svgOpen(W, H, lit, w){ return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"${lit ? ` width="${w || W}" height="${Math.round(H * (w || W) / W)}"` : ''} class="fig" font-family="${FONT()}" role="img">`; }
function nice(a, b, n = 4){
  const span = Math.max(b - a, 1e-9), raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const st = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p, lo = Math.floor(a / st + 1e-9) * st, hi = Math.ceil(b / st - 1e-9) * st, t = [];
  for (let v = lo; v <= hi + st * 0.001; v += st) t.push(+v.toFixed(10));
  return {lo, hi, st, t};
}
const fmtTick = v => Math.abs(v) >= 100 || Number.isInteger(v) ? String(Math.round(v * 100) / 100) : v.toFixed(1);

/* ---------- 단면도 ---------- */
function secSVG(lit){
  const P = pal(lit), K = kit(P), m = RES.m, L = RES.L, Ltot = L + 1.5;
  const W = 660, top = 92, sc = Math.min(30, 370 / Ltot), Hh = Math.round(top + Ltot * sc + 40);
  const xl = 90, xw = 300, tw = 10, xr = 530, Y = z => top + z * sc;
  let s = svgOpen(W, Hh, lit, 660);
  let acc = 0;
  S.layers.forEach((l, i) => {
    const z0 = acc, z1 = i === S.layers.length - 1 ? Ltot : Math.min(acc + l.t, Ltot); acc += l.t;
    if (z0 >= Ltot) return;
    const col = SOILCOL[i % SOILCOL.length];
    s += K.rc(xl, Y(z0), xw - xl, Y(z1) - Y(z0), {f:col, s:'#9AA5AF', w:.5});
    const zf = Math.max(z0, S.H);
    if (z1 > zf) s += K.rc(xw + tw, Y(zf), xr - xw - tw, Y(z1) - Y(zf), {f:col, s:'#9AA5AF', w:.5});
    const mid = (Y(z0) + Y(z1)) / 2;
    if (Y(z1) - Y(z0) > 22) { s += K.tx(xl + 8, mid - 1, l.name, {c:'#1d2630', w:700, s:11}); s += K.tx(xl + 8, mid + 12, `γ=${l.gt} c=${l.c} φ=${l.phi}°`, {c:'#1d2630', s:10}); }
    else s += K.tx(xl + 8, mid + 4, l.name, {c:'#1d2630', w:700, s:10});
  });
  s += K.ln(xl - 12, Y(0), xw, Y(0), {c:P.fg, w:1.6});
  s += K.tx(xl - 14, Y(0) + 4, 'GL', {a:'end', s:11, w:700});
  for (let i = 0; i < 8; i++){ const x = xl + 22 + i * (xw - xl - 44) / 7; s += K.ln(x, Y(0) - 30, x, Y(0) - 4, {c:P.acc, w:1.4}) + `<polygon points="${x - 3},${Y(0) - 8} ${x + 3},${Y(0) - 8} ${x},${Y(0) - 2}" style="fill:${P.acc}"/>`; }
  s += K.ln(xl + 22, Y(0) - 30, xw - 22, Y(0) - 30, {c:P.acc, w:1.4});
  s += K.tx((xl + xw) / 2, Y(0) - 38, T(`상재하중 q = ${fm(S.q, 1)} kN/m²`, `上載荷重 q = ${fm(S.q, 1)} kN/m²`), {a:'middle', c:P.acc, w:700, s:11});
  if (S.hw < Ltot){
    s += K.ln(xl, Y(S.hw), xw, Y(S.hw), {c:P.wat, w:1.4, d:'6 3'});
    s += `<polygon points="${xl + 8},${Y(S.hw) - 7} ${xl + 20},${Y(S.hw) - 7} ${xl + 14},${Y(S.hw)}" style="fill:${P.wat}"/>`;
    s += K.tx(xl - 14, Y(S.hw) + 4, `GWL −${fm(S.hw, 1)}`, {a:'end', c:P.wat, s:10, w:700});
    s += K.tx(xw - 6, Y(S.hw) - 4, S.useWater ? T('수압 고려','水圧考慮') : T('수압 미고려','水圧非考慮'), {a:'end', s:10, c:'#1d2630'});
  }
  s += K.rc(xw, Y(0), tw, Y(L) - Y(0), {f:P.wall});
  s += K.rc(xr, Y(0), tw, Y(L) - Y(0), {f:P.wall, o:.22});
  s += K.tx(xr + tw / 2, Y(0) - 8, T('대칭 벽체','対称壁体'), {a:'middle', s:10, c:P.mu});
  s += K.ln(xw + tw, Y(S.H), xr, Y(S.H), {c:P.fg, w:1.6});
  s += K.tx(xw + tw + 8, Y(S.H) - 5, T('굴착저면','掘削底面'), {s:10, c:P.mu});
  S.supports.slice().sort((a, b) => a.z - b.z).forEach((sp, j) => {
    if (sp.z >= S.H) return;
    const y = Y(sp.z);
    if (S.supportType === 'strut'){
      s += K.ln(xw + tw, y, xr, y, {c:P.sup, w:5, cap:1});
      s += K.tx((xw + xr) / 2 + 5, y - 7, `S${j + 1}  GL−${fm(sp.z, 2)}  ${S.strut.sec.replace(/x/g, '×')} @${fm(sp.sh, 1)}`, {a:'middle', s:10.5, c:P.fg, w:700});
    } else {
      const a = S.anchor, ca = Math.cos(a.ang * Math.PI / 180), sa = Math.sin(a.ang * Math.PI / 180);
      const k = Math.min(sc, (xw - xl - 16) / ((a.Lf + a.Lb) * Math.max(ca, .2)));
      const xa = xw - a.Lf * ca * k, ya = y + a.Lf * sa * k, xb = xw - (a.Lf + a.Lb) * ca * k, yb = y + (a.Lf + a.Lb) * sa * k;
      s += K.ln(xw, y, xa, ya, {c:P.sup, w:1.6}) + K.ln(xa, ya, xb, yb, {c:P.sup, w:6, cap:1});
      s += K.tx(xw + tw + 8, y + 4, `A${j + 1}  GL−${fm(sp.z, 2)}  ${a.ang}° @${fm(sp.sh, 1)}`, {s:10.5, w:700});
    }
    s += K.ln(xw - 5, y, xw, y, {c:P.fg, w:1});
  });
  const dx = xr + tw + 34;
  s += K.ln(dx, Y(0), dx, Y(S.H), {c:P.fg, w:1}) + K.ln(dx - 5, Y(0), dx + 5, Y(0), {c:P.fg}) + K.ln(dx - 5, Y(S.H), dx + 5, Y(S.H), {c:P.fg});
  s += K.tx(dx + 14, (Y(0) + Y(S.H)) / 2, `H = ${fm(S.H, 2)} m`, {a:'middle', rot:90, w:700, s:11});
  s += K.ln(dx, Y(S.H), dx, Y(L), {c:P.acc, w:1}) + K.ln(dx - 5, Y(L), dx + 5, Y(L), {c:P.acc});
  s += K.tx(dx + 14, (Y(S.H) + Y(L)) / 2, `D = ${fm(L - S.H, 2)} m`, {a:'middle', rot:90, w:700, s:11, c:P.acc});
  s += K.tx(xw + tw / 2, Y(L) + 16, T(`벽체 L = ${fm(L, 2)} m`, `壁体 L = ${fm(L, 2)} m`), {a:'middle', s:10.5, c:P.mu});
  s += K.tx(10, 16, m.label, {w:700, s:12});
  s += K.tx(10, 33, S.supportType === 'strut' ? T(`버팀보 ${S.supports.length}단 · 굴착폭 B=${fm(S.strut.B, 1)} m`, `切梁 ${S.supports.length}段 · 掘削幅 B=${fm(S.strut.B, 1)} m`) : T(`어스앵커 ${S.supports.length}단`, `アースアンカー ${S.supports.length}段`), {s:10.5, c:P.mu});
  return s + '</svg>';
}

/* ---------- 토압도 ---------- */
function pressSVG(lit){
  const P = pal(lit), K = kit(P), L = RES.L, f = RES.lastF, z = RES.z;
  const W = 640, top = 54, ph = 400, Hh = top + ph + 40, cx = W / 2, half = 250;
  let pm = 0; z.forEach((_, i) => { pm = Math.max(pm, f.pb[i], f.pf[i], RES.paB[i]); });
  const ax = nice(0, pm * 1.05, 4), Y = zv => top + zv / L * ph, XL = p => cx - 8 - p / ax.hi * half, XR = p => cx + 8 + p / ax.hi * half;
  let s = svgOpen(W, Hh, lit, 640);
  ax.t.forEach(t => {
    s += K.ln(XL(t), top, XL(t), top + ph, {c:P.line, w:.6}) + K.ln(XR(t), top, XR(t), top + ph, {c:P.line, w:.6});
    s += K.tx(XL(t), top + ph + 14, fmtTick(t), {a:'middle', s:10, c:P.mu}) + K.tx(XR(t), top + ph + 14, fmtTick(t), {a:'middle', s:10, c:P.mu});
  });
  const dstep = L > 16 ? 4 : 2;
  for (let zv = 0; zv <= L + 1e-6; zv += dstep) s += K.tx(10, Y(zv) + 4, String(zv), {s:10, c:P.mu}) + K.ln(30, Y(zv), W - 10, Y(zv), {c:P.line, w:.4, d:'2 4'});
  s += K.tx(10, top - 8, 'GL (m)', {s:10, c:P.mu});
  const areaL = [[XL(0), Y(0)]].concat(z.map((zv, i) => [XL(f.pb[i]), Y(zv)])).concat([[XL(0), Y(L)]]);
  const areaR = [[XR(0), Y(S.H)]].concat(z.map((zv, i) => f.hasF[i] ? [XR(f.pf[i]), Y(zv)] : null).filter(Boolean)).concat([[XR(0), Y(L)]]);
  s += K.pl(areaL, {f:P.sup, c:P.sup, w:1.6, o:.28});
  s += K.pl(areaR, {f:P.acc, c:P.acc, w:1.6, o:.28});
  s += K.pl(z.map((zv, i) => [XL(Math.min(RES.paB[i], ax.hi)), Y(zv)]), {c:P.sup, w:1.2, d:'5 3'});
  s += K.pl(z.map((zv, i) => f.hasF[i] ? [XR(Math.min(f.ppF[i], ax.hi)), Y(zv)] : null).filter(Boolean), {c:P.acc, w:1.2, d:'5 3'});
  s += K.rc(cx - 8, top, 16, ph, {f:P.wall, o:.9});
  s += K.ln(cx - 8, Y(S.H), W - 20, Y(S.H), {c:P.fg, w:1, d:'6 3'});
  s += K.tx(W - 22, Y(S.H) - 4, T('굴착저면','掘削底面'), {a:'end', s:10, c:P.mu});
  RES.sup.forEach((sp, j) => { s += `<polygon points="${cx - 14},${Y(sp.z)} ${cx - 26},${Y(sp.z) - 5} ${cx - 26},${Y(sp.z) + 5}" style="fill:${P.sup}"/>` + K.tx(cx - 30, Y(sp.z) - 7, `${S.supportType === 'strut' ? 'S' : 'A'}${j + 1}`, {a:'end', s:10, w:700, c:P.sup}); });
  s += K.tx(cx - 8 - half / 2, top - 22, T('배면측 (주동)','背面側 (主働)'), {a:'middle', w:700, s:12, c:P.sup});
  s += K.tx(cx + 8 + half / 2, top - 22, T('굴착측 (수동)','掘削側 (受働)'), {a:'middle', w:700, s:12, c:P.acc});
  s += K.tx(cx, top + ph + 32, T('최종단계 작용토압 (kN/m²) · 실선: 작용토압 · 점선: Rankine 한계(Pa / Pp)', '最終ステップ作用土圧 (kN/m²) · 実線: 作用土圧 · 点線: Rankine限界(Pa / Pp)'), {a:'middle', s:11, c:P.mu});
  return s + '</svg>';
}

/* ---------- 해석결과 도해 ---------- */
function resSVG(kind, lit, w){
  const P = pal(lit), K = kit(P), L = RES.L, ns = RES.stages.length;
  const W = 250, Hh = 480, ml = 38, mr = 14, mt = 40, mb = 40, pw = W - ml - mr, ph = Hh - mt - mb;
  const conv = kind === 'w' ? (a => a.map(v => v * 1000)) : (a => a);
  const arr = s => kind === 'w' ? conv(s.w) : kind === 'M' ? s.M : s.V;
  const eA = kind === 'w' ? conv(RES.env.wMax) : kind === 'M' ? RES.env.Mmax : RES.env.Vmax;
  const eB = kind === 'w' ? conv(RES.env.wMin) : kind === 'M' ? RES.env.Mmin : RES.env.Vmin;
  let mn = 0, mx = 0; RES.stages.forEach(s => arr(s).forEach(v => { mn = Math.min(mn, v); mx = Math.max(mx, v); }));
  if (mx - mn < 1e-6){ mx = 1; mn = -1; }
  const ax = nice(mn, mx, 4), X = v => ml + (v - ax.lo) / (ax.hi - ax.lo) * pw, Y = zv => mt + zv / L * ph;
  const title = kind === 'w' ? T('수평변위 (mm)','水平変位 (mm)') : kind === 'M' ? T('휨모멘트 (kN·m/본)','曲げモーメント (kN·m/本)') : T('전단력 (kN/본)','せん断力 (kN/本)');
  let s = svgOpen(W, Hh, lit, w || 250);
  s += K.tx(W / 2, 16, title, {a:'middle', w:700, s:12});
  ax.t.forEach(t => { s += K.ln(X(t), mt, X(t), mt + ph, {c:P.line, w:t === 0 ? 1.2 : .5}) + K.tx(X(t), mt + ph + 13, fmtTick(t), {a:'middle', s:9.5, c:P.mu}); });
  const dstep = L > 16 ? 4 : 2;
  for (let zv = 0; zv <= L + 1e-6; zv += dstep) s += K.tx(ml - 6, Y(zv) + 3.5, String(zv), {a:'end', s:9.5, c:P.mu}) + K.ln(ml, Y(zv), ml + pw, Y(zv), {c:P.line, w:.4, d:'2 4'});
  s += K.tx(ml - 6, mt - 8, 'GL(m)', {a:'end', s:9, c:P.mu});
  s += K.ln(ml, Y(S.H), ml + pw, Y(S.H), {c:P.fg, w:1, d:'6 3'}) + K.tx(ml + pw - 2, Y(S.H) - 3, 'H', {a:'end', s:9.5, c:P.mu});
  RES.sup.forEach(sp => { s += `<polygon points="${ml},${Y(sp.z)} ${ml - 7},${Y(sp.z) - 4} ${ml - 7},${Y(sp.z) + 4}" style="fill:${P.sup}"/>`; });
  s += K.pl(eA.map((v, i) => [X(v), Y(RES.z[i])]), {c:P.fg, w:1, d:'4 3', o:.65});
  s += K.pl(eB.map((v, i) => [X(v), Y(RES.z[i])]), {c:P.fg, w:1, d:'4 3', o:.65});
  RES.stages.forEach((st, j) => {
    const last = j === ns - 1;
    s += K.pl(arr(st).map((v, i) => [X(v), Y(RES.z[i])]), {c:P.acc, w:last ? 2.4 : 1.2, o:last ? 1 : .25 + .5 * (j / Math.max(ns - 1, 1))});
  });
  const mxo = kind === 'w' ? RES.Wx : kind === 'M' ? RES.Mx : RES.Vx;
  const val = kind === 'w' ? mxo.v * 1000 : mxo.v;
  s += K.tx(W / 2, Hh - 8, `max |${kind === 'w' ? 'δ' : kind}| = ${fm(val, kind === 'w' ? 1 : 1)} @GL−${fm(mxo.z, 2)}m`, {a:'middle', s:10.5, w:700});
  return s + '</svg>';
}

    RES.sup.forEach((x, j) => { r += `<tr><td>${S.supportType === 'strut' ? 'S' : 'A'}${j + 1}</td><td>${fm(x.z, 2)}</td><td>${fm(x.sh, 1)}</td><td>${fm(x.Rm, 1)}</td><td>${fm(x.N, 1)}</td></tr>`; });
    r += `</tbody></table></div>`;
  }
  $('#o3').innerHTML = r;
  let c = `<div class="tw"><table><thead><tr><th class="l">${T('구분','区分')}</th><th class="l">${T('검토항목','照査項目')}</th><th>${T('계산값','計算値')}</th><th>${T('허용값','許容値')}</th><th>${T('이용률','利用率')}</th><th>${T('판정','判定')}</th><th class="l">${T('비고','備考')}</th></tr></thead><tbody>`;
  CHK.forEach(x => {
    if (x.na){ c += `<tr><td class="l">${x.g}</td><td class="l">${x.name}</td><td colspan="3">-</td><td><span class="pill na">${T('해당없음','該当なし')}</span></td><td class="l note2">${esc(x.note)}</td></tr>`; return; }
    c += `<tr><td class="l">${x.g}</td><td class="l">${x.name}</td><td>${fm(x.val, 2)} ${x.unit}</td><td>${x.mode === 'min' ? '≥ ' : '≤ '}${fm(x.lim, 2)} ${x.unit}</td><td>${ratioBar(x.ratio, x.ok)}</td><td><span class="pill ${x.ok ? 'ok' : 'ng'}">${x.ok ? 'O.K' : 'N.G'}</span></td><td class="l note2">${esc(x.note)}</td></tr>`;
  });
  $('#o4').innerHTML = c + `</tbody></table></div><p class="cap">${T('이용률 = 계산값/허용값 (Fs 항목은 요구값/계산값). 이용률 90% 초과 시 주황색으로 표시합니다.','利用率 = 計算値/許容値 (Fs項目は要求値/計算値)。利用率が90%を超える場合はオレンジ色で表示します。')}</p>`;
}
function run(){
  ERR = validate(S);

    $('#msgs').innerHTML = `<div class="ban err"><b>${T('입력 오류','入力エラー')}</b><ul>${ERR.slice(0, 6).map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`; return;

  catch (e){ $('#msgs').innerHTML = `<div class="ban err">${T('해석 중 오류가 발생했습니다: ','解析中にエラーが発生しました: ')}${esc(e.message)}</div>`; }

function toast(t, ms = 3200){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms); }
async function saveFile(name, data){
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) {}
  if (dl){
    try { await dl.save({filename: name, data}); toast(T('저장 확인창에서 승인하면 ' + name + ' 파일이 저장됩니다.', '保存確認ダイアログで承認すると ' + name + ' が保存されます。')); }
    catch (e){ toast(e && e.code === 'declined' ? T('저장을 취소했습니다.','保存をキャンセルしました。') : T('저장하지 못했습니다. (','保存できませんでした。(') + ((e && e.code) || e.message) + ')'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast(name + T(' 저장',' を保存'));
}
const fname = (ext, kind) => ((S.meta.project || T('흙막이','山留め')).replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40)) + (kind === 'in' ? T('_입력값','_入力値') : T('_구조계산서','_構造計算書')) + '.' + ext;

    [T('부재 특성(1본 기준)','部材特性(1本あたり)')], [T('휨강성 EI (kN·m²)','曲げ剛性 EI (kN·m²)'), m.EI], [T('단면계수 Z (cm³)','断面係数 Z (cm³)'), m.Z], [T('전단면적 Aw (cm²)','せん断断面積 Aw (cm²)'), m.Aw], [T('하중폭 Wa (m)','荷重幅 Wa (m)'), m.Wa], [T('수동폭 Wp (m)','受働幅 Wp (m)'), m.Wp], [],
    [T('재료·기준','材料・基準')], ['Es (MPa)', mat.Es], [T('기본 허용휨 (MPa)','基本許容曲げ (MPa)'), mat.fb0], [T('기본 허용전단 (MPa)','基本許容せん断 (MPa)'), mat.fv0], [T('가설 할증계수','仮設割増係数'), mat.alpha], [T('적용 허용휨 (MPa)','適用許容曲げ (MPa)'), mat.fb0 * mat.alpha], [T('적용 허용전단 (MPa)','適用許容せん断 (MPa)'), mat.fv0 * mat.alpha],
    [T('허용 수평변위 (H 대비 %)','許容水平変位 (H比 %)'), S.limits.dispPct], [T('근입 안정 요구 Fs','根入れ安定 要求Fs'), S.limits.FsEmb], [T('히빙 요구 Fs','ヒービング 要求Fs'), S.limits.FsHeave]];
  XLSX.utils.book_append_sheet(wb, sheet(A, [30, 40]), T('입력조건','入力条件'));
  const B = [['No', T('지층','地層'), T('두께(m)','厚さ(m)'), T('상단 GL−(m)','上端 GL−(m)'), T('하단 GL−(m)','下端 GL−(m)'), 'γt(kN/m³)', 'γsat(kN/m³)', 'c(kN/m²)', 'φ(°)', 'kh(kN/m³)', 'Ka', 'Kp', 'K0']];
  let acc = 0;
  S.layers.forEach((l, i) => {
    const ka = Math.pow(Math.tan((45 - l.phi / 2) * Math.PI / 180), 2), kp = Math.pow(Math.tan((45 + l.phi / 2) * Math.PI / 180), 2);
    B.push([i + 1, l.name, l.t, acc, i === S.layers.length - 1 ? '∞' : acc + l.t, l.gt, l.gs, l.c, l.phi, l.kh, +ka.toFixed(4), +kp.toFixed(4), +(1 - Math.sin(l.phi * Math.PI / 180)).toFixed(4)]); acc += l.t;
  });
  XLSX.utils.book_append_sheet(wb, sheet(B, [6, 14, 9, 11, 11, 11, 12, 10, 8, 12, 8, 8, 8]), T('지층','地層'));
  const C = [[T('단','段'), T('설치깊이 GL−(m)','設置深さ GL−(m)'), T('수평간격(m)','水平間隔(m)'), T('선행하중(kN/개)','プレロード(kN/個)'), T('최대 본당 반력(kN)','最大反力 1本あたり(kN)'), S.supportType === 'strut' ? T('축력 N(kN)','軸力 N(kN)') : T('인장력 T(kN)','引張力 T(kN)')]];
  RES.sup.forEach((x, j) => C.push([j + 1, x.z, x.sh, x.P, +x.Rm.toFixed(2), +x.N.toFixed(2)]));
  if (!RES.sup.length) C.push([T('지보 없음(자립식)','支保工なし(自立式)')]);
  XLSX.utils.book_append_sheet(wb, sheet(C, [6, 16, 12, 16, 18, 16]), T('지보재','支保工'));
  const D = [['GL−(m)']]; RES.stages.forEach(st => { D[0].push(T(`${st.k}단계 변위(mm)`,`ステップ${st.k} 変位(mm)`), T(`${st.k}단계 M(kN·m)`,`ステップ${st.k} M(kN·m)`), T(`${st.k}단계 V(kN)`,`ステップ${st.k} V(kN)`)); });
  RES.z.forEach((zv, i) => { const r = [zv]; RES.stages.forEach(st => r.push(+(st.w[i] * 1000).toFixed(3), +st.M[i].toFixed(3), +st.V[i].toFixed(3))); D.push(r); });

  const E = [['GL−(m)', T('변위 최대(mm)','変位 最大(mm)'), T('변위 최소(mm)','変位 最小(mm)'), T('M 최대(kN·m)','M 最大(kN·m)'), T('M 최소(kN·m)','M 最小(kN·m)'), T('V 최대(kN)','V 最大(kN)'), T('V 최소(kN)','V 最小(kN)')]];
  RES.z.forEach((zv, i) => E.push([zv, +(RES.env.wMax[i] * 1000).toFixed(3), +(RES.env.wMin[i] * 1000).toFixed(3), +RES.env.Mmax[i].toFixed(3), +RES.env.Mmin[i].toFixed(3), +RES.env.Vmax[i].toFixed(3), +RES.env.Vmin[i].toFixed(3)]));
  XLSX.utils.book_append_sheet(wb, sheet(E, [9, 14, 14, 14, 14, 12, 12]), T('포락선','包絡線'));
  const G = [[T('구분','区分'), T('검토항목','照査項目'), T('계산값','計算値'), T('허용값','許容値'), T('단위','単位'), T('이용률','利用率'), T('판정','判定'), T('비고','備考')]];
  CHK.forEach((x, i) => {
    const r = i + 2;
    if (x.na){ G.push([x.g, x.name, '-', '-', '', '-', T('해당없음','該当なし'), x.note]); return; }
    // 이용률: max형 = 계산/허용, min형 = 요구/계산  → 열 C=계산값, D=허용값
    const f1 = x.mode === 'min' ? `IFERROR(D${r}/C${r},0)` : `IFERROR(C${r}/D${r},0)`;

  });

  }
  XLSX.utils.book_append_sheet(wb, sheet(G, [9, 26, 12, 12, 8, 10, 10, 60]), T('검토요약','照査まとめ'));

  let p2 = `<div class="page">${head(2, T('지반 및 토압','地盤および土圧'))}<h2>${T('3. 지반 조건','3. 地盤条件')}</h2><table class="t"><thead><tr><th>${T('지층','地層')}</th><th>${T('두께 m','厚さ m')}</th><th>γt</th><th>γsat</th><th>c</th><th>φ°</th><th>kh</th><th>Ka</th><th>Kp</th><th>K₀</th></tr></thead><tbody>`;
  S.layers.forEach((l, i) => { p2 += `<tr><td>${esc(l.name)}</td><td>${i === S.layers.length - 1 ? '∞' : fm(l.t, 2)}</td><td>${l.gt}</td><td>${l.gs}</td><td>${l.c}</td><td>${l.phi}</td><td>${l.kh}</td><td>${fm(Math.pow(Math.tan((45 - l.phi / 2) * Math.PI / 180), 2), 3)}</td><td>${fm(Math.pow(Math.tan((45 + l.phi / 2) * Math.PI / 180), 2), 3)}</td><td>${fm(1 - Math.sin(l.phi * Math.PI / 180), 3)}</td></tr>`; });
  p2 += `</tbody></table><p class="cap">γ: kN/m³ · c: kN/m² · kh: kN/m³</p><h2>${T('4. 적용 기준 및 가정','4. 適用基準および仮定')}</h2><ul class="ls"><li>${T('토압: Rankine 주동·수동토압을 한계값으로 하고, 초기토압은 정지토압(K₀=1−sinφ)으로 한다.','土圧: Rankine主働・受働土圧を限界値とし、初期土圧は静止土圧(K₀=1−sinφ)とする。')}</li><li>${T('지반: 수평지반반력계수 kh에 의한 탄소성 스프링으로 모델링하고 굴착 단계별 변위를 누적한다.','地盤: 水平地盤反力係数khによる弾塑性ばねとしてモデル化し、掘削ステップごとの変位を累積する。')}</li><li>${T(`벽체: Euler 보(절점간격 ${fm(RES.dz, 2)} m), 지보재는 설치 이후 선형 스프링, 해체 단계는 고려하지 않는다.`,`壁体: Eulerはり(節点間隔 ${fm(RES.dz, 2)} m)、支保工は設置後に線形ばね、撤去ステップは考慮しない。`)}</li><li>${T(`허용응력: 기본 허용휨 ${mat.fb0} MPa · 허용전단 ${mat.fv0} MPa에 가설 할증 ${mat.alpha}배 적용 (휨 ${fm(mat.fb0 * mat.alpha, 0)} / 전단 ${fm(mat.fv0 * mat.alpha, 0)} MPa).`,`許容応力: 基本許容曲げ ${mat.fb0} MPa · 許容せん断 ${mat.fv0} MPa に仮設割増 ${mat.alpha}倍を適用 (曲げ ${fm(mat.fb0 * mat.alpha, 0)} / せん断 ${fm(mat.fv0 * mat.alpha, 0)} MPa)。`)}</li></ul>`;
  p2 += `<h2>${T('5. 토압 분포도','5. 土圧分布図')}</h2>${pressSVG(true)}${foot(2)}</div>`;
  let p3 = `<div class="page">${head(3, T('해석 결과','解析結果'))}<h2>${T('6. 단계별 해석 결과','6. ステップ別解析結果')}</h2><table class="t"><thead><tr><th>${T('단계','ステップ')}</th><th>${T('굴착깊이 GL−m','掘削深さ GL−m')}</th><th>${T('활성 지보','有効支保工')}</th><th>δmax mm</th><th>Mmax kN·m</th><th>Vmax kN</th><th>${T('수렴','収束')}</th></tr></thead><tbody>`;
  RES.stages.forEach((st, j) => { p3 += `<tr><td>${T(st.k + '단계', 'ステップ' + st.k)}</td><td>${fm(st.d, 2)}</td><td>${j}</td><td>${fm(Math.max.apply(null, st.w.map(Math.abs)) * 1000, 1)}</td><td>${fm(Math.max.apply(null, st.M.map(Math.abs)), 1)}</td><td>${fm(Math.max.apply(null, st.V.map(Math.abs)), 1)}</td><td>${st.conv ? '○' : '✕'}</td></tr>`; });
  p3 += `</tbody></table><div class="trio">${resSVG('w', true, 224)}${resSVG('V', true, 224)}${resSVG('M', true, 224)}</div><p class="cap">${T('연한→진한 곡선: 굴착 단계 · 굵은 곡선: 최종 단계 · 점선: 포락선 · 삼각형: 지보 위치','薄い→濃い曲線: 掘削ステップ · 太い曲線: 最終ステップ · 点線: 包絡線 · 三角: 支保工位置')}</p>`;
  if (RES.sup.length){
    p3 += `<h2>${T('7. 지보재 반력','7. 支保工反力')}</h2><table class="t"><thead><tr><th>${T('지보','支保工')}</th><th>${T('깊이 GL−m','深さ GL−m')}</th><th>${T('간격 m','間隔 m')}</th><th>${T('본당 반력 kN','反力 1本あたり kN')}</th><th>${S.supportType === 'strut' ? T('축력 N kN','軸力 N kN') : T('인장력 T kN','引張力 T kN')}</th></tr></thead><tbody>`;
    RES.sup.forEach((x, j) => { p3 += `<tr><td>${S.supportType === 'strut' ? 'S' : 'A'}${j + 1}</td><td>${fm(x.z, 2)}</td><td>${fm(x.sh, 1)}</td><td>${fm(x.Rm, 1)}</td><td>${fm(x.N, 1)}</td></tr>`; });
    p3 += `</tbody></table>`;
  }
  p3 += `${foot(3)}</div>`;
  const allOk = CHK.every(c => c.ok) && RES.stages.every(s => s.conv);
  let p4 = `<div class="page">${head(4, T('부재 검토','部材照査'))}<h2>${T('8. 부재 및 안정 검토','8. 部材および安定照査')}</h2><table class="t"><thead><tr><th class="l">${T('구분','区分')}</th><th class="l">${T('검토항목','照査項目')}</th><th>${T('계산값','計算値')}</th><th>${T('허용값','許容値')}</th><th>${T('이용률','利用率')}</th><th>${T('판정','判定')}</th></tr></thead><tbody>`;
  CHK.forEach(x => {
    if (x.na) p4 += `<tr><td class="l">${x.g}</td><td class="l">${x.name}</td><td colspan="3">${esc(x.note)}</td><td>${T('해당없음','該当なし')}</td></tr>`;
    else p4 += `<tr><td class="l">${x.g}</td><td class="l">${x.name}<br><span class="sm">${esc(x.note)}</span></td><td>${fm(x.val, 2)} ${x.unit}</td><td>${x.mode === 'min' ? '≥ ' : '≤ '}${fm(x.lim, 2)} ${x.unit}</td><td>${fm(x.ratio * 100, 0)}%</td><td class="${x.ok ? 'ok' : 'ng'}">${x.ok ? 'O.K' : 'N.G'}</td></tr>`;
  });
  p4 += `</tbody></table><div class="verdict ${allOk ? 'ok' : 'ng'}">${T('종합 판정: ','総合判定: ')}${allOk ? T('O.K — 전 검토항목 만족','O.K — 全照査項目を満足') : 'N.G — ' + T(CHK.filter(c => !c.ok).length + '개 항목 불만족, 단면·근입·지보 재검토 필요', CHK.filter(c => !c.ok).length + '項目が不満足、断面・根入れ・支保工の再検討が必要')}</div>`;
  p4 += `<p class="cap">${T('본 계산서는 입력된 토질정수와 해석 가정에 따른 결과이며, 최종 설계는 관련 기준 및 책임기술자의 검토를 거쳐야 한다.','本計算書は入力された土質定数および解析上の仮定に基づく結果であり、最終設計は関連基準および責任技術者の照査を経なければならない。')}</p>${foot(4)}</div>`;
  const css = `<style>
    .rpt{font-family:${LANG === 'ja' ? "'Yu Gothic','Meiryo','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif" : "'Malgun Gothic','맑은 고딕','Noto Sans KR','Apple SD Gothic Neo',sans-serif"};color:#14202B}
    .rpt .page{width:794px;height:1123px;padding:44px 52px 40px;box-sizing:border-box;background:#fff;position:relative;overflow:hidden;font-size:11.5px;line-height:1.5}
    .rpt .rh{display:flex;justify-content:space-between;border-bottom:1.5px solid #14202B;padding-bottom:5px;margin-bottom:14px;font-size:10.5px;color:#566676}
    .rpt .rf{position:absolute;left:52px;right:52px;bottom:26px;display:flex;justify-content:space-between;border-top:1px solid #C9D1D9;padding-top:5px;font-size:10px;color:#566676}
    .rpt h1{font-size:23px;margin:6px 0 2px} .rpt .sub{margin:0 0 14px;color:#566676;font-size:12px}
    .rpt h2{font-size:13.5px;margin:16px 0 7px;padding-bottom:3px;border-bottom:1px solid #C9D1D9}
    .rpt table.t{border-collapse:collapse;width:100%;margin-bottom:6px}
    .rpt .t th,.rpt .t td{border:1px solid #AEB8C2;padding:3px 6px;text-align:right;font-size:10.8px;white-space:normal}
    .rpt .t th{background:#EEF2F6;font-weight:700;color:#14202B} .rpt .t .l{text-align:left}
    .rpt .t td:first-child{text-align:left}
    .rpt .kv th{text-align:left;width:15%} .rpt .kv td{text-align:left;width:35%}
    .rpt .cap{color:#566676;font-size:10.3px;margin:3px 0} .rpt .sm{color:#566676;font-size:9.6px}
    .rpt .ls{margin:4px 0;padding-left:18px} .rpt .ls li{margin-bottom:3px}
    .rpt .trio{display:flex;gap:6px;justify-content:center;margin:8px 0 2px}
    .rpt .ok{color:#1C7C4D;font-weight:700} .rpt .ng{color:#B83227;font-weight:700}
    .rpt .verdict{margin:12px 0;padding:9px 12px;border:1.5px solid;font-weight:700;font-size:13px}
    .rpt .verdict.ok{border-color:#1C7C4D;background:#E6F4EC} .rpt .verdict.ng{border-color:#B83227;background:#FBE9E6}
    .rpt svg{display:block;margin:4px auto}
  </style>`;
  return css + `<div class="rpt">${p1}${p2}${p3}${p4}</div>`;
}
$('#bPdf').onclick = async () => {
  if (!guard()) return;
  const b = $('#bPdf'); b.disabled = true; const t0 = b.textContent; b.textContent = T('PDF 생성 중…','PDF生成中…');
  try {
    if (!window.html2canvas || !window.jspdf) throw new Error(T('PDF 라이브러리를 불러오지 못했습니다.','PDFライブラリを読み込めませんでした。'));
    const host = $('#rptHost'); host.innerHTML = buildReport();
    void host.offsetHeight;
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => setTimeout(r, 200));
    const pages = [...host.querySelectorAll('.page')], pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
    for (let i = 0; i < pages.length; i++){
      const cv = await html2canvas(pages[i], {scale:2, backgroundColor:'#ffffff', logging:false, useCORS:true});
      if (i) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    }
    host.innerHTML = '';
    await saveFile(fname('pdf'), pdf.output('blob'));
  } catch (e){ toast(T('PDF 생성 실패: ','PDF生成に失敗: ') + e.message); }
  b.disabled = false; applyStatic();
};

/* ---------- 초기화·입력 저장/불러오기 ---------- */
$('#bReset').onclick = () => { S = DEF(); renderInputs(); run(); toast(T('기본값으로 초기화했습니다.','初期値に戻しました。')); };
$('#bSave').onclick = async () => { await saveFile(fname('json', 'in'), JSON.stringify(S, null, 2)); };
$('#bLoad').onclick = () => $('#fLoad').click();
$('#fLoad').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result), d = DEF();
      const merge = (a, b) => { Object.keys(b).forEach(k => { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], b[k]); else a[k] = b[k]; }); return a; };
      S = merge(d, o); renderInputs(); run(); toast(T('입력값을 불러왔습니다.','入力値を読み込みました。'));
    } catch (err){ toast(T('불러오기 실패: 올바른 입력 파일이 아닙니다.','読込失敗: 正しい入力ファイルではありません。')); }
    e.target.value = '';
  };
  r.readAsText(f);
};
/* ---------- 언어 전환 ---------- */
function applyStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-ko]').forEach(el => { el.textContent = el.dataset[LANG]; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG ? 'true' : 'false'));
}
function defOf(l){ const o = LANG; LANG = l; const d = DEF(); LANG = o; return d; }
function setLang(l){
  if (l === LANG || (l !== 'ko' && l !== 'ja')) return;
  const a = defOf(LANG), b = defOf(l);
  if (S.meta.project === a.meta.project) S.meta.project = b.meta.project;
  S.layers.forEach((x, i) => {
    if (a.layers[i] && x.name === a.layers[i].name && b.layers[i]) x.name = b.layers[i].name;
    else if (x.name === NEWL[LANG]) x.name = NEWL[l];
  });
  LANG = l;
  try { localStorage.setItem('sh_lang', l); } catch (e) {}
  applyStatic(); renderInputs(); run();
}
document.querySelector('.lang').addEventListener('click', e => { const b = e.target.closest('button[data-lang]'); if (b) setLang(b.dataset.lang); });
applyStatic(); renderInputs(); run();

</script>
