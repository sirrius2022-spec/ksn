<script>
/* ===== 엔진: 탄소성 보-스프링 단계별 굴착 해석 (Rankine 토압) ===== */
const GW = 9.81;
const rad = d => d * Math.PI / 180;
const HSEC = {
  'H-200x200x8x12':  {d:200,bf:200,tw:8, tf:12,A:63.53,I:4720, Z:472, ry:5.02},
  'H-250x250x9x14':  {d:250,bf:250,tw:9, tf:14,A:92.18,I:10800,Z:867, ry:6.29},
  'H-300x300x10x15': {d:300,bf:300,tw:10,tf:15,A:119.8,I:20400,Z:1360,ry:7.51},
  'H-350x350x12x19': {d:350,bf:350,tw:12,tf:19,A:173.9,I:40300,Z:2300,ry:8.84},
  'H-400x400x13x21': {d:400,bf:400,tw:13,tf:21,A:218.7,I:66600,Z:3330,ry:10.1}
};
const SSEC = {
  'SP-III': {I:16800,Z:1340,A:191,  Aw:40.6},
  'SP-IV':  {I:38600,Z:2270,A:242.5,Aw:65.9}
};
function layerAt(layers, z){
  let acc = 0;
  for (let i = 0; i < layers.length; i++){
    acc += layers[i].t;
    if (z < acc - 1e-9 || i === layers.length - 1) return layers[i];
  }
}
function memberProps(inp){
  const E = inp.mat.Es; // MPa
  const wt = inp.wallType;
  if (wt === 'hpile' || wt === 'scw'){
    const p = inp.pile;
    const sec = p.sec === 'custom' ? p.custom : HSEC[p.sec];
    const Aw = sec.Aw != null ? sec.Aw : sec.d * sec.tw / 100;
    const bf = sec.bf || 300;
    const Wa = p.s;
    const Wp = wt === 'hpile' ? Math.min(p.s, p.kpass * bf / 1000) : p.s;
    return {kind:'steel', label: (wt==='hpile'?'H-Pile+토류판 ':'SCW(H-Pile 삽입) ') + (p.sec==='custom'?'사용자단면':p.sec) + ' @' + p.s.toFixed(2) + 'm',
      EI: E * 1000 * sec.I * 1e-8, Z: sec.Z, A: sec.A, Aw, bf, Wa, Wp, s: p.s, sec, lagging: wt === 'hpile'};
  }
  if (wt === 'sheet'){
    const sp = inp.sheet;
    const sec = sp.sec === 'custom' ? sp.custom : SSEC[sp.sec];
    return {kind:'steel', label:'강널말뚝 ' + (sp.sec==='custom'?'사용자단면':sp.sec) + ' (1m당)',
      EI: E * 1000 * sec.I * 1e-8, Z: sec.Z, A: sec.A, Aw: sec.Aw, bf: 0, Wa: 1, Wp: 1, s: 1, sec, lagging: false};
  }
  const c = inp.cip;
  const Ig = Math.PI * Math.pow(c.D, 4) / 64;
  return {kind:'rc', label:'CIP Ø' + (c.D*1000).toFixed(0) + ' @' + c.s.toFixed(2) + 'm',
    EI: c.Ec * 1000 * Ig * c.red, Z: 0, A: 0, Aw: 0, bf: 0, Wa: c.s, Wp: c.s, s: c.s, Mcap: c.Ma, lagging: false};
}
function solveLinear(A, b, N){
  for (let c = 0; c < N; c++){
    let p = c, mx = Math.abs(A[c][c]);
    for (let r = c + 1; r < N; r++){ const v = Math.abs(A[r][c]); if (v > mx){ mx = v; p = r; } }
    if (p !== c){ const t = A[c]; A[c] = A[p]; A[p] = t; const tb = b[c]; b[c] = b[p]; b[p] = tb; }
    const d = A[c][c];
    for (let r = c + 1; r < N; r++){
      const f = A[r][c] / d;
      if (f === 0) continue;
      const Ar = A[r], Ac = A[c];
      for (let k = c; k < N; k++) Ar[k] -= f * Ac[k];
      b[r] -= f * b[c];
    }
  }
  const x = new Array(N).fill(0);
  for (let r = N - 1; r >= 0; r--){
    let s = b[r];
    for (let k = r + 1; k < N; k++) s -= A[r][k] * x[k];
    x[r] = s / A[r][r];
  }
  return x;
}
function analyze(inp){
  const m = memberProps(inp);
  const dz = inp.dz || 0.25;
  const H = inp.H;
  const L = Math.ceil((H + inp.D) / dz - 1e-9) * dz;
  const n = Math.round(L / dz) + 1;
  const z = Array.from({length: n}, (_, i) => i * dz);
  const tr = z.map((_, i) => (i === 0 || i === n - 1) ? dz / 2 : dz);
  const Wa = m.Wa, Wp = m.Wp, EI = m.EI;
  const lay = z.map(zi => layerAt(inp.layers, Math.min(zi + 1e-6, L)));
  const Ka = lay.map(l => Math.pow(Math.tan(rad(45 - l.phi / 2)), 2));
  const Kp = lay.map(l => Math.pow(Math.tan(rad(45 + l.phi / 2)), 2));
  const K0 = lay.map(l => 1 - Math.sin(rad(l.phi)));
  const gam = s => { const l = layerAt(inp.layers, s); return (inp.useWater && s > inp.hw) ? Math.max(l.gs - GW, 1) : l.gt; };
  const integ = (z0, z1) => {
    if (z1 <= z0) return 0;
    const N = Math.max(1, Math.ceil((z1 - z0) / 0.05)), h = (z1 - z0) / N;
    let s = 0; for (let i = 0; i < N; i++) s += gam(z0 + (i + .5) * h);
    return s * h;
  };
  const sv0 = z.map(zi => integ(0, zi));
  const svb = sv0.map(v => v + inp.q);
  const paB = z.map((_, i) => Math.max(0, Ka[i] * svb[i] - 2 * lay[i].c * Math.sqrt(Ka[i])));
  const ppB = z.map((_, i) => Kp[i] * svb[i] + 2 * lay[i].c * Math.sqrt(Kp[i]));
  const khN = lay.map(l => l.kh);
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  // 지보 목록
  const sup = inp.supports.filter(s => s.z < H - 1e-6).slice().sort((a, b) => a.z - b.z).map(s => {
    const idx = Math.round(s.z / dz);
    let ku, cosA = 1, Pax = s.P;
    if (inp.supportType === 'strut'){
      const sec = HSEC[inp.strut.sec];
      ku = 2 * inp.mat.Es * 1000 * sec.A * 1e-4 / inp.strut.B;
    } else {
      const a = inp.anchor; cosA = Math.cos(rad(a.ang));
      ku = a.E * 1000 * a.A * 1e-6 / a.Lf * cosA * cosA;
    }
    return {z: z[idx], idx, sh: s.sh, P: s.P, cosA, kM: ku * m.s / s.sh, Ph: (inp.supportType === 'strut' ? s.P : s.P * cosA) * m.s / s.sh, xi: 0};
  });
  // 굴착 단계
  const dList = [];
  sup.forEach(s => dList.push(Math.min(H, s.z + inp.clr)));
  if (!dList.length || dList[dList.length - 1] < H - 1e-6) dList.push(H);
  const stages = [];
  let x = new Array(n).fill(0), x0 = new Array(n).fill(0);
  let Fb0 = z.map((_, i) => clamp(K0[i] * svb[i], paB[i], ppB[i]) * Wa * tr[i]);
  let Ff0 = z.map((_, i) => K0[i] * sv0[i] * Wa * tr[i]);
  const h = dz;
  for (let k = 0; k < dList.length; k++){
    const d = dList[k];
    const act = sup.filter((s, j) => j < k);
    const hasF = z.map(zi => zi > d + 1e-9);
    const svf = z.map((zi, i) => hasF[i] ? integ(d, zi) : 0);
    const paF = z.map((_, i) => hasF[i] ? Math.max(0, Ka[i] * svf[i] - 2 * lay[i].c * Math.sqrt(Ka[i])) : 0);
    const ppF = z.map((_, i) => hasF[i] ? Kp[i] * svf[i] + 2 * lay[i].c * Math.sqrt(Kp[i]) : 0);
    const Fa_b = paB.map((v, i) => v * Wa * tr[i]), Fp_b = ppB.map((v, i) => v * Wa * tr[i]);
    const Fa_f = paF.map((v, i) => v * Wp * tr[i]), Fp_f = ppF.map((v, i) => v * Wp * tr[i]);
    const kb = khN.map((v, i) => v * Wa * tr[i]), kf = khN.map((v, i) => hasF[i] ? v * Wp * tr[i] : 0);
    // 굴착측 기준력 재설정 (응력해방)
    for (let i = 0; i < n; i++){
      if (hasF[i]) Ff0[i] = clamp(Ff0[i], Fa_f[i], Fp_f[i]); else Ff0[i] = 0;
    }
    // 수압 (순수압)
    const Fw = z.map((zi, i) => {
      if (!inp.useWater) return 0;
      const pb = GW * Math.max(0, zi - inp.hw);
      const hwf = Math.max(inp.hw, d);
      const pf = hasF[i] ? GW * Math.max(0, zi - hwf) : 0;
      return (pb - pf) * Wa * tr[i];
    });
    const stateOf = xv => {
      const sb = new Array(n), sf = new Array(n);
      for (let i = 0; i < n; i++){
        const vb = Fb0[i] - kb[i] * (xv[i] - x0[i]);
        sb[i] = vb <= Fa_b[i] ? 1 : (vb >= Fp_b[i] ? 2 : 0);
        if (hasF[i]){
          const vf = Ff0[i] + kf[i] * (xv[i] - x0[i]);
          sf[i] = vf <= Fa_f[i] ? 1 : (vf >= Fp_f[i] ? 2 : 0);
        } else sf[i] = 3;
      }
      return {sb, sf};
    };
    let xs = x.slice(), st = stateOf(xs), w = xs, th = new Array(n).fill(0), conv = false, iters = 0;
    const N2 = 2 * n;
    for (let it = 0; it < 200; it++){
      iters = it + 1;
      const A = Array.from({length: N2}, () => new Array(N2).fill(0));
      const b = new Array(N2).fill(0);
      const c = EI / (h * h * h);
      for (let e = 0; e < n - 1; e++){

    env.Vmax[i] = Math.max(env.Vmax[i], s.V[i]); env.Vmin[i] = Math.min(env.Vmin[i], s.V[i]);

function runChecks(inp, res){
  const m = res.m, H = inp.H, mat = inp.mat, out = [];
  const fb = mat.fb0 * mat.alpha, fv = mat.fv0 * mat.alpha;
  const add = (g, name, val, lim, unit, mode, note) => {
    const ratio = mode === 'min' ? (val > 0 ? lim / val : 0) : val / lim;
    out.push({g, name, val, lim, unit, mode: mode || 'max', ratio, ok: mode === 'min' ? val >= lim : val <= lim, note: note || ''});
  };
  // 1) 벽체 휨/전단
  if (m.kind === 'steel'){
    const sb = res.Mx.v * 1000 / m.Z, tv = res.Vx.v * 1000 / (m.Aw * 100);
    add('벽체', '휨응력 σb', sb, fb, 'MPa', 'max', 'Mmax=' + res.Mx.v.toFixed(1) + ' kN·m @GL-' + res.Mx.z.toFixed(2));
    add('벽체', '전단응력 τ', tv, fv, 'MPa', 'max', 'Vmax=' + res.Vx.v.toFixed(1) + ' kN @GL-' + res.Vx.z.toFixed(2));
  } else {
    add('벽체', '휨모멘트 M (본당)', res.Mx.v, m.Mcap, 'kN·m', 'max', '허용휨모멘트는 배근에 따라 사용자 입력');
  }
  // 2) 변위
  const dl = H * inp.limits.dispPct / 100 * 1000;
  add('변위', '최대 수평변위 δmax', Math.abs(res.Wx.v) * 1000, dl, 'mm', 'max', 'δmax @GL-' + res.Wx.z.toFixed(2) + ', 허용=H×' + inp.limits.dispPct + '%');
  // 3) 근입 안정 (모멘트 평형)
  {
    const d = H, L = res.L, zs = res.sup.length ? res.sup[res.sup.length - 1].z : L;
    const f = res.lastF; let Ma = 0, Mp = 0;
    const dz = res.dz;
    for (let i = 0; i < res.n; i++){
      const zi = res.z[i], t = (i === 0 || i === res.n - 1) ? dz / 2 : dz;
      const arm = res.sup.length ? zi - zs : L - zi;
      Ma += res.paB[i] * m.Wa * t * arm;
      if (inp.useWater){
        const pw = GW * Math.max(0, zi - inp.hw) - (zi > d ? GW * Math.max(0, zi - Math.max(inp.hw, d)) : 0);
        Ma += pw * m.Wa * t * arm;
      }
      if (f.hasF[i]) Mp += f.ppF[i] * m.Wp * t * arm;
    }
    const piv = res.sup.length ? '최하단 지보(GL-' + zs.toFixed(1) + 'm)' : '선단(자립식)';
    out.push({g:'근입', name:'근입 안정 Fs=Mp/Ma', val: Ma > 0 ? Mp / Ma : 99, lim: inp.limits.FsEmb, unit:'-', mode:'min',
      ratio: Ma > 0 ? inp.limits.FsEmb / (Mp / Ma) : 0, ok: Ma <= 0 || Mp / Ma >= inp.limits.FsEmb,
      note: piv + ' 중심, Ma=' + Ma.toFixed(0) + ', Mp=' + Mp.toFixed(0) + ' kN·m'});
    res.emb = {Ma, Mp};
  }
  // 4) 히빙
  {
    const l = layerAt(inp.layers, H + 1e-6);
    if (l.c > 0 && l.phi <= 5){
      const Bw = inp.strut.B, B1 = 0.7 * Bw;
      let gH = 0; { const N = Math.ceil(H / 0.05); for (let i = 0; i < N; i++){ const zz = (i + .5) * H / N; gH += layerAt(inp.layers, zz).gt * H / N; } }
      const FsC = 5.7 * l.c / (gH + inp.q - l.c * H / B1);
      out.push({g:'히빙', name:'히빙 Fs (Terzaghi)', val: FsC, lim: inp.limits.FsHeave, unit:'-', mode:'min', ratio: inp.limits.FsHeave / FsC, ok: FsC >= inp.limits.FsHeave, note:'굴착저면 점성토 c=' + l.c + ' kN/m²'});
    } else out.push({g:'히빙', name:'히빙 검토', na:true, note:'굴착저면 지반이 사질토/φ>5° → 해당없음', ok:true});
  }
  // 5) 토류판
  if (m.lagging){
    const lg = inp.lag, f = res.lastF;
    let pmax = 0; for (let i = 0; i < res.n; i++) if (res.z[i] <= H) pmax = Math.max(pmax, res.paB[i]);
    const Lc = Math.max(0.05, m.s - m.bf / 1000);
    const Mw = pmax * Lc * Lc / 8;
    const sw = Mw * 1e6 / (1000 * lg.t * lg.t / 6);
    add('토류판', '토류판 휨응력', sw, lg.fb * mat.alpha, 'MPa', 'max', 't=' + lg.t + 'mm, 순경간 ' + Lc.toFixed(2) + 'm, pmax=' + pmax.toFixed(1) + ' kN/m²');
  }
  // 6) 지보재
  if (res.sup.length){
    const maxN = Math.max.apply(null, res.sup.map(s => s.N));
    const maxRh = Math.max.apply(null, res.sup.map(s => s.Rh));
    const maxSh = Math.max.apply(null, res.sup.map(s => s.sh));
    // 띠장
    const ws = HSEC[inp.wale.sec], Zw = ws.Z * inp.wale.n;
    const Mw = maxRh * maxSh / 10, Vw = 0.6 * maxRh;
    add('띠장', '띠장 휨응력', Mw * 1000 / Zw, fb, 'MPa', 'max', inp.wale.sec + ' ×' + inp.wale.n + ', M=' + Mw.toFixed(1) + ' kN·m (wL²/10)');
    add('띠장', '띠장 전단응력', Vw * 1000 / (ws.d * ws.tw / 100 * inp.wale.n * 100), fv, 'MPa', 'max', 'V=' + Vw.toFixed(1) + ' kN (0.6wL)');
    if (inp.supportType === 'strut'){
      const ss = HSEC[inp.strut.sec];
      const lam = inp.strut.Lk * 100 / ss.ry;
      let fca0 = lam <= 20 ? mat.fb0 : (lam <= 93 ? mat.fb0 - 0.84 * (lam - 20) : 1200000 / (6700 + lam * lam));
      const fca = fca0 * mat.alpha;
      add('버팀보', '버팀보 압축응력(좌굴)', maxN * 1000 / (ss.A * 100), fca, 'MPa', 'max', inp.strut.sec + ', Nmax=' + maxN.toFixed(0) + ' kN, λ=' + lam.toFixed(0) + ', fca=' + fca.toFixed(1));
    } else {
      const a = inp.anchor;
      const Ta = a.ratio * a.fpu * a.A / 1000;
      add('앵커', '앵커 인장력 T', maxN, Ta, 'kN', 'max', 'Tmax(설계)=' + maxN.toFixed(0) + ' kN, Ta=' + a.ratio + '·fpu·A');
      const La = maxN / (Math.PI * a.dia / 1000 * a.tau);
      add('앵커', '필요 정착장', La, a.Lb, 'm', 'max', 'La=T/(π·d·τba), τba=' + a.tau + ' kN/m²');
    }
  }
  return out;
}

    h += `<div class="grp"><h3>재료 · 허용응력</h3><div class="grid2">${F('mat.Es', '강재 탄성계수 Es', 'MPa')}${F('mat.alpha', '가설 할증계수', '배', {step:0.05})}${F('mat.fb0', '기본 허용휨응력', 'MPa')}${F('mat.fv0', '기본 허용전단응력', 'MPa')}</div><p class="note">적용 허용값 = 기본값 × 할증계수. 적용 기준(KDS 등)에 맞추어 수정하십시오.</p></div>`;
    h += `<div class="grp"><h3>검토 기준</h3><div class="grid2">${F('limits.dispPct', '허용 수평변위 (H 대비)', '%', {step:0.05})}${F('limits.FsEmb', '근입 안정 Fs', '이상', {step:0.05})}${F('limits.FsHeave', '히빙 Fs', '이상', {step:0.05})}${SEL('dz', '해석 절점간격', [[0.25, '0.25 m (정밀)'], [0.5, '0.5 m (빠름)']])}</div></div>`;
    h += `<div class="grp"><h3>해석 가정</h3><p class="note">Rankine 주동·수동토압을 한계값으로 하는 탄소성 지반스프링(kh)과 Euler 보 요소로 굴착 단계별 누적 해석합니다. 초기토압은 정지토압(K₀=1−sinφ)이며, 굴착면 측 토압은 굴착 시 제거됩니다. 지보재는 설치 단계 이후 선형 스프링으로 모델링하고 해체 단계는 고려하지 않습니다.</p></div>`;
  }

function validate(s){
  const e = [], nf = (v, name, min = 0, strict = true) => { if (!isFinite(v) || (strict ? v <= min : v < min)) e.push(name + ' 값을 확인하십시오.'); };
  nf(s.H, '굴착깊이'); nf(s.D, '근입깊이'); nf(s.q, '상재하중', 0, false); nf(s.hw, '지하수위', 0, false); nf(s.clr, '굴착 여유', 0, false);
  if (s.layers.length < 1) e.push('지층이 없습니다.');
  s.layers.forEach((l, i) => {
    nf(l.t, (i + 1) + '번 지층 두께'); nf(l.gt, (i + 1) + '번 지층 γt'); nf(l.gs, (i + 1) + '번 지층 γsat'); nf(l.c, (i + 1) + '번 지층 c', 0, false);
    nf(l.kh, (i + 1) + '번 지층 kh');
    if (!isFinite(l.phi) || l.phi < 0 || l.phi > 50) e.push((i + 1) + '번 지층 φ는 0~50° 범위로 입력하십시오.');
  });
  nf(s.mat.Es, 'Es'); nf(s.mat.fb0, '허용휨'); nf(s.mat.fv0, '허용전단'); nf(s.mat.alpha, '할증계수');
  nf(s.limits.dispPct, '허용변위'); nf(s.limits.FsEmb, '근입 Fs'); nf(s.limits.FsHeave, '히빙 Fs');
  if (s.wallType === 'hpile' || s.wallType === 'scw'){
    nf(s.pile.s, '말뚝 간격'); if (s.wallType === 'hpile'){ nf(s.pile.kpass, '수동폭 계수'); nf(s.lag.t, '토류판 두께'); nf(s.lag.fb, '목재 허용휨'); }
    if (s.pile.sec === 'custom') ['d', 'bf', 'tw', 'A', 'I', 'Z'].forEach(k => nf(s.pile.custom[k], '사용자 H형강 ' + k));
  } else if (s.wallType === 'sheet'){
    if (s.sheet.sec === 'custom') ['I', 'Z', 'A', 'Aw'].forEach(k => nf(s.sheet.custom[k], '사용자 강널말뚝 ' + k));
  } else { nf(s.cip.D, 'CIP 직경'); nf(s.cip.s, 'CIP 간격'); nf(s.cip.Ec, 'Ec'); nf(s.cip.red, '유효강성비'); nf(s.cip.Ma, '허용휨모멘트'); }
  s.supports.forEach((p, i) => {
    nf(p.z, (i + 1) + '단 설치깊이'); nf(p.sh, (i + 1) + '단 수평간격'); nf(p.P, (i + 1) + '단 선행하중', 0, false);
    if (isFinite(p.z) && isFinite(s.H) && p.z > s.H - s.clr + 1e-6) e.push((i + 1) + '단 설치깊이는 굴착깊이−굴착여유(' + (s.H - s.clr).toFixed(2) + 'm) 이하여야 합니다.');
  });
  if (s.supportType === 'strut'){ nf(s.strut.B, '굴착폭'); nf(s.strut.Lk, '좌굴길이'); }
  else ['A', 'E', 'Lf', 'Lb', 'dia', 'tau', 'fpu', 'ratio'].forEach(k => nf(s.anchor[k], '앵커 ' + k));
  if (s.supportType === 'anchor' && (!isFinite(s.anchor.ang) || s.anchor.ang < 0 || s.anchor.ang > 60)) e.push('앵커 설치각은 0~60° 범위로 입력하십시오.');
  if (isFinite(s.H) && isFinite(s.D) && (s.H + s.D) / s.dz > 220) e.push('벽체 길이가 과대합니다. 절점간격을 0.5m로 선택하십시오.');
  return e;
}

/* ---------- 도해 공통 ---------- */
const FONT = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";
function pal(lit){
  return lit ? {fg:'#14202B', mu:'#566676', line:'#C9D1D9', acc:'#1B5CA6', wall:'#4D5C6B', sup:'#C25E1E', bg:'#FFFFFF', ok:'#1C7C4D', ng:'#B83227', wat:'#2B7BB9'}
             : {fg:'var(--fg)', mu:'var(--mu)', line:'var(--line)', acc:'var(--acc)', wall:'var(--wall)', sup:'var(--sup)', bg:'var(--surf)', ok:'var(--ok)', ng:'var(--ng)', wat:'#3C8FD0'};
}
function kit(P){
  return {
    tx:(x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || 'start'}" style="fill:${o.c || P.fg};font-size:${o.s || 11}px;font-weight:${o.w || 400}"${o.rot ? ` transform="rotate(${o.rot} ${x} ${y})"` : ''}>${esc(t)}</text>`,
    ln:(x1, y1, x2, y2, o = {}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${o.c || P.line};stroke-width:${o.w || 1};${o.d ? 'stroke-dasharray:' + o.d + ';' : ''}"${o.cap ? ' stroke-linecap="round"' : ''}/>`,
    rc:(x, y, w, h, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" style="fill:${o.f || 'none'};stroke:${o.s || 'none'};stroke-width:${o.w || 1};opacity:${o.o == null ? 1 : o.o}"/>`,
    pl:(pts, o = {}) => `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" style="fill:${o.f || 'none'};stroke:${o.c || P.fg};stroke-width:${o.w || 1.5};${o.d ? 'stroke-dasharray:' + o.d + ';' : ''}opacity:${o.o == null ? 1 : o.o};stroke-linejoin:round"/>`
  };
}
function svgOpen(W, H, lit, w){ return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"${lit ? ` width="${w || W}" height="${Math.round(H * (w || W) / W)}"` : ''} class="fig" font-family="${FONT}" role="img">`; }
function nice(a, b, n = 4){
  const span = Math.max(b - a, 1e-9), raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const st = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p, lo = Math.floor(a / st + 1e-9) * st, hi = Math.ceil(b / st - 1e-9) * st, t = [];
  for (let v = lo; v <= hi + st * 0.001; v += st) t.push(+v.toFixed(10));
  return {lo, hi, st, t};
}
const fmtTick = v => Math.abs(v) >= 100 || Number.isInteger(v) ? String(Math.round(v * 100) / 100) : v.toFixed(1);

/* ---------- 단면도 ---------- */
function secSVG(lit){
  const P = pal(lit), K = kit(P), m = RES.m, L = RES.L, Ltot = L + 1.5;
  const W = 660, top = 92, sc = Math.min(30, 370 / Ltot), Hh = Math.round(top + Ltot * sc + 40);
  const xl = 90, xw = 300, tw = 10, xr = 530, Y = z => top + z * sc;
  let s = svgOpen(W, Hh, lit, 660);
  let acc = 0;
  S.layers.forEach((l, i) => {
    const z0 = acc, z1 = i === S.layers.length - 1 ? Ltot : Math.min(acc + l.t, Ltot); acc += l.t;
    if (z0 >= Ltot) return;
    const col = SOILCOL[i % SOILCOL.length];
    s += K.rc(xl, Y(z0), xw - xl, Y(z1) - Y(z0), {f:col, s:'#9AA5AF', w:.5});
    const zf = Math.max(z0, S.H);
    if (z1 > zf) s += K.rc(xw + tw, Y(zf), xr - xw - tw, Y(z1) - Y(zf), {f:col, s:'#9AA5AF', w:.5});
    const mid = (Y(z0) + Y(z1)) / 2;
    if (Y(z1) - Y(z0) > 22) { s += K.tx(xl + 8, mid - 1, l.name, {c:'#1d2630', w:700, s:11}); s += K.tx(xl + 8, mid + 12, `γ=${l.gt} c=${l.c} φ=${l.phi}°`, {c:'#1d2630', s:10}); }
    else s += K.tx(xl + 8, mid + 4, l.name, {c:'#1d2630', w:700, s:10});
  });
  s += K.ln(xl - 12, Y(0), xw, Y(0), {c:P.fg, w:1.6});
  s += K.tx(xl - 14, Y(0) + 4, 'GL', {a:'end', s:11, w:700});
  for (let i = 0; i < 8; i++){ const x = xl + 22 + i * (xw - xl - 44) / 7; s += K.ln(x, Y(0) - 30, x, Y(0) - 4, {c:P.acc, w:1.4}) + `<polygon points="${x - 3},${Y(0) - 8} ${x + 3},${Y(0) - 8} ${x},${Y(0) - 2}" style="fill:${P.acc}"/>`; }
  s += K.ln(xl + 22, Y(0) - 30, xw - 22, Y(0) - 30, {c:P.acc, w:1.4});
  s += K.tx((xl + xw) / 2, Y(0) - 38, `상재하중 q = ${fm(S.q, 1)} kN/m²`, {a:'middle', c:P.acc, w:700, s:11});
  if (S.hw < Ltot){
    s += K.ln(xl, Y(S.hw), xw, Y(S.hw), {c:P.wat, w:1.4, d:'6 3'});
    s += `<polygon points="${xl + 8},${Y(S.hw) - 7} ${xl + 20},${Y(S.hw) - 7} ${xl + 14},${Y(S.hw)}" style="fill:${P.wat}"/>`;
    s += K.tx(xl - 14, Y(S.hw) + 4, `GWL −${fm(S.hw, 1)}`, {a:'end', c:P.wat, s:10, w:700});
    s += K.tx(xl + 26, Y(S.hw) - 5, S.useWater ? '수압 고려' : '수압 미고려', {s:10, c:'#1d2630'});
  }
  s += K.rc(xw, Y(0), tw, Y(L) - Y(0), {f:P.wall});
  s += K.rc(xr, Y(0), tw, Y(L) - Y(0), {f:P.wall, o:.22});
  s += K.tx(xr + tw / 2, Y(0) - 8, '대칭 벽체', {a:'middle', s:10, c:P.mu});
  s += K.ln(xw + tw, Y(S.H), xr, Y(S.H), {c:P.fg, w:1.6});
  s += K.tx(xw + tw + 8, Y(S.H) - 5, '굴착저면', {s:10, c:P.mu});
  S.supports.slice().sort((a, b) => a.z - b.z).forEach((sp, j) => {
    if (sp.z >= S.H) return;
    const y = Y(sp.z);
    if (S.supportType === 'strut'){
      s += K.ln(xw + tw, y, xr, y, {c:P.sup, w:5, cap:1});
      s += K.tx((xw + xr) / 2 + 5, y - 7, `S${j + 1}  GL−${fm(sp.z, 2)}  ${S.strut.sec.replace(/x/g, '×')} @${fm(sp.sh, 1)}`, {a:'middle', s:10.5, c:P.fg, w:700});
    } else {
      const a = S.anchor, ca = Math.cos(a.ang * Math.PI / 180), sa = Math.sin(a.ang * Math.PI / 180);
      const k = Math.min(sc, (xw - xl - 16) / ((a.Lf + a.Lb) * Math.max(ca, .2)));
      const xa = xw - a.Lf * ca * k, ya = y + a.Lf * sa * k, xb = xw - (a.Lf + a.Lb) * ca * k, yb = y + (a.Lf + a.Lb) * sa * k;
      s += K.ln(xw, y, xa, ya, {c:P.sup, w:1.6}) + K.ln(xa, ya, xb, yb, {c:P.sup, w:6, cap:1});
      s += K.tx(xw + tw + 8, y + 4, `A${j + 1}  GL−${fm(sp.z, 2)}  ${a.ang}° @${fm(sp.sh, 1)}`, {s:10.5, w:700});
    }
    s += K.ln(xw - 5, y, xw, y, {c:P.fg, w:1});
  });
  const dx = xr + tw + 34;
  s += K.ln(dx, Y(0), dx, Y(S.H), {c:P.fg, w:1}) + K.ln(dx - 5, Y(0), dx + 5, Y(0), {c:P.fg}) + K.ln(dx - 5, Y(S.H), dx + 5, Y(S.H), {c:P.fg});
  s += K.tx(dx + 14, (Y(0) + Y(S.H)) / 2, `H = ${fm(S.H, 2)} m`, {a:'middle', rot:90, w:700, s:11});
  s += K.ln(dx, Y(S.H), dx, Y(L), {c:P.acc, w:1}) + K.ln(dx - 5, Y(L), dx + 5, Y(L), {c:P.acc});
  s += K.tx(dx + 14, (Y(S.H) + Y(L)) / 2, `D = ${fm(L - S.H, 2)} m`, {a:'middle', rot:90, w:700, s:11, c:P.acc});
  s += K.tx(xw + tw / 2, Y(L) + 16, `벽체 L = ${fm(L, 2)} m`, {a:'middle', s:10.5, c:P.mu});
  s += K.tx(10, 16, m.label, {w:700, s:12});
  s += K.tx(10, 33, S.supportType === 'strut' ? `버팀보 ${S.supports.length}단 · 굴착폭 B=${fm(S.strut.B, 1)} m` : `어스앵커 ${S.supports.length}단`, {s:10.5, c:P.mu});
  return s + '</svg>';
}

/* ---------- 토압도 ---------- */
function pressSVG(lit){

  const W = 640, top = 54, ph = 400, Hh = top + ph + 40, cx = W / 2, half = 250;
  let pm = 0; z.forEach((_, i) => { pm = Math.max(pm, f.pb[i], f.pf[i], RES.paB[i]); });
  const ax = nice(0, pm * 1.05, 4), Y = zv => top + zv / L * ph, XL = p => cx - 8 - p / ax.hi * half, XR = p => cx + 8 + p / ax.hi * half;
  let s = svgOpen(W, Hh, lit, 640);
  ax.t.forEach(t => {
    s += K.ln(XL(t), top, XL(t), top + ph, {c:P.line, w:.6}) + K.ln(XR(t), top, XR(t), top + ph, {c:P.line, w:.6});
    s += K.tx(XL(t), top + ph + 14, fmtTick(t), {a:'middle', s:10, c:P.mu}) + K.tx(XR(t), top + ph + 14, fmtTick(t), {a:'middle', s:10, c:P.mu});
  });
  const dstep = L > 16 ? 4 : 2;
  for (let zv = 0; zv <= L + 1e-6; zv += dstep) s += K.tx(10, Y(zv) + 4, String(zv), {s:10, c:P.mu}) + K.ln(30, Y(zv), W - 10, Y(zv), {c:P.line, w:.4, d:'2 4'});
  s += K.tx(10, top - 8, 'GL (m)', {s:10, c:P.mu});
  const areaL = [[XL(0), Y(0)]].concat(z.map((zv, i) => [XL(f.pb[i]), Y(zv)])).concat([[XL(0), Y(L)]]);
  const areaR = [[XR(0), Y(S.H)]].concat(z.map((zv, i) => f.hasF[i] ? [XR(f.pf[i]), Y(zv)] : null).filter(Boolean)).concat([[XR(0), Y(L)]]);
  s += K.pl(areaL, {f:P.sup, c:P.sup, w:1.6, o:.28});
  s += K.pl(areaR, {f:P.acc, c:P.acc, w:1.6, o:.28});
  s += K.pl(z.map((zv, i) => [XL(Math.min(RES.paB[i], ax.hi)), Y(zv)]), {c:P.sup, w:1.2, d:'5 3'});
  s += K.pl(z.map((zv, i) => f.hasF[i] ? [XR(Math.min(f.ppF[i], ax.hi)), Y(zv)] : null).filter(Boolean), {c:P.acc, w:1.2, d:'5 3'});
  s += K.rc(cx - 8, top, 16, ph, {f:P.wall, o:.9});
  s += K.ln(cx - 8, Y(S.H), W - 20, Y(S.H), {c:P.fg, w:1, d:'6 3'});
  s += K.tx(W - 22, Y(S.H) - 4, '굴착저면', {a:'end', s:10, c:P.mu});
  RES.sup.forEach((sp, j) => { s += `<polygon points="${cx - 14},${Y(sp.z)} ${cx - 26},${Y(sp.z) - 5} ${cx - 26},${Y(sp.z) + 5}" style="fill:${P.sup}"/>` + K.tx(cx - 30, Y(sp.z) - 7, `${S.supportType === 'strut' ? 'S' : 'A'}${j + 1}`, {a:'end', s:10, w:700, c:P.sup}); });
  s += K.tx(cx - 8 - half / 2, top - 22, '배면측 (주동)', {a:'middle', w:700, s:12, c:P.sup});
  s += K.tx(cx + 8 + half / 2, top - 22, '굴착측 (수동)', {a:'middle', w:700, s:12, c:P.acc});
  s += K.tx(cx, top + ph + 32, `최종단계 작용토압 (kN/m²) · 실선: 작용토압 · 점선: Rankine ${''}한계(Pa / Pp)`, {a:'middle', s:11, c:P.mu});
  return s + '</svg>';
}

/* ---------- 해석결과 도해 ---------- */
function resSVG(kind, lit, w){
  const P = pal(lit), K = kit(P), L = RES.L, ns = RES.stages.length;
  const W = 250, Hh = 480, ml = 38, mr = 14, mt = 40, mb = 40, pw = W - ml - mr, ph = Hh - mt - mb;
  const conv = kind === 'w' ? (a => a.map(v => v * 1000)) : (a => a);
  const arr = s => kind === 'w' ? conv(s.w) : kind === 'M' ? s.M : s.V;
  const eA = kind === 'w' ? conv(RES.env.wMax) : kind === 'M' ? RES.env.Mmax : RES.env.Vmax;
  const eB = kind === 'w' ? conv(RES.env.wMin) : kind === 'M' ? RES.env.Mmin : RES.env.Vmin;
  let mn = 0, mx = 0; RES.stages.forEach(s => arr(s).forEach(v => { mn = Math.min(mn, v); mx = Math.max(mx, v); }));
  if (mx - mn < 1e-6){ mx = 1; mn = -1; }
  const ax = nice(mn, mx, 4), X = v => ml + (v - ax.lo) / (ax.hi - ax.lo) * pw, Y = zv => mt + zv / L * ph;
  const title = kind === 'w' ? '수평변위 (mm)' : kind === 'M' ? '휨모멘트 (kN·m/본)' : '전단력 (kN/본)';
  let s = svgOpen(W, Hh, lit, w || 250);
  s += K.tx(W / 2, 16, title, {a:'middle', w:700, s:12});
  ax.t.forEach(t => { s += K.ln(X(t), mt, X(t), mt + ph, {c:P.line, w:t === 0 ? 1.2 : .5}) + K.tx(X(t), mt + ph + 13, fmtTick(t), {a:'middle', s:9.5, c:P.mu}); });
  const dstep = L > 16 ? 4 : 2;
  for (let zv = 0; zv <= L + 1e-6; zv += dstep) s += K.tx(ml - 6, Y(zv) + 3.5, String(zv), {a:'end', s:9.5, c:P.mu}) + K.ln(ml, Y(zv), ml + pw, Y(zv), {c:P.line, w:.4, d:'2 4'});
  s += K.tx(ml - 6, mt - 8, 'GL(m)', {a:'end', s:9, c:P.mu});
  s += K.ln(ml, Y(S.H), ml + pw, Y(S.H), {c:P.fg, w:1, d:'6 3'}) + K.tx(ml + pw - 2, Y(S.H) - 3, 'H', {a:'end', s:9.5, c:P.mu});
  RES.sup.forEach(sp => { s += `<polygon points="${ml},${Y(sp.z)} ${ml - 7},${Y(sp.z) - 4} ${ml - 7},${Y(sp.z) + 4}" style="fill:${P.sup}"/>`; });
  s += K.pl(eA.map((v, i) => [X(v), Y(RES.z[i])]), {c:P.fg, w:1, d:'4 3', o:.65});
  s += K.pl(eB.map((v, i) => [X(v), Y(RES.z[i])]), {c:P.fg, w:1, d:'4 3', o:.65});
  RES.stages.forEach((st, j) => {
    const last = j === ns - 1;
    s += K.pl(arr(st).map((v, i) => [X(v), Y(RES.z[i])]), {c:P.acc, w:last ? 2.4 : 1.2, o:last ? 1 : .25 + .5 * (j / Math.max(ns - 1, 1))});
  });
  const mxo = kind === 'w' ? RES.Wx : kind === 'M' ? RES.Mx : RES.Vx;
  const val = kind === 'w' ? mxo.v * 1000 : mxo.v;
  s += K.tx(W / 2, Hh - 8, `max |${kind === 'w' ? 'δ' : kind}| = ${fm(val, kind === 'w' ? 1 : 1)} @GL−${fm(mxo.z, 2)}m`, {a:'middle', s:10.5, w:700});
  return s + '</svg>';
}

/* ---------- 결과 렌더 ---------- */
function ratioBar(r, ok){ const p = Math.min(100, Math.round(r * 100)); return `<span class="bar"><i class="${!ok ? 'n' : r > .9 ? 'w' : ''}" style="width:${p}%"></i></span>`; }
function renderResults(){
  const allOk = CHK.every(c => c.ok) && RES.stages.every(s => s.conv);
  const ng = CHK.filter(c => !c.ok).length;
  const ms = []; 
  if (!RES.stages.every(s => s.conv)) ms.push('<div class="ban err">해석이 수렴하지 않았습니다. 근입깊이·지보 배치·지반 정수를 재검토하십시오. 결과는 참고용입니다.</div>');
  $('#msgs').innerHTML = ERR.length ? '' : ms.join('');
  const sb = CHK.find(c => c.name.indexOf('휨') >= 0 && c.g === '벽체');
  const dp = CHK.find(c => c.g === '변위'), em = CHK.find(c => c.g === '근입');
  const sp = RES.sup.length ? Math.max.apply(null, RES.sup.map(x => x.N)) : null;
  $('#sum').innerHTML =
    `<div class="kpi ${allOk ? 'ok' : 'ng'}"><small>종합 판정</small><b>${allOk ? 'O.K' : 'N.G'}</b><span>${ng ? 'N.G ' + ng + '항목' : '전 항목 만족'}</span></div>` +
    `<div class="kpi"><small>${RES.m.kind === 'steel' ? '벽체 휨응력' : '벽체 휨모멘트'}</small><b>${sb ? fm(sb.val, 1) : '-'}</b><span>${sb ? '허용 ' + fm(sb.lim, 1) + ' ' + sb.unit + ' · ' + fm(sb.ratio * 100, 0) + '%' : ''}</span></div>` +
    `<div class="kpi"><small>최대 수평변위</small><b>${fm(dp.val, 1)} mm</b><span>허용 ${fm(dp.lim, 1)} mm · ${fm(dp.ratio * 100, 0)}%</span></div>` +
    `<div class="kpi"><small>근입 안정 Fs</small><b>${fm(em.val, 2)}</b><span>요구 ${fm(em.lim, 2)} 이상</span></div>` +
    `<div class="kpi"><small>${S.supportType === 'strut' ? '최대 버팀보 축력' : '최대 앵커 인장력'}</small><b>${sp == null ? '-' : fm(sp, 0) + ' kN'}</b><span>${RES.sup.length}단 지보</span></div>`;
  $('#o1').innerHTML = secSVG(false) + `<p class="cap">${esc(RES.m.label)} · 지층별 토질정수는 입력값, 굴착측 지반은 굴착저면 이하만 표시됩니다. 대칭 굴착 가정.</p>`;
  $('#o2').innerHTML = pressSVG(false) + `<p class="cap">배면측 K₀ 초기토압에서 출발하여 단계별 변위에 따라 Rankine 한계(Pa·Pp) 범위 내에서 변화한 최종단계 토압입니다. 말뚝(본) 간격에 따른 폭 환산 후의 단위면적 토압입니다.</p>`;
  let r = `<div class="figs">${resSVG('w', false)}${resSVG('V', false)}${resSVG('M', false)}</div><p class="cap">연한 곡선→진한 곡선: 굴착 단계 진행 · 굵은 곡선: 최종 단계 · 점선: 포락선 · 주황 삼각형: 지보 위치 · 수평 점선: 굴착저면.</p>`;
  r += `<h2>단계별 해석 요약</h2><div class="tw"><table><thead><tr><th>단계</th><th>굴착깊이 GL−m</th><th>활성 지보</th><th>δmax mm</th><th>Mmax kN·m</th><th>Vmax kN</th><th>수렴</th></tr></thead><tbody>`;
  RES.stages.forEach((st, j) => {
    const mM = Math.max.apply(null, st.M.map(Math.abs)), mV = Math.max.apply(null, st.V.map(Math.abs)), mW = Math.max.apply(null, st.w.map(Math.abs)) * 1000;
    r += `<tr><td>${st.k}단계</td><td>${fm(st.d, 2)}</td><td>${j}</td><td>${fm(mW, 1)}</td><td>${fm(mM, 1)}</td><td>${fm(mV, 1)}</td><td>${st.conv ? '○' : '✕'}</td></tr>`;
  });
  r += `</tbody></table></div>`;
  if (RES.sup.length){
    r += `<h2>지보재 반력 (최대)</h2><div class="tw"><table><thead><tr><th>지보</th><th>깊이 GL−m</th><th>간격 m</th><th>본당 반력 kN</th><th>${S.supportType === 'strut' ? '축력 N kN' : '인장력 T kN'}</th></tr></thead><tbody>`;
    RES.sup.forEach((x, j) => { r += `<tr><td>${S.supportType === 'strut' ? 'S' : 'A'}${j + 1}</td><td>${fm(x.z, 2)}</td><td>${fm(x.sh, 1)}</td><td>${fm(x.Rm, 1)}</td><td>${fm(x.N, 1)}</td></tr>`; });
    r += `</tbody></table></div>`;
  }
  $('#o3').innerHTML = r;
  let c = `<div class="tw"><table><thead><tr><th class="l">구분</th><th class="l">검토항목</th><th>계산값</th><th>허용값</th><th>이용률</th><th>판정</th><th class="l">비고</th></tr></thead><tbody>`;
  CHK.forEach(x => {
    if (x.na){ c += `<tr><td class="l">${x.g}</td><td class="l">${x.name}</td><td colspan="3">-</td><td><span class="pill na">해당없음</span></td><td class="l note2">${esc(x.note)}</td></tr>`; return; }
    c += `<tr><td class="l">${x.g}</td><td class="l">${x.name}</td><td>${fm(x.val, 2)} ${x.unit}</td><td>${x.mode === 'min' ? '≥ ' : '≤ '}${fm(x.lim, 2)} ${x.unit}</td><td>${ratioBar(x.ratio, x.ok)}</td><td><span class="pill ${x.ok ? 'ok' : 'ng'}">${x.ok ? 'O.K' : 'N.G'}</span></td><td class="l note2">${esc(x.note)}</td></tr>`;
  });
  $('#o4').innerHTML = c + `</tbody></table></div><p class="cap">이용률 = 계산값/허용값 (Fs 항목은 요구값/계산값). 이용률 90% 초과 시 주황색으로 표시합니다.</p>`;
}
function run(){
  ERR = validate(S);
  if (ERR.length){
    $('#msgs').innerHTML = `<div class="ban err"><b>입력 오류</b><ul>${ERR.slice(0, 6).map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`; return;
  }
  try { RES = analyze(S); CHK = runChecks(S, RES); renderResults(); }
  catch (e){ $('#msgs').innerHTML = `<div class="ban err">해석 중 오류가 발생했습니다: ${esc(e.message)}</div>`; }
}

/* ---------- 파일 저장 ---------- */
function toast(t, ms = 3200){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms); }
async function saveFile(name, data){
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) {}
  if (dl){
    try { await dl.save({filename: name, data}); toast('저장 확인창에서 승인하면 ' + name + ' 파일이 저장됩니다.'); }
    catch (e){ toast(e && e.code === 'declined' ? '저장을 취소했습니다.' : '저장하지 못했습니다. (' + ((e && e.code) || e.message) + ')'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast(name + ' 저장');
}
const fname = ext => ((S.meta.project || '흙막이').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40)) + '_구조계산서.' + ext;
function guard(){ if (ERR.length || !RES){ toast('입력 오류를 먼저 수정하십시오.'); return false; } return true; }

/* ---------- 엑셀 ---------- */
function buildXLSX(){
  const wb = XLSX.utils.book_new(), m = RES.m, mat = S.mat;
  const sheet = (rows, cols) => { const ws = XLSX.utils.aoa_to_sheet(rows); if (cols) ws['!cols'] = cols.map(w => ({wch: w})); return ws; };
  const A = [['흙막이 구조계산서 — 입력조건'], [], ['과업명', S.meta.project], ['작성자', S.meta.author], ['작성일', S.meta.date], [],
    ['공법', m.label], ['최종 굴착깊이 H (m)', S.H], ['근입깊이 D (m)', S.D], ['벽체 길이 L (m)', RES.L], ['상재하중 q (kN/m²)', S.q],
    ['지하수위 GL− (m)', S.hw], ['수압 고려', S.useWater ? '예' : '아니오'], ['굴착 여유 (m)', S.clr], ['해석 절점간격 (m)', RES.dz], [],
    ['부재 특성(1본 기준)'], ['휨강성 EI (kN·m²)', m.EI], ['단면계수 Z (cm³)', m.Z], ['전단면적 Aw (cm²)', m.Aw], ['하중폭 Wa (m)', m.Wa], ['수동폭 Wp (m)', m.Wp], [],
    ['재료·기준'], ['Es (MPa)', mat.Es], ['기본 허용휨 (MPa)', mat.fb0], ['기본 허용전단 (MPa)', mat.fv0], ['가설 할증계수', mat.alpha], ['적용 허용휨 (MPa)', mat.fb0 * mat.alpha], ['적용 허용전단 (MPa)', mat.fv0 * mat.alpha],
    ['허용 수평변위 (H 대비 %)', S.limits.dispPct], ['근입 안정 요구 Fs', S.limits.FsEmb], ['히빙 요구 Fs', S.limits.FsHeave]];
  XLSX.utils.book_append_sheet(wb, sheet(A, [30, 40]), '입력조건');
  const B = [['No', '지층', '두께(m)', '상단 GL−(m)', '하단 GL−(m)', 'γt(kN/m³)', 'γsat(kN/m³)', 'c(kN/m²)', 'φ(°)', 'kh(kN/m³)', 'Ka', 'Kp', 'K0']];
  let acc = 0;
  S.layers.forEach((l, i) => {
    const ka = Math.pow(Math.tan((45 - l.phi / 2) * Math.PI / 180), 2), kp = Math.pow(Math.tan((45 + l.phi / 2) * Math.PI / 180), 2);
    B.push([i + 1, l.name, l.t, acc, i === S.layers.length - 1 ? '∞' : acc + l.t, l.gt, l.gs, l.c, l.phi, l.kh, +ka.toFixed(4), +kp.toFixed(4), +(1 - Math.sin(l.phi * Math.PI / 180)).toFixed(4)]); acc += l.t;
  });
  XLSX.utils.book_append_sheet(wb, sheet(B, [6, 14, 9, 11, 11, 11, 12, 10, 8, 12, 8, 8, 8]), '지층');
  const C = [['단', '설치깊이 GL−(m)', '수평간격(m)', '선행하중(kN/개)', '최대 본당 반력(kN)', S.supportType === 'strut' ? '축력 N(kN)' : '인장력 T(kN)']];
  RES.sup.forEach((x, j) => C.push([j + 1, x.z, x.sh, x.P, +x.Rm.toFixed(2), +x.N.toFixed(2)]));
  if (!RES.sup.length) C.push(['지보 없음(자립식)']);
  XLSX.utils.book_append_sheet(wb, sheet(C, [6, 16, 12, 16, 18, 16]), '지보재');
  const D = [['GL−(m)']]; RES.stages.forEach(st => { D[0].push(`${st.k}단계 변위(mm)`, `${st.k}단계 M(kN·m)`, `${st.k}단계 V(kN)`); });
  RES.z.forEach((zv, i) => { const r = [zv]; RES.stages.forEach(st => r.push(+(st.w[i] * 1000).toFixed(3), +st.M[i].toFixed(3), +st.V[i].toFixed(3))); D.push(r); });
  XLSX.utils.book_append_sheet(wb, sheet(D, [9].concat(RES.stages.flatMap(() => [14, 15, 12]))), '단계별결과');
  const E = [['GL−(m)', '변위 최대(mm)', '변위 최소(mm)', 'M 최대(kN·m)', 'M 최소(kN·m)', 'V 최대(kN)', 'V 최소(kN)']];
  RES.z.forEach((zv, i) => E.push([zv, +(RES.env.wMax[i] * 1000).toFixed(3), +(RES.env.wMin[i] * 1000).toFixed(3), +RES.env.Mmax[i].toFixed(3), +RES.env.Mmin[i].toFixed(3), +RES.env.Vmax[i].toFixed(3), +RES.env.Vmin[i].toFixed(3)]));
  XLSX.utils.book_append_sheet(wb, sheet(E, [9, 14, 14, 14, 14, 12, 12]), '포락선');
  const G = [['구분', '검토항목', '계산값', '허용값', '단위', '이용률', '판정', '비고']];
  CHK.forEach((x, i) => {
    const r = i + 2;
    if (x.na){ G.push([x.g, x.name, '-', '-', '', '-', '해당없음', x.note]); return; }
    // 이용률: max형 = 계산/허용, min형 = 요구/계산  → 열 C=계산값, D=허용값
    const f1 = x.mode === 'min' ? `IFERROR(D${r}/C${r},0)` : `IFERROR(C${r}/D${r},0)`;
    G.push([x.g, x.name, +x.val.toFixed(4), +x.lim.toFixed(4), x.unit, {t:'n', f:f1, v:+x.ratio.toFixed(4), z:'0.0%'}, {t:'s', f:`IF(F${r}<=1,"O.K","N.G")`, v:x.ok ? 'O.K' : 'N.G'}, x.note]);
  });
  const base = CHK.length + 3;
  G.push([], ['산정식 검증(벽체 휨)']);
  if (m.kind === 'steel'){
    G.push(['Mmax (kN·m)', RES.Mx.v], ['Z (cm³)', m.Z], ['σb = Mmax×10³/Z (MPa)', {t:'n', f:`B${base + 2}*1000/B${base + 3}`, v:RES.Mx.v * 1000 / m.Z}]);
  }
  XLSX.utils.book_append_sheet(wb, sheet(G, [9, 26, 12, 12, 8, 10, 10, 60]), '검토요약');
  return XLSX.write(wb, {bookType:'xlsx', type:'array'});
}

/* ---------- PDF 계산서 ---------- */
function buildReport(){
  const m = RES.m, mat = S.mat, W = 690;
  const head = (n, t) => `<div class="rh"><span>${esc(S.meta.project)}</span><span>${t}</span></div>`;
  const foot = n => `<div class="rf">${esc(S.meta.author ? S.meta.author + ' · ' : '')}${esc(S.meta.date)}<span>- ${n} -</span></div>`;
  const kv = rows => `<table class="t kv"><tbody>${rows.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td><th>${r[2] || ''}</th><td>${r[3] || ''}</td></tr>`).join('')}</tbody></table>`;
  let p1 = `<div class="page">${head(1, '흙막이 구조계산서')}<h1>흙막이 가시설 구조계산서</h1><p class="sub">탄소성 보-스프링 해석(단계별 굴착) · Rankine 토압</p>`;
  p1 += kv([['과업명', esc(S.meta.project), '작성일', esc(S.meta.date)], ['작성자', esc(S.meta.author || '-'), '해석 모델', 'Euler 보 + 탄소성 지반스프링']]);
  p1 += `<h2>1. 설계 개요</h2>` + kv([
    ['공법', esc(m.label), '굴착깊이 H', fm(S.H, 2) + ' m'],
    ['근입깊이 D', fm(RES.L - S.H, 2) + ' m', '벽체 길이 L', fm(RES.L, 2) + ' m'],
    ['상재하중 q', fm(S.q, 1) + ' kN/m²', '지하수위', 'GL−' + fm(S.hw, 1) + ' m (' + (S.useWater ? '수압 고려' : '수압 미고려') + ')'],
    ['지보 방식', S.supportType === 'strut' ? '버팀보 ' + S.supports.length + '단 (' + S.strut.sec + ')' : '어스앵커 ' + S.supports.length + '단', '굴착 여유', fm(S.clr, 2) + ' m'],
    ['휨강성 EI', fm(m.EI, 0) + ' kN·m²', '하중폭 / 수동폭', fm(m.Wa, 2) + ' / ' + fm(m.Wp, 2) + ' m']]);
  p1 += `<h2>2. 단면도</h2>${secSVG(true)}${foot(1)}</div>`;
  let p2 = `<div class="page">${head(2, '지반 및 토압')}<h2>3. 지반 조건</h2><table class="t"><thead><tr><th>지층</th><th>두께 m</th><th>γt</th><th>γsat</th><th>c</th><th>φ°</th><th>kh</th><th>Ka</th><th>Kp</th><th>K₀</th></tr></thead><tbody>`;
  S.layers.forEach((l, i) => { p2 += `<tr><td>${esc(l.name)}</td><td>${i === S.layers.length - 1 ? '∞' : fm(l.t, 2)}</td><td>${l.gt}</td><td>${l.gs}</td><td>${l.c}</td><td>${l.phi}</td><td>${l.kh}</td><td>${fm(Math.pow(Math.tan((45 - l.phi / 2) * Math.PI / 180), 2), 3)}</td><td>${fm(Math.pow(Math.tan((45 + l.phi / 2) * Math.PI / 180), 2), 3)}</td><td>${fm(1 - Math.sin(l.phi * Math.PI / 180), 3)}</td></tr>`; });
  p2 += `</tbody></table><p class="cap">γ: kN/m³ · c: kN/m² · kh: kN/m³</p><h2>4. 적용 기준 및 가정</h2><ul class="ls"><li>토압: Rankine 주동·수동토압을 한계값으로 하고, 초기토압은 정지토압(K₀=1−sinφ)으로 한다.</li><li>지반: 수평지반반력계수 kh에 의한 탄소성 스프링으로 모델링하고 굴착 단계별 변위를 누적한다.</li><li>벽체: Euler 보(절점간격 ${fm(RES.dz, 2)} m), 지보재는 설치 이후 선형 스프링, 해체 단계는 고려하지 않는다.</li><li>허용응력: 기본 허용휨 ${mat.fb0} MPa · 허용전단 ${mat.fv0} MPa에 가설 할증 ${mat.alpha}배 적용 (휨 ${fm(mat.fb0 * mat.alpha, 0)} / 전단 ${fm(mat.fv0 * mat.alpha, 0)} MPa).</li></ul>`;
  p2 += `<h2>5. 토압 분포도</h2>${pressSVG(true)}${foot(2)}</div>`;
  let p3 = `<div class="page">${head(3, '해석 결과')}<h2>6. 단계별 해석 결과</h2><table class="t"><thead><tr><th>단계</th><th>굴착깊이 GL−m</th><th>활성 지보</th><th>δmax mm</th><th>Mmax kN·m</th><th>Vmax kN</th><th>수렴</th></tr></thead><tbody>`;
  RES.stages.forEach((st, j) => { p3 += `<tr><td>${st.k}단계</td><td>${fm(st.d, 2)}</td><td>${j}</td><td>${fm(Math.max.apply(null, st.w.map(Math.abs)) * 1000, 1)}</td><td>${fm(Math.max.apply(null, st.M.map(Math.abs)), 1)}</td><td>${fm(Math.max.apply(null, st.V.map(Math.abs)), 1)}</td><td>${st.conv ? '○' : '✕'}</td></tr>`; });
  p3 += `</tbody></table><div class="trio">${resSVG('w', true, 224)}${resSVG('V', true, 224)}${resSVG('M', true, 224)}</div><p class="cap">연한→진한 곡선: 굴착 단계 · 굵은 곡선: 최종 단계 · 점선: 포락선 · 삼각형: 지보 위치</p>`;
  if (RES.sup.length){
    p3 += `<h2>7. 지보재 반력</h2><table class="t"><thead><tr><th>지보</th><th>깊이 GL−m</th><th>간격 m</th><th>본당 반력 kN</th><th>${S.supportType === 'strut' ? '축력 N kN' : '인장력 T kN'}</th></tr></thead><tbody>`;
    RES.sup.forEach((x, j) => { p3 += `<tr><td>${S.supportType === 'strut' ? 'S' : 'A'}${j + 1}</td><td>${fm(x.z, 2)}</td><td>${fm(x.sh, 1)}</td><td>${fm(x.Rm, 1)}</td><td>${fm(x.N, 1)}</td></tr>`; });
    p3 += `</tbody></table>`;
  }
  p3 += `${foot(3)}</div>`;
  const allOk = CHK.every(c => c.ok) && RES.stages.every(s => s.conv);
  let p4 = `<div class="page">${head(4, '부재 검토')}<h2>8. 부재 및 안정 검토</h2><table class="t"><thead><tr><th class="l">구분</th><th class="l">검토항목</th><th>계산값</th><th>허용값</th><th>이용률</th><th>판정</th></tr></thead><tbody>`;
  CHK.forEach(x => {
    if (x.na) p4 += `<tr><td class="l">${x.g}</td><td class="l">${x.name}</td><td colspan="3">${esc(x.note)}</td><td>해당없음</td></tr>`;
    else p4 += `<tr><td class="l">${x.g}</td><td class="l">${x.name}<br><span class="sm">${esc(x.note)}</span></td><td>${fm(x.val, 2)} ${x.unit}</td><td>${x.mode === 'min' ? '≥ ' : '≤ '}${fm(x.lim, 2)} ${x.unit}</td><td>${fm(x.ratio * 100, 0)}%</td><td class="${x.ok ? 'ok' : 'ng'}">${x.ok ? 'O.K' : 'N.G'}</td></tr>`;
  });
  p4 += `</tbody></table><div class="verdict ${allOk ? 'ok' : 'ng'}">종합 판정: ${allOk ? 'O.K — 전 검토항목 만족' : 'N.G — ' + CHK.filter(c => !c.ok).length + '개 항목 불만족, 단면·근입·지보 재검토 필요'}</div>`;
  p4 += `<p class="cap">본 계산서는 입력된 토질정수와 해석 가정에 따른 결과이며, 최종 설계는 관련 기준 및 책임기술자의 검토를 거쳐야 한다.</p>${foot(4)}</div>`;
  const css = `<style>
    .rpt{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR','Apple SD Gothic Neo',sans-serif;color:#14202B}
    .rpt .page{width:794px;height:1123px;padding:44px 52px 40px;box-sizing:border-box;background:#fff;position:relative;overflow:hidden;font-size:11.5px;line-height:1.5}
    .rpt .rh{display:flex;justify-content:space-between;border-bottom:1.5px solid #14202B;padding-bottom:5px;margin-bottom:14px;font-size:10.5px;color:#566676}
    .rpt .rf{position:absolute;left:52px;right:52px;bottom:26px;display:flex;justify-content:space-between;border-top:1px solid #C9D1D9;padding-top:5px;font-size:10px;color:#566676}
    .rpt h1{font-size:23px;margin:6px 0 2px} .rpt .sub{margin:0 0 14px;color:#566676;font-size:12px}
    .rpt h2{font-size:13.5px;margin:16px 0 7px;padding-bottom:3px;border-bottom:1px solid #C9D1D9}
    .rpt table.t{border-collapse:collapse;width:100%;margin-bottom:6px}
    .rpt .t th,.rpt .t td{border:1px solid #AEB8C2;padding:3px 6px;text-align:right;font-size:10.8px;white-space:normal}
    .rpt .t th{background:#EEF2F6;font-weight:700;color:#14202B} .rpt .t .l{text-align:left}
    .rpt .t td:first-child{text-align:left}
    .rpt .kv th{text-align:left;width:15%} .rpt .kv td{text-align:left;width:35%}
    .rpt .cap{color:#566676;font-size:10.3px;margin:3px 0} .rpt .sm{color:#566676;font-size:9.6px}
    .rpt .ls{margin:4px 0;padding-left:18px} .rpt .ls li{margin-bottom:3px}
    .rpt .trio{display:flex;gap:6px;justify-content:center;margin:8px 0 2px}
    .rpt .ok{color:#1C7C4D;font-weight:700} .rpt .ng{color:#B83227;font-weight:700}
    .rpt .verdict{margin:12px 0;padding:9px 12px;border:1.5px solid;font-weight:700;font-size:13px}
    .rpt .verdict.ok{border-color:#1C7C4D;background:#E6F4EC} .rpt .verdict.ng{border-color:#B83227;background:#FBE9E6}
    .rpt svg{display:block;margin:4px auto}
  </style>`;
  return css + `<div class="rpt">${p1}${p2}${p3}${p4}</div>`;
}
$('#bPdf').onclick = async () => {
  if (!guard()) return;
  const b = $('#bPdf'); b.disabled = true; const t0 = b.textContent; b.textContent = 'PDF 생성 중…';
  try {
    if (!window.html2canvas || !window.jspdf) throw new Error('PDF 라이브러리를 불러오지 못했습니다.');
    const host = $('#rptHost'); host.innerHTML = buildReport();
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => setTimeout(r, 60));
    const pages = [...host.querySelectorAll('.page')], pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
    for (let i = 0; i < pages.length; i++){
      const cv = await html2canvas(pages[i], {scale:2, backgroundColor:'#ffffff', logging:false, useCORS:true});
      if (i) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    }
    host.innerHTML = '';
    await saveFile(fname('pdf'), pdf.output('blob'));
  } catch (e){ toast('PDF 생성 실패: ' + e.message); }
  b.disabled = false; b.textContent = t0;
};

/* ---------- 초기화·입력 저장/불러오기 ---------- */
$('#bReset').onclick = () => { S = DEF(); renderInputs(); run(); toast('기본값으로 초기화했습니다.'); };
$('#bSave').onclick = async () => { await saveFile(fname('json').replace('_구조계산서', '_입력값'), JSON.stringify(S, null, 2)); };
$('#bLoad').onclick = () => $('#fLoad').click();
$('#fLoad').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result), d = DEF();
      const merge = (a, b) => { Object.keys(b).forEach(k => { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], b[k]); else a[k] = b[k]; }); return a; };
      S = merge(d, o); renderInputs(); run(); toast('입력값을 불러왔습니다.');
    } catch (err){ toast('불러오기 실패: 올바른 입력 파일이 아닙니다.'); }
    e.target.value = '';
  };
  r.readAsText(f);
};
renderInputs(); run();
