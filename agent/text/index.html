<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>위험성평가 AI 프롬프트 | 실습용</title>
<style>
  :root{
    --safety-yellow:#FFC72C;
    --sky-blue:#2E86DE;
    --ink:#1B2733;
    --paper:#FBF8F1;
    --card:#FFFFFF;
    --line:#E4DFD3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .topbar{
    background:var(--ink);
    color:#fff;
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .topbar .chip{
    background:var(--safety-yellow);
    color:var(--ink);
    font-weight:800;
    font-size:12px;
    padding:4px 10px;
    border-radius:999px;
    letter-spacing:0.02em;
  }
  .topbar .title{
    font-size:14px;
    font-weight:600;
    opacity:0.9;
  }
  .topbar .admin-link{
    margin-left:auto;
    font-size:11px;
    color:#8C97A3;
    text-decoration:none;
    opacity:0.7;
    padding:4px 6px;
  }
  .topbar .admin-link:hover{
    opacity:1;
    color:#fff;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:24px 18px 60px;
  }
  h1{
    font-size:22px;
    line-height:1.4;
    margin:6px 0 4px;
    font-weight:800;
  }
  .sub{
    font-size:14px;
    color:#5B6B7A;
    margin-bottom:22px;
    line-height:1.6;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 18px 18px;
    margin-bottom:16px;
    box-shadow:0 1px 0 rgba(0,0,0,0.02);
    min-height:120px;
  }
  .prompt-text{
    font-size:15px;
    line-height:1.75;
    white-space:pre-wrap;
    word-break:keep-all;
    padding:2px 2px 4px;
  }
  .prompt-text.loading{
    color:#B7BFC7;
  }
  .copy-btn{
    width:100%;
    margin-top:6px;
    border:none;
    border-radius:12px;
    padding:15px;
    font-size:15px;
    font-weight:700;
    background:var(--sky-blue);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    transition:transform 0.08s ease, background 0.2s ease;
  }
  .copy-btn:active{ transform:scale(0.98); }
  .copy-btn.copied{ background:#2E9E5B; }
  .copy-btn:disabled{ background:#C7CDD3; cursor:default; }
  footer{
    text-align:center;
    font-size:12px;
    color:#8C97A3;
    margin-top:28px;
    line-height:1.7;
  }
  footer .brand{ color:var(--ink); font-weight:700; }
  footer a{ color:#8C97A3; }
</style>
</head>
<body>

<div class="topbar">
  <span class="chip">실습</span>
  <span class="title">위험성평가 AI 프롬프트 · 복사해서 바로 사용</span>
  <a class="admin-link" href="admin.html">Admin</a>
</div>

<main>
  <h1>사진 기반 위험성평가<br>AI 프롬프트</h1>
  <p class="sub">아래 문구를 복사해서, AI 챗봇에 사진과 함께 붙여넣으세요.</p>

  <div class="card">
    <div class="prompt-text loading" id="promptText">불러오는 중...</div>
  </div>

  <button class="copy-btn" id="copyBtn" onclick="copyPrompt()" disabled>
    <span>📋</span><span>프롬프트 복사하기</span>
  </button>

  <footer>
    QR 스캔 → 버튼 탭 → AI 챗봇에 붙여넣기<br>
    <span class="brand">KSNEDU</span> 스마트 건설안전 강의 실습자료
  </footer>
</main>

<script>
async function loadPrompt(){
  const el = document.getElementById('promptText');
  const btn = document.getElementById('copyBtn');
  try{
    const res = await fetch('./content.json?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('load failed');
    const data = await res.json();
    el.textContent = data.prompt || '(등록된 프롬프트가 없습니다)';
    el.classList.remove('loading');
    btn.disabled = false;
  }catch(e){
    el.textContent = '프롬프트를 불러오지 못했습니다. 잠시 후 새로고침 해주세요.';
    el.classList.remove('loading');
  }
}

async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta);
  }
}

function copyPrompt(){
  const btn = document.getElementById('copyBtn');
  const text = document.getElementById('promptText').textContent;
  copyToClipboard(text).then(()=>{
    const original = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '<span>✅</span><span>복사 완료!</span>';
    setTimeout(()=>{
      btn.classList.remove('copied');
      btn.innerHTML = original;
    }, 1500);
  });
}

loadPrompt();
</script>

</body>
</html>
