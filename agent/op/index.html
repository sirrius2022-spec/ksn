<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김성남 오피스</title>
<style>
/* 디자인 방향: 딥 네이비 외벽 + 브라스 가는 선 + 차분한 룸 컬러. 레이아웃: 평면도 중심, 모바일은 하단 탭 + 패널 */
:root{
  --bg:#e8ebee; --panel:#ffffff; --ink:#0f1c2c; --muted:#5a6a7a; --wall:#16283f; --line:#d2d9e0;
  --gold:#b08a4a; --gold-soft:#d8c08f; --nav:#10213a;
  --ok:#1f7a4d; --warn:#b4580f; --run:#2b5fa8; --idle:#667685;
  --ok-bg:#e1f2e8; --warn-bg:#fbe9da; --run-bg:#e0eafa; --idle-bg:#e9edf0;
  --r-boss:#efe4d0; --r-promo:#dfe9e0; --r-edu:#dfe5f1; --r-con:#efe0e5; --r-lab:#d9e7ea;
  --sheen:rgba(255,255,255,.6); --floor:rgba(16,33,58,.045);
  --accent:#b08a4a; --desk:#cdd3d8; --shadow:0 1px 2px rgba(16,33,58,.06),0 10px 28px rgba(16,33,58,.08);
  --font:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b121a; --panel:#131c26; --ink:#e8edf2; --muted:#98a8b6; --wall:#4a6684; --line:#25313e;
    --gold:#d0af70; --gold-soft:#8f7648; --nav:#08101a;
    --ok:#52c68a; --warn:#f29a55; --run:#76a8f2; --idle:#9aa9b0;
    --ok-bg:#183326; --warn-bg:#3a2616; --run-bg:#182a45; --idle-bg:#222d36;
    --r-boss:#2d2719; --r-promo:#1e2a21; --r-edu:#1e2538; --r-con:#2d2027; --r-lab:#1a2d31;
    --sheen:rgba(255,255,255,.05); --floor:rgba(255,255,255,.035);
    --desk:#3b4853; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b121a; --panel:#131c26; --ink:#e8edf2; --muted:#98a8b6; --wall:#4a6684; --line:#25313e;
  --gold:#d0af70; --gold-soft:#8f7648; --nav:#08101a;
  --ok:#52c68a; --warn:#f29a55; --run:#76a8f2; --idle:#9aa9b0;
  --ok-bg:#183326; --warn-bg:#3a2616; --run-bg:#182a45; --idle-bg:#222d36;
  --r-boss:#2d2719; --r-promo:#1e2a21; --r-edu:#1e2538; --r-con:#2d2027; --r-lab:#1a2d31;
  --sheen:rgba(255,255,255,.05); --floor:rgba(255,255,255,.035);
  --desk:#3b4853; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:18px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.top h1 .sub{font-weight:400;color:var(--muted);font-size:14px;letter-spacing:0}
.top small{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:12px;letter-spacing:.06em;font-weight:700;margin-top:2px}
.top small::before{content:"";width:22px;height:1px;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ribbon{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;margin-bottom:14px}
.ribbon .lbl{font-weight:800;margin-right:4px;letter-spacing:-.01em}
.rb{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg);font-variant-numeric:tabular-nums}
.rb.done{border-color:var(--ok);color:var(--ok)}
.rb.next{border-color:var(--gold);color:var(--gold);font-weight:700;background:color-mix(in srgb,var(--gold) 10%,var(--panel))}
.ctrl{margin-left:auto;display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 12px;font-size:12px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:linear-gradient(180deg,#c29d5c,#a37e3f);border-color:#9a7637;color:#fff;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px;margin-bottom:14px;font-size:12px;color:var(--muted)}
.legend i{font-style:normal}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 1px 2px rgba(16,33,58,.18)}
.pill.ok{background:var(--ok);color:#fff}
.pill.warn{background:var(--warn);color:#fff}
.pill.run{background:var(--run);color:#fff}
.pill.idle{background:var(--idle-bg);color:var(--idle);border:1px solid var(--line);box-shadow:none}
.pill.off{background:var(--idle-bg);color:var(--idle);border:1px dashed var(--idle);box-shadow:none}
.plan{padding:14px}
.plan h2{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;gap:10px;align-items:baseline;letter-spacing:-.02em}
.plan h2 span{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;border:3px solid var(--wall);border-radius:14px;padding:10px;background:var(--panel);box-shadow:0 0 0 1px var(--gold-soft),inset 0 0 0 1px var(--gold-soft)}
.room{position:relative;border:1.5px solid var(--wall);border-radius:8px;padding:9px 11px 10px;min-height:220px;display:flex;flex-direction:column;
  background-image:linear-gradient(140deg,var(--sheen),transparent 55%),repeating-linear-gradient(45deg,var(--floor) 0 1px,transparent 1px 11px);
  box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px color-mix(in srgb,var(--gold) 45%,transparent)}
.room.boss{grid-column:span 3;background-color:var(--r-boss)}
.room.promo{grid-column:span 3;background-color:var(--r-promo)}
.room.edu{grid-column:span 2;background-color:var(--r-edu)}
.room.con{grid-column:span 2;background-color:var(--r-con)}
.room.lab{grid-column:span 2;background-color:var(--r-lab)}
.rh{display:flex;gap:7px;align-items:center;flex-wrap:nowrap;min-width:0}
.code{background:var(--wall);color:var(--gold-soft);font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:3px;padding:1px 7px;flex:none}
.rn{font-weight:800;font-size:14.5px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.rm{font-size:12px;color:var(--muted);margin:3px 0 0}
.desk{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:14px;padding-top:10px;min-height:0}
.person{position:relative;background:none;border:1.5px solid transparent;border-radius:12px;padding:2px 8px 4px;text-align:center;min-width:110px}
.person:hover,.person.sel{border-color:var(--gold);background:color-mix(in srgb,var(--panel) 60%,transparent)}
.person svg{display:block;margin:0 auto}
.person .nm{font-weight:800;font-size:14px;margin-top:2px;letter-spacing:-.02em}
.person .rl{font-size:11px;color:var(--muted)}
.bd{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:2}
.deco{display:flex;gap:6px;align-items:flex-end;justify-content:flex-end;margin-top:6px}
.plant{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#58b070,#2f7d44);box-shadow:6px 4px 0 -2px #2f7d44}
.shelf{width:86px;height:14px;border-radius:2px;background:repeating-linear-gradient(90deg,#8a3f33 0 8px,#b8923f 8px 14px,#2f5f8f 14px 22px,#6a7430 22px 29px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.table{width:70px;height:30px;border-radius:50%;background:radial-gradient(ellipse at 40% 30%,#a58260,#7a5a3c);border:3px solid #5d452d}
.hall{grid-column:1/-1;text-align:center;font-size:11px;letter-spacing:.7em;color:var(--gold);padding:3px 0;border-top:1px solid var(--gold-soft);border-bottom:1px solid var(--gold-soft)}
.lobby{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;background:var(--bg);border:1.5px solid var(--wall);border-radius:8px;min-width:0}
.sign{max-width:100%;min-width:0;background:linear-gradient(160deg,#1b3556,#0d1c30);color:#fff;border-radius:8px;padding:9px 22px;font-weight:800;letter-spacing:.05em;text-align:center;border:1px solid var(--gold);box-shadow:0 0 0 3px #0d1c30,0 0 0 4px var(--gold-soft),0 8px 18px rgba(13,28,48,.28)}
.sign b{display:block;font-size:15px}
.sign small{display:block;font-weight:500;font-size:11px;color:var(--gold-soft);letter-spacing:.08em;margin-top:2px;white-space:nowrap}
.side{display:flex;flex-direction:column;min-height:560px;max-height:calc(100vh - 36px);position:sticky;top:18px;overflow:hidden}
.sh{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.live{font-size:11px;color:var(--run);font-weight:800;letter-spacing:.06em}
.badge-new{font-size:11px;background:linear-gradient(180deg,#c29d5c,#a37e3f);color:#fff;border-radius:999px;padding:1px 9px;font-weight:700}
.tabs{display:flex;gap:4px;padding:8px 14px 0}
.tab{border:1px solid var(--line);border-bottom:none;background:var(--bg);border-radius:8px 8px 0 0;padding:5px 13px;font-size:12px}
.tab[aria-selected="true"]{background:var(--panel);font-weight:800;border-color:var(--gold);color:var(--ink)}
.pane{flex:1;overflow:auto;padding:12px 14px;border-top:1px solid var(--line);min-height:200px}
.filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.f{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:1px 11px;font-size:12px}
.f[aria-pressed="true"]{background:var(--wall);color:#fff;border-color:var(--wall)}
.msg{display:flex;gap:9px;margin-bottom:11px}
.av{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--gold-soft)}
.mb{background:var(--bg);border-radius:10px;padding:7px 11px;flex:1;min-width:0}
.mb .mt{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.mb p{margin:2px 0 0;overflow-wrap:anywhere}
.msg.me .mb{background:var(--run-bg)}
.rep h3{margin:0;font-size:15px;font-weight:800}
.rep .meta{font-size:12px;color:var(--muted);margin:2px 0 8px}
.rep h4{margin:12px 0 3px;font-size:13px;font-weight:800;color:var(--gold)}
.rep ul{margin:0;padding-left:18px}
.rep li{margin:1px 0}
.rep .urgent li::marker{color:var(--warn)}
.composer{border-top:1px solid var(--line);padding:11px 14px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:6px;align-items:center}
.row label{font-size:12px;color:var(--muted);white-space:nowrap}
select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:5px 8px}
textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px}
.quick{display:flex;flex-wrap:wrap;gap:5px}
.note{font-size:11px;color:var(--muted)}
.bnav,.backdrop,.x{display:none}
@media (max-width:900px){
  html,body{height:100%;overflow:hidden}
  .wrap{height:100vh;height:100dvh;max-width:none;display:flex;flex-direction:column;gap:6px;padding:8px 8px 0}
  .top{flex-wrap:nowrap;gap:8px;margin:0}
  .top h1{font-size:16px;white-space:nowrap;flex:none}
  .top small,.top .sub{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;justify-content:flex-start}
  .chips::-webkit-scrollbar,.ribbon::-webkit-scrollbar{display:none}
  .chip{font-size:11px;padding:2px 8px}
  .card.ribbon{flex-wrap:nowrap;overflow-x:auto;margin:0;padding:5px 8px;scrollbar-width:none;box-shadow:none}
  .ribbon .lbl,.rb,.btn{white-space:nowrap}
  .rb{font-size:11px}
  .ctrl{margin-left:6px;flex:none}
  .layout{display:block;flex:1;min-height:0}
  .layout>section{height:100%;display:flex;flex-direction:column;min-height:0}
  .legend{display:none}
  .plan{flex:1;min-height:0;display:flex;flex-direction:column;padding:5px;box-shadow:none}
  .plan h2{display:none}
  .grid{flex:1;min-height:0;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;padding:6px;border-width:3px;border-radius:12px}
  .room,.room.boss,.room.promo,.room.edu,.room.con,.room.lab{grid-column:auto;min-height:0;padding:6px 7px;overflow:hidden;container-type:size;container-name:room;box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 3px color-mix(in srgb,var(--gold) 45%,transparent)}
  .hall,.rs,.deco,.rm{display:none}
  .lobby{grid-column:auto;min-height:0;padding:6px;container-type:inline-size;overflow:hidden}
  .sign{padding:7px 10px}
  .sign b{font-size:13px}
  .sign small{font-size:9.5px;letter-spacing:0;white-space:normal;text-wrap:balance;word-break:keep-all;line-height:1.35}
  .rn{font-size:13px}
  .desk{padding-top:2px;align-items:center;justify-content:center}
  .person{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;width:100%;padding:1px 2px 2px;border-color:transparent}
  .bd{position:static;transform:none;order:-1;margin-bottom:2px}
  .person svg{width:38px;height:auto}
  .person .nm{font-size:12.5px;margin:0;line-height:1.2}
  .person .rl{display:none;font-size:10px;white-space:nowrap}
  .pill{font-size:10.5px;padding:0 7px}
  body:not(.sheet-open) .person.sel{border-color:transparent;background:none}
  .bnav{display:flex;flex:none;margin:0 -8px;background:var(--nav);padding-bottom:env(safe-area-inset-bottom,0)}
  .bnav button{flex:1;min-height:48px;border:none;background:none;font-size:13px;color:rgba(255,255,255,.62);border-top:3px solid transparent;letter-spacing:.02em}
  .bnav button[aria-current="true"]{color:#fff;font-weight:700;border-top-color:var(--gold)}
  .backdrop{position:fixed;inset:0;background:rgba(6,14,24,.5);z-index:20}
  body:not(.sheet-open) .backdrop{display:none}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:86vh;height:86dvh;min-height:0;max-height:none;z-index:30;border-radius:18px 18px 0 0;transform:translateY(105%);visibility:hidden}
  body.sheet-open .side{transform:none;visibility:visible}
  .x{display:inline-block;margin-left:auto;min-height:32px}
  .pane{min-height:0}
  textarea{min-height:52px}
  select,textarea,.btn{font-size:16px}
}
/* 방 높이에 따라 내용이 늘어남 (겹침 방지) */
@container room (min-height:96px){ .person svg{width:44px} }
@container room (min-height:108px){ .person svg{width:48px} }
@container room (min-height:158px){ .person svg{width:56px} .person .rl{display:block} .person .nm{font-size:13.5px} }
@container room (max-width:170px){ .code{display:none} }
@container room (max-height:104px){ .bd{display:none} .person svg{width:34px} }
@media (max-width:900px) and (prefers-reduced-motion:no-preference){
  .side{transition:transform .25s ease,visibility .25s}
}
@media (min-width:901px){.room{min-height:220px}}
@media (prefers-reduced-motion:no-preference){
  .pill.run::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:p 1.2s infinite}
  @keyframes p{50%{opacity:.25}}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>김성남 오피스<span class="sub"> · AI 가상 오피스</span></h1>
      <small>AI건설교육 · 판촉물 · 건설기술자문</small>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="card ribbon" id="ribbon"></div>

  <div class="layout">
    <section>
      <div class="card legend" id="legend">
        <span><span class="pill run">작업 중</span><i> 지금 일하는 중</i></span>
        <span><span class="pill idle">대기</span><i> 출근 · 다음 업무 대기</i></span>
        <span><span class="pill ok">✓ 완료</span><i> 오늘 보고 올림</i></span>
        <span><span class="pill warn">! 확인 필요</span><i> 결재·확인 요청</i></span>
        <span><span class="pill off">퇴근</span><i> 자동 근무 꺼짐</i></span>
      </div>
      <div class="card plan">
        <h2>평면도 <span>김성남 AI 가상 오피스 · 5실 · 5명</span></h2>
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <aside class="card side">
      <div class="sh"><span class="live">● LIVE</span><span class="badge-new" id="newbadge">새 소식 0</span><b style="margin-left:4px">업무 채널</b><button class="btn x" id="close" aria-label="패널 닫기">닫기</button></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-ch" aria-selected="true">업무 채널</button>
        <button class="tab" role="tab" id="tab-rp" aria-selected="false">보고서</button>
      </div>
      <div class="pane" id="pane"></div>
      <div class="composer">
        <div class="row"><label for="to">받는 사람</label><select id="to"></select></div>
        <div class="quick" id="quick"></div>
        <textarea id="ta" placeholder="지시 입력 (Ctrl+Enter로 보내기)"></textarea>
        <div class="row"><span class="note" id="hint">보내면 담당자가 바로 처리하고 보고서를 남깁니다.</span><button class="btn primary" id="send" style="margin-left:auto">보내기</button></div>
      </div>
    </aside>
  </div>
  <nav class="bnav" aria-label="화면 전환">
    <button data-nav="plan" aria-current="true">평면도</button>
    <button data-nav="ch">업무 채널</button>
    <button data-nav="rp">보고서</button>
    <button data-nav="cmd">지시</button>
  </nav>
</div>
<div class="backdrop" id="backdrop"></div>

<script>
/* 직원 5명 = 5개 실에 1명씩. 데이터는 시안용 샘플. */
var AG=[
 {id:'a1',room:'boss',code:'R-101',rn:'사장실',name:'김성남',title:'대표',role:'종합보고 · 결재',color:'#8c5a2b',hair:'#2b1d14',st:'ok',nx:'',
  rep:{head:'2026-11-19(목) 종합보고 · 전 부서 통합',time:'오늘 오전 08:06',sec:[

}
function renderQuick(){
  var q=['지금까지 보고 종합 다시 작성','오늘 일정 정리','미수금 현황 확인','다음 주 업무 계획'];
  $('#quick').innerHTML=q.map(function(x){return '<button class="f" data-q="'+x+'">'+x+'</button>'}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-q]'),function(b){b.onclick=function(){$('#ta').value=b.getAttribute('data-q');$('#ta').focus()}});
}
function renderAll(){renderTop();renderRibbon();renderGrid();renderPane()}

/* 실가동: 자료함(또는 사장실은 각 실 보고서) 읽기 → Claude 보고서 작성 → 보고서 폴더에 Google 문서 저장 */
function readText(id){
  return dcall('read_file_content',{fileId:id}).then(function(r){return txt(r).slice(0,5000)});
}
function post(a,msg,url){FEED.unshift({w:a.id,t:'11.19 '+hm(),x:msg,link:a.id,url:url});newCnt++}
function runLive(a,instr){
  var isBoss=a.id==='a1';
  var srcP=isBoss
    ? Promise.all(AG.filter(function(b){return b.id!=='a1'}).map(function(b){return listFiles(FOLDER[b.id][1],1)})).then(function(ls){return [].concat.apply([],ls)})
    : listFiles(FOLDER[a.id][0],4);
  return srcP.then(function(fl){
    fl=fl.slice(0,5);
    if(!fl.length){
      a.st='warn';
      post(a,isBoss?'종합할 부서 보고서가 아직 없습니다. 각 실에 지시하여 보고서를 먼저 만들어 주세요.':'근거 자료가 없습니다. "'+a.rn+'" 폴더에 자료를 넣은 뒤 다시 지시해 주세요.');
      FILES[a.id]=null;return;
    }
    return Promise.all(fl.map(function(f){return readText(f.id).then(function(t){return '=== '+f.title+' ===\n'+t})})).then(function(parts){
      var prompt='당신은 \'김성남 오피스\'의 '+a.rn+' '+a.name+' '+a.title+'('+a.role+')입니다. 대표 김성남의 지시와 아래 Google Drive 자료만 근거로 업무 보고서를 작성하세요.\n'
       +'지시: '+instr+'\n\n작성 규칙:\n1) 한국어 기술사 답안 문체, 개조식 단문(→, · 연결).\n2) ① 핵심 요약 ② 세부 내용 ③ 확인 필요·후속 조치 순서의 번호 대제목.\n3) 자료에 없는 수치·사실은 쓰지 말고 "자료 없음"으로 표기.\n4) 마크다운 기호(#, *, **) 금지, 일반 텍스트만.\n5) 600~1,200자.\n\n[자료]\n'+parts.join('\n\n');
      return SAMPLE(prompt,{cache:false}).then(function(res){
        var text=(res&&res.text||'').trim();
        if(!text)throw {code:'empty'};
        var day=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
        var title=day+'_'+a.rn+'_'+instr.replace(/\s+/g,' ').slice(0,20);
        return dcall('create_file',{title:title,parentId:FOLDER[a.id][1],contentMimeType:'text/plain',textContent:text}).then(function(r){
          var p=r.payload; if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p={}}}
          var url=safeUrl(p&&(p.viewUrl||p.webViewLink));
          a.rep={head:title,time:'오늘 '+hm(),text:text,url:url};
          a.st='ok';
          post(a,'보고서를 작성하여 보고서 폴더에 저장했습니다.',url);
          FILES[a.id]=null;
        });
      });
    });
  }).catch(function(e){
    a.st='warn';
    post(a,e&&e.code==='empty'?'보고서 생성 결과가 비어 있습니다. 다시 지시해 주세요.':errMsg(e));
    FILES[a.id]=null;
  });
}
function send(){
  var x=$('#ta').value.trim(); if(!x||busy)return;
  var to=$('#to').value, t='11.19 '+hm();
  FEED.unshift({w:'me',to:to,t:t,x:x}); sentCnt++;
  if(MCP&&SAMPLE){
    var a=byId(to==='all'?'a1':to);
    if(a.st==='off'){post(a,'퇴근 상태입니다. 전원 출근 후 지시해 주세요.');$('#ta').value='';view='ch';renderAll();return}
    busy=true;a.prev=a.st;a.st='run';$('#ta').value='';view='ch';filt='all';renderAll();
    runLive(a,x).then(function(){busy=false;renderAll();if(MCP&&view==='rp'&&!FILES[cur])loadFiles(cur)});
    return;
  }
  var targets=to==='all'?AG:[byId(to)];
  targets.forEach(function(a){ if(a.st!=='off'){a.prev=a.st;a.st='run'} });
  $('#ta').value=''; view='ch'; filt='all'; renderAll();
  setTimeout(function(){
    targets.forEach(function(a){
      if(a.st==='off')return;
      a.st='ok'; newCnt++;
      FEED.unshift({w:a.id,t:'11.19 '+hm(),x:'지시 접수 → 처리 완료. 결과를 보고서에 반영했습니다. (시안 동작: 실가동 시 실제 업무 수행)',link:a.id});
    });
    renderAll();
  },1800);
}
$('#send').onclick=send;
$('#ta').addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}});
$('#tab-ch').onclick=function(){view='ch';renderPane()};
$('#tab-rp').onclick=function(){view='rp';renderPane();if(MCP&&!FILES[cur])loadFiles(cur)};
$('#to').addEventListener('change',function(){if(this.value!=='all'){cur=this.value;renderGrid();if(view==='rp')renderPane()}});
Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'),function(b){
  b.onclick=function(){
    var n=b.getAttribute('data-nav');
    if(n==='plan'){setSheet(false);return}
    view=(n==='rp')?'rp':'ch';
    if(n==='rp'&&MCP&&!FILES[cur])loadFiles(cur);
    renderPane();setSheet(true);
    if(n==='cmd')setTimeout(function(){$('#ta').focus()},280);
  };
});
$('#close').onclick=function(){setSheet(false)};
$('#backdrop').onclick=function(){setSheet(false)};
document.addEventListener('keydown',function(e){if(e.key==='Escape')setSheet(false)});
renderTo(); renderQuick(); renderAll(); initCaps();
setInterval(function(){renderTop();renderRibbon()},30000);
</script>
</body>
