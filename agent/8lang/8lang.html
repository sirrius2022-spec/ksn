<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가사 8개국어 번역기</title>
<style>
  :root {
    --accent: #2b6cb0;
    --accent-dark: #1a4971;
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }
  textarea {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    font-size: 14px;
    line-height: 1.6;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    background: #fafbfc;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled {
    background: #b8c4d0;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: #f2f4f7; }
  .error {
    font-size: 13px;
    color: #c0392b;
    margin-top: 8px;
    display: none;
  }
  .detected {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
    display: none;
  }
  .progress-wrap {
    display: none;
    margin-top: 14px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: #e8ebef;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.2s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }
  #results { margin-top: 8px; }
  .lang-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
    background: var(--card);
  }
  .lang-item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .lang-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-dark);
    letter-spacing: 0.02em;
  }
  .src-badge {
    font-size: 11px;
    font-weight: 600;
    color: #1d9e75;
    margin-left: 6px;
  }
  .copy-btn {
    font-size: 12px;
    padding: 4px 10px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-muted);
  }
  .copy-btn:hover { background: #f2f4f7; color: var(--text); }
  .copy-btn.done { color: #1d9e75; border-color: #1d9e75; }
  .lang-text {
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: var(--text);
  }
  .lang-text.failed {
    color: #c0392b;
    font-size: 13px;
  }
  .top-actions {
    display: none;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .empty-hint {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    padding: 24px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>가사 8개국어 번역기</h1>
  <p class="subtitle">가사를 붙여넣으면 원곡 언어를 자동 감지하고, 한국어·영어·중국어·일본어·프랑스어·베트남어·태국어·암하라어로 번역합니다. 유튜브 자막/설명란에 바로 붙여넣기 좋게 구성됩니다.</p>

  <div class="card">
    <label for="lyrics">원곡 가사 (언어 자동 감지)</label>
    <textarea id="lyrics" placeholder="번역할 가사를 여기에 붙여넣으세요."></textarea>
    <div class="row">
      <button class="btn-primary" id="translateBtn">8개국어로 번역하기</button>
      <button class="btn-secondary" id="clearBtn">초기화</button>
    </div>
    <div class="error" id="errorMsg"></div>
    <div class="detected" id="detectedMsg"></div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 8 완료</div>
    </div>
  </div>

  <div class="top-actions" id="topActions">
    <button class="btn-secondary" id="copyAllBtn">전체 결과 복사 (한→영→중→일→프→베→태→암하라 순)</button>
    <button class="btn-secondary" id="downloadAllBtn">전체 텍스트 파일로 저장 (.txt)</button>
  </div>

  <div id="results">
    <div class="empty-hint" id="emptyHint">번역 결과가 여기에 표시됩니다.</div>
  </div>
</div>

<script>
// 전체 복사 순서: 한국어 → 영어 → 중국어 → 일본어 → 프랑스어 → 베트남어 → 태국어 → 암하라어
const LANGUAGES = [
  ["한국어", "Korean", "ko"],
  ["영어", "English", "en"],
  ["중국어", "Chinese (Simplified)", "zh"],
  ["일본어", "Japanese", "ja"],
  ["프랑스어", "French", "fr"],
  ["베트남어", "Vietnamese", "vi"],
  ["태국어", "Thai", "th"],
  ["암하라어", "Amharic", "am"]
];

const lyricsEl = document.getElementById("lyrics");
const translateBtn = document.getElementById("translateBtn");
const clearBtn = document.getElementById("clearBtn");
const errorMsg = document.getElementById("errorMsg");
const detectedMsg = document.getElementById("detectedMsg");
const progressWrap = document.getElementById("progressWrap");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");
const resultsEl = document.getElementById("results");
const emptyHint = document.getElementById("emptyHint");
const topActions = document.getElementById("topActions");
const copyAllBtn = document.getElementById("copyAllBtn");
const downloadAllBtn = document.getElementById("downloadAllBtn");

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    throw new Error("clipboard api unavailable");
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.left = "-1000px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e2) {
      return false;
    }
  }
}

let translations = {};
let isRunning = false;
let detectedCode = null;

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = "block";
}
function clearError() {
  errorMsg.style.display = "none";
  errorMsg.textContent = "";
}

async function callClaude(prompt, maxTokens) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: maxTokens,
      messages: [{ role: "user", content: prompt }]
    })
  });
  if (!response.ok) {
    throw new Error("API request failed: " + response.status);
  }
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === "text");
  if (!textBlock || !textBlock.text) {
    throw new Error("empty response");
  }
  return textBlock.text.trim();
}

async function detectLanguage(lyrics) {
  const prompt = "What is the primary language of the following song lyrics? " +
    "Answer with ONLY one of these exact codes, nothing else: ko, en, zh, ja, fr, vi, th, am, other.\n\n" +
    "Lyrics:\n" + lyrics;
  const raw = await callClaude(prompt, 10);
  const code = raw.toLowerCase().replace(/[^a-z]/g, "");
  const known = LANGUAGES.map(l => l[2]);
  return known.includes(code) ? code : "other";
}

async function translateOne(lyrics, langNameEn) {
  const prompt = "Translate the following song lyrics into " + langNameEn + ". " +
    "Preserve the line breaks and verse structure of the original as closely as natural in the target language. " +
    "Output ONLY the translated lyrics text, with no title, no explanation, no quotation marks, no markdown.\n\n" +
    "Lyrics:\n" + lyrics;
  return await callClaude(prompt, 1000);
}

function renderResults() {
  resultsEl.innerHTML = "";
  const keys = Object.keys(translations);
  if (keys.length === 0) {
    resultsEl.appendChild(emptyHint);
    topActions.style.display = "none";
    return;
  }
  topActions.style.display = "flex";

  for (const [nameKo, nameEn, code] of LANGUAGES) {
    if (!(code in translations)) continue;
    const entry = translations[code];
    const item = document.createElement("div");
    item.className = "lang-item";

    const head = document.createElement("div");
    head.className = "lang-item-head";

    const label = document.createElement("span");
    label.className = "lang-name";
    label.textContent = nameKo;
    if (code === detectedCode) {
      const badge = document.createElement("span");
      badge.className = "src-badge";
      badge.textContent = "(원곡 언어)";
      label.appendChild(badge);
    }

    const copyBtn = document.createElement("button");
    copyBtn.className = "copy-btn";
    copyBtn.textContent = "복사";
    copyBtn.onclick = async () => {
      const ok = await copyText(entry.text || "");
      if (ok) {
        copyBtn.textContent = "복사됨";
        copyBtn.classList.add("done");
        setTimeout(() => { copyBtn.textContent = "복사"; copyBtn.classList.remove("done"); }, 1500);
      } else {
        copyBtn.textContent = "복사 실패";
        setTimeout(() => { copyBtn.textContent = "복사"; }, 1500);
      }
    };

    head.appendChild(label);
    head.appendChild(copyBtn);

    const textDiv = document.createElement("div");
    if (entry.error) {
      textDiv.className = "lang-text failed";
      textDiv.textContent = "번역 실패: 다시 시도해 주세요.";
    } else {
      textDiv.className = "lang-text";
      textDiv.textContent = entry.text;
    }

    item.appendChild(head);
    item.appendChild(textDiv);
    resultsEl.appendChild(item);
  }
}

function buildFullText() {
  let out = [];
  for (const [nameKo, nameEn, code] of LANGUAGES) {
    if (!(code in translations)) continue;
    const entry = translations[code];
    out.push("[" + nameKo + "]");
    out.push(entry.error ? "(번역 실패)" : entry.text);
    out.push("");
  }
  return out.join("\n");
}

copyAllBtn.onclick = async () => {
  const ok = await copyText(buildFullText());
  if (ok) {
    copyAllBtn.textContent = "복사됨";
  } else {
    copyAllBtn.textContent = "복사 실패";
  }
  setTimeout(() => { copyAllBtn.textContent = "전체 결과 복사 (한→영→중→일→프→베→태→암하라 순)"; }, 1500);
};

downloadAllBtn.onclick = () => {
  const blob = new Blob([buildFullText()], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "translated-lyrics.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

clearBtn.onclick = () => {
  if (isRunning) return;
  lyricsEl.value = "";
  translations = {};
  detectedCode = null;
  clearError();
  detectedMsg.style.display = "none";
  progressWrap.style.display = "none";
  renderResults();
};

translateBtn.onclick = async () => {
  if (isRunning) return;
  clearError();
  detectedMsg.style.display = "none";

  const lyrics = lyricsEl.value.trim();
  if (!lyrics) {
    showError("가사를 먼저 입력해 주세요.");
    return;
  }

  isRunning = true;
  translateBtn.disabled = true;
  translateBtn.textContent = "언어 감지 중...";
  translations = {};
  detectedCode = null;
  renderResults();
  progressWrap.style.display = "block";
  progressFill.style.width = "0%";
  progressLabel.textContent = "0 / " + LANGUAGES.length + " 완료";

  try {
    detectedCode = await detectLanguage(lyrics);
  } catch (e) {
    detectedCode = null;
  }

  if (detectedCode && detectedCode !== "other") {
    const detectedEntry = LANGUAGES.find(l => l[2] === detectedCode);
    detectedMsg.textContent = "감지된 원곡 언어: " + (detectedEntry ? detectedEntry[0] : detectedCode);
  } else {
    detectedMsg.textContent = "원곡 언어를 자동 감지하지 못했습니다. 모든 언어로 번역합니다.";
  }
  detectedMsg.style.display = "block";

  translateBtn.textContent = "번역 중...";

  let done = 0;
  for (const [nameKo, nameEn, code] of LANGUAGES) {
    if (code === detectedCode) {
      translations[code] = { text: lyrics };
    } else {
      try {
        const text = await translateOne(lyrics, nameEn);
        translations[code] = { text };
      } catch (e) {
        translations[code] = { error: true };
      }
    }
    done += 1;
    progressFill.style.width = Math.round((done / LANGUAGES.length) * 100) + "%";
    progressLabel.textContent = done + " / " + LANGUAGES.length + " 완료";
    renderResults();
  }

  isRunning = false;
  translateBtn.disabled = false;
  translateBtn.textContent = "8개국어로 번역하기";
};
</script>
</body>
</html>
