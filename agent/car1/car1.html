<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이동식 크레인 안전성 검토 프로그램</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (안정적인 CDN으로 변경 및 crossorigin 추가) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #f1f5f9; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .svg-crane { max-width: 100%; height: auto; }
        
        /* Custom inputs for better mobile experience */
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = window.React;

        const App = () => {
            // 1. 화물 제원 (Cargo)
            const [cargoWeight, setCargoWeight] = useState(5.0); // 인양하중 (ton)

            // 2. 크레인 제원 (Crane) - 안전율 85% 이내
            const [craneMaxLoad, setCraneMaxLoad] = useState(10.0); // 붐구간 최대하중능력 (ton)

            // 3. 줄걸이 제원 (Sling) - 안전계수 5
            const [slingBreakingLoad, setSlingBreakingLoad] = useState(15.0); // 절단하중 (ton)
            const [slingCount, setSlingCount] = useState(2); // 걸이 줄 수
            const [slingAngle, setSlingAngle] = useState(60); // 인양 각도

            // 4. 샤클 제원 (Shackle)
            const [shackleSWL, setShackleSWL] = useState(4.0); // 1개당 사용하중 (ton)
            const [shackleCount, setShackleCount] = useState(2); // 사용 개수

            // 계산 로직
            const calculations = useMemo(() => {
                // 1. 크레인 안전하중 = 붐구간 최대하중 * 0.85
                const craneSafeLoad = craneMaxLoad * 0.85;
                const craneStatus = craneSafeLoad >= cargoWeight;

                // 2. 줄걸이 안전하중
                // 인양각도에 따른 하중계수 (cos(각도/2))
                let angleFactor = 1;
                if (slingAngle === 60) angleFactor = 0.866;
                else if (slingAngle === 90) angleFactor = 0.707;
                else if (slingAngle === 120) angleFactor = 0.5;
                
                // 줄걸이 안전하중 = (절단하중 / 안전계수 5) * 줄수 * 각도계수
                const slingSafeLoad = (slingBreakingLoad / 5) * slingCount * angleFactor;
                const slingStatus = slingSafeLoad >= cargoWeight;

                // 3. 샤클 안전하중 = 1개당 사용하중 * 사용개수
                const shackleSafeLoad = shackleSWL * shackleCount;
                const shackleStatus = shackleSafeLoad >= cargoWeight;

                const overallStatus = craneStatus && slingStatus && shackleStatus;

                return {
                    craneSafeLoad, craneStatus,
                    slingSafeLoad, slingStatus, angleFactor,
                    shackleSafeLoad, shackleStatus,
                    overallStatus
                };
            }, [cargoWeight, craneMaxLoad, slingBreakingLoad, slingCount, slingAngle, shackleSWL, shackleCount]);

            const CraneVisualizer = () => {
                const { craneStatus, slingStatus, shackleStatus, overallStatus } = calculations;
                
                // 시각적 피드백 색상
                const colorCrane = craneStatus ? "#3b82f6" : "#ef4444"; // Blue or Red
                const colorSling = slingStatus ? "#10b981" : "#ef4444"; // Green or Red
                const colorShackle = shackleStatus ? "#f59e0b" : "#ef4444"; // Yellow or Red
                const colorLoad = overallStatus ? "#8b5cf6" : "#ef4444"; // Purple or Red

                return (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center h-full min-h-[300px]">
                        <h3 className="text-lg font-bold text-gray-700 mb-4 w-full text-center">양중 작업 시뮬레이션</h3>
                        <svg viewBox="0 0 400 400" className="svg-crane drop-shadow-md w-full max-w-sm">
                            {/* 지면 */}
                            <line x1="10" y1="380" x2="390" y2="380" stroke="#cbd5e1" strokeWidth="4" />
                            
                            {/* 크레인 본체 */}
                            <rect x="50" y="320" width="120" height="40" rx="5" fill="#475569" />
                            <rect x="130" y="290" width="40" height="30" rx="3" fill="#64748b" />
                            <circle cx="80" cy="360" r="15" fill="#1e293b" />
                            <circle cx="140" cy="360" r="15" fill="#1e293b" />
                            
                            {/* 아웃트리거 */}
                            <line x1="60" y1="360" x2="40" y2="380" stroke="#475569" strokeWidth="6" strokeLinecap="round"/>
                            <line x1="160" y1="360" x2="180" y2="380" stroke="#475569" strokeWidth="6" strokeLinecap="round"/>

                            {/* 크레인 붐대 (상태에 따라 색상 변경) */}
                            <g stroke={colorCrane} strokeWidth="12" strokeLinecap="round" className="transition-colors duration-300">
                                <line x1="100" y1="320" x2="280" y2="100" />
                                <line x1="280" y1="100" x2="330" y2="40" strokeWidth="8" />
                            </g>
                            
                            {/* 후크 블록 */}
                            <circle cx="330" cy="50" r="8" fill={colorCrane} />

                            {/* 메인 와이어 & 샤클 (상태에 따라 색상 변경) */}
                            <line x1="330" y1="50" x2="330" y2="180" stroke="#94a3b8" strokeWidth="3" />
                            {/* 샤클 표현 */}
                            <path d="M 320 180 Q 330 195 340 180" fill="none" stroke={colorShackle} strokeWidth="4" className="transition-colors duration-300"/>
                            <line x1="320" y1="180" x2="340" y2="180" stroke={colorShackle} strokeWidth="4" />

                            {/* 줄걸이 슬링 (각도에 따라 시각적 변화) */}
                            <g stroke={colorSling} strokeWidth="3" className="transition-colors duration-300">
                                <line x1="330" y1="185" x2="290" y2="250" />
                                <line x1="330" y1="185" x2="370" y2="250" />
                            </g>

                            {/* 인양 화물 (전체 상태에 따라 색상 변경) */}
                            <g transform="translate(280, 250)">
                                <rect x="0" y="0" width="100" height="70" rx="4" fill={colorLoad} className="transition-colors duration-300 opacity-90" />
                                <text x="50" y="30" fill="white" fontSize="14" fontWeight="bold" textAnchor="middle">화물</text>
                                <text x="50" y="50" fill="white" fontSize="12" textAnchor="middle">{cargoWeight} Ton</text>
                            </g>

                            {/* 상태 라벨 */}
                            <text x="250" y="80" fill={colorCrane} fontSize="12" fontWeight="bold">크레인 {craneStatus ? 'OK' : 'NG'}</text>
                            <text x="355" y="185" fill={colorShackle} fontSize="12" fontWeight="bold">샤클 {shackleStatus ? 'OK' : 'NG'}</text>
                            <text x="360" y="220" fill={colorSling} fontSize="12" fontWeight="bold">줄걸이 {slingStatus ? 'OK' : 'NG'}</text>
                        </svg>
                    </div>
                );
            };

            const InputGroup = ({ label, children, icon: Icon, colorClass }) => (
                <div className={`p-4 rounded-xl border-l-4 shadow-sm bg-white mb-4 ${colorClass}`}>
                    <div className="flex items-center gap-2 mb-3 border-b pb-2">
                        <Icon className="w-5 h-5 opacity-70" />
                        <h3 className="font-bold text-gray-800">{label}</h3>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {children}
                    </div>
                </div>
            );

            const NumberInput = ({ label, value, onChange, unit, step="0.1" }) => (
                <div className="flex flex-col">
                    <label className="text-xs text-gray-500 mb-1 font-medium">{label}</label>
                    <div className="relative">
                        <input 
                            type="number" 
                            step={step}
                            className="w-full pl-3 pr-10 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                            value={value} 
                            onChange={(e) => onChange(Number(e.target.value) || 0)}
                        />
                        <span className="absolute right-3 top-2.5 text-sm text-gray-400">{unit}</span>
                    </div>
                </div>
            );

            const ResultCard = ({ title, safeLoad, requiredLoad, isSafe, formula }) => (
                <div className={`p-4 rounded-xl border ${isSafe ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} mb-3`}>
                    <div className="flex justify-between items-start mb-2">
                        <h4 className="font-bold text-gray-800">{title}</h4>
                        <span className={`px-2 py-1 rounded text-xs font-bold text-white ${isSafe ? 'bg-green-500' : 'bg-red-500'}`}>
                            {isSafe ? '적합 (PASS)' : '부적합 (FAIL)'}
                        </span>
                    </div>
                    <div className="flex justify-between items-end">
                        <div>
                            <p className="text-xs text-gray-500 mb-1" title={formula}>계산된 안전하중</p>
                            <p className={`text-2xl font-black ${isSafe ? 'text-green-700' : 'text-red-700'}`}>
                                {safeLoad.toFixed(2)} <span className="text-sm font-normal">Ton</span>
                            </p>
                        </div>
                        <div className="text-right">
                            <p className="text-xs text-gray-500 mb-1">필요 하중(화물)</p>
                            <p className="text-lg font-bold text-gray-700">{requiredLoad.toFixed(2)} Ton</p>
                        </div>
                    </div>
                    {!isSafe && (
                        <p className="text-xs text-red-600 mt-2 font-medium bg-red-100 p-2 rounded">
                            ⚠️ 위험: 안전하중이 화물중량보다 작습니다!
                        </p>
                    )}
                </div>
            );

            return (
                <div className="min-h-screen p-4 md:p-8 flex justify-center">
                    <div className="max-w-6xl w-full fade-in">
                        
                        {/* Header */}
                        <header className="mb-6 flex items-center justify-between bg-slate-800 text-white p-4 rounded-2xl shadow-lg">
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold flex items-center gap-2">
                                    <i data-lucide="hard-hat" className="w-6 h-6 text-yellow-400"></i>
                                    이동식 크레인 양중 안전성 검토
                                </h1>
                                <p className="text-sm text-slate-300 mt-1 opacity-80">차량계 하역운반 작업계획서 기준 (자동 계산)</p>
                            </div>
                            <div className={`px-4 py-2 rounded-lg font-black text-lg ${calculations.overallStatus ? 'bg-green-500 text-white' : 'bg-red-500 text-white animate-pulse'}`}>
                                {calculations.overallStatus ? '작업 가능' : '작업 중지'}
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            
                            {/* Left Column: Inputs */}
                            <div className="lg:col-span-7 space-y-2">
                                
                                <InputGroup label="1. 화물 제원 (Cargo)" icon={() => <i data-lucide="package" />} colorClass="border-purple-400">
                                    <NumberInput label="화물 인양하중" value={cargoWeight} onChange={setCargoWeight} unit="Ton" />
                                </InputGroup>

                                <InputGroup label="2. 크레인 제원 (Crane)" icon={() => <i data-lucide="truck" />} colorClass="border-blue-400">
                                    <NumberInput label="해당 붐/반경 최대하중능력" value={craneMaxLoad} onChange={setCraneMaxLoad} unit="Ton" />
                                    <div className="flex flex-col justify-center">
                                        <label className="text-xs text-gray-500 mb-1 font-medium">안전율 적용</label>
                                        <div className="px-3 py-2 bg-gray-100 rounded-lg text-sm text-gray-600 border border-gray-200">
                                            최대능력의 85% 이내 사용 (0.85 곱)
                                        </div>
                                    </div>
                                </InputGroup>

                                <InputGroup label="3. 줄걸이 제원 (Sling)" icon={() => <i data-lucide="link-2" />} colorClass="border-green-400">
                                    <NumberInput label="줄걸이 절단하중 (제원표)" value={slingBreakingLoad} onChange={setSlingBreakingLoad} unit="Ton" />
                                    <NumberInput label="걸이 줄 수" value={slingCount} onChange={setSlingCount} unit="가닥" step="1" />
                                    
                                    <div className="flex flex-col md:col-span-2">
                                        <label className="text-xs text-gray-500 mb-1 font-medium">인양 각도 (하중 감소율 적용)</label>
                                        <div className="flex gap-2 bg-gray-50 p-1 rounded-lg border border-gray-200">
                                            {[0, 60, 90, 120].map(angle => (
                                                <button 
                                                    key={angle}
                                                    onClick={() => setSlingAngle(angle)}
                                                    className={`flex-1 py-1.5 text-sm font-bold rounded-md transition-all ${slingAngle === angle ? 'bg-white shadow-sm text-green-600 border border-gray-200' : 'text-gray-400 hover:text-gray-600'}`}
                                                >
                                                    {angle === 0 ? '0° (수직)' : `${angle}°`}
                                                </button>
                                            ))}
                                        </div>
                                        <p className="text-xs text-gray-400 mt-1 pl-1">* 각도 계수: 0°(1.0), 60°(0.866), 90°(0.707), 120°(0.5) / 안전계수: 5</p>
                                    </div>
                                </InputGroup>

                                <InputGroup label="4. 샤클 제원 (Shackle)" icon={() => <i data-lucide="anchor" />} colorClass="border-yellow-400">
                                    <NumberInput label="샤클 1개당 사용하중 (SWL)" value={shackleSWL} onChange={setShackleSWL} unit="Ton" />
                                    <NumberInput label="사용 개수" value={shackleCount} onChange={setShackleCount} unit="개" step="1" />
                                </InputGroup>
                            </div>

                            {/* Right Column: Visualization & Results */}
                            <div className="lg:col-span-5 flex flex-col gap-4">
                                <CraneVisualizer />
                                
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex-1">
                                    <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        <i data-lucide="calculator" className="w-5 h-5 text-gray-500"></i>
                                        항목별 안전성 검토 결과
                                    </h3>
                                    
                                    <ResultCard 
                                        title="[1] 중량물(크레인) 안전성" 
                                        safeLoad={calculations.craneSafeLoad} 
                                        requiredLoad={cargoWeight} 
                                        isSafe={calculations.craneStatus}
                                        formula="최대하중능력 × 0.85"
                                    />
                                    
                                    <ResultCard 
                                        title="[2] 줄걸이 안전성" 
                                        safeLoad={calculations.slingSafeLoad} 
                                        requiredLoad={cargoWeight} 
                                        isSafe={calculations.slingStatus}
                                        formula="(절단하중 ÷ 안전계수 5) × 줄수 × 각도계수"
                                    />
                                    
                                    <ResultCard 
                                        title="[3] 샤클 안전성" 
                                        safeLoad={calculations.shackleSafeLoad} 
                                        requiredLoad={cargoWeight} 
                                        isSafe={calculations.shackleStatus}
                                        formula="1개당 사용하중 × 사용개수"
                                    />
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Lucide 아이콘 렌더링을 위한 딜레이 처리 (안전성 강화)
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 100);
    </script>
</body>
</html>
